"none": false, "chosen": "reading"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 17, "text": "In sum, building upon crisis, temporary victories and serendipitous events, a fragile yet persistent political coalition around wind energy was able to “steer” the Danish wind turbine path to its modern incarnation.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 5, "text": "In other words, serendipitous inventions can advance the current plans of a startup in unforeseen ways or serve as a fortuitous opportunity for shifting the business in a new direction.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "role-03", "group": "role", "status": "reference", "label": "Discovery before demand", "description": "The offering or capability is found first, often as an unforeseen use of an existing technology or know-how, and a market or need is identified only afterwards.", "when": "The person describes having a solution, technology or know-how before a need existed, then finding a market for it or founding a venture to exploit the new use.", "example": "", "notwhen": "An existing project's discovery is moved to a different application than first intended (use Redirecting a discovery to new applications). Innovation that answers a known, pre-existing problem does not count.", "evidence": [{"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 4, "text": "Technological speciation originates from \"transplanting the existing technological know-how to a new application domain where it evolves in new directions\" (Adner and Levinthal 2002, p. 51).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 3, "text": "By contrast, science-push, demand-pull, and institutional-steering offer adaptive pathways to science-based innovations often driven by a desire to realize functionalities identified ex ante.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 14, "text": "And only then it appears whether there is a 'problem' for which it is an 'answer' and, if so, then it remains to be seen, whether the mutated gene has more survival value than the pre-existing gene.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 30, "text": "First, our results are based on the sample of 83 drugs approved by the FDA over three years (1998 - 2000), a number that is consistent with the average number of 27 approved drugs per year.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-04", "group": "role", "status": "reference", "label": "Chance find as a starting point needing development", "description": "A chance finding is only the first step: it must be investigated, refined and evaluated before it becomes a venture.", "when": "The account treats an accidental insight as the beginning of further work, such as testing, gathering missing knowledge or shaping the concept, rather than as the finished result.", "example": "", "notwhen": "The focus is simply that the idea arose by chance, with no account of later development work (use Originating the venture idea).", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 19, "text": "For scientists, an accidental discovery is only the initial step, stimulating them to seek explanations for the unexpected or anomalous finding.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": 11, "text": "Once an idea has been generated, the entrepreneur must take further actions to understand whether there is an opportunity to launch a successful venture based on the idea.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-05", "group": "role", "status": "reference", "label": "Chance formation of the founding team", "description": "Co-founders and early team members come together through chance encounters rather than a planned search.", "when": "A co-founder or early team member was met unexpectedly, sometimes someone the founder did not know they needed.", "example": "", "notwhen": "The chance tie is an outside partner or collaborator rather than a team member (use Chance partnerships and network ties). A co-founder found through deliberate search or an investor referral does not count.", "evidence": [{"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 23, "text": "For example, they learned about new markets for their products, met the co- founder they did not know they needed, or ran into a major potential client.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Clough et al. (2019)", "title": "Turning Lead into Gold: How Do Entrepreneurs Mobilize Resources to Exploit Opportunities?", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/annals.2016.0132", "page": 11, "text": "While a lot of entrepreneurial team formation occurs serendipitously (Aldrich & Kim, 2007), there is evidence that high-ambition ventures sometimes find cofounders through the personal networks of the venture capital backers (Hsu, 2007).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-06", "group": "role", "status": "reference", "label": "Chance partnerships and network ties", "description": "Collaborations, partnerships and network ties arise from unplanned encounters and lead to profitable opportunities.", "when": "A key partner, collaborator or joint project is traced to a chance meeting.", "example": "", "notwhen": "The person met by chance joined the founding team (use Chance formation of the founding team).", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "Moreover, as suggested by Meyer and Skak (2002) ,net work sand collaborations can also develop serendipitously, resulting in profitable business opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 3, "text": "Hence, we know relatively little about whether serendipitous encounters actually lead to meaningful idea exchange that can be applied to one'sown tasks, or whether these interactions can spark new collaborations and broader diffusion of ideas over time.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-07", "group": "role", "status": "reference", "label": "Discovering and acquiring needed resources", "description": "Serendipity helps entrepreneurs find out which knowledge, skills or resources they need, and obtain them through unplanned interactions.", "when": "The entrepreneur says they realised a need only on encountering it, or obtained key knowledge or assets through an unplanned social interaction.", "example": "", "notwhen": "The chance encounter produced an ongoing partnership (use Chance partnerships and network ties) rather than a specific resource or piece of knowledge.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "In the context of mergers and acquisitions, Carayannis (2008) noted that serendipity can appear through knowledge dynamics and social interactions in the operational, tactical, and strategic phases.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 25, "text": "This also helps resolve a challenge for incubators: Targeted support at a particular point in time is unlikely to be helpful, because ventures’ resource needs change and may be unknown; hence, serendipity- inducing approaches are necessary.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-09", "group": "role", "status": "reference", "label": "Redirecting a discovery to new applications", "description": "A project, product or technology is moved toward a different use, target or product than first intended because of an unexpected finding. Sometimes it passes through several uses, or a failing project is rescued this way.", "when": "The account follows a specific technology or project shifting to an unplanned application, indication or product line, possibly one larger than the original aim.", "example": "", "notwhen": "The whole venture's business model or market changes (use Pivoting the venture's direction). If the offering existed before any need for it, use Discovery before demand.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 20, "text": "Indeed, this application had the potential to generate a much bigger market than the first Trizact abrasive product introduced for conventional abrasive applications.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 9, "text": "At first, the discovery generated a product that was sold to firms in Japan to brighten the display of products.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 5, "text": "The discovery of the drug's side effects opened up an alternative possibility, subsequently exploited by Pfizer.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Serendipity as Ideology and Politics of Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 12, "text": "Well-organized research along clearly defined lines is most often the method by which modern science achieves its goals.” 12 This does not mean that serendipity is not worth cultivating.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 15, "text": "At this moment, the project was still “detemporalized” because a detailed project plan and timeline had not yet been defined.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 3, "text": "The patient returned and reported that, “by the way, doctor, this is the first time I haven ’t become dizzy or nauseated on the ride to your office.” (Box 424; Box 427: i1634, i4873).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-10", "group": "role", "status": "reference", "label": "Strategy and goals emerging from events", "description": "The venture's strategy, goals and basic shape are not fixed in advance. They are constructed over time from chance events, feedback, stakeholder commitments and interactions, and are often formalised only afterwards.", "when": "The person says the venture's aims or strategy emerged or kept changing through events, contacts or commitments. Strategy may follow a discovery, or seized opportunities may later be shaped into a coherent strategy, rather than being set first.", "example": "", "notwhen": "A defined original plan was explicitly abandoned at a turning point (use Pivoting the venture's direction). Changes that were planned stages of a predefined path do not count.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 84, "text": "Building on a recent systematic review on serendipity in the management context (Busch 2022), we define serendipity as a surprising and valuable discovery originating from agentic responses to unplanned events.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davidsson (2015)", "title": "Entrepreneurial opportunities and the entrepreneurship nexus: A re-conceptualization", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2015.01.002", "page": 14, "text": "Second, New Venture Ideas being incomplete and malleable at early stages makes it unlikely that their early-stage characteristics can accurately explain venture creation Outcomes at a much later time.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 13, "text": "Under uncertainty, effectual networking changes the portfolio of ties who commit to co-create the venture, thereby generating unexpected contingencies and enabling the serendipitous emergence of new entrepreneurial goals . 5.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 25, "text": "It was only after the discovery that the military magnetron was also a microwave oven that they set the strategy for the entry in the kitchen appliances business.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 21, "text": "Human imagination and human aspirations influence each other and reshape one another continually, both directly and through economic artifacts.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 21, "text": "Furthermore, who comes on board determin es the goals of the enterprise.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 2, "text": "Instead, they propose a diachronic conceptualization of venture creation in which the individual-opportunity nexus evolves over time and is not fixed from the moment of initial intentions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 13, "text": "In this second type of path dependence, entrepreneurial action is not only affected by an existing path through time, it can create that path (Arthur, 1989).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 15, "text": "For instance, it has been shown that when firms maintain a broader “north star” (a broader purpose or ambition) while embracing emergent strategy, this can lead to an openness to the unexpected, allowing for serendipity to emerge (Gyori et al. 2019).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 8, "text": "Hence business by small firms with Eastern Europe is often based not on strategic planning, as business literature would suggest, but on reaction to opportunities that arise with specific old or new network partners, and that only later are formed into a coherent strategy.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-11", "group": "role", "status": "reference", "label": "Side activity becomes the core business", "description": "An incidental, temporary, peripheral or deprioritised activity, or a modest local fix, turns out to be valuable and becomes the venture's main strategic thrust.", "when": "Something taken up casually, pursued on the side or initially seen as uninteresting is described as growing into what the firm mainly does.", "example": "", "notwhen": "The new direction came from an outside event or signal rather than from the firm's own side activity (use Pivoting the venture's direction).", "evidence": [{"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 27, "text": "Furthermore, as the potential for strategic value becomes clearer over time, serendipity work also becomes more deliberate (casually listening in shifts to strategically monitoring), oriented toward shaping a future potential, in line", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 9, "text": "The intendedly temporary tactical improvisation became the firm’s primary strategic thrust.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 11, "text": "Our suspicion is that much strategic adaptation results from unconnected strategies (whether or not clandestine) that succeed and so pervade the organization.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-12", "group": "role", "status": "reference", "label": "Successive opportunities chaining from earlier results", "description": "The by-products or unexpected results of one project become the starting point for the next, so the venture moves into new lines of business in a progression.", "when": "The person describes noticing that an outcome or by-product of an earlier project could support a new project or business line, and then launching it, possibly several times over.", "example": "", "notwhen": "A single side activity grows into the core business (use Side activity becomes the core business). New lines planned independently of earlier results do not count.", "evidence": [{"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 14, "text": "The impact of the bricolage we observed varied from very little to the generation of major new business activities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 34, "text": "In his eagerness to undermine the validity of planning, Langmuir goes almost as far as Hooke in putting the scientist in the hands of Providence: “[The satisfactory results] occurred as though we were just drifting with the wind.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-13", "group": "role", "status": "reference", "label": "Reviving a shelved idea", "description": "An idea that once looked like a mistake, or was abandoned or left latent, becomes valuable later when circumstances or complementary assets change, and is then taken up again.", "when": "The account describes returning to an earlier failed or shelved idea because changed conditions made it newly useful.", "example": "", "notwhen": "An ongoing project is redirected while still active (use Redirecting a discovery to new applications).", "evidence": [{"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 22, "text": "For instance, an idea may not be valuable due to a lack of complementary assets, as Brown (1997) described in PARC’s development of its early personal computer designed to work in a distributed network.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-14", "group": "role", "status": "reference", "label": "Triggering international entry", "description": "Chance contacts, orders or encounters, rather than strategic planning, start a firm's entry into foreign markets, often early and with low commitment or resources.", "when": "The person says first business in a new country came about through an unexpected contact, order or opportunity.", "example": "", "notwhen": "An unexpected event deepens commitment in a market already entered (use Advancing growth and success). Planned international expansion does not count.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "This usually occurs when strategic commitment toward internationalisation is low, although they still expand internationally quite early ( Wood et al. , 2011 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 7, "text": "Thus, in addition to initiatives by existing partners, entry of new partners into the network is a typical event triggering international entry.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-15", "group": "role", "status": "reference", "label": "Unexpected value from acquisitions and expansion", "description": "Much of the value of an acquisition or expansion emerges serendipitously, for example from technology unexpectedly found in the acquired firm.", "when": "An acquisition, merger or expansion is described as producing benefits that were not anticipated.", "example": "", "notwhen": "The acquisition led to a change in the firm's direction (use Pivoting the venture's direction).", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 97, "text": "Research has shown that when people fill a role in both the subsidiary and the parent company, it helps them link different parts, and gives them the required standing in the parent organisation to “lobby” for ideas that emerge from the “periphery” (Graebner 2004).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 15, "text": "Research has shown that when people fill a role in both the subsidiary and the parent company, it helps them link different parts, and gives them the required standing in the parent organisation to “lobby” for ideas that emerge from the “periphery” (Graebner 2004).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-17", "group": "role", "status": "reference", "label": "Discovering new products or markets", "description": "An unexpected discovery leads a venture to introduce a new or radically new product or service category, or to enter a latent market.", "when": "The person links a chance discovery or chance-rich experimentation to a fundamentally new offering or a newly found market.", "example": "", "notwhen": "The discovery only improves existing products or processes (use Incremental improvement of operations). If the venture abandons its original business for the new one, use Pivoting the venture's direction.", "evidence": [{"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 5, "text": "For example, Honda ’ s unexpected discovery of latent demand for small motorcycles in the U.S. enabled them to introduce a highly successful product category to a market dominated by large motorcycles ( Andel, 1994 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 1, "text": "Thus, the presence of these biases leads to an NPD process in which we continue to irrationally prefer a low-risk approach, which is unlikely to deliver the radically better outcomes that competitive strategies require.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 12, "text": "Before 3D printers arrived, makers often had to wait a day or more to examine prototypes.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-18", "group": "role", "status": "reference", "label": "Incremental improvement of operations", "description": "Serendipitous discoveries in day-to-day operations improve or extend an existing business, for example by finding synergies between resources or making process improvements.", "when": "A chance find leads to an improvement in products, services, processes or efficiency in an ongoing business, without founding or redirecting it.", "example": "", "notwhen": "The find yields a fundamentally new product or market (use Discovering new products or markets).", "evidence": [{"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 8, "text": "By synthesizing disparate knowledge sources, serendipitous discoveries generate insights that can be translated into products, services, or processes (Foster & Ford, 2003; Lane et al., 2021).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 4, "text": "I’ll dry ‘em and make powder and flakes in Idaho.”’ Thus, through a contingent meeting with Sokol, Simplot found an opportunity to recombine his existing resources (storage and sorting facilities and access to a large supply of onions) with new ones (onion-drying processes).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-19", "group": "role", "status": "reference", "label": "Serendipity complementing planned effort", "description": "Serendipity usually plays a secondary but essential role within planned effort. Planning may inspire the search, a chance event creates the fit, and means-based work then develops it.", "when": "The account shows deliberate planning or search in which an unexpected element proved crucial, or a sequence moving from planned search to chance fit to development.", "example": "", "notwhen": "The chance event replaced the plan rather than supporting it (use Pivoting the venture's direction).", "evidence": [{"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 8, "text": "Causation, then, inspires the initial search, and then the recognition of new information by various means (chance encounter or otherwise) inspires the fit between the individual and an idea, while effectuation logic inspires the entrepreneur to work within their given set of means.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 15, "text": "(3) Serendipity plays a supporting but essential role, that should not be underestimated or exaggerated.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-20", "group": "role", "status": "reference", "label": "Redirecting the person's career path", "description": "Unexpected events or finds radically change an individual's career or professional direction, or renew their interest in a field, turning them away from prior plans.", "when": "The account contrasts the person's original career plans, such as a corporate job or a research focus, with the new direction taken after an unexpected event.", "example": "", "notwhen": "The change concerns the venture's direction rather than the person's career (use Pivoting the venture's direction). If the result is founding a venture they never intended, use Becoming an entrepreneur without intending to.", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 4, "text": "Prior research has been limited in its ability to observe actual acts of knowledge sharing between pairs, and its implications on knowledge production.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 13, "text": "The findings show that the three interviewed immigrants experienced critical events that radically altered their career paths and led to unanticipated outcomes.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 237, "text": "Their excitement about these events was palpable, and their recall of the events before and after these serendipitous moments was surprisingly vivid.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 1, "text": "This unexpected recruitment effort changed her career\" (p. 384).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-21", "group": "role", "status": "reference", "label": "Reshaping the founder's thinking", "description": "An unexpected experience changes the founder's or manager's mental frames and so shapes their later decisions.", "when": "The person says an unexpected event changed how they think about the business and what they subsequently decided.", "example": "", "notwhen": "The account describes a concrete change of the venture's direction (use Pivoting the venture's direction) rather than a change in how the founder thinks.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "Moreover, serendipity can affect the cognitive frames of managers and entrepreneurs and shape their decisions in the context of foreign market entry (Kiss et al., 2020; Lassalle, 2018).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "role-22", "group": "role", "status": "reference", "label": "Opening new options", "description": "Chance coincidences create new alternatives that actors may choose to pursue. They make options possible but do not by themselves determine where the venture goes.", "when": "The account describes a fortuitous event that created a new possibility or option, whether or not it was later pursued.", "example": "", "notwhen": "The option was actually taken up and changed the venture's course (use Pivoting the venture's direction).", "evidence": [{"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 14, "text": "Strategic choice and chance exist in a relation of sufficiency according to which chance coincidence can, but need not, open up new avenues for future choices (Conjecture 2).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-01", "group": "outcome", "status": "core", "label": "A new product or service", "description": "A specific product, service, feature or process came out of the unexpected event.", "when": "The founder traces something they now sell or do back to the event.", "example": "'That's how our best-selling kit was born.'", "notwhen": "What came out was a new market or customers, not a new offering (outcome-03).", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 19, "text": "The organization invested into the idea, integrated a dirt filter, and turned it into a concrete new product (materialization).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 14, "text": "In a similar vein, Starbucks—as we know it today—emerged from Howard Schultz’s unexpected observation that replicating Italian coffee bar culture around the world could be a valuable business.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 2, "text": "His knowledge of the cockleburs spawned the product known as Velcro, a word derived from velvet and crochet.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 9, "text": "At first, the discovery generated a product that was sold to firms in Japan to brighten the display of products.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 2, "text": "This paper presents an ethnographic study of a product design firm that routinely creates new products by making such connections.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 15, "text": "Eventually, the compound developed in this process became a first-in-class treatment for a specific lung disease and an extraordinary scientific and commercial success for the company.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 34, "text": "But on occasion, the designs that emerged from bricolage represented valuable product or service innovations.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 3, "text": "This may be a new product (such as Velcro), artefact (such as the Rosetta Stone), process (vulcanisation of rubber), hypothesis (such as “penicillium kills staphylococcus bacteria”), use for an object (such as quinine), and so on.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 5, "text": "The Food and Drug Administration (FDA) approved Viagra, on March 27, 1998.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "outcome-03", "group": "outcome", "status": "core", "label": "A new market or opportunity", "description": "The event revealed a market, customer group, channel or opportunity the founder had not seen or planned for.", "when": "The founder says the event opened their eyes to customers or channels they had not targeted.", "example": "'We realised dentists were our real market.'", "notwhen": "The result was a new product or service (outcome-01).", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 9, "text": "Given that serendipity can result in the identification of new market niches ( Casalini et al., 2016 ) and that firms can benefit from serendipitous discoveries or encounters, managers have strived to stimulate it in their organisations.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 20, "text": "How ever, after the acquisition, TouchDown'shead of sales discovered that a mirror-image opportunity existed: he could leverage TouchDown's phone sales force to sell a downsized version of the buyer's product to small businesses.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 18, "text": "The outcome of the second episode was the discovery of an opportunity that lay beyond the local task that the consortium originally set out to solve.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 1, "text": "Serendipity potentially leads to new opportunities and entrepreneurs can explore them to achieve growth.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 19, "text": "The resources acquired to help solve the weekday problem of staff being interrupted led to establishment of a center for providing homeless services during the week, and the amplifying cycle continued.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 3, "text": "Whether the individuals and the organization as a whole can leverage the use of serendipity to create values will determine the results of solving an existing or not-yet-tackled problem, finding an opportunity, or generating new ideas for future use.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "outcome-05", "group": "outcome", "status": "core", "label": "Growth and results", "description": "The founder credits the unexpected event, and what they did with it, with growth, sales, revenue or profit.", "when": "The founder links business results to the event.", "example": "'That channel is now 60% of our revenue.'", "notwhen": "The founder describes no measurable or stated result; use only outcome-01 or outcome-03 as fits.", "evidence": [{"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 5, "text": "The relationship between serendipity and new venture performance Serendipitous discoveries can provide ventures with a potential source of advantage and basis for improved performance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 16, "text": "Furthermore, serendipity plays a critical role in determining business performance and other organisational outcomes.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 1, "text": "The results demonstrate that serendipitous inventions are more positively related to crowdfunding success than nonserendipitous ones via perceptions of product innovativeness.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 2, "text": "Indeed, the history of management in general and marketing in particular reveals that serendipity plays a significant part in the commercial equation (Bernstein, 1998; Taleb, 2004).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 19, "text": "Our study adds to this literature by demonstrating that serendipity supports enhanced innovation performance relative to competitors, but only in the presence of certain industry conditions, such as dynamism.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 10, "text": "First, the estimation shows that on average serendipity brings about better research quality.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "An equivalent formulation can be seen in the context of entrepreneurship, where Fultz and Hmieleski [24] provided evidence of how serendipity is a key mechanism through which organizational improvisation positively relates to new venture performance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "outcome-25", "group": "outcome", "status": "core", "label": "Nothing came of it", "description": "The unexpected opportunity was missed, dismissed, dropped or forgotten.", "when": "The founder recounts a chance signal or contact they ignored or did not follow up, sometimes with regret.", "example": "'Someone offered to invest early on and I said no.'", "notwhen": "The find was pursued and led somewhere; use the outcome codes for that.", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 28, "text": "Thus, ‘serendipity gained’ was based on the individual’s agency in response to an unexpected event, while ‘serendipity lost’ was based on the same unexpected event but not met by individual agency in response to this event.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 28, "text": "This highlights the vulnerability of serendipity: being closely intertwined in everyday planned practices, serendipitous discoveries risk being overlooked or lost along the way, thereby not exploiting to their full potential.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 8, "text": "Depending on the effectiveness of bisociative integration in existing circuits of knowledge/power, the discovery may be implemented or rejected (Clegg, 1989).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Hargadon and Bechky (2006)", "title": "When Collections of Creatives Become Creative Collectives: A Field Study of Problem Solving at Work", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1060.0200", "page": 7, "text": "However, we cannot yet say when such opportunities for collective creativity are missed, because there is still little understanding of these moments and what triggers them.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 9, "text": "While organizations may scan for weak signals, cognitive bias means many of them are ignored or dismissed.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 13, "text": "In 72 decisions, where decision-makers considered change, they chose to maintain their strategies and rejected the option to make a strategic change despite the new information the trigger presented.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 8, "text": "‘Missed’ encounters, serendipitous moments not pursued as opportunities, can yield valuable outcomes of problem refinement.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 13, "text": "However, whether serendipitiesare acted upon might be important for them to be considered serendipitous by others. 5 Also, it does seem that some entrepreneurs may be more exposedto serendipity and more likely to developand create new businesses based on a serendipitously discovered opportunity (Ardichvili et al. 2003).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Moral Implications of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 9, "text": "Collectors, too, miss discoveries and experience regret at doing so, but claims to adumbration, let alone priority of discovery, are neither possible for them nor are they necessary.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "outcome-02", "group": "outcome", "status": "reference", "label": "New market, industry or field created", "description": "A serendipitous discovery produces radical change: a new-to-the-world market, industry, field of knowledge or trajectory. This includes making feasible a need nobody thought could be met.", "when": "The account says the unexpected discovery opened a market or industry that did not exist before, founded a new field, or made a previously unimaginable offering feasible.", "example": "", "notwhen": "The discovery revealed a niche or opportunity in a market that already existed; use 'New market niche or opportunity revealed'.", "evidence": [{"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 20, "text": "Exaptations that are based on (and lead to) the discovery of new -to-the-world phenomena are at the root of some of the most radical innovations.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 19, "text": "These endeavors that opened up new markets and industries plugged into and exploited so - cial and technological contingencies that could not have been anticipated or planned for.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "42 Chapter 3 unlike the collectors, none of the writers dealing with science appears to have made use of Walpole’s apt term in their discussions of accidental discovery.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-04", "group": "outcome", "status": "reference", "label": "New use found for an existing product", "description": "Serendipity redirects an existing product or technology to a use or market it was not developed for. The unintended benefit is then used to win support or create commercial value.", "when": "The account describes discovering, or stressing, a benefit or use of the product that was not its original purpose, and repositioning the product or venture around it.", "example": "", "notwhen": "An entirely new product resulted; use 'New product, service or process'.", "evidence": [{"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 7, "text": "Serendipity as the unintended consequence of design: sildenafil citrate Serendipity can also come about as the unintended consequence of innovation, where products are discovered to have uses other than those for which they were originally designed.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2014)", "title": "Entrepreneurial Storytelling, Future Expectations, and the Paradox of Legitimacy", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0915", "page": 10, "text": "In response, the project team successfully repositioned Gemmase as a \"specialty product\" by shedding its image as a \"commodity product\" in the agriculture market.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-06", "group": "outcome", "status": "reference", "label": "Venture founding and survival", "description": "Serendipity affects whether a venture gets founded and survives. This happens through chance-acquired knowledge, or through an accumulation of favourable or unfavourable unforeseen shocks.", "when": "The account links chance events or chance knowledge to the venture passing a founding threshold, surviving, or failing.", "example": "", "notwhen": "The account concerns growth or results of a venture that already exists; use 'Improved venture performance'.", "evidence": [{"cite": "Carayannis et al. (2011)", "title": "Knowledge Arbitrage, Serendipity, and Acquisition Formality: Their Effects on Sustainable Entrepreneurial Activity in Regions", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2011.2109725", "page": 11, "text": "The presence of a formal network was important to the formation of a new venture, but greater size reduced the effectiveness of the knowledge acquisition process until it reached a critical mass.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2015)", "title": "Perspective—Chance Explanations in the Management Sciences", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0946", "page": 10, "text": "Barnett also suggested that a chance model, in which exposure to competition only impacts the variance of viability, can offer an alternative account (Barnett 2008, p. 58; Denrell 2003).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-07", "group": "outcome", "status": "reference", "label": "Windfall gain from undervalued resources", "description": "Luck or discovery lets the entrepreneur obtain something whose value others did not see, yielding above-normal returns or pure profit without superior foresight.", "when": "The person reports gaining unusual value because a resource or opportunity was cheap, or because nobody knew it existed, relative to its later worth.", "example": "", "notwhen": "The gain is an unplanned side result of an initiative aimed elsewhere; use 'Valuable by-product of other work'.", "evidence": [{"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 12, "text": "The value of technologies at Xerox “lit up ” for them, revealing value unseen by others, because in them they saw solutions to the problem they had formulated.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 11, "text": "The entrepreneur is considered as hiring these resources from himself as owner, and should then include this rental income as part of his (implicit) economic costs.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": 9, "text": "Second, firms can obtain above normal returns through luck when they underestimate the true future value of a strategy.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-08", "group": "outcome", "status": "reference", "label": "Competitive advantage", "description": "A serendipitous discovery, once noticed, evaluated and acted on, gives the venture an edge over competitors. The discovery may be a product, knowledge, capability or the use of prior experience. Authors note it can equally end in waste.", "when": "The person describes an unexpected discovery or unanticipated prior experience giving the venture an edge, or exploiting it ahead of competitors.", "example": "", "notwhen": "The advantage comes from one early lucky break that compounds over time; use 'Lasting head start from an early chance event'.", "evidence": [{"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 2, "text": "Key words: prior experience; preadaptation; initial conditions; technological performance 1.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 3, "text": "16/C111 /C109/C97/C105/C110/C116/C97/C105/C110 /C97 /C99/C101/C114/C116/C97/C105/C110 /C108/C101/C118/C101/C108 /C111/C102 /C115/C108/C97/C99/C107 /C116/C111 /C97/C108/C108/C111/C119 /C102/C111/C114 /C115/C101/C108/C102/C45/C105/C110/C105/C116/C105/C97/C116/C101/C100 /C97/C99/C116/C105/C111/C110/C115/C44 /C101/C120/C112/C101/C114/C105/C109/C101/C110/C116/C97/C116/C105/C111/C110/C115/C44 /C97/C110/C100 /C105/C109/C112/C114/C111/C118/C105/C115/C97/C116/C105/C111/C110/C115 /C98/C121 /C105/C110/C100/C105/C118/C105/C100/C117/C97/C108 /C101/C109/C112/C108/C111/C121/C101/C101/C ur and an entrepreneurial firm accumulate over the opportunity enactment process.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2012)", "title": "Inferring superior capabilities from sustained superior performance: A Bayesian analysis", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.2001", "page": 4, "text": "The reason is that chance events are Strat.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell (2004)", "title": "Random Walks and Sustained Competitive Advantage", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.1030.0143", "page": 11, "text": "Obviously, such persistence could also be produced by alternative processes.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 9, "text": "For some types of systems, seemingly innocuous and improbable serendipities may have far-reaching consequences because the system sometimes amplifies small events into large effects (Taleb 2007).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 12, "text": "In a causal world, chance coincidences can supply possibilities for alternative choices.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-10", "group": "outcome", "status": "reference", "label": "Lucky success not sustained or copied", "description": "Exceptional success driven by early luck tends to regress toward the mean, and others who imitate it cannot replicate the luck. This contrasts with authors who see lasting effects.", "when": "The account describes a chance-driven breakthrough that could not be repeated, or an ilitate serendipitous triggers, bisociations, and the enactment of serendipity can become a “dynamic capability” (Busch 2020a, b; de Rond et al. 2011).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 14, "text": "To understand serendipity as a capability also opens a Pandora’s box of questions for future research: are some organizations ‘luckier’ than others, and if so why?", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-12", "group": "outcome", "status": "reference", "label": "New capabilities built from the unexpected", "description": "Unexpected discoveries add unplanned competences and routines on top of existing ones, or reveal through action what the venture is actually good at.", "when": "The founder describes gaining a new capability, or learning where the venture's strengths lie, through unexpected deviations or by trying things.", "example": "", "notwhen": "The capability is a general ability to exploit serendipity repeatedly; use 'Serendipity becomes a dynamic capability'.", "evidence": [{"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 7, "text": "This prevented reification of established mindsets and allowed the construction of unplanned competences on top of existing competences.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 16, "text": "Whereas the more deliberate strategies tend to emphasize central direction and hierarchy, the more emergent ones open the way for collective action and convergent behaviour.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-13", "group": "outcome", "status": "reference", "label": "Resources and help from chance encounters", "description": "Chance encounters provide concrete resources: clients, funding, assets, partners, support or the removal of a bureaucratic barrier. One study found that former strangers rarely provided money.", "when": "Concrete resources or practical support are traced to a chance meeting or unplanned connection.", "example": "", "notwhen": "The account is about the network itself forming through unplanned ties; use 'Network built from unplanned ties'.", "evidence": [{"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 23, "text": "The social- support structure also helped them turn these opportunities into practice, for example, via funding of emergent ideas.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "This is because the former are usually characterised by limited resources and experience difficulties in anticipating the unexpected and realigning toward the initial plans through resource mobilisation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 230, "text": "In the post-conflict vignettes from Colombia, individuals made unexpected discoveries by a combination of chance and sagacity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 9, "text": "Busch and Barkema (2022), for example, found that serendipitous encounters provided entrepreneurs with crucial resources that enabled them to adapt effectively to community needs despite high environmental uncertainty.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 11, "text": "The entrepreneurs explained that prior strangers were more likely to provide other resources but rarely financial ones.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-14", "group": "outcome", "status": "reference", "label": "Network built from unplanned ties", "description": "Chance encounters accumulate into networks whose value could not be known in advance. Acquaintances give access to opportunities, and chance-initiated contacts grow into lasting relationships.", "when": "The entrepreneur describes their network, mentors, partners or offers arising from chance contacts or weak ties, or chance contacts developing into lasting relationships.", "example": "", "notwhen": "A contact vouches for the entrepreneur or refers customers; use 'Referrals and legitimacy from chance contacts'.", "evidence": [{"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 23, "text": "T- Hub “intuitively” developed conditions facilitating unexpected encounters— and in aggregate, unplanned networks—to emerge, where entrepreneurs met each other and formed connections even if the value of a potential relationship was previously unknown.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Granovetter (1973)", "title": "The Strength of Weak Ties", "venue": "", "url": "", "page": 15, "text": "When a man changes jobs, he is not only moving from one network of ties to another, but also establishing a link between these.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 11, "text": "All in all, we might humbly speculate that serendipitous initiation can be an alternative effective way of developing weak or strong ties over time.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 1, "text": "Is it the same as a chance event?", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-15", "group": "outcome", "status": "reference", "label": "Referrals and legitimacy from chance contacts", "description": "Former strangers vouch for the entrepreneur and refer clients or contacts, sometimes in chains of new customers.", "when": "A once-unknown contact refers customers, makes introductions or lends credibility.", "example": "", "notwhen": "The contact supplies resources directly; use 'Resources and help from chance encounters'.", "evidence": [{"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 11, "text": "This often involved introductions to new potential customers.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-17", "group": "outcome", "status": "reference", "label": "Learning and new knowledge", "description": "Chance discoveries and encounters produce new know-how, information or improved practice that the person brings into later work.", "when": "The person reports gaining knowledge, advice, methods or practice improvements from an unexpected event or a former stranger.", "example": "", "notwhen": "The event changed the person's basic way of seeing or theorising; use 'Changed thinking or new framework'.", "evidence": [{"cite": "Giustiniano et al. (2016)", "title": "Organizational zemblanity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2015.12.001", "page": 2, "text": "Within this field, when science is defined as the practice of gathering knowledge and condensing it into testable laws and theories, serendipity “wonderfully enables and enriches good science” (Pepys, 2007, p. 565).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 11, "text": "We identified three key benefits of networking with strangers: learning (knowledge and information), legitimacy/referrals, and identity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 4, "text": "We find both cooperative and competitive effects of serendipitous knowledge sharing encounters on knowledge production.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-18", "group": "outcome", "status": "reference", "label": "Changed thinking or new framework", "description": "An unexpected result reshapes how the person thinks: it breaks assumptions, opens new questions, yields a new idea or theory, or reorients later decisions.", "when": "The person says an unexpected event changed how they think or decide, challenged established assumptions, or generated a new idea, hypothesis or line of inquiry.", "example": "", "notwhen": "The gain is specific know-how or information; use 'Learning and new knowledge'.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 8, "text": "An unanticipated observation yields an unanticipated kind of new knowledge.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 14, "text": "An original and valuable outcome may then suggest a new predictive logic, leading to a new cone of expectation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 186, "text": "It is this requirement of noticing which informs my hypothesis that the frustrated state which is already aware of its own ignorance would be most congenial to serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 2, "text": "By combining ‘‘ways of seeing’’, serendipity may open new windows for organizational understanding and refresh existing pools of knowledge.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "In their study of Canadian and UK high-tech SMEs, the authors observed that internationalisation decisions were widely contingent on chance events.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-19", "group": "outcome", "status": "reference", "label": "Confidence and entrepreneurial identity", "description": "Unexpected events and the venture's unfolding build self-confidence, belief in one's own agency and an entrepreneurial identity, sometimes through inspiring strangers. These traits arise as an effect of entrepreneurship rather than only as its cause.", "when": "The person describes becoming more confident, entrepreneurial or agentic, or changing their self-concept, after an unexpected event or encounter.", "example": "", "notwhen": "Confidence comes from reading chance performance as proof the strategy works; use 'Strategy reinforced or changed by misread luck'.", "evidence": [{"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 11, "text": "Finally, the original stranger ties, especially with those who remained strangers, helped the entrepreneurs form their identities as entrepreneurs through inspiration, confidence building, and vision.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entre
