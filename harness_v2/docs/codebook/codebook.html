r example starting by talking with friends and contacts to see what could be done.", "example": "", "notwhen": "Only specific existing ties providing staff, money or space are described; use Existing ties supply early resources. Also not when the founder fixed a goal first and then sought means.", "evidence": [{"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 21, "text": "The em ph a sish ere is on cre a tings om ething new with existing means than discovering new ways to achieve given goals.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 9, "text": "The reason for this is that under uncertainty, there is simply no way to know in advance who will be the conduit for the next necessary resource or who will provide the piece of information that will change the venture's current direction.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 9, "text": "Entrepreneurs begin with three categories of \"means\": they know who they are, what they know, and whom they know-their own traits, tastes, and abilities; the knowledge corridors they are in; and the social networks they are a part of.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 22, "text": "Prospective entrepreneurs self-select into support systems, driven by their knowledge, aspirations, or serendipitous circumstances.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-16", "group": "background", "status": "reference", "label": "Existing ties supply early resources", "description": "Founders draw opportunities, staff, funding, space, advice and belief from people they already know, such as friends, family, coworkers, customers and past collaborators.", "when": "Early resources or partners came through existing personal or professional contacts. Examples are funding from friends and family, or prior collaborators forming the team.", "example": "", "notwhen": "The tie was not formed for business and only later unexpectedly became useful; use Non-business ties turning useful. Also not when resources came from strangers or impersonal channels.", "evidence": [{"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 13, "text": "Nonetheless, this scientist continued to rely on his existing personal and professional network—the resources at hand—for recruitment.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 10, "text": "In ‘bootstrapping,’ entrepreneurs finance activities from their own wealth, or from the wealth of those closely associated with them – the triumvirate of ‘friends, family, and fools’ (Bhide, 1992).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 18, "text": "And then they also sent me to business school, an extreme level of privilege.” People For the entrepreneurs in our sample, “people” refers to the critical social and relational capital resources available to entrepreneurs prior to and throughout the venture creation process.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 7, "text": "A.L. described “borrowing people from here and there”.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 8, "text": "Many respondents saw the potential in funding more projects in the early-stage phase as seen by the high rating.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-18", "group": "background", "status": "reference", "label": "Weak and forgotten ties", "description": "Novel information most often comes from acquaintances, dormant or barely remembered contacts, or near-strangers. Close friends tend to share the same information.", "when": "The person credits an acquaintance, an old or nearly forgotten contact, or a loosely known person nearby with new information, help or the opportunity.", "example": "", "notwhen": "The source was a close friend, family member or established collaborator; use Network as channel of unexpected opportunity or Existing ties supply early resources.", "evidence": [{"cite": "Granovetter (1973)", "title": "The Strength of Weak Ties", "venue": "", "url": "", "page": 13, "text": "The Strength of Weak Ties information socially distant from ego may reach him.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eagle (2004)", "title": "Can Serendipity Be Planned", "venue": "", "url": "", "page": 2, "text": "But it is exactly these sorts of “weak ties” within an organization that can be particularly powerful in faciliCan Serendipity Be Planned?", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 218, "text": "The people an individual is closest with (strong ties) tend to also know each other (triadic closure) and are thus less likely to be sources for novel information.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-19", "group": "background", "status": "reference", "label": "Non-business ties turning useful", "description": "Ties formed in everyday surroundings or for non-business reasons, such as friendships, university acquaintances or neighbours, and judged unimportant, later reveal latent value for the venture.", "when": "A pre-existing personal tie not formed for business, or one formed by chance in daily surroundings, later becomes a partner, entry route or solution to a venture problem.", "example": "", "notwhen": "The tie was cultivated deliberately for business, or was already used as a business contact; use Existing ties supply early resources.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 229, "text": "It had a latent value for my research subjects which only became clear through this exchange.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 5, "text": "The ‘coincidence’ of an existing personal acquaintance, or friendship, can at some stage become a business asset.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Clough et al. (2019)", "title": "Turning Lead into Gold: How Do Entrepreneurs Mobilize Resources to Exploit Opportunities?", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/annals.2016.0132", "page": 8, "text": "For entrepreneurs with a low propensity for proactively forming new ties, their network grows based on whatever ties they form serendipitously in their immediate social surroundings.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-20", "group": "background", "status": "reference", "label": "Brokerage across groups", "description": "Holding ties that span otherwise unconnected industries, organisations or groups gives early exposure to ideas from one area that are valuable in another. This position sometimes arises by chance.", "when": "The account explains spotting an opportunity through ties to several disconnected industries, organisations or groups, or through a position bridging them.", "example": "", "notwhen": "The account describes contact with diverse people through a shared setting rather than one's own bridging position; use Cross-domain interaction.", "evidence": [{"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 3, "text": "Edison's laboratory acted as a broker of technological ideas be - cause it had connections to many industries, rather than being central in one, and it linked industries that had few other ties (DiMaggio, 1992).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 23, "text": "The buyer's engineers were receptive to MoveTech's ideas.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 8, "text": "Some of the connections between firms represent “weak ties” (Granovetter, 1973) that facilitate the flow of ideas across distant domains.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-21", "group": "background", "status": "reference", "label": "Knowing who knows what", "description": "Awareness of where expertise sits, and active contacts with experts, help people make sense of unexpected events and use new information.", "when": "The person uses knowledge of who has relevant expertise, or turns to expert contacts, to interpret or exploit an unexpected event.", "example": "", "notwhen": "The contact brought the opportunity itself; use Network as channel of unexpected opportunity.", "evidence": [{"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 7, "text": "This sort of knowledge can be knowledge of who knows what, who can help with what problem, or who can exploit new information.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 6, "text": "116/C101/C110 /C109/C97/C105/C110/C116/C97/C105/C110 /C97/C99/C116/C105/C118/C101 /C99/C111/C110/C116/C97/C99/C116/C115 /C119/C105/C116/C104 /C118/C97/C114/C105/C111/C117/C115 /C101/C120/C112/C101/C114/C116/C115 /C115/C111 /C97/C115 /C116/C111 /C98/C101/C116/C116/C101/C114 /C116/C114/C97/C99/C107 /C97/C110/C100 /C109/C97/C107/C101 /C115/C101/C110/C115/C101 /C111/C102 /C116/C104/C101 /C116/C104/C101/C115/C101 /C101/C118/C101/C110/C116/C115/C44 /C114/C97/C110/C103/C105/C110/C103 /C102/C114/C111/C109 /C105/C110/C116/C101/C114/C110/C97/C116/C105/C111/C110/C97/C108 /C112/C111/C108/C105/C116/C105/C99/C115/C44 /C104/C117/C109/C97/C110 /C114/C105/C103/C104/C116/C115 /C105/C115/C115/C117/C101/C115/C44 /C116/C111 /C103/C108/C111/C98/C97/C108 /C119/C97/C114/C109/C105/C110/C103 /C97/C110/C100 /C69/C108 /C78/C105/C110/C111 /C101/C102/C102/C101/C99/C116/C115/C46 /C70/C111/C114 /C105/C110/C115/C116/C97/C110/C99/C101/C44 /C65/C109/C101/C114/C105/C99/C97/C110 /C69/C120/C112/C114/C101/C115/C115 /C112/C101/C114/C105/C111/C100/C105/C99/C97/C108/C108/C121 /C99/C111/C110/C115/C117/C108/C116/C115 /C97/C117/C116/C104/C111/C114/C105/C116/C97/C116/C105/C118/C101 /C97/C110/C100 /C107/C110/C111/C119/C108/C101", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-22", "group": "background", "status": "reference", "label": "Others help interpret and develop", "description": "Serendipity is often collective. Other people, collaborators or stakeholders, often with different skills, help reveal the relevance of an unexpected find, interpret it, or carry it forward.", "when": "The account describes others (colleagues, peers, partners, investors, people from other fields) helping to notice, make sense of, refine or develop an unexpected idea. It also covers a division of labour between spotting and developing.", "example": "", "notwhen": "Others only delivered the unexpected input; use Network as channel of unexpected opportunity.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 94, "text": "Often, the significance of events is only understood when people from other areas help explore the broader relevance of an unexpected moment.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 3, "text": "In addition, from these perspectives, serendipity is not merely an individual endeavor, but rather a collective accomplishment, a social, distributed process involving people from inside and outside organizational boundaries at different points in time (Garud et al., 2018).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2014)", "title": "Entrepreneurial Storytelling, Future Expectations, and the Paradox of Legitimacy", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0915", "page": 10, "text": "Through such involvement, stakeholders are better able to make sense of what happened and what may now be possible (McCorduck 2004).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 6, "text": "Lastly, networks that are particularly homogeneous, cohesive and insular may be inversely related to serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 23, "text": "Serendipity often emerges based on the skills and interactions of several people (Cunha et al., 2010; Meyers, 2007).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 13, "text": "This dual function embedded in effectual networking assists in treating unexpected contingencies as opportunities to control newly emerging situations, and it may therefore produce valuable serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 19, "text": "Seegal adds the further, tacitly sociological, suggestion that such time for reflection may be especially productive “when shared by others of similar interests.” “The chance observation might often have been overlooked if there had been but one mind to perceive it.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-23", "group": "background", "status": "reference", "label": "Cross-domain interaction", "description": "Settings, cultures and practices that bring together people, units and technologies from different domains create collisions from which unexpected combinations arise. Examples are consortia, rotations, cross-department talk and cross-boundary communities.", "when": "The account traces an unexpected idea to interaction with people of different expertise, other units or disciplines, or to an organisational culture of informal cross-boundary sharing.", "example": "", "notwhen": "The emphasis is on physical closeness enabling chance meetings; use Shared spaces and proximity. Also not when it is on the person's own bridging ties; use Brokerage across groups.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 20, "text": "People rotated between platforms and businesses, and cross-functional team meetings – sometimes including people who were not directly involved – were the norm.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 8, "text": "When the interaction with project size is included as in the second column, separation has a negative coefficient, while the", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 5, "text": "While our original research focus was to unpack knowledge integration practices, not unexpected outcomes, our attention was drawn to them as", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 7, "text": "We label such efforts as scaling down into local practices.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-24", "group": "background", "status": "reference", "label": "Shared spaces and proximity", "description": "Physical or virtual co-location and shared spaces bring diverse people together so that they bump into each other by chance.", "when": "The account describes meeting someone through proximity in a shared space, at events, through seating, nearby organisations or random pairings.", "example": "", "notwhen": "An incubator or accelerator actively brokered the connection; use Incubators and ecosystems.", "evidence": [{"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 22, "text": "Providing interactive digital and physical spaces (Agile Platform Design) facilitates serendipitous encounters for a diverse group of members with similar mindsets to “accidentally bump into each other” (von Hippel & von Krogh, 2016).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 10, "text": "Research in the information sciences has shown that factors such as proximity play a major role for serendipity in virtual spaces, too.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-25", "group": "background", "status": "reference", "label": "Incubators and ecosystems", "description": "Incubators, accelerators, universities, regional networks and other third-party organisations embed entrepreneurs in environments that foster or broker unplanned connections.", "when": "The person was embedded in an incubator, accelerator, university or regional network that produced or brokered an unexpected connection or opportunity.", "example": "", "notwhen": "The place matters because of its ambient knowledge density rather than an organisation; use Knowledge-rich local setting.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "In turn, networks and collaborations can stimulate serendipitous outcomes and result in the exploitation of new strategic opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 9, "text": "Specifically, given the importance of social networks for organisational survival and growth more generally, a number of organisations such as accelerators and incubators have been increasingly mobilised around the globe (Amezcua et al. 2013; Cohen et al. 2019).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-26", "group": "background", "status": "reference", "label": "Knowledge-rich local setting", "description": "Being located in a knowledge-dense area with high absorptive capacity, where knowledge is picked up informally through casual local contact, makes serendipitous knowledge acquisition more likely to lead to venture formation.", "when": "The venture formed after picking up knowledge informally or by chance in a knowledge-rich place, cluster or local social scene, rather than through formal partnerships.", "example": "", "notwhen": "The knowledge came through a formal alliance or a specific organisation such as an incubator; use Incubators and ecosystems.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "It should be noted that formal and informal knowledge acquisition mechanisms can co-exist, and serendipitous knowledge acquisition contributes to new venture formation, especially in knowledge-rich areas with high levels of absorptive capacity ( Carayannis et al. , 2011 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Carayannis et al. (2011)", "title": "Knowledge Arbitrage, Serendipity, and Acquisition Formality: Their Effects on Sustainable Entrepreneurial Activity in Regions", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2011.2109725", "page": 4, "text": "New ventures use one of the two modes of knowledge acquisition—formal through alliance networks or informal through social connections (loose knowledge), and one of the two transformation mechanisms—serendipity, and knowledge arbitrage in their efforts to appropriate new knowledge and improve their competitive positions.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-27", "group": "background", "status": "reference", "label": "Shared community and trust", "description": "Belonging to the same community, with its rituals and shared journeys, creates trust that lets strangers interact openly. This supports the cooperation serendipity needs.", "when": "The person notes being more open with someone because both belong to the same community or know the same people.", "example": "", "notwhen": "Shared formal training or interests are credited with understanding each other; use Shared field background or Shared interests.", "evidence": [{"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 8, "text": "User-innovators who participate in a user community benefit in two significant ways.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 18, "text": "We refer to this as institutionalizing (community) trust.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-28", "group": "background", "status": "reference", "label": "Shared field background", "description": "Common knowledge from overlapping education, discipline or training lets encounter partners understand each other's specialised knowledge. The authors note same-field partners may later become competitive.", "when": "The person mentions sharing, or not sharing, a discipline, training or professional background with someone they met, as affecting whether they could grasp what the other offered.", "example": "", "notwhen": "The overlap is in personal interests or passions across fields; use Shared interests.", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 6, "text": "In distinguishing how field and intellectual overlap shape knowledge production, knowledge similarity describes the distance between the field specialties and intellectual specialties of two knowledge sharing partners.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-29", "group": "background", "status": "reference", "label": "Shared interests", "description": "Overlap in personal interests, passions and pursuits with an encounter partner, possibly across different fields. Moderate overlap aids learning from the encounter.", "when": "The person notes shared topical interests or passions with someone they met, especially across different fields.", "example": "", "notwhen": "The overlap is shared formal discipline or training; use Shared field background.", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 6, "text": "These intellectual interests can be specific to a field's research topics, such as Alzheimer's disease, which is typically studied by neurologists, or span different fields, such as stem cell research.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-30", "group": "background", "status": "reference", "label": "Structure that surfaces the unexpected", "description": "Routines, observation and recording habits, and environments with enough structure (but not too much) make unexpected findings stand out against clear expectations and get noticed.", "when": "The account credits planned routine work, documentation and reporting habits, protocols, or a structured yet varied environment for catching or highlighting an unexpected finding.", "example": "", "notwhen": "The insight came from deliberately unstructured slack time. Also not when it came from cross-boundary interaction; use Cross-domain interaction.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 47, "text": "But our hypothesis is that it is most likely to be encountered where there is enough structure to encourage relevance, but not so much as to suppress the unexpected and unpredicted.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 5, "text": "In an example where a nurse noticed that jaundiced infants placed near the window in the sunshine recovered faster, she did so in a hospital – a highly observed and structured environment ( Roberts, 1989, p. 136).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 19, "text": "In line with recent specifications of the concept of serendipity (Yaqub 2018 , Busch 2022 ), this reorientation only occurs against the background of clear structures and corresponding expectations and behaviors—of which chronos is a central element.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-31", "group": "background", "status": "reference", "label": "Serendipitous dispositions", "description": "Personal traits and habits make some people better at serendipitous finding. These include curiosity, open-mindedness, keen observation, thoroughness, questioning, and a propensity to link seemingly unconnected ideas.", "when": "The account attributes spotting or pursuing a discovery to the person's curiosity, openness, observational skill, habit of examining things fully, or tendency to connect unrelated ideas.", "example": "", "notwhen": "Knowledge or expertise, rather than character, is credited; use Prior expertise enables recognition.", "evidence": [{"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 7, "text": "Regardless of the context, some people will potentially be more competent in finding something serendipitously than others.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 9, "text": "The finding of “new connexions” and “subtile analogies” delighted him; one such connection led him to the neologism serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 5, "text": "They have questioning minds whichchallenge existingassumptions when they are incon­ gruent with empirical observations.These scientists, realizingthat serendipitouseventscan generate importantresearch ideas,recog­ nize and appreciate the unexpected and encourage laboratory assistants to observe and discuss unusual happenings.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-32", "group": "background", "status": "reference", "label": "Resource scarcity pushes towards chance", "description": "Starting with few resources or little knowledge, or operating amid institutional voids, pushes entrepreneurs to act opportunistically. They make do, reach out to strangers, and combine factors others overlook.", "when": "The founder links unplanned experimentation, outreach to strangers, or combining overlooked factors to a lack of resources, knowledge or stable institutions.", "example": "", "notwhen": "The account is about using resources already held; use Resources already at hand. Also not when lack of field knowledge led to pursuing a dismissed area; use Outsider or low-knowledge advantage.", "evidence": [{"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 14, "text": "First, Kenyan entrepreneurs may engage with strangers as a necessity to overcome resource constraints; that is, entrepreneurs in Kenya operate in environments where particular access to resources is limited ( Grzeslo, 2020 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Carayannis et al. (2011)", "title": "Knowledge Arbitrage, Serendipity, and Acquisition Formality: Their Effects on Sustainable Entrepreneurial Activity in Regions", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2011.2109725", "page": 2, "text": "In new ventures, these resources are inherently knowledge based.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 30, "text": "Opportunities may exist even for those who do not yet possess any valuable resource, for example, entrepreneurs (Dew, 2009), but can make meaningful combinations of seemingly irrelevant factors that were omitted by others.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-33", "group": "background", "status": "reference", "label": "Privilege and life circumstances", "description": "Advantages of birth, family, education, health, finances and broader life trajectory shape a person's ability to notice, explore and act on opportunities. Entrepreneurs often regard these advantages as luck.", "when": "The account credits supportive family, birthplace, education, a financial cushion, early access to tools, or family history and life circumstances as enabling the venture.", "example": "", "notwhen": "Reputation, affiliation or network position amplified a lucky break; use Reputation and favourable position.", "evidence": [{"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 17, "text": "The concept of privilege relates directly to the objective existence of distinct advantages that lead to opportunities, with multiple factors (such as specific access, initial resources, and/or support) impacting why some individuals recognize and act on opportunities while others do not.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 217, "text": "One’s life trajectory is a composite of experiences and relationships, shaped by the social contexts one inhabits.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 10, "text": "Historical realist explanation, with its unique ability to account for complex causal patterns and contingent events, is particularly useful for elucidating the emergent processes associated with venture creation (Vaara & Lamberg, 2016).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-34", "group": "background", "status": "reference", "label": "Reputation and favourable position", "description": "Reputation, prior distinction, seniority, institutional affiliation or a well-placed network position bring early recognition and access to resources. These act as a multiplier on lucky breaks.", "when": "The account credits a person's reputation, prior accomplishments, seniority, affiliation or well-placed clique for being approached, gaining early support, or amplifying a lucky event.", "example": "", "notwhen": "The advantages are of birth, family or upbringing; use Privilege and life circumstances.", "evidence": [{"cite": "Liu and Tsay (2023)", "title": "A normative theory of luck", "venue": "Frontiers in Psychology", "url": "https://doi.org/10.3389/fpsyg.2023.1157527", "page": 9, "text": "To further explore what accounts for “early luck, ” we examine one possible mechanism predicted by our model: Mediocre papers may receive high initial recognition or citations if they are published by authors in a favorable position in a network.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 27, "text": "Connecting and implementing requires actors with a broad network and access to resources, typically individuals with a long experience and tenure in an organization or field.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 224, "text": "For those who believe in meritocracy, one’s professional position is attributed to one’sown merit.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 1, "text": "Is it the same as a chance event?", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-02", "group": "mechanism", "status": "core", "label": "Noticing it", "description": "The founder paid attention to something unexpected that others overlooked or would have dismissed.", "when": "The founder describes the moment they registered a cue and kept it in mind.", "example": "'Everyone laughed it off, but I couldn't stop thinking about it.'", "notwhen": "The founder goes on to link it to a need or use (mechanism-06).", "evidence": [{"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 7, "text": "Specifically, noticing and bracketing peripheral information without being cognitively constrained by goal-directed search processes helps social actors identify possibilities that might have previously been overlooked (Merton and Barber 2004; Cunha et al. 2010).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 16, "text": "In all these cases it was eons before the significance of these events was perceived.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 5, "text": "Instead of ignoring the unexpected anomaly, as practitioners of “normal science” are socialised to do, the misfits of “revolutionary science” seize on the deviant development and show how it subverts the established paradigm.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 21, "text": "At the core of serendipity is the noticing of weak cues (Busch and Grimes, 2023), and the review surfaced detection qualities that can help identify cues (Thomas et al., 1993; Weick, 1995) such as unexpected serendipity triggers.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 185, "text": "Without a conscious noticing, no matter how rich the environmental possibilities, the serendipitous moment is lost.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 3, "text": "He later emphasized that Aemming's discovery was mainly attributable to tenacity in seizing an opportunity others had let pass rather than due to just pure chance (Scott, 1947).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "Cognitive bias prevents both the noticing of an unexpected event and then the necessary novel associations from being made.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 5, "text": "It was only Claude, seeing the same experiment as the 500 or so who also heard the lecture, who realised its commercial importance as the first neon light (Box 256: i1733).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 2, "text": "The first function is noticing or being alert to unexpected information.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "mechanism-06", "group": "mechanism", "status": "core", "label": "Connecting the dots", "description": "The founder linked the unexpected input to a need, problem, skill or piece of knowledge, and saw a new idea in the combination (Busch's 'association').", "when": "The founder describes realising how the new information fit something they knew or needed.", "example": "'I put the two together and thought, this could be a product.'", "notwhen": "The founder only noticed the cue without linking it (mechanism-02).", "evidence": [{"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 22, "text": "Connecting involves translating new information into meaningful and applicable knowledge by connecting it to an actor’s existing domain-specific knowledge.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 92, "text": "Step 2: Bisociation Research has shown that bisociation—the connection of previously unrelated matrices of events, skills, or information (for example, linking a serendipity trigger to something relevant)—tends to be at the core of serendipity (Busch and Barkema 2020; von Hippel and von Krogh 2016).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 19, "text": "All potential associations (‘connections between dots’) that are theoretically possible form a latent space of possibility (potentiality).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 5, "text": "In addition to strengthening assimilative powers, knowledge diversity also facilitates the innovative process by enabling the individual to make novel associations and linkages.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 5, "text": "Bisociation occurs when someone combines previously unrelated matrices of skills or information (Koestler, 1964).", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 10, "text": "To see bridges, or ‘matching pairs’, is to creatively recombine events based on the appearance of a meaningful rather than causal link.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 22, "text": "Firms that consistently ‘‘connect the dots’’ between their strategic goals and unexpected opportunities stand to gain a competitive edge in navigating change through innovation (Busch, 2024).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 19, "text": "He describes Edward Jenner’s “capacity to observe and associate the apparently unrelated facts” of the similarity between smallpox and cowpox and the apparent immunity to smallpox of those milkers who had contracted cowpox.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "Serendipity involves an unexpected event, the recognition of weak signals and the connection of disparate information to a potential solution (Busch and Grimes, 2023).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 17, "text": "However, unlike the other entrepreneurs, Stephen recognized how to make custom-fitted replacement bones from information scanned from an MRI because his prior work experience allowed him bring together the 3DPTM process and other new technologies to which he was exposed.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 9, "text": "Our Proposition 3 notes that it is the evaluation of new information outside the specification of the original NPD concept that can lead to novel associations.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 22, "text": "The important insight here is that serendipity comes in different shapes and forms but is always about an unexpected encounter and about connecting potential problems and potential solutions as they emerge, rather than going from (preplanned) problem A to (preplanned) solution B in a linear way (Yaqub, 2018).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 10, "text": "Step 2: Bisociation Research has shown that bisociation—the connection of previously unrelated matrices of events, skills, or information (for example, linking a serendipity trigger to something relevant)—tends to be at the core of serendipity (Busch and Barkema 2020; von Hippel and von Krogh 2016).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 7, "text": "This prediction is based on logic suggesting that for serendipitous invention to occur, individuals must ‘‘connect the dots’’ to discover a previously unforeseen, novel solution (Baron, 2006; Copeland, 2019).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "mechanism-22", "group": "mechanism", "status": "core", "label": "Acting on it", "description": "The founder took concrete steps to pursue the unexpected event: followed up, invested time or money, built or launched something.", "when": "The founder describes what they did next and how quickly.", "example": "'I built a landing page that weekend.'", "notwhen": "Acting meant dropping or changing the original plan (mechanism-23).", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "A crucial component of serendipity is enactment: acting upon the opportunity when it arises (e Cunha et al., 2010).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 186, "text": "Noticing is not enough; it also has to result in action to shore up the changes.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 13, "text": "Thus, serendipity involves the capability of firms to exploit opportunities that arise over time through fast reactions to stimuli and the adoption of emergent strategies ( Crick and Spence, 2005 ; Denrell et al., 2003; Dew, 2009).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 20, "text": "Said differently, even when the same objective advantages exist, and one is able to recognize the opportunities those advantages lead to, some individuals are willing to exert effort and seize those opportunities, while others are not.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 20, "text": "T- Hub not only provided these conditions to facilitate unexpected encounters and bisociations, that is, serendipity, but also helped its members turn these random encounters into real opportunities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 19, "text": "The organization invested into the idea, integrated a dirt filter, and turned it into a concrete new product (materialization).", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 14, "text": "While this causal background supplies the raw materials for choice, something else is required, namely deliberation and commit ment.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 14, "text": "An entrepreneurial attitude is one which is always ready to be surprised, always ready to take the steps needed to profit by such surprises.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 3, "text": "Serendipity requires action on the part of the recipient—action to create favorable circumstances, action to recognize opportunities when they arise, and action to capitalize on unplanned events in a timely manner.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 8, "text": "Acting swiftly, they can realize new opportunities that open with changes in the network, initiatives by existing partners, or new entrants to the network.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 4, "text": "The findings show that serendipity in terms of networking and chance encounters assists entrepreneurs to recognise emerging opportunities, but they have to be quick in responding to them by leveraging their resources.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 19, "text": "Martin, having seniority and access to resources, quickly took action and assigned one of his team members, Joe, to become a full member of WP7.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 8, "text": "In particular, emotional alignment, rooted in congruence with the problem space, may enable an energetic flow, allowing entrepreneurs to act under uncertainty ( Wolfe and Shepherd, 2015b ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 69, "text": "As he puts it most emphatically, “The key point is that serendipity does not, of itself, produce discoveries: it produces opportunities for making discoveries.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 3, "text": "To become a competitive advantage, the assessment must yield value and action because the ability to recognize and evaluate unexpected information has no value in itself.", "close": false, "none": false, "chosen": "reading"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 3, "text": "When he got back to work [Sadow worked at a luggage company], he took casters off a wardrobe trunk and mounted them on a big travel suitcase.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "mechanism-23", "group": "mechanism", "status": "core", "label": "Changing the plan", "description": "The founder dropped or reshaped the original plan, product or goal to follow the unexpected input.", "when": "The founder describes abandoning or changing their idea or strategy because of the event.", "example": "'We scrapped the app and focused on the API.'", "notwhen": "The founder acted on it without changing any plan (mechanism-22).", "evidence": [{"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 2, "text": "When a scientist encounters a serendipitous finding, they are faced with an important choice: to be flexible and change the research plan to pursue the serendipitous event, or to stick closely to the initial plan.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "Therefore, serendipitous internationalisers tend to develop their foreign market entry strategies through an evolutionary approach (Ciravegna et al. ,2 0 1 9; Merrilees et al. ,1 9 9 8).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 13, "text": "Informal organizational structures allow for the agility to alter current plans that can then be used to exploit newly discovered opportunities (Davis et al., 2009).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 22, "text": "After
