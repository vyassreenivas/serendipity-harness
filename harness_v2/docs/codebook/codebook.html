utsider status creates other challenges, such as understanding what resources are misevaluated (i.e., learning barriers).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 7, "text": "Interestingly, this suggests possible unexpected benefits to inexperience in the early stages of a project, wherein the time-contingent importance of serendipity is presumed to be amplified (Cunha et al. 2010; also see Kornberger et al. 2005).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "March (1991)", "title": "Exploration and Exploitation in Organizational Learning", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2.1.71", "page": 16, "text": "Moreover, my initial ignorance of the powerful, false objections that were raised against my ideas protected those ideas from being nipped in the bud.\" These observations do not overturn the renaissance.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 14, "text": "Moreover, my initial ignorance of the powerful, false objections that were raised against my ideas protected those ideas from being nipped in the bud (Polanyi, 1963: 1013).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "Indeed, managers should be ready for new international opportunities that emerge and promptly adapt their strategies accordingly.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-20", "group": "condition", "status": "reference", "label": "Expertise and functional fixedness", "description": "Growing mastery, specialisation and success in current activities narrow expectations, fix how tools and resources are seen and crowd out experimentation with new possibilities.", "when": "The person describes habitual uses, narrow specialisation, routine skill or commitment to core competence making them overlook or not follow up an unexpected option.", "example": "", "notwhen": "The dismissal stems from biases such as overconfidence or anchoring; use cognitive biases.", "evidence": [{"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 8, "text": "Roots of success Competence building (market share) Superior technological capacity Empowerment of front line employees Capacity of local adjustment Luck (in the case of the popularity of Supercub model) Technological capabilities must be combined with local adjustment.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "March (1991)", "title": "Exploration and Exploitation in Organizational Learning", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2.1.71", "page": 3, "text": "It is also clear that improvements in competence at existing procedures make experimentation with others less attractive (Levitt and March 1988).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 14, "text": "As a maker's mastery of processes and materials increases, predictions become more accurate, because masters can more often achieve what they intend (expertise narrows the cone).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 8, "text": "Learning by doing does not contribute to the diversity that is critical to learning about or creating something that is relatively new.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 11, "text": "Here we briefly discuss how our notion of a functional search image links to problem solving, but more importantly, reinforce the link between search images and the origins of new resources.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 10, "text": "For example, if functional fixedness is a major impediment, guidance toward envisioning novel need–solution pairs can also be more systematically supplied.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 6, "text": "However, co-ordination might render it unnecessary for all researchers to have a disposition for serendipitous discovery.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-21", "group": "condition", "status": "reference", "label": "Cognitive biases", "description": "Overconfidence, complacency, anchoring, illusion of control, underestimating the unexpected, se to a perceived lack of legitimacy or the desire to appear rational (Busch and Grimes, 2023).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-23", "group": "condition", "status": "reference", "label": "Broad versus narrow goals", "description": "Broad, aspirational or unspecified goals and loosely defined problems raise the chance of picking up the unexpected; narrow, over-specified goals, fixed criteria or task-focused productivity create selective inattention.", "when": "The person contrasts a broad mission or open-ended aim with tightly specified targets in relation to noticing or missing unexpected options.", "example": "", "notwhen": "The account concerns where search was directed rather than how goals were set; use searching beyond the core.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 228, "text": "I suggested that a simple change in protocol could create space for the unexpected.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "Readers of ‘The Mancroft Essays’ will be mildly thrilled by many a felicitous coincidence and fortunate chance in their adventure.” Simply his pursuit of scholarly byways rather than highways, then, tends to expose the antiquarian to the excitement of unexpected discoveries.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 35, "text": "[10] In recent years, companies have used the development of a broader social purpose, for example related to the UN’s Sustainable Development Goals, to maintain a broader ‘north star’ while embracing emergent strategy , allowing for the emergence of serendipity .", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 15, "text": "For instance, it has been shown that when firms maintain a broader “north star” (a broader purpose or ambition) while embracing emergent strategy, this can lead to an openness to the unexpected, allowing for serendipity to emerge (Gyori et al. 2019).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 14, "text": "They pursued opportunities without predefined end goals, responding adaptively to emerging circumstances.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 5, "text": "In terms of Curry in a Hurry, this could mean something like a progression from the entire city of Pittsburgh to Fox Chapel (an affluent residential neighborhood) to the Joneses (specific customer profile of a wealthy family), as it were.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 6, "text": "Proposition 3: If an unexpected result occurs the likelihood of it being noticed is diminished when the evaluation criteria of NPD actions are fixed in advance.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-24", "group": "condition", "status": "reference", "label": "Searching beyond the core", "description": "Undirected, wide search and attention to peripheral users, markets, uses or domains outside one's usual focus increase unexpected discovery.", "when": "The person wandered into, looked at, or entered markets, users or fields far from their core, or kept the problem open while exploring broadly.", "example": "", "notwhen": "The point is goal breadth; use broad versus narrow goals.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 73, "text": "By engaging with users, one cannot predict that something valuable will be discovered, but the chance of unexpected discovery increases as curiosity and novel forms of thinking are sources of organizational re-creation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 22, "text": "This search is usually undirected and so more likely than targeted search to land in unexplored or unexploited areas.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 10, "text": "To stimulate the imagination of serendipitists, it may be advantageous to invite people to look beyond what is usual and familiar.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 1, "text": "It involves matching a need (problem) with a solution — referred to as a need-solution pair ( Von Hippel and von Krogh, 2016 ) — and can be understood as a form of complex problem solving ( Newell and Simon, 1972 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Introduction The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 6, "text": "Although there are, of course, benefits to be gained from the narrowing of research focus, specialization limits our ability to reach outside of what we practice on a daily basis.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 8, "text": "Active search appears more common in large and — as predicted by the internationalization model — nearby countries, while ‘chance’ appears more important in peripheral (other) markets, in this study Hungary, Czech Republic and Yugoslavia (Table 4).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-25", "group": "condition", "status": "reference", "label": "Too much openness and need for focus", "description": "Openness without focus leads to drifting between opportunities; some focus, lance between structure and chaos, unlocking the full potential of serendipity as a driver of innovation and competitive advantage.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 7, "text": "A system which allowed itself to be derailed from a task at hand might not achieve as much as one which maintains focus.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-26", "group": "condition", "status": "reference", "label": "Planned work as a seedbed", "description": "Serendipity arises within routine, goal-directed work and purposeful action, which also make surprises visible against the plan; alternating goal progress with open modes helps.", "when": "The surprise emerged while doing assigned, routine or planned tasks, or was noticed because it departed from a plan.", "example": "", "notwhen": "The person says plans blinded them; use rigid versus flexible plans.", "evidence": [{"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 28, "text": "Our results suggest that planned work facilitates the practices of serendipity work.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 24, "text": "For instance, kairos-driven moments of serendipity did not lie outside or apart from chronos-driven moments of routine work; in fact, they were created in and through those moments.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 226, "text": "Even the more goal-directed activities were often based on and interwoven with modes of interaction that were more conducive to serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity as a Political Metaphor. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "Through it, he was always discovering interesting, or amusing, or delightful things while hunting for something quite different; and this tended to keep him keyed up and expectant.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 22, "text": "While much of the literature on serendipity remains descriptive or phenomenological ( Garud et al., 2011 ; Austin et al., 2012 ), our study contributes by showing how systematic and purposeful action can create conditions that increase the likelihood of serendipitous outcomes.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-27", "group": "condition", "status": "reference", "label": "Prior commitments", "description": "Commitments to funders, contracts, assigned targets, sunk investments, dominant stories and accumulated stakeholder obligations limit the freedom to redirect toward unexpected opportunities.", "when": "The person could not follow an unexpected lead because of investor expectations, contracted tasks, committed resources or earlier commitments.", "example": "", "notwhen": "The constraint is internal plan fixation; use rigid versus flexible plans.", "evidence": [{"cite": "Garud et al. (2014)", "title": "Entrepreneurial Storytelling, Future Expectations, and the Paradox of Legitimacy", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0915", "page": 8, "text": "These researchers found that the dominant stories adopted by entrepreneurs of a biomanufacturing company prevented them from questioning prior assumptions even when the company encountered a crisis.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 10, "text": "Indeed, exogenous shocks to an industry or market may have created opportunities precisely", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Serendipity as Ideology and Politics of Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 7, "text": "Every scientist knows that some of the most important discoveries in the history of science have been made by accident or on the basis of false assumptions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 10, "text": "Funders may have intended for there to be cross-over from their designated target, or investigators may have been well aware of multiple avenues that were potentially fruitful but disclosed only some of them.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 6, "text": "Even scientists who recognize and appreciate the significance of the unexpected may find their time and resources totally com­ mitted to existing projects.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 21, "text": "This principle involves negotiating with any and all stakeholders who are willing to make actual commitments to the project, without worrying about opportunity costs, or carrying out elaborate competitive analyses.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-28", "group": "condition", "status": "reference", "label": "Formal control and efficiency drives", "description": "Stage-gates, Six Sigma, schedules, short-term metrics, bureaucratic top-down management and predefined innovation channels kill or ignore unexpected avenues. One author instead treats reliance on chance as a symptom of bureaucracy.", "when": "An unexpected opportunity was blocked, killed or ignored because of formal evaluation, schedules, efficiency pressure or a manager insisting on the plan.", "example": "", "notwhen": "The account praises few rules and informal arrangements; use loose, flexible structure.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 10, "text": "During his tenure between 2000 and 2004, McNerney sought to improve operational efficiency by establishing central control, introducing Six Sigma 3 initiatives and standard routines, and placing an emphasis on projects with the potential to yield quick results.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity in the Humanities. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "Instead of admiring the qualities that make for unexpected discoveries—curiosity, spontaneity, imaginativeness, a sense of adventure—they frown on them.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 2, "text": "The findings of this paper suggest that a bureaucratic and formalistic research manager can block a leading scientist from approaching an initial research plan flexibly and pursuing serendipitous findings, which are a source of quality scientific discoveries.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 12, "text": "Rather, entrainment maintains and secures the dominant temporal order and the prescribed steps of the innovation process, thereby framing any moments of tension as unwelcome deviations from the plan rather than as opportunities for exploration.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 8, "text": "In short, different forms of serendipity could have different implications for policy and theory.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 3, "text": "Difficulties arise if value appears unpredictably, however, because such an approach might precipitously kill a project that could benefit from accidental innovation, forfeiting emergent value.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 24, "text": "Given these solutions, innovation occurs after considerable struggle despite (and not because of) organizing structures (Dougherty & Hardy, 1996), only to settle down to equilibrium, i.e.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 26, "text": "A structural solution that predefined areas for innovation would not have fostered these discoveries.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-29", "group": "condition", "status": "reference", "label": "Loose, flexible structure", "description": "Informal, flat and lightly structured organisations with simple rules and the ability to shift resources quickly can capture unexpected opportunities; heavy structure narrows them.", "when": "The account links informal arrangements, few rules or rapid redirection of resources to taking up an unexpected opportunity.", "example": "", "notwhen": "The focus is individual freedom to follow leads; use autonomy to follow leads.", "evidence": [{"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 8, "text": "In other words, more needs to be known about when, how and why some serendipitous events gain strategic momentum whereas others evanesce or are countered rather than encouraged.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davis et al. (2009)", "title": "Optimal Structure, Market Dynamism, and the Strategy of Simple Rules", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2009.54.3.413", "page": 31, "text": "Less structure enables the flexible capture of serendipitous opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 6, "text": "They poise the company on what’s termed in complexity theory “the edge of chaos, ” providing just enough structure to allow it to capture the best opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 6, "text": "In addition to allowing firms to more easily act on new and unexpected opportunities, informal structure makes it more likely new opportunities can and will be exploited.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 7, "text": "The introduction of Six Sigma at 3M created a culture of discipline with a focus on execution, but it discouraged exploration ( Hindo, 2007) and therefore openness to the unexpected.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and ilarity between two individuals increases .", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 7, "text": "The former survived only on revenues from selling his products, whereas the latter worked in an institution that subsidized his costs.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 186, "text": "One had the time and resources to follow this up and the other did not.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Introduction The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 10, "text": "Introduction xxi social institution, to an interest in the role of the unanticipated in scientific discovery—both the “by-products” of intended research and, correspondingly, the main products of unintended research.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-36", "group": "condition", "status": "reference", "label": "Unequal access", "description": "Serendipity is unequally distributed: privilege, networks and in-person presence widen access, while poverty, financial strain and marginal position sap attention and limit it.", "when": "The person notes that social position, financial pressure or lack of in-person contact limited or enabled chance encounters.", "example": "", "notwhen": "The issue is only the venture's own funds; use time, money and support.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 225, "text": "As I now turn to examine serendipity in rural parts of Colombia, one thing that stands out to me is how the scale of impact of serendipity is shaped by networks and privilege.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 20, "text": "For example, in settings characterised by higher power distance (in which lower-ranking individuals tend to accept that power is distributed unequally), it might be more difficult to trigger serendipity, as hierarchical divisions might hinder the free flow of information and ideas.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-37", "group": "condition", "status": "reference", "label": "Attention load and multitasking", "description": "Attention is limited; authors differ on multitasking, some seeing broad simultaneous tasks as favourable, others finding overload or sequential work matters.", "when": "The person links juggling tasks, overload or one-at-a-time working to noticing or missing opportunities.", "example": "", "notwhen": "The account is about time slack; use slack time.", "evidence": [{"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 5, "text": "Multitasking—in such environments—can generate cognitive overload, resulting in shallow engagement with tasks, reduced depth of problem-solving, and hindered organizational learning t izations could take enough time to engage in extensive trial-and-error actions to capture any opportunity, opportunities actually have limited time windows in which they are viable (D’Aveni, 1994).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-39", "group": "condition", "status": "reference", "label": "Retaining past knowledge", "description": "Storing and retrieving past ideas, failures and competences lets later chance connections occur.", "when": "A shelved idea, retained team or stored knowledge enabled a later discovery.", "example": "", "notwhen": "The stress is on long development time; use patience.", "evidence": [{"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 11, "text": "Managers in two of the dominant firms (USWindPower and ESI) made it clear that they did not want to invest much in on-going technology development in-between stages ( Karnøe, 1993).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 6, "text": "Indeed, interconnecting platforms of knowledge made it possible for people to go ‘back to the future’, allowing 3M to harness – rather than limit – the complexity that innovation requires and generates.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 3, "text": "Edison's laboratory did more than just transfer knowledge from groups where it was plentiful to groups where it was dear; this organization t made earlier advantages useless.", "example": "", "notwhen": "Use amplification code when gains persist.", "evidence": [{"cite": "Denrell (2004)", "title": "Random Walks and Sustained Competitive Advantage", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.1030.0143", "page": 7, "text": "Clearly, as bdecreases, the distribution becomes unimodal and concentrated around 5.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2012)", "title": "Inferring superior capabilities from sustained superior performance: A Bayesian analysis", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.2001", "page": 12, "text": "For example, due to a technological shift, resources that the firm had accumulated are no longer relevant.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-67", "group": "condition", "status": "reference", "label": "Reputation for quality", "description": "Commitment to quality and clients opens chance opportunities.", "when": "Opportunity credited to reputation.", "example": "", "notwhen": "Use network breadth for contacts.", "evidence": [{"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 16, "text": "Being alert to changes in the environment and commitments to clients in terms of high-quality products and services are other elements that may open new windows of opportunity.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-68", "group": "condition", "status": "reference", "label": "Board resists tangents", "description": "Investors or board members discourage the founders from following side opportunities, even surprising ones.", "when": "The founder describes investors or a board pushing back on following an unexpected opportunity.", "example": "", "notwhen": "", "evidence": [{"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 14, "text": "“We discovered up there that there's a surprising market… the challenge is that the Board of Directors does not want us to go on a tangent.", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "condition-69", "group": "condition", "status": "reference", "label": "Enjoyment of the activity", "description": "Users who enjoy the activity are more likely to keep innovating and to drift into founding.", "when": "The founder says they did it because they loved the activity or hobby.", "example": "", "notwhen": "", "evidence": [{"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 11, "text": "Engaging in work related to an enjoyable and satisfying activity is particularly relevant in the case of hobbyist users, where lifestyle benefits can be significant.", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "condition-70", "group": "condition", "status": "reference", "label": "Small niche market", "description": "User entrepreneurship is more likely in niche markets that established firms ignore.", "when": "The founder describes a small or specialised market large firms did not serve.", "example": "", "notwhen": "", "evidence": [{"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 12, .25525647", "page": 23, "text": "The amplifying actions and their dynamic interplay with contextual conditions escalated the accumulation of small changes into a pattern that ultimately became radical, but the resistance created by negative feedback along the way limited how far and how fast the system changed.", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "account-01", "group": "account", "status": "core", "label": "Told as if planned", "description": "Looking back, the founder tells an unplanned, chance-filled path as an orderly plan, smoothing over or leaving out the unexpected turns.", "when": "The story is told as linear or intended, while the details show unplanned turns.", "example": "'We always knew this was the market', though earlier they describe stumbling into it.", "notwhen": "The founder credits skill rather than recasting the sequence; if nothing fits, MIS-ACC.", "evidence": [{"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 8, "text": "Consistent with Berlin, the historian Carr wrote that history entails the lining up of events in an orderly sequence of cause and effect, a selective process in which the intellect is complicit.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "Some scientists seem to have been aware of the fact that the elegance and parsimony prescribed for the presentation of the results of scientific work tend to falsify retrospectively the actual process by which the results were obtained.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 1, "text": "Post hoc perspectives of venture creation typically involve high “narrativity,” characterized by structured, linear, teleological sense-making that tends to omit unreasoned and unintended facets of entrepreneurship.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 16, "text": "Scientists then report their results as following directly and logically from their initial hypothesis, omitting possibly crucial (pseudo)serendipitous events.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 12, "text": "Also, managers may be reluctant to admit serendipity , preferring to credit their deliberate strategies rather than ‘luck.’", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 8, "text": "As explained byMeyers (2007), many valuable discoveries made serendipitously are even the object of retrospective falsification in order to appear as if they were rational and purposeful from the beginning.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url":
