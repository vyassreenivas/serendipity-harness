tum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 23, "text": "For example, TouchDown's vice president of sales had the authority to implement his idea for selling the buyer's product via telesales because he was the leader of the combined firm's channel sales organization.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 4, "text": "When a scientist observes unexpected but potentially creative serendipitous findings or encounters a serendipitous idea, they need to encourage the person who plays a managerial role to change the initial research plan in order to pursue the serendipitous.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-40", "group": "mechanism", "status": "reference", "label": "Working around official approval", "description": "Pursuing an unexpected idea without authorisation: borrowing time or equipment, working after hours against orders, or blurring deadlines to keep a project alive.", "when": "The account describes bootlegged resources, secret or after-hours work on a dismissed finding, or deliberately vague timelines used to protect exploration.", "example": "", "notwhen": "The person openly persuades superiors; use Winning buy-in and championing.", "evidence": [{"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 15, "text": "She started working on the anomaly “after hours” and thus temporarily detrained her activities from the established chronos.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 16, "text": "Appeldorn and his colleagues then bootlegged resources and were successful in developing a new plastic Fresnel lens that was far cheaper and superior to other lenses available at that time.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-41", "group": "mechanism", "status": "reference", "label": "Legitimating narratives", "description": "Telling stories that present improvised or improbable activities as coherent and possible to customers, funders or recruits. These stories in turn lock in what the venture becomes.", "when": "The founder describes presenting the venture as more coherent than it was, or building a story that makes an unexpected connection seem possible, which then shaped strategy.", "example": "", "notwhen": "The person simply tells others about a find to draw them in; use Sharing the find widely.", "evidence": [{"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 9, "text": "Like the founder above, some founders seemed to know that they were, in the words of an ex-EPA employee, “playing pretend” when they gave accounts of their firms that legitimated past tactical improvisations as if they had been parts of a coherent forward-looking strategy.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 12, "text": "Grimes was once deemed improbable as now possible (Grimes and Vogus 2021).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-42", "group": "mechanism", "status": "reference", "label": "Building the relationship after a chance encounter", "description": "Following up a chance contact by approaching the person, meeting repeatedly and building trust and friendship until it becomes collaboration or business.", "when": "The account describes visits, repeated meetings and relationship building after a chance meeting, which turned it into joint work.", "example": "", "notwhen": "Others commit resources and join the venture, shaping its direction; use Drawing in partners and amplifying.", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 26, "text": "This shift may be due to the time and repeated interactions needed to develop an initial encounter into a multiplex relationship (Ingram & Morris, 2007; Uzzi, 1997), or the evolving expectations from collaborators as projects move from exploratory research to joint execution of research ideas.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 7, "text": "Crucial for the development of the business is how the partners build their relationship after the first encounter ‘by chance’.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-43", "group": "mechanism", "status": "reference", "label": "Drawing in partners and amplifying", "description": "After acting, extending the serendipitous result by securing commitments from partners, customers, suppliers or investors. The stakeholders who self-select in reshape the venture.", "when": "The person forms alliances, gains precommitments or brings in new partners and investors around the unexpected opportunity.", "example": "", "notwhen": "The effort is to create a market or institutional context for a new use; use Building a market around the new use.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 13, "text": "In Ginger’s story, the process around the critical event leading to the formation of a new venture reflects all components of serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 11, "text": "Effectuation emphasizes strategic alliances and precommitments from stakeholders as a way to reduce and/or eliminate uncertainty and to erect entry barriers. 3.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 21, "text": "This principle involves negotiating with any and all stakeholders who are willing to make actual commitments to the project, without worrying about opportunity costs, or carrying out elaborate competitive analyses.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 19, "text": "We looked carefully at our transcripts and considered the use of language as a way of labeling and amplifying the pattern that was forming around the emergent changes at Mission Church.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-44", "group": "mechanism", "status": "reference", "label": "Building a market around the new use", "description": "After a chance discovery, modifying the artifact for its new function and actively creating the market, niche or institutional infrastructure that makes it valuable.", "when": "The account describes redesigning the product for the newly found use, or working to build markets, standards or partners so the opportunity has value.", "example": "", "notwhen": "The person only realises the find could be a business; use Seeing a business in something already solved.", "evidence": [{"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 5, "text": "In this approach, firms develop new products after having identified a promising function that fulfills a market need.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 14, "text": "In the scientific realm, discovery is (at least by standard accounts) about finding new phenomena and explaining them; in contrast, entrepreneurial discoveries involve shaping and creating value in social settings, which involves action repertoires such as interfering, orchestrating, tailoring, and so on.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-45", "group": "mechanism", "status": "reference", "label": "Seeing a business in something already solved", "description": "Realising that a solution to one's own or a hobby problem, or an accidental invention, could become a business. The realisation often comes as others ask for it through word of mouth.", "when": "The founder describes solving something without business intent, or making an accidental find, and only later seeing commercial potential, for example because others wanted it.", "example": "", "notwhen": "The realisation is that an existing solution meets a different need; use Matching a solution to an unsought need.", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 3, "text": "0/C111/C118/C97/C116/C105/C111/C110 /C97/C110/C100/C47/C111/C114 /C105/C110/C118/C101/C110/C116/C105/C111/C110 /C102/C114/C111/C109 /C115/C117/C99/C104 /C97/C99/C116/C105/C118/C105/C116/C105/C101/C115 /C109/C97/C121 /C110/C111/C116 /C98/C101 /C99/C111/C110/C102/C111/C114/C109/C105/C110/C103 /C116/C111 /C116/C104/C101 /C102/C105/C114/C109/C39/C115 /C99/C117/C114/C114/C101/C110/C116 /C98/C117/C115/C105/C110/C101/C115/C115 /C115/C99/C111/C112/C101 /C97/C110/C100 /C115/C116/C114/C97/C116/C101/C103/C121/C46 /C84/C104/C101 /C103/C101/C110/C101/C114/C97/C108 /C109/C97/C110/C97/C103/C101/C114/C115 /C104/C97/C118/C101 /C116/C111 /C116/C97/C107/C101 /C110/C111/C116/C105/C99/C101 /C111/C102 /C116/C104/C101/C109 /C97/C110/C100 /C112/C114/C111/C97/C99/C116/C105/C118/C101/C108/C121 /C101/C120/C112/C108/C111/C105/C116 /C116/C104/C101/C105/C114 /C99/C111/C109/C109/C101/C114/C99/C105/C97/C108 /C112/C111/C116/C101/C110/C116/C105/C97/C108/C115/C46 /C70/C111/C114 /C105/C110/C115/C116/C97/C110/C99/C101/C44 /C116/C104/C101 /C78/C117/C116/C114/C97/C83/C119/C101/C101/C116 /C115/C119/C101/C101/C116/C101/C110/C101/C114/C44 /C97/C115/C112/C97/C114/C116/C97/C109/C101/C44 /C119/C97/C115 /C100/C105/C115/C99/C11", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Bhave (1994)", "title": "A process model of entrepreneurial venture creation", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/0883-9026(94)90031-0", "page": 8, "text": "SW started his violin repair business as follows: I couldn’t find anyone I had enough faith in to repair violins I was playing, so I started repairing myself, and the word got around that I would do that.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davidsson (2015)", "title": "Entrepreneurial opportunities and the entrepreneurship nexus: A re-conceptualization", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2015.01.002", "page": 12, "text": "The cognitions that give direction to hobbyists' actions to solve their own problems are not NVIs before they see their solution as the potential basis for a business.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": 10, "text": "The patients loved it and it occurred to him that he could make a business out of it (Jones, 2011).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-46", "group": "mechanism", "status": "reference", "label": "Recognising and adopting emergent patterns", "description": "Noticing unplanned initiatives, side activities or patterns in one's own or others' actions, cultivating rather than cutting them off, and formalising them as the venture's strategy.", "when": "The person describes realising that something unplanned or marginal was working and making it the explicit direction, or embracing an employee's initiative.", "example": "", "notwhen": "The change is a response to a single unexpected event; use Changing plans to pursue the unexpected.", "evidence": [{"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 30, "text": "This seems to be a perfect example of an emergent strategy.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 9, "text": "Waters essence, like us, it searches for patterns in streams of actions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 25, "text": "This observation raises the question of the role of leadership in emergent change.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 12, "text": "Organizational strategies can emerge as the result of chance rather than choice.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-47", "group": "mechanism", "status": "reference", "label": "Learning from the event", "description": "Success after a chance find is attributed to a willingness to learn and adapt in the field, including learning from a single critical incident, rather than to foresight.", "when": "A founder describes a significant unexpected event that changed their understanding or later decisions, or credits learning on the go.", "example": "", "notwhen": "The learning comes from deliberate repeated trials; use Experimenting and tinkering.", "evidence": [{"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 36, "text": "What made that strategy brilliant was not foresight but a capacity and willingness to learn, supported by a tolerant organization and its committed personnel.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Soto-Simeone et al. (2021)", "title": "The role of skill versus luck in new venture survival", "venue": "International Journal of Management Reviews", "url": "https://doi.org/10.1111/ijmr.12262", "page": 5, "text": "Another shortcoming of the gambling analogy is that it misrepresents the effects of (entrepreneurial) learning.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-49", "group": "mechanism", "status": "reference", "label": "Leveraging contingencies", "description": "Treating unexpected events, including constraints, threats and crises, as resources to exploit and build into the venture's vision, rather than avoiding them or merely adapting. Human agency, not the event, creates the opportunity.", "when": "The founder describes deliberately turning a surprise, setback, constraint or threat to the venture's advantage or into a new venture concept.", "example": "", "notwhen": "The founder only adjusts course to stay afloat; use Changing plans to pursue the unexpected. If the emphasis is on reinterpreting meaning, use Reframing the unexpected as opportunity.", "evidence": [{"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 13, "text": "So it was absolutely impossible just to wait without doing something.” Leveraging contingencies into a new vision “I took [some of my students] out to dinner and asked them why they had acted so badly in class.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 8, "text": "It differs from spontaneous recognition because it supposes that opportunity discovery involves a vigorous quest on the part of the entrepreneur, rather than the discovery of opportunities that were all along under the entrepreneur’s nose (Kirzner 1997: 72).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "Conceptual model of effectuation-enabled serendipity in new venture creation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 11, "text": "Exploitation of contingencies rather than exploitation of preexisting knowledge: When preexisting knowledge, such as expertise in a particular new technology, forms the source of competitive advantage, causation models might be preferable.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 22, "text": "This principle urges relying on and working with human agency as the prime driver of opportunity rather than limiting entrepreneurial efforts to exploiting exogenous factors such as technological trajectories and socio-economic trends.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 9, "text": "In particular, identity threats might favour serendipitous value creation, as these threats stimulate mobilising and mitigating actions.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-50", "group": "mechanism", "status": "reference", "label": "Abstracting the idea to its core", "description": "Founders respond to criticism by moving the idea to a more abstract level so that the core survives while details change.", "when": "The founder restates the idea at a higher level (the purpose or need) after criticism of specifics.", "example": "", "notwhen": "", "evidence": [{"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 14, "text": "Other entrepreneurs responded to identitysharpening feedback by reflecting on “what is core to the idea,” thereby reappraising their psychological ownership by way of abstraction.", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "role-01", "group": "role", "status": "core", "label": "Started the venture", "description": "The unexpected event gave rise to the business idea, the first project or first customer, or made founding possible.", "when": "The founder traces the origin of the business to the event.", "example": "'That conversation is why the company exists.'", "notwhen": "The founder never meant to found (role-02), or an existing venture changed course (role-08).", "evidence": [{"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 3, "text": "The founding of Staples office supply retail chain provi ecifications.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 6, "text": "Desperate, but reluctant to give up, the founders hit upon the idea of using the low-grade ore to make sandpaper and, thus, the company survived.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 16, "text": "However, as they continued on their entrepreneurial paths, both moved toward the bottom right quadrant of resourceful responses that eventually led them to a positive contingency and enabled the creation of a viable venture that is even now helping transform the environments in which they encountered the original negative contingencies.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 29, "text": "This application of luck as serendipity focuses on the role of human intervention instead: the fact that Gates understood the value of his unique capabilities and decided to start business instead of going to Harvard is crucial for establishing the sustainable superior performances of Microsoft.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 7, "text" role-02", "group": "role", "status": "core", "label": "Accidental founder", "description": "The founder had no plan to start a business, or this business, and the unexpected event made them a founder.", "when": "The founder stresses they were not trying to be an entrepreneur.", "example": "'I never meant to start a company; it just grew.'", "notwhen": "The founder already wanted to start something and found the idea by chance (role-01).", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 1, "text": "Without the interconnectedness among critical events, serendipity and effectuation, these unforeseen ventures would likely not have been initiated.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 4, "text": "Users are often ‘accidental’ entrepreneurs who happen upon an idea through their own use and then share it with others—the development of the idea, experimentation, adaptation, and preliminary adoption often occur before the formal evaluation of the idea as the basis of a commercial venture.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 8, "text": "In fact, social interaction may sometimes be the trigger for communally developing an idea, experimenting with it, or adapting and refining it, all of which are activities that occur before an entrepreneur may even be identified as such.", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 6, "text": "However, on a trip to find work, she got off at the wrong stop and ended up at GR Management, which was owned by the former manager of the band Texas.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "role-08", "group": "role", "status": "core", "label": "Changed the venture's direction", "description": "The unexpected event made the venture turn from its original plan: a new product, market, customer or business model (a pivot).", "when": "The founder describes a clear turning point away from the original plan.", "example": "'After that, we stopped selling to consumers and went B2B.'", "notwhen": "Small tweaks with the same purpose, or growth along the same path (role-16).", "evidence": [{"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 29, "text": "For example, executives of Honda managed to successfully link information that seemed to distract them from their original goal of promoting heavyweight motorcycles in the USA, and concluded that light-weight motorcycles were the model to introduce in the US market instead.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 23, "text": "Firms that pivoted did so through the gradual accumulation of multiple strategic decisions over time, adding and exiting elements to their strategy, rather than reorienting the firm's irecting the effort.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 75, "text": "Honda assumed a strategy that was not the one planned beforehand.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 4, "text": "Thus Honda serendipitously discovered a latent market for small motorcyclesin the USA, in a classic exampleof searchingfor one opportunityand discoveringanother through a contingent interaction — in this case, with a Sears buyer — what Mintzberg (1996) has described as being ‘pleasantly surprised’by a contingency.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2014)", "title": "Entrepreneurial Storytelling, Future Expectations, and the Paradox of Legitimacy", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0915", "page": 9, "text": "For instance, Bilton (2013, p. 58) chronicled the transformative process whereby Odeo, a failing venture, became Twitter, noting, \"Changing the focus of a start-up is not like the metamorphosis of a traditional businesslike trying to turn a high-end clothing store into a construction company.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 13, "text": "While this strategy is a kind of “lottery,” entrepreneurs mainly approach high-potential strangers—that is, strangers with high social status or success—because they are perceived as being more likely to completely change the course of the new venture through the resources they can provide.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 18, "text": "As a result, the founders decided to revise their ideas to focus on corporate wellness services, scrapping their entire original business model in the process.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 3, "text": "In this research, we attempt to understand how and why an initial small change, whose ultimate consequences were unintended, escalated and led to radical organizational change.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 19, "text": "In this way the entrepreneur’s search to more clearly define a particular problem–solution dyad is subject to ongoing contingencies, which then lead to an emergent strategy (Harmeling and Sarasvathy 2013; Mintzberg and Waters 1985; Sarasvathy 2008).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 9, "text": "Unexpected breakthroughs can reveal promising pathways forward, offering clear objectives that sharpen organizational focus while competitors remain ventually building a business in the motivational consulting industry!", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 6, "text": "Serendipitous encounters are not minor anomalies in this template, but potential juncture points – strategic bifurcations that may push strategizing processes in unexpected directions.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 7, "text": "(#3, Stage 3: Emotions/Energy → Agency) This friction led to rethink the problem space: “ I started with clean water ( … ) but no one had effective solutions ( … ), so I pivoted ” (#1, Stage 3: Emotions/Energy → Agency). 3.1.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"c
