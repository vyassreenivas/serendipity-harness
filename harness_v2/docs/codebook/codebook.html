 commitment to that existing theory stood him in good stead: “So I noted a new fact, unforeseen in theory, which men had not noticed, doubtless because they were under the influence of contrary theories which they had too confidently accepted.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Soto-Simeone et al. (2021)", "title": "The role of skill versus luck in new venture survival", "venue": "International Journal of Management Reviews", "url": "https://doi.org/10.1111/ijmr.12262", "page": 5, "text": "However, they can adjust their sails to stay afloat (survive); they can influence their crew members’ moods and efforts; and they can make decisions on moving forward or remaining at anchor if weather conditions are adverse.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 6, "text": "Secondly, because the leader's vision is personal, it can also be changed completely.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "mechanism-27", "group": "mechanism", "status": "core", "label": "Following what took off", "description": "The founder tried things in the market, watched how customers responded, and built on what unexpectedly worked.", "when": "The founder describes small tests, early customer feedback or usage data, and backing the surprise winner.", "example": "'We ran a few ads, one took off, so we went all in on that.'", "notwhen": "The experiments were on materials or the product, not customers; if nothing fits, MIS-MEC.", "evidence": [{"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 5, "text": "In creation theory, entrepreneurs do not search – for there are no mountains to find – they act, and observe how consumers and markets respond to their actions.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 11, "text": "Managers must be prepared, therefore, to reinforce successful moves that gain traction, even if those successes run counter to managers’ preconceived notions of what should work.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 6, "text": "For example, if the first customers who actually buy the food and come back for more are working women of varied ethnic origin, this becomes her target segment.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 29, "text": "In other words, the doing of strategy was a catalyst for strategy evolution: Only by enacting their strategies and executing on their beliefs about the founding opportunity, could entrepreneurs discover where new problems and opportunities lay.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Denrell et al. (2015)", "title": "Perspective—Chance Explanations in the Management Sciences", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0946", "page": 16, "text": "Even if initial product success is largely random, managers can promote demand by managing social influence for the products that happen to take off.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 9, "text": "Upon investigation of a spike in demand, 3M scientists realized that the film could also be used to direct light from a source to the retina.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "mechanism-01", "group": "mechanism", "status": "reference", "label": "General alertness to opportunity", "description": "A standing watchfulness or receptiveness to overlooked possibilities, with no specific target in mind. Because of it, the person notices chances that others pass over.", "when": "The person describes being generally on the lookout, scanning, 'open to the universe' or watching with eyes wide open, and spotting an opportunity as a result.", "example": "", "notwhen": "The account describes one specific moment of registering an odd cue; use Noticing and singling out the unexpected. If prior expertise is what made the cue meaningful, use Prepared mind recognising significance.", "evidence": [{"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 15, "text": "Entrepreneurial self-efficacy ● I’m a great believer in listening to my hunches, I could have done it on my own. ● I have this thesis that the world runs on luck, the question is, “what you do with it”?", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 14, "text": "Entrepreneurial alertness refers to an attitude of receptiveness to available (but hitherto overlooked) opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 6, "text": "5/C110 /C115/C99/C111/C112/C101/C44 /C116/C104/C101/C121 /C104/C97/C118/C101 /C116/C111 /C97/C108/C119/C97/C121/C115 /C97/C115/C107 /C113/C117/C101/C115/C116/C105/C111/C110/C115 /C108/C105/C107/C101/C44 /C119/C104/C97/C116 /C97/C114/C101 /C116/C104/C101 /C105/C109/C112/C108/C105/C99/C97/C116/C105/C111/C110/C115 /C111/C102 /C97 /C112/C97/C114/C116/C105/C99/C117/C108/C97/C114 /C101/C118/C101/C110/C116 /C116/C111 /C111/C117/C114 /C112/C97/C114/C116/C105/C99/C117/C108/C97/C114 /C98/C117/C115/C105/C110/C101/C115/C115/C63 /C65/C108/C101/C114/C116/C110/C101/C115/C115 /C105/C110 /C115/C99/C97/C110/C110/C105/C110/C103 /C116/C104/C101 /C109/C97/C99/C114/C111 /C101/C110/C118/C105/C114/C111/C110/C109/C101/C110/C116 /C119/C105/C108/C108 /C108/C105/C107/C101/C108/C121 /C104/C101/C108/C112 /C98/C101/C116/C116/C101/C114 /C114/C101/C99/C111/C103/C110/C105/C122/C101 /C116/C104/C101 /C115/C116/C111/C99/C104/C97/C115/C116/C105/C99 /C111/C112/C112/C111/C114/C116/C117/C110/C105/C116/C105/C101/C115 /C97/C110/C100 /C99/C97/C112/C116/C117/C114/C101 /C119/C105/C110/C100/C102/C97/C108/C108 /C103/C97/C105/C110/C115/C46 /C77/C97/C106/C111/C114 /C103/C108/C111/C98/C97/C108 /C102/C105/C114/C109/C115 /C111/C102/C", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 7, "text": "More precisely, accidental discoveries need the right capabilities to exploit and extract value from these discoveries to entail serendipity and lead to value creation (Austin et al., 2012).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 29, "text": "The ability to see what others do not is the key to this application of luck, and it is this variation that most closely reflects serendipity’s etymological origins.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 14, "text": "Entrepreneurial alertness exploits these opportunities when others pass them by.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "In their study of over 300 new ventures in the US, they argue that discoveries occur when looking for something with “eyes wide open.” This positions serendipity as a practice that relies on intentional observation.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-03", "group": "mechanism", "status": "reference", "label": "Prepared mind recognising significance", "description": "Prior knowledge, theory or long experience lets the person grasp the value of a chance finding (sagacity). Some authors add deliberately building broad background knowledge in advance so as to be ready.", "when": "The person attributes seeing the value of an unexpected find to their expertise, working hypothesis, years in the field or background knowledge built up beforehand.", "example": "", "notwhen": "The person simply perceived something others missed without crediting prior knowledge; use Noticing and singling out the unexpected (one author contrasts theory-led with observer-led noticing). If they put their old skills to work in a new domain, use Redeploying one's own prior knowledge.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "Interestingly, a low degree of knowledge can also stimulate serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 15, "text": "Christopher Columbus, for instance, never had the sagacity to recognize the significance of his discovery.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 8, "text": "Because of his experience of working with artists, labels and promotion companies, he was able to exploit the opportunity which Paolo presented and to turn him into an international brand.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 5, "text": "These stand as possible factors of serendipity distinct from the prepared mind theme discussed previously. 9 Individual attributes may a ffect perceptiveness for serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 22, "text": "The observation that R&D creates a capacity to assimilate and exploit new knowledge provides a ready explanation of why some firms may invest in basic research even when the preponderance of findings spill out into the public domain.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 18, "text": "I had been in the abrasive world long enough to recognize that ‘Hey, this is something we need.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 3, "text": "Walsh (Eds.), Handbook of career counseling theory and practice (pp. 55-80).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-04", "group": "mechanism", "status": "reference", "label": "Generative doubt and questioning assumptions", "description": "Acknowledging the limits of one's understanding and holding ideas open to revision, so that preparation is combined with openness to the new. This includes tolerating delay and ambiguity rather than rushing back onto the original track.", "when": "The person says they did not know, questioned their assumptions, let doubt or ambiguity stand, or let schedules slip in order to understand an unexpected development.", "example": "", "notwhen": "The doubt produces a specific new explanation of an anomaly; use Abductive reasoning about the anomaly.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 16, "text": "The emergence of serendipity in organisations requires a good synthesis of preparation and openness through generative doubt.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 22, "text": "These conditions contribute individually and in combination: cultivating reframing focuses on encouraging entrepreneurs to question their ideas and engage with new people and insights, a core necessity for serendipity (Merton & Barber, 2004), potentially leading to a reframing of understanding problems and solutions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 5, "text": "The synthesis of data and theory extends research on serendipity by articulating how serendipity results from a dynamic interplay of preparation and openness, mediated by generative doubt.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 13, "text": "We term these practices of sustaining tension, active detemporalization and exploring scope and questioning assumptions (second-order codes) detraining from chronos.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Giustiniano et al. (2016)", "title": "Organizational zemblanity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2015.12.001", "page": 2, "text": "The focal mechanism for managerial serendipity is generative doubt (Cunha et al., 2015), the motivated and conscious search for understanding stimulated by the experience of not knowing ( Locke, GoldenBiddle, & Feldman, 2008 ).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-05", "group": "mechanism", "status": "reference", "label": "Reframing the unexpected as opportunity", "description": "Interpreting a surprise, mistake, nuisance, constraint, setback or dead end as something valuable to build on rather than an error to correct.", "when": "The person describes coming to see a failure, side effect, accident, difficulty or fruitless contact as an opportunity, or building on an accident instead of fixing it.", "example": "", "notwhen": "The person deliberately uses a contingency as an input to build the venture without first re-seeing it; use Leveraging contingencies. If they reuse a concrete element from earlier failed work, use Salvaging earlier work and dead ends.", "evidence": [{"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 5, "text": "From the perspective sketched above, serendipity can be seen as a complex process rather than as a mysterious discovery of an opportunity without preparation, a result of luck, pure and simple.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity in the Humanities. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 7, "text": "Bacon is urging upon them, as an alternative to their illusion of control, not passivity, but a realistic acknowledgement of the limits of rational activity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 7, "text": "Problem-shift, where a problem evolves alongside possible solutions (see, for instance, (Helms and Goel 2012)), is also relevant.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 4, "text": "As a further part of the analysis, we also developed hypotheses about openness to accident and reliance on accident.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 93, "text": "This builds on the notion that an entrepreneur’s role is to create new ideas and opportunities by way of frames or narratives that (re-) construct reality, reframing what", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 12, "text": "By embracing rather than eschewing discomfiting information, unfruitful tie formation may be redrawn as an opportunity ( Chandler et al., 2011 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 11, "text": "This builds on the notion that an entrepreneur’s role is to create new ideas and opportunities by way of frames or narratives that (re-) construct reality, reframing what", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-07", "group": "mechanism", "status": "reference", "label": "Analogical transfer", "description": "Seeing a similarity between something in one context or domain and a current problem, and carrying it over as a solution.", "when": "The person describes something seen in another field, product or nature that suggested a solution by similarity, or an expert pointing to an analogous distant field.", "example": "", "notwhen": "An existing artifact itself is put to a new function; use Repurposing an artifact for a new function.", "evidence": [{"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 24, "text": "In product design, creative problem solving draws on the organization's memory by making analogies between past technological solutions and current design problems.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 14, "text": "By bridging distant domains (e.g., from food analysis to plastics) and related areas (e.g., from food items like fruits and vegetables to oil), the expert abstracted key principles, such as targeting homogeneous substances with low water content.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 11, "text": "'Ringer's solution' as an essential reagent in the everyday use for the maintenance of living cells.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 12, "text": "On the one hand, analogous thinking has been shown to require deep expertise (Ericsson and Staszewski 1989).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 94, "text": "On the one hand, analogous thinking has been shown to require deep expertise (Ericsson and Staszewski 1989).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-08", "group": "mechanism", "status": "reference", "label": "Repurposing an artifact for a new function", "description": "An existing product, technology or trait made for one purpose (or none) is recognised as serving a different function or field once it meets a new context or observer (exaptation).", "when": "The account describes something already built or held being used for a new purpose or taken into a field where it had not been used.", "example": "", "notwhen": "What is redeployed is the person's own skills or experience; use Redeploying one's own prior knowledge. If several resources are combined, use Recombining resources at hand.", "evidence": [{"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 23, "text": "Search via exaptation, indeed, is different as it does not rely on the ‘pre -existence’ of a target domain but on the ‘emergence’ of a target domain through artifact -context interactions that give rise to new functions, occasionally underlined by new phenomena.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 8, "text": "For example,von Hippel and von Krogh (2016) explored how firms might serendipitously discover a new solution, even though the related problem was not the object of the search.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 95, "text": "Supportive organisational structures and ecosystems can also facilitate adaptation (i.e., change based on the initial function), as well as exaptation (i.e., use characteristics that evolved for other or no use, and co-opting them for their current role; Andriani et al. 2017; Gould and Vrba 1982).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 7, "text": "While acknowledging the importance of these mechanisms, in this article we want to reflect on a broader issue: Serendipity occurs by considering a discovery in a new context, thereby triggering the interpretive flexibility of others who then envision new uses (Pinch & Bijker, 1987).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 7, "text": "By exposing the technology to a field that it has not been previously used for, new use cases for the technology potentially emerge.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 5, "text": "Moreover, serendipity and exaptations are inherently connected, as traits, technologies, or knowledge originally developed for one purpose are repurposed to address entirely different problems.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-09", "group": "mechanism", "status": "reference", "label": "Matching a solution to an unsought need", "description": "Starting from a solution or chance find already in hand and discovering a problem or need it meets that the person was not pursuing ('what problem have I solved?'). This is the reverse of defining a problem first.", "when": "The person realises something they had, or came across, solves a different, unrelated or earlier problem.", "example": "", "notwhen": "The person had defined the problem first and a resource 'lit up' against it; use Problem-led search image. If the realisation is that a personal fix could be a business, use Seeing a business in something already solved.", "evidence": [{"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 24, "text": "In the first, the identification of a need triggers the formulation of a problem that drives the search process for a solution: the order is need-problem formulation-solution.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 8, "text": "Here, problem identification occurs after solution identification (i.e. once a serendipitous discovery occurs).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 23, "text": "As Von Hippel and von Krogh (2016) emphasize, the identification of need-solution pairs is often serendipitous—emerging from the unexpected recognition of congruence between a need and a solution.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 17, "text": "But a present observation can also lead one to discover the solution of a 'problem' that cannot be called 'an earlier problem'.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-10", "group": "mechanism", "status": "reference", "label": "Problem-led search image", "description": "Deliberately formulating a problem or needed function first, which creates a search image that makes matching resources in the environment stand out, including ones others had seen without valuing.", "when": "The founder describes defining what they needed and then recognising something they encountered as the answer, often something others had overlooked.", "example": "", "notwhen": "The person started from the resource and asked what it could do; use Matching a solution to an unsought need.", "evidence": [{"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 11, "text": "Specifying a functional need that defines a search image can be seen as emanating from a problem.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-11", "group": "mechanism", "status": "reference", "label": "Redefining the problem", "description": "Treating the original question as changeable, so that the problem is reframed or broadened during interaction and previously irrelevant knowledge or alternatives suddenly apply.", "when": "The account shows the problem statement or goal itself being redefined, for example 'this is the same problem we faced with…', when an attractive alternative or new angle appears.", "example": "", "notwhen": "The problem stays the same and an unexpected solution is linked to it; use Connecting the dots.", "evidence": [{"cite": "Hargadon and Bechky (2006)", "title": "When Collections of Creatives Become Creative Collectives: A Field Study of Problem Solving at Work", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1060.0200", "page": 10, "text": "Such shifts in the framing of a problematic situation allow participants to recall details not easily recognized in the original framing of the problem (Fiske and Taylor 1991).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 8, "text": "I broadened the “Where shall we go for dinner?” problem you initially posed to “What shall we do tonight?” In other words, I regarded your initial problem statement as a variable.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-12", "group": "mechanism", "status": "reference", "label": "Redeploying one's own prior knowledge", "description": "Realising that skills, experience or endowments one already has, often acquired by chance or long unused, can be applied in a new domain, and then actually drawing on them.", "when": "The person describes an earlier, unrelated skill, qualification or asset becoming relevant to the venture and putting it to use.", "example": "", "notwhen": "The prior knowledge only helped the person see the value of an outside find; use Prepared mind recognising significance.", "evidence": [{"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 6, "text": "This implies that \"having\" preadaptation (i.e., availability of relevant skills and knowledge) is distinct from \"using\" preadaptation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 28, "text": "For example, Cattani (2005) uses the case of Corning to illustrate how an unanticipated use of fiber optics technology enabled Corning to become one of the leaders in long-distance communications.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 13, "text": "For example, some business founders, like those of CPN, TBE and TAL, entered their current business with low levels of knowledge, whereas others like COP, TRO, TAR and CET had relevant knowledge and experience.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-13", "group": "mechanism", "status": "reference", "label": "Abductive reasoning about the anomaly", "description": "Reasoning from a surprising fact or clues to a possible explanation, hypothesis or new rule, which brings the accident within rational inquiry and can point to new uses.", "when": "The person asks why something surprising happened and constructs an explanation, infers from traces, or reinterprets the puzzle into a new hypothesis.", "example": "", "notwhen": "The emphasis is on stopping work and digging into the surprise out of curiosity, without a reasoning step; use Stopping to investigate out of curiosity.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "4 Chapter 1 from the clues they had observed, which happened to coincide with the facts.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 7, "text": "Abduction consists in studying facts and devising a theory to explain them. [b ] Abduction is the process of forming an explanatory hypothesis.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 15, "text": "At this point, the initial data irregularity was no longer an anomaly that disrupted their work process; it had transformed into a new opportunity that management agreed needed funding for further exploration.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 146, "text": "Abduction is an epistemological concept that, in brief, refers to fallible (in the classical logic sense) but useful kind of reasoning that connects a surprising event to a general rule (Magnani 2009).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 5, "text": "It relates to ‘‘the creative act of constructing explanations to account for surprising observations in the course of experience (hypothesis generation).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 8, "text": "When unexpected discoveries occur, they often trigger abductive reasoning, which drives the creation of new knowledge (Campanario, 1996).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 2, "text": "In AI, some reasoning techniques are more associated with creativity than others.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-14", "group": "mechanism", "status": "reference", "label": "Stopping to investigate out of curiosity", "description": "Interrupting normal work to explore an unexpected occurrence, driven by curiosity: asking 'what is it?' and actively tracking down information and resources.", "when": "The person describes pausing or deviating from their tasks to dig into a surprise, researching it and chasing down sources out of curiosity.", "example": "", "notwhen": "The work is planned, repeated testing to confirm and develop the find; use Systematic follow-up and development.", "evidence": [{"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 3, "text": "Nature does not surprise us with new laws.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Serendipity as Ideology and Politics of Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 13, "text": "One of the chemists began to search for an insecticide.” In writing down the chemical formula of his 406th experiment, he noted that its chemical structure looked perfect for an insecticide.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 9, "text": "Curious, Sam began researching the phenomenon and its niche market.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 16, "text": "As soon as he observes a surprising fact he interrupts and sometimes even stops his 'normal' work or program for a certain period: to exploit and explain it himself by using his serendipity, intuition, knowledge, logic and/or experimental set up.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-15", "group": "mechanism", "status": "reference", "label": "Systematic follow-up and development", "description": "After the chance observation, sustained and deliberate testing, repetition, experimentation and refinement to validate it and work it into something usable. This includes refining a rough idea into a business concept and closely monitoring the emerging development.", "when": "The account describes repeated tests, trials, prototypes, long development work or concept refinement aimed at turning the unexpected find into an application.", "example": "", "notwhen": "The experimenting came before any find and is open-ended play; use Experimenting and tinkering. If the account stresses persisting through setbacks, use Perseverance and effort.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 32, "text": "Such accidents don’t just grow on trees, and among those people concerned with the development of science who rather wish they did, we find a variety of prescriptions for their cultivation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 9, "text": "The goatherd Kaldi saw, to his surprise, that his goats became very active after eating violet berries.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 7, "text": "Bootlegging is a cultural practice that has gained currency at 3M through the accumulation of innovation narratives extolling the virtues of undertaking low-cost experimentation using the firm ’s resources.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 25, "text": "However, unlike previous episodes where listening in encompassed peripheral vision and general ambient awareness, these later episodes are characterized by deliberate monitoring that substitutes the earlier listening in practices, accompanied by actively shaping the discovery.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Bhave (1994)", "title": "A process model of entrepreneurial venture creation", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/0883-9026(94)90031-0", "page": 8, "text": "SW started his violin repair business as follows: I couldn’t find anyone I had enough faith in to repair violins I was playing, so I started repairing myself, and the word got around that I would do that.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 4, "text": "Where the result is unexpected, this represents a potential serendipitous event.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 4, "text": "Systematic scientific work always follow the initialfortuitous observation, withthe eventual applica­ tion evoMng from rigorous experimentation and extensiveknowl· edge of the field.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-16", "group": "mechanism", "status": "reference", "label": "Incubation and delayed insight", "description": "A time lag between the trigger and the connection, during which significance is realised later, sometimes as a sudden eureka moment, and the original source may be forgotten.", "when": "The person describes an earlier observation that only clicked into an insight later.", "example": "", "notwhen": "The person deliberately kept an idea alive and revived it when the time seemed right; use Keeping ideas alive for the right moment.", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 18, "text": "Depending on the situation, an unplanned event may activate a cloud of possibilities constituted by problems, solutions, and unexpected events, allowing for potential problem/solution combinations (i.e., relevant associations) to emerge (see, V on Hippel and von Krogh, 2016).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 11, "text": "Indeed, this delay between the triggering event and the related bisociation can make it difficult for an actor to recall and properly attribute the original source of the creative observation (Stock-Homburg et al. 2021).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 93, "text": "Indeed, this delay between the triggering event and the related bisociation can make it difficult for an actor to recall and properly attribute the original source of the creative observation (Stock-Homburg et al. 2021).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-17", "group": "mechanism", "status": "reference", "label": "Keeping ideas alive for the right moment", "description": "Remembering and sustaining an old idea or discovery as a solution looking for a problem, and reviving it when the moment is opportune.", "when": "The account describes keeping an idea alive over time, or recognising that now was the right time to pursue a shelved idea.", "example": "", "notwhen": "Parts of failed or abandoned work are reused in a new combination; use Salvaging earlier work and dead ends.", "evidence": [{"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 6, "text": "When asked if he considered his experiment a failure, Silver replied that his discovery was a “solution looking for a problem ” (quoted in Lindahl, 1988, p. 14).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 23, "text": "When the time is right, an idea that may have been abandoned or shelved can become valuable, thereby blurring the distinction between invention and development.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-18", "group": "mechanism", "status": "reference", "label": "Salvaging earlier work and dead ends", "description": "Rescuing pieces of failed ventures, shelved work, abandoned products or earlier ties and recombining them with new elements to pursue a new or modified goal.", "when": "The person describes reusing a technology, relationship, skill or artifact from a failed or abandoned effort in the venture.", "example": "", "notwhen": "Resources currently at hand are combined without a history of failure; use Recombining resources at hand.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 24, "text": "For instance, although new ideas by themselves are of little value unless they are commercialized, the distinction between invention and innovation can now be understood in a far more nuanced manner (Ruttan 1959).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2014)", "title": "Entrepreneurial Storytelling, Future Expectations, and the Paradox of Legitimacy", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0915", "page": 9, "text": "Their study shows how entrepreneurs selectively incorporate some of the earlier social ties, technologies, and organizational capabilities into their stories to accomplish a modified goal.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 11, "text": "Managers at Enron also try to build on mistakes by salvaging what did work and recombining it with other resources to create new opportunities.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-19", "group": "mechanism", "status": "reference", "label": "Intuitive gut judgment", "description": "A fast, often unconscious assessment of an unexpected input: the idea clicks instantly, or a gut feeling acts as a filter for what to connect and pursue.", "when": "The person says the opportunity just clicked, was instinctive, or that a gut feeling led them to pursue an y brings about better results because a scientist does not change their research plan and pursue unintended findings unless they expect that the change would be worth pursuing.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 2, "text": "Evaluating the information After the information is noticed or connected, flash evaluation and systematic evaluation (or ‘E’) will be subsequently carried out for assessing the values of the unexpected information.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 16, "text": "Napier and Vuong ( 2013) contrast flash evaluations of serendipity with systematic evaluations.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-21", "group": "mechanism", "status": "reference", "label": "Choosing which leads to pursue", "description": "Selecting among many unexpected clues or opportunities, dropping those that are merely interesting or out of scope and pursuing the promising ones. Plans, goals or simple rules act as the filter.", "when": "The person describes facing several leads and deciding which to follow and which to drop or exit, by goals, rules of thumb or likely payoff.", "example": "", "notwhen": "Only one lead is being assessed for worth; use Deliberate appraisal of worth.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity in the Humanities. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 6, "text": "The problem resolves itself into one of deciding which clues, out of the mass, are most likely to lead to the lucky spot.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 5, "text": "Second, it demands openness, i.e. the effort to recognize and accept unexpected observations as organizational opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davis et al. (2009)", "title": "Optimal Structure, Market Dynamism, and the Strategy of Simple Rules", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2009.54.3.413", "page": 27, "text": "A consequential implication is that the content of a high-performing simple-rules strategy will likely focus on capturing a few, high-payoff opportunities—i.e., a small number of rules to quickly select a few “home-run” opportunities and to quickly exit those opportunities when they do not pan out.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-24", "group": "mechanism", "status": "reference", "label": "Improvising in the moment", "description": "Designing and executing action at the same time, figuring things out on the spot with what is available, often under time pressure or in a crisis, which captures or produces unexpected opportunities.", "when": "The account describes acting fast without a plan, starting operations almost immediately, improvising in a crisis, or trying an improvised route when blocked.", "example": "", "notwhen": "The emphasis is on combining existing materials or resources in new ways; use Recombining resources at hand.", "evidence": [{"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 7, "text": "In focused search.", "evidence": [{"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 7, "text": "This prevented reification of established mindsets and allowed the construction of unplanned competences on top of existing competences.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 10, "text": "In Case 5, for example, leaders of a graphic design firm told us that they need crises to help them avoid \"becoming established\" in the ways they do work.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-32", "group": "mechanism", "status": "reference", "label": "Listening in on others' work", "description": "Attending to information outside one's own focus without deep task involvement, such as overhearing or sitting in on meetings, akin to peripheral vision. Field actors then respond locally to what they pick up.", "when": "Someone picks up an unexpected cue by being present at meetings, overhearing colleagues, or observing frontline developments outside their remit.", "example": "", "notwhen": "The person immersed themselves deeply in a new field to do a task; use Deep-diving into a new field.", "evidence": [{"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 6, "text": "Serendipitous encounters are not minor anomalies in this template, but potential juncture points – strategic bifurcations that may push strategizing processes in unexpected directions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 21, "text": "Listening in involves attending to information without a specific focus in mind and without being deeply involved in the specific tasks (in contrast to deep-diving).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-33", "group": "mechanism", "status": "reference", "label": "Deep-diving into a new field", "description": "Immersing oneself in learning a new topic in depth, usually for an assigned task. On its own it does not yield discovery, but it later feeds one.", "when": "The person had to learn a new area from scratch for a task, and that knowledge later fed into an unexpected discovery.", "example": "", "notwhen": "The person attended loosely without task involvement; use Listening in on others' work.", "evidence": [{"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 21, "text": "Serendipity practices Deep-diving is the process of an actor submersing into a new field in order to gain deep knowledge about that field.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-34", "group": "mechanism", "status": "reference", "label": "Focused attention filtering distractions", "description": "Concentrating on one task at a time and filtering out irrelevant information, so that meaningful unexpected cues stand out.", "when": "The person links noticing an unexpected opportunity to deep, uninterrupted focus or to deliberately ignoring distractions.", "example": "", "notwhen": "The person credits broad, untargeted scanning; use General alertness to opportunity.", "evidence": [{"cite": "Fu trepreneurs take different paths through this process?", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 31, "text": "Knowledge of the resources at hand enabled firms engaged in bricolage to find combinations of resources that allowed them to embrace new problems and opportunities, which meant that opportunity discovery could be interactive and social, rather than a process requiring an individual epiphany.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 12, "text": "Often, the significance of events is only understood when people from other areas help explore the broader relevance of an unexpected moment.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 4, "text": "By increasing joint activity among individuals, organizational improvisation in - creases “the number of fortuitous encounters they are likely to experience” because chance opportunities are more likely to occur among highly active people (Bandura, 1998: 98).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.10 lks, posts or presentations, which drew in collaborators or unexpected approaches.", "example": "", "notwhen": "The aim is to persuade a decision-maker to allocate resources; use Winning buy-in and championing.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 14, "text": "He started talking around to different people involved in the rivet project or people who understood microreplication.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 39, "text": "Noticing unexpected items or events, quickly adapting to them, and spreading the news to others is a part of Mongolian culture, and features prominently in storytelling.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 6, "text": "Instead of abandoning it as an outcome of a failed experiment, Silver went about telling “anyone who would listen.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 26, "text": "The visibility created through the revelation of entrepreneurial intentions would induce interested prospective entrepreneurs to converge and interact.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "mechanism-39", "group": "mechanism", "status": "reference",
