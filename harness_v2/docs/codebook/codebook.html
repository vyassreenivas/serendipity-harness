ext": "Gift for finding one thing when looking for another.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 10, "text": "Columbian serendipity involves finding an opportunity when you are looking for some other specified opportunity.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 18, "text": "For example, in 2012, Ohm added a new product to their strategy after identifying an opportunity trigger: An internal development project revealed the potential for a new product not previously considered.", "close": true, "none": false, "chosen": "reading; close match"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 11, "text": "By contrast, in the discoveries of sildenafil citrate and penicillin, scientists discovered something different from what they were looking for.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 14, "text": "As we seek to solve one problem, we often discover the solution to a completely different problem.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 6, "text": "All serendipity arises in part from purposeful action, yet prior studies distinguish between serendipity that emerges from the deliberate search for specific solutions to defined problems and serendipity that occurs during day-to-day activities where no specific solution or problem is actively sought (Busch & Grimes, 2023; Yaqub, 2018).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 26, "text": "A first distinction is that between “true” and “pseudo” serendipity, where one seeks A but finds B, and where B is ultimately the more highly valued.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 5, "text": "Second, a serendipitous invention can either be an unexpected solution to a given problem at hand (Mertonian serendipity) or to a problem that was not intended to be solved (Walpolian serendipity).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 3, "text": "A search for a solution to a known problem is underway, but in the process the social actor stumbles across a solution to a previously unrecognised or entirely different problem.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 85, "text": "A search for a solution to a known problem is underway, but in the process the social actor stumbles across a solution to a previously unrecognised or entirely different problem.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "type-03", "group": "type", "status": "core", "label": "Not looking at all", "description": "The founder was not looking for a business or an idea. A need and a way to meet it turned up together in everyday life, and they saw an opportunity.", "when": "The founder stumbled on the idea, often solving their own or a friend's problem, before planning a business.", "example": "'I made it for myself, then people kept asking for one.'", "notwhen": "The founder already wanted a business (type-04) or pursued a specific goal (type-01, type-02).", "evidence": [{"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 3, "text": "No search for a solution to a specific problem is under way, but the actor unexpectedly (“thunderbolt”) comes across a new problemsolution dyad, often conceptualised as an ‘opportunity’.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Bhave (1994)", "title": "A process model of entrepreneurial venture creation", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/0883-9026(94)90031-0", "page": 8, "text": "The realization that the need was widespread led to the recognition of the business opportunity.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 9, "text": "For example, the TDI founder had no intention to run a business but discovered a business opportunity when he went to buy a camera and found that there are no reliable information sources that review camera product specifications.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 6, "text": "Such discoveries occur when firms have ‘‘no particular problem in mind’’ (Yaqub, 2018, p. 171) or are engaged in day-to-day activities where ‘‘no search for a solution is under way’’ (Busch & Grimes, 2023, p. 71).", "close": false, "none": false, "chosen": "reading"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 15, "text": "In other words, there is no need to address the kind of radical uncertainty (i.e., flat response curves) indicative of market ignorance if one begins with the assumption that the stimulus will be thrust on the individual in the normal course of business activities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 22, "text": "Prediscovery is when contingency and search overlap without prior knowledge.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 85, "text": "No search for a solution to a specific problem is under way, but the actor unexpectedly (“thunderbolt”) comes across a new problemsolution dyad, often conceptualised as an ‘opportunity’.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "type-04", "group": "type", "status": "core", "label": "Wanted a business, any business", "description": "The founder wanted to start or grow a business but had no specific idea, and a suitable opportunity came along by chance (Mirvahedi and Morrish's 'entrepreneurial serendipity').", "when": "The founder was open to any opportunity when one turned up.", "example": "'I knew I wanted to work for myself; then a friend mentioned...'", "notwhen": "No wish to found (type-03), or already pursuing a specific idea (type-01, type-02).", "evidence": [{"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 15, "text": "This pattern occurs when an entrepreneur looks for any opportunity or idea to start a business but without any specified opportunities in mind.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "type-05", "group": "type", "status": "core", "label": "Bushian: exploring, met existing need", "description": "The founder was exploring, browsing or tinkering without a specific problem in mind, and came across something that met a need they already had (Yaqub's Bushian type).", "when": "The founder was trying things out or browsing, and found the answer to a need they already had.", "example": "'I was playing with a new tool and realised it fixed our shipping problem.'", "notwhen": "The founder was searching for that answer (type-01), or the need only appeared later (type-06).", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 3, "text": "The defining feature of this Bushian type is that the discovery leads to a not sought-for solution because the research was un-targeted, or was not research at all.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 26, "text": "We often try out new things without a specific problem in mind and end up solving a pre-existing problem", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "type-06", "group": "type", "status": "core", "label": "Stephanian: solution first, problem later", "description": "The founder came upon something interesting with no use for it at the time, kept it, and later found the problem or market it solved (Yaqub's Stephanian type).", "when": "The founder describes a find, skill or product that sat unused until a need turned up.", "example": "'We had built that feature years ago; only when customers asked did we see what it was for.'", "notwhen": "Problem and solution came together (type-03), or the find met an existing need (type-05).", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 3, "text": "Within un-targeted research, I believe there is another type of serendipity, whose defining feature is when un-targeted research comes upon a new unsought-for problem and unsought-for solution.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 8, "text": "Here, problem identification occurs after solution identification (i.e. once a serendipitous discovery occurs).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 26, "text": "We often discover solutions before we discover the problems they solve", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 22, "text": "An individual might be unaware of the potential commercialization of their invention, and so store it for potential future use (Garud & Nayyar, 1994) or never ultimately commercialize it.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "type-07", "group": "type", "status": "reference", "label": "Foreground versus background serendipity", "description": "Foreground serendipity confirms or advances a person's current focus or direction. Background serendipity triggers a latent interest and may change that direction.", "when": "The account shows whether the chance find pushed the existing direction forward, or awakened a dormant interest that shifted the person's course.", "example": "", "notwhen": "The coder is only judging whether the find solved the searched-for problem or a different one. Use the search-based types for that; this code concerns fit with existing focus and latent interests.", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 20, "text": "Björneborn (2017) and Bogers and Björneborn (2013) differentiated between ‘foreground serendipity’ (confirming a person’s immediate focus or direction; e.g., the discovery of penicillin) and ‘background serendipity’ (possibly changing a person’s immediate focus and direction), depending on whether preoccupations/foreground interests or background/latent interests are triggered.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-08", "group": "type", "status": "reference", "label": "Everyday micro serendipity", "description": "Small, frequent chance occurrences, such as a useful piece of information, a minor encounter or an accident with materials. They are noticed and adjust what a person does, with modest benefit. This is the weak end of a weak-to-strong continuum (little-s serendipity).", "when": "The account describes minor everyday lucky finds or encounters that changed a task or decision but not the person's overall path.", "example": "", "notwhen": "The chance event radically changed the person's career, such as founding an unforeseen venture (use 'Life-changing serendipitous critical event').", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 20, "text": "I synthesize these literatures and locate serendipity on a continuum from ‘weak’ to ‘strong,’ based on the three necessary conditions agency, value (satisficing threshold level), and (degree of) surprise.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 178, "text": "Serendipity itself arises from networks of people and things.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "Less significant serendipitous insights occur frequently in everyday life (Reviglio, 2019).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 7, "text": "Despite this, we suggest that serendipity is a feature which can be both possible and useful to model in future creative systems.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-09", "group": "type", "status": "reference", "label": "Life-changing serendipitous critical event", "description": "A rare, clearly bounded chance episode that is causally decisive for the outcome and produces radical change, such as creating a venture the person would otherwise not have started. This is the strong end of the continuum (Big-S serendipity).", "when": "A specific unplanned conversation, request or event is described as what turned the person's professional path toward the venture.", "example": "", "notwhen": "The chance event was small and everyday (use 'Everyday micro serendipity'). Also excluded: a general trigger such as available financing or a poor economy that is not a bounded chance episode.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "In contrast, this study focuses on unforeseen venture creation, which is comparatively rare and can be considered, from an objective perspective, a radical professional change – an outcome characteristic of a critical event (Mertova and Webster, 2019).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 20, "text": "Björneborn (2017) and Bogers and Björneborn (2013) differentiated between ‘foreground serendipity’ (confirming a person’s immediate focus or direction; e.g., the discovery of penicillin) and ‘background serendipity’ (possibly changing a person’s immediate focus and direction), depending on whether preoccupations/foreground interests or background/latent interests are triggered.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 7, "text": "The examples of human serendipity all describe groundbreaking discoveries.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-10", "group": "type", "status": "reference", "label": "Sudden moment versus unfolding process", "description": "Serendipity can be narrated as a single eureka moment or flash of insight, or as an opportunity that unfolds over time through doubt, exploration and reinterpretation.", "when": "The coder can see whether the person tells the opportunity as one sudden flash or as a drawn-out process.", "example": "", "notwhen": "The issue is the size of the impact rather than its timing (use the micro or critical event codes).", "evidence": [{"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 3, "text": "Based on these findings, our research highlights that kairos is not only a eureka moment, a sudden insight, or a flash of time (Garud et al. 2011 ) that constitutes the “other” of chronos.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-11", "group": "type", "status": "reference", "label": "Missed serendipity", "description": "A surprising fact, contact or opportunity is noticed or is right in front of the person, but is not recognised or not acted on, so its value is lost (negative serendipity).", "when": "The person describes noticing something unexpected, such as unexpected customer interest, but failing to see its value or to pursue it.", "example": "", "notwhen": "The person acted on an unexpected bad event and turned it to value (use 'Unfortunate event turned to advantage').", "evidence": [{"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 9, "text": "To fall in love with a surprising person.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Serendipity as Ideology and Politics of Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 18, "text": "Luck merely speeds up, in a socially insignificant degree, what would have been discovered in any case.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-12", "group": "type", "status": "reference", "label": "Unfortunate event turned to advantage", "description": "An unexpected negative event, such as a rejection, setback or resistance, becomes the occasion for finding or pursuing something valuable, rather than a reason to quit.", "when": "The account describes an unforeseen setback during the venture's development that the founder leveraged into a new direction or gain.", "example": "", "notwhen": "The person's own setup repeatedly produced unlucky outcomes (use 'Zemblanity'), or an opportunity was simply missed (use 'Missed serendipity').", "evidence": [{"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 15, "text": "Teaching entrepreneurship was a challenge, “new territory” to use Singer’sown words.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "It has been defined as finding something valuable by chance (e Cunha et al., 2010) or encountering resources, such as information, people or objects, in unplanned ways (Bj€orneborn, 2017).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-15", "group": "type", "status": "reference", "label": "Prepared or self-made luck", "description": "Chance events become fortunate because of the person's or firm's position, preparation, knowledge, alertness, belief and action. Entrepreneurs often hold this view alongside the view that luck simply happened to them.", "when": "The person says 'you make your own luck', or describes having prepared themselves or the firm in ways that let them recognise and seize an unexpected change.", "example": "", "notwhen": "The gain needed no action or capability (use 'Pure luck'), or the person describes an enduring personal knack for lucky finds (use 'Serendipity as a personal gift').", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 11, "text": "C111/C109/C112/C101/C116/C105/C116/C105/C118/C101 /C97/C100/C118/C97/C110/C116/C97/C103/C101/C46 /C73/C116 /C116/C114/C101/C97/C116/C115 /C108/C117/C99/C107 /C97/C115 /C115/C111/C109/C101 /C115/C111/C114/C116 /C111/C102 /C104/C97/C112/C112/C101/C110/C105/C110/C103 /C115/C116/C101/C109/C109/C105/C110/C103 /C102/C114/C111/C109 /C98/C111/C116/C104 /C99/C104/C97/C110/C99/C101 /C101/C118/C101/C110/C116 /C97/C110/C100 /C104/C117/C109/C97/C110 /C101/C110/C100/C101/C97/C118/C111/C114/C44 /C114/C97/C110/C103/C105/C110/C103 /C102/C114/C111/C109 /C112/C117/C114/C101 /C115/C101/C114/C101/C110/C100/C105/C112/C105/C116/C121 /C105/C110 /C105/C116/C115 /C105/C100/C101/C97/C108 /C102/C111/C114/C109 /C116/C111 /C116/C104/C101 /C99/C97/C115/C101 /C111/C102 /C112/C114/C101/C112/C97/C114/C101/C100 /C108/C117/C99/C107 /C119/C104/C101/C114/C101 /C114/C97/C110/C100/C111/C109 /C102/C111/C114/C99/C101/C115 /C118/C97/C108/C105/C100/C97/C116/C101 /C102/C111/C114/C101/C115/C105/C103/C104/C116 /C97/C110/C100 /C112/C117/C114/C112/C111/C115/C101/C102/C117/C108 /C97/C99/C116/C105/C111/C110/C46 /C84/C97/C107/C105/C110/C103 /C97 /C114/C97/C116/C104/C101/C114 /C112/C114/C111/C97/C99/C116/C105/C118/C101 /C97/C112/C112", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 24, "text": "This suggests that whether entrepreneurs perceive that luck is discovered or created is likely as inconsequential to refinement and advancement of the construct as it is to opportunity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 14, "text": "Moreover, strategic serendipity literature notes that considerable preparation can be necessary to recognise and seize opportunities arising from unanticipated events (Knudsen and Lemmergaard, 2014).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-16", "group": "type", "status": "reference", "label": "Serendipity as a personal gift", "description": "Serendipity understood as an enduring quality, knack or faculty that lets some people repeatedly make happy accidental discoveries. This is set against serendipity as a one-off event or as external luck. Dictionaries and authors are inconsistent on which sense applies.", "when": "The person describes themselves or someone else as having a recurring knack for stumbling on valuable things, or as always making such discoveries.", "example": "", "notwhen": "A single fortunate occurrence is described, or the find is credited to deliberate preparation and action (use 'Prepared or self-made luck').", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Dictionaries and Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 14, "text": "Walpole coined only this noun, and his derivation implied that it was a quality that some people like himself or Lord Shaftesbury had, which enabled them to make happy accidental discoveries.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-17", "group": "type", "status": "reference", "label": "Engineered serendipity", "description": "Conditions for unexpected outcomes are deliberately created, while the specific result or contact stays unplanned. Examples are organised events, designed spaces, or deliberately introduced randomness and crises (artificial serendipity, intentional accident). Topic-focused settings such as conferences also shape what is exchanged.", "when": "The person describes arranging, or taking part in, a structured setting or deliberate process meant to make something unforeseen turn up, which then produced a useful contact or idea.", "example": "", "notwhen": "The meeting or event simply happened without anyone arranging conditions for it (use 'Chance encounter').", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 26, "text": "We suggest that one attractive aspect of conferences over informal serendipitous encounters (e.g., in hallways, watercoolers) is that they have a focusing effect on the topic of knowledge sharing and idea exchange.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 7, "text": "The case summaries in Table 3 clearly show us that the idea of an \"intentional accident\" is not paradoxical.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 158, "text": "These characteristics can be cultivated in physical as well as digital environments, for what is called “artificial serendipity”, that is, the ability to create the necessary conditions for serendipity to occur (de Melo 2018).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-19", "group": "type", "status": "reference", "label": "Collaborative serendipity", "description": "Unexpected synergies discovered when team members or parties juxtapose very different ideas or lines of action in working together.", "when": "A valuable unforeseen idea emerged from combining different people's contributions within a collaboration.", "example": "", "notwhen": "The discovery depended on information passed along a wider network or built up over a long process involving many actors (use 'Collective serendipity').", "evidence": [{"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 14, "text": "Sometimes in our study, accidents happened collab oratively, as when two members of a team juxtaposed very different ideas and discovered serendipitous synergies (this often happened in the Case 6 process improve ment team, for example).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-20", "group": "type", "status": "reference", "label": "Collective serendipity", "description": "Discovery made possible only by many actors over time: inputs noticed and passed along by others in a network, matched in a chance meeting, or accumulated contributions from many people. It is not one person's moment of insight.", "when": "Success is described as depending on several people encountering and relaying information, or on many contributions over time, each adding unforeseen pieces.", "example": "", "notwhen": "A small team directly combined their ideas (use 'Collaborative serendipity'), or a single individual encountered and recognised the opportunity.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 43, "text": "Discovery of the link between these two empires constituted a collective serendipitous experience, possible only through collective information encountering.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-21", "group": "type", "status": "reference", "label": "Distributed serendipity", "description": "Someone other than the original discoverer finds a new use for a discovery, often after it has been shared. The discoverer may anticipate that others will find such uses.", "when": "The new use or opportunity was identified by a different person from the one who made the original discovery.", "example": "", "notwhen": "The discoverer alone found the new use (use 'New use for an existing thing').", "evidence": [{"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 5, "text": "To make this argument, we begin with the work of organizational scholars who have explored serendipity.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-22", "group": "type", "status": "reference", "label": "Accidental discovery itself", "description": "The chance element is the making of the discovery itself, such as stumbling on a new substance, finding or technology (Type I serendipity).", "when": "The account describes accidentally discovering or creating something new, such as a material, effect or technology.", "example": "", "notwhen": "The thing already existed and the surprise was a new use for it (use 'New use for an existing thing').", "evidence": [{"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 5, "text": "Extending these observations to exaptation, we argue that serendipity covers not just scientific discoveries (Type I), but also the discovery of new uses for these scientific discoveries (Type II).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-23", "group": "type", "status": "reference", "label": "New use for an existing thing", "description": "Finding an unanticipated function or market for an existing technology, product, skill or resource (exaptation, Type II serendipity). This includes applying a technology in another field or recombining technologies.", "when": "The person describes discovering that something they already had or knew could serve a surprising new purpose, field or market.", "example": "", "notwhen": "The thing itself was newly discovered by accident (use 'Accidental discovery itself'), or the new use was found by someone else (use 'Distributed serendipity').", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 6, "text": "Namely, it can be the outcome of a combination of different technologies, the application of a technology to a field that differs from that of the original Figure 2.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 6, "text": "The exaptation literature has offered a useful distinction between an object (whether an asset, technology or resource) and the unprestatable uses and functions that the object might possess.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 5, "text": "Extending these observations to exaptation, we argue that serendipity covers not just scientific discoveries (Type I), but also the discovery of new uses for these scientific discoveries (Type II).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-24", "group": "type", "status": "reference", "label": "Repurposing something in use versus something without use", "description": "Exaptive sources are of two kinds. 'Franklins' are existing structures already in use that are co-opted for a supplementary use. 'Miltons' are discoveries or things with no current function that later find a use.", "when": "The account shows either repurposing something already functioning, or finding a use for something that previously had none.", "example": "", "notwhen": "The coder is judging only whether a find awaited a later problem (use 'Solution found before its problem'). This code concerns whether the source already had a function.", "evidence": [{"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 9, "text": "The likelihood of franklins (those already in use) being maintained is high, given their current utility.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 3, "text": "Miltons refer to discoveries without a currently known function.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-25", "group": "type", "status": "reference", "label": "Added use versus redirected development", "description": "A distinction between an established product gaining an additional use (repurposing) and a product still in development being redirected mid-course toward a different use (redevelopment).", "when": "The account describes either an existing product gaining a new market or use, or a project under development being switched to another application.", "example": "", "notwhen": "The coder is only noting a new use without the established-versus-in-development contrast (use 'New use for an existing thing').", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 3, "text": "However, such re-purposing of drugs approved for existing uses into multi-purpose drugs should be distinguished from re-developed drugs that were being developed for one use, but whose development path changed in favour of another use.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-26", "group": "type", "status": "reference", "label": "New mechanism versus known principle", "description": "A distinction between unexpected uses that rest on the same underlying phenomenon, which could in principle be reasoned out by analogy, and uses that rest on a genuinely new, unknown phenomenon. The latter cannot be foreseen and are rarer but more radical.", "when": "The coder can tell whether the surprising use relied on a known principle or on a newly revealed mechanism.", "example": "", "notwhen": "The issue is whether the find was new to the person or new to the world (use 'New to me versus new to the world').", "evidence": [{"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 23, "text": "But, if exaptations rely on a different and previously unknown underlying phenomenon, then it is inherently impossible to arrive at the exaptation via analogy or deduction.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-27", "group": "type", "status": "reference", "label": "New to me versus new to the world", "description": "A chance encounter may lead someone to adopt an existing need-solution pair that is new only to them. It may also spark a need-solution pair that is new to the world, such as an idea transferred to an entirely different situation.", "when": "The account shows either taking up a solution encountered as it was, or being prompted by an encounter to create something novel for another context.", "example": "", "notwhen": "The distinction concerns the underlying mechanism of an exaptation (use 'New mechanism versus known principle').", "evidence": [{"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 2, "text": "The employee then mentally assesses the need–solution pair on offer for utility to the firm.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-28", "group": "type", "status": "reference", "label": "Random chance versus unintended design consequence", "description": "Authors keep apart two triggers. One is an a-causal random event unrelated to any design, such as a contaminant or a lucky office-mate. The other is an unexpected outcome causally produced by a design or testing process, such as side effects or unintended uses.", "when": "Mark random chance when the trigger was unconnected to the person's plans. Mark unintended consequence when the surprise came from how the person's own product, project or trial was set up.", "example": "", "notwhen": "The distinction is whether the trigger came from the outside world or from the person's own mind (use 'External versus internal chance').", "evidence": [{"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 11, "text": "A further distinction can be made between chance as the unintended consequence of research design, and chance as pure random variation.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-29", "group": "type", "status": "reference", "label": "External versus internal chance", "description": "Chance may intervene in outer events before the observer's eyes, or during the person's own mental operations such as playing, joking or dreaming.", "when": "The unexpected input can be identified as coming from an outside event, or from the person's own mental play, joke or dream.", "example": "", "notwhen": "The distinction is between a private occurrence and a large societal event (use 'Personal versus historical contingency').", "evidence": [{"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 13, "text": "(Ernst [1989]) (16) Joke: A practical joke, like Vernes' travel to the moon.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-30", "group": "type", "status": "reference", "label": "Personal versus historical contingency", "description": "Triggering contingencies may happen to the individual privately, such as a mugging. They may also be historical or societal events that affect many people, such as a war.", "when": "The triggering event is described either as a private personal occurrence or as a large-scale societal or historical event.", "example": "", "notwhen": "The distinction is whether the input came from outer events or from the person's own thinking (use 'External versus internal chance').", "evidence": [{"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 14, "text": "One started in response to a personal contingency (the mugging in New York City), the other in response to a historical one (the Croatian war).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-31", "group": "type", "status": "reference", "label": "Idea received from someone else", "description": "The venture idea is handed to the person by someone else. This can happen without being sought, as when a friend suggests a business, or through deliberate outside search.", "when": "The account says the venture idea originally came from another person, whether solicited or unsolicited.", "example": "", "notwhen": "The person generated the idea themselves, by accident or by search. Also excluded: a chance meeting that led to a partnership or resource rather than to the idea itself (use 'Chance encounter').", "evidence": [{"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": 10, "text": "Building on Murphy (2011), I label this mechanism “legacy” and define it as receiving a venture idea from someone else .", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-32", "group": "type", "status": "reference", "label": "Accident from individual side activity", "description": "'Useful weeds' are self-initiated experiments, improvisations or failed projects by individuals inside a firm, pursued for whatever motive, that accidentally yield an innovation.", "when": "An individual's side experiment, personal tinkering or failed project produced an accidental discovery.", "example": "", "notwhen": "The work was a secret organised group effort against the formal agenda (use 'Skunk work').", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 3, "text": "/C101/C114/C101/C100 /C40._/C82/C97/C108/C112/C104 /C87/C97/C108/C100/C111 /C69/C109/C101/C114/C115/C111/C110/C41/C46 /C66/C97/C115/C101/C100 /C111/C110 /C116/C104/C101 /C105/C110/C115/C105/C103/C104/C116/C102/C117/C108 /C114/C101/C109/C97/C114/C107/C115 /C111/C102 /C69/C109/C101/C114/C115/C111/C110/C44 /C73 /C116/C101/C114/C109 /C116/C104/C101 /C115/C101/C108/C102/C45/C105/C110/C105/C116/C105/C97/C116/C101/C100 /C97/C99/C116/C105/C118/C105/C116/C105/C101/C115 /C98/C121 /C105/C110/C100/C105/C118/C105/C100/C117/C97/C108/C115 /C119/C105/C116/C104/C105/C110 /C116/C104/C101 /C102/C105/C114/C109 /C177 /C102/C111/C114 /C119/C104/C97/C116/C101/C118/C101/C114 /C109/C111/C116/C105/C118/C101/C115 /C177 /C97/C115 /C117/C115/C101/C102/C117/C108 /C119/C101/C101/C100/C115/C44 /C119/C104/C105/C99/C104 /C109/C97/C121 /C103/C101/C110/C101/C114/C97/C116/C101 /C97/C100/C118/C97/C110/C116/C97/C103/C101/C115 /C102/C111/C114 /C116/C104/C101 /C102/C105/C114/C109 /C105/C110 /C110/C101/C119 /C112/C114/C111/C100/C117/C99/C116/C44 /C112/C114/C111/C99/C101/C115/C115/C44 /C107/C110/C111/C119/C108/C101/C100/C103/C101/C44 /C111/C114 /C99/C97/C112/C97/C98/C105/C108/C105/C116/C121/C46 /C84/C104/C101 /C105/C110/C11", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-33", "group": "type", "status": "reference", "label": "Skunk work", "description": "Individuals or informal groups work voluntarily and secretly on their own initiative, outside or against the formal agenda. Such efforts may bring lucky breaks or disaster.", "when": "The person describes a secret or unofficial side project, pursued outside official plans, that led to an unexpected breakthrough or venture.", "example": "", "notwhen": "An individual's casual side activity or accident is involved (use 'Accident from individual side activity'). Also excluded: an initiative endorsed by top management.", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 3, "text": "1/C46 /C79/C112/C101/C110/C45/C109/C105/C110/C100/C101/C100/C110/C101/C115/C115 /C97/C110/C100 /C116/C111/C108/C101/C114/C97/C110/C99/C101 /C102/C111/C114 /C101/C114/C114/C111/C114/C115 /C97/C114/C101 /C116/C104/C101/C114/C101/C102/C111/C114/C101 /C97/C108/C115/C111 /C110/C101/C99/C101/C115/C115/C97/C114/C121/C46 /C83/C107/C117/C110/C107 /C119/C111/C114/C107 /C83/C107/C117/C110/C107 /C119/C111/C114/C107 /C104/C97/C112/C112/C101/C110/C115 /C119/C104/C101/C110 /C105/C110/C100/C105/C118/C105/C100/C117/C97/C108/C115 /C111/C114 /C119/C111/C114/C107/C105/C110/C103 /C103/C114/C111/C117/C112/C115 /C177 /C111/C102/C116/C101/C110 /C116/C101/C109/C112/C111/C114/C97/C114/C121 /C111/C114 /C105/C110/C102/C111/C114/C109/C97/C108 /C111/C110/C101/C115 /C177 /C119/C105/C116/C104/C105/C110 /C97/C110 /C111/C114/C103/C97/C110/C105/C122/C97/C116/C105/C111/C110 /C119/C111/C114/C107 /C118/C111/C108/C117/C110/C116/C97/C114/C105/C108/C121 /C97/C110/C100 /C115/C101/C99/C114/C101/C116/C105/C118/C101/C108/C121 /C111/C110 /C116/C104/C101/C105/C114 /C111/C119/C110 /C105/C110/C105/C116/C105/C97/C116/C105/C118/C101 /C116/C111 /C116/C97/C99/C107/C108/C101 /C101/C110/C116/C114/C101/C112/C114/C101/C110/C101/C117/C114", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-34", "group": "type", "status": "reference", "label": "Capabilities built before the opportunity was known", "description": "Preadaptation is the accumulation of capabilities before anyone knew of the new application. It is distinguished from adaptation: targeted development after the new opportunity becomes known.", "when": "The coder can see that relevant skills or resources were built up before the person became aware of the opportunity they later served.", "example": "", "notwhen": "The development was aimed at the opportunity after it was recognised (adaptation), or the account is about general readiness to seize luck (use 'Prepared or self-made luck').", "evidence": [{"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 17, "text": "A correct identification of Coming's preentry resources and capabilities, therefore, should trace them back to the period before 1966.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-35", "group": "type", "status": "reference", "label": "Unexpected strategic or managerial value", "description": "Unplanned gains in strategy or management that arise beyond the expected benefits, such as new strategic directions, sales channels, revitalised marketing or new acquisition targets.", "when": "Someone describes an unplanned strategic idea, market approach or management improvement that emerged from a deal or combination.", "example": "", "notwhen": "The unexpected gain concerns technology or product development processes (use 'Unexpected technological value').", "evidence": [{"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 7, "text": "While expected value was relatively similar across all cases, serendipitous value took many forms, including the revitalization of the acquirer's marketing organization, the discovery of new product development processes, and the identification of additional acquisition targets.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-36", "group": "type", "status": "reference", "label": "Unexpected technological value", "description": "Unplanned technological gains, such as superior development processes or unexpectedly useful technologies, discovered when engineers from different firms share work.", "when": "The account reports unexpected learning about technology or development methods through joint engineering work.", "example": "", "notwhen": "The gain is strategic or managerial (use 'Unexpected strategic or managerial value').", "evidence": [{"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 24, "text": "Proposition 3b: Acquisitions will be more likely to yield serendipitous technological value if acquired engineers share responsibilities with acquiring firm engineers.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-37", "group": "type", "status": "reference", "label": "Kind of thing found", "description": "Serendipitous finds take different forms: a person, an institution, or a broadening of one's mental horizon. In discovery more broadly, they may be a new natural resource, a new product or a new productive technique.", "when": "The account makes clear what was unexpectedly found: a person, an organisation, a new perspective, a resource, a product or a technique.", "example": "", "notwhen": "The interest is in whether the find was the discovery itself or a new use for something existing (use 'Accidental discovery itself' or 'New use for an existing thing').", "evidence": [{"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity as a Political Metaphor. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "We were looking for something else, and the profit was simply a pleasant thing that we ran across accidentally.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 17, "text": "All kinds of discovery essentially create something genuinely new, something simply not present (as far as human knowledge up until now could fathom) in the pie of available inputs and outputs given just prior to the moment of discovery.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-01", "group": "rival", "status": "core", "label": "Pure luck, no action", "description": "A good thing happened to the founder by chance, and they describe no noticing, judging or acting of their own. This is luck, not serendipity.", "when": "The founder presents an event as a windfall that simply happened.", "example": "'A big blog wrote about us out of nowhere and sales took off.'", "notwhen": "The founder also noticed and acted on the event; then consider serendipity instead.", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 29, "text": "Luck (‘good things that happen to you by chance, not because of your own efforts or abilities’; Oxford Dictionary , 2021), in turn, includes the elements of value and surprise but not of agency.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 8, "text": "Chute calls sortes Walpolianae,” for, whether sortes is translated as “luck” or “fate,” it lacks the mixture of those two ingredients that Walpole irrevocably included in the complex meaning of serendipity: accident and sagacity.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 237, "text": "Although serendipity is often seen as a result of good luck, research, including this book, has shown that it is not entirely a matter of chance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 12, "text": "As for the first of these, the paucity of empirical research may be explained, at least partly, by an incorrect use of serendipity as synonymous with chance, luck or providence.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 17, "text": "Neither is it simply the fortuitous outcome of a stroke of wholly undeserved luck.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 3, "text": "Therefore, finding something that occurs by accident and pure chance is not serendipity, because it needs mental capacity to recognise unusual things, which could go beyond the obvious.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 7, "text": "The concept of serendipity has clear boundaries, meaning it is different from ambiguity (Brown, 2006 ), providence ( de Rond, 2014 ), accidental occurrences ( Brown, 2005 ), chance events (de Rond, 2014), and randomness ( Liu and de Rond, 2016 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 9, "text": "For the purposes of this paper, I shall define pure luck as some kind of favorable contingency or chance happening (i.e. an event completely beyond the entrepreneur’s control) that impacts the entrepreneur in a positive way.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 14, "text": "Literature on social networks also discusses serendipitous networks as opposed to goal-directed networks ( Kilduff and Tsai, 2003 ), yet for these scholars, serendipity is merely an exogenous structural feature of randomness and spontaneous encounters ( Casciaro et al., 2014; Feld, 1981, 1982; Shipilov et al., 2014b ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 3, "text": "Following prior research, agency is included in our definition of serendipity to clarify that it is an outcome that results partly from purposeful human action and also to distinguish it from unexpected discoveries made via pure luck, which are A.E.F.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 6, "text": "First, whereas luck is purely random, serendipity involves agency—serendipitous discoveries often emerge, at least in part, from purposeful effort.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 3, "text": "In contrast to pure luck, Busch (2024) argues that in addition to the necessary conditions of surprise and value forming luck, respectively, agency is a third necessary condition for serendipity to happen.", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 2, "text": "Dew (2009) however argues that serendipity is not luck but rather relies on prior knowledge.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 3, "text": "These authors argue that serendipity and the discoveries it yields are more than just random strokes of luck; rather, they are the result of chance combined with effortful—and often collective—accomplishment.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 6, "text": "These authors argue that consumers penalize serendipitous inventions via a ‘‘just world’’ perspective, assigning situational attributions of luck or chance to such products and believing they are less deserving of consumer support than non-serendipitous ones.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 15, "text": "That said, a persuasive alternative to any explanation of effective resource search — including ours —is simply luck or serendipity (Alchian, 1950; Von Hippel & Von Krogh, 2016; Winter, 2012, for a review, see Liu & De Rond, 2016).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 5, "text": "Unlike pure luck, which is mostly passive, serendipity requires human effort and preparedness ( Garud et al., 2011 ; Austin et al., 2012 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Adegbesan (2009)", "title": "On the Origins of Competitive Advantage: Strategic Factor Markets and Heterogeneous Resource Complementarity", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2009.40632465", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "rival-06", "group": "rival", "status": "core", "label": "Systematic search", "description": "The opportunity came from a planned, methodical search with no real surprise: researching markets, testing ideas, working from a known problem.", "when": "The founder decided what to look for and found it as expected.", "example": "'I analysed 40 niches and picked the one with the best margins.'", "notwhen": "The search was under way but the answer came unexpectedly (definition-04).", "evidence": [{"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 2, "text": "Systematic search refers to goal-directed exploration aimed at solving known problems, requiring deliberate planning and resource allocation (Fiet & Patel, 2008).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 5, "text": "But, in all, better environmental representations allow firms to see and search more efficiently, thus identifying resources and value.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 13, "text": "An opportunity for pure profit cannot, by its nature, be the object of systematic search.", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 1, "text": "Thus , while the literature suggests that entrepreneurial opportunities are more likely to be the result of a systematic search (Shane and Venkataraman, 2000) than a fortuitous discovery, this study suggests that the combination of “accident and sagacity” is", "close": false, "none": false, "chosen": "reading"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 8, "text": "Active search has been reported more frequently for first entries than for subsequent entries, while initiative from local businesses motivated subsequent entries of Danish firms already established in a country of the region.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 23, "text": "In contrast, our findings suggest that NSP formation can also result from deliberate and structured search behavior.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 3, "text": "Also, this emphasis on exogenous shocks forming opportunities suggests that discovery theory is predominantly about search – systematically scanning the environment to discover opportunities to produce new products or services.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 14, "text": "Several studies indicate that commercially successful innovations for example are for about eighty percent answers to an already pre-existing and known problem, like 'the pill', but in the remaining twenty percent, it appears that something was discovered before there was a demand for it, like X-rays.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 29, "text": "The innovation process often starts with a problem that has been identified or formulated for solving, and then involves a structured search for a (new) solution to that problem (Jeppesen and Lakhani, 2010; V on Hippel and von Krogh, 2016).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 2, "text": "This focus is undergirded by the premises that individuals and organisations are able to anticipate possible outcomes a priori, and that activities and interactions can subsequently be coordinated around stable “strategic” objectives such as seeking particular resources (Engel et al. 2017; Hallen and Eisenhardt 2012).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 6, "text": "This overlap between the domain of search and the domain of prior knowledge is captured in Figure 1 as the space where opportunity discovery is the result of systematic exploration of knowledge corridors.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 2, "text": "Opportunity identification and exploitation are often seen as the outcome of systematic search and experimentation ( March, 1991 ; Patel and Fiet, 2009 ), and substantial investment ( Zahra et al., 2006 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 2, "text": "It is related to deliberate search and exploring solutions.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 21, "text": "Systematic exploration happens when a potential entrepreneur actively searches for an invention, or an inventor actively seeks innovation possibilities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": 9, "text": "While some scholars have discussed this general approach in the field of entrepreneurship (e.g., DeTienne & Chandler, 2004; Marvel, 2013), intentional idea generation has received the strongest interest from creativity researchers, who have developed an armamentarium of techniques that can be used to assist in this process (Smith, 1998).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 14, "text": "I need to start looking at these ideas as hypotheses that need testing, and then figure out what works and what doesn’t.", "close": false, "none": false, "chosen": "reading"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 9, "text": "Indeed, one might argue that the conventional procedure of exhaustive search of a well-defined solution landscape to solve a prespecified problem will be much richer than the possibly serendipitous discovery of viable need–solution pairs.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 9, "text": "In contrast to this more burst-like emergence of an idea, there were also answers from teams reporting that their starting point was identifying the problem and that their project was a methodical effort to resolve this identified need (27%). 4.3.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Bhave (1994)", "title": "A process model of entrepreneurial venture creation", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/0883-9026(94)90031-0", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "rival-07", "group": "rival", "status": "core", "label": "A plan carried out", "description": "The venture's founding or growth is explained as a plan or strategy carried out as intended.", "when": "The founder describes following a plan made in advance, step by step, without unexpected turns.", "example": "'We had a five-year plan and stuck to it.'", "notwhen": "The point is how the idea was searched for; use rival-06.", "evidence": [{"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 4, "text": "In this first type, called planned strategy, leaders at the centre of authority formulate their intentions as precisely as possible and then strive for their implementation-their translation into collective action-with a minimum of distortion, 'surprise-free'.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 8, "text": "This perspective received criticism from Felin and Zenger (2016) ,who discussed the primacy of normative theories in problem-solving practices, raising a counterpoint against serendipity in the strategy-making process, and preferring the comparative firm-centric theories of value creation.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 27, "text": "Moreover, in one of the rare instances of the realization of explicit managerial intentions (outlined in the 1966 NFB Annual Report), a strategy of regionalizing production began in earnest in 1971 with the opening of a filmmaking office in Vancouver, followed by offices in Halifax, Winnipeg, and Toronto.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 2, "text": "Start-up intentions and gestation typically lead to the creation of a plan—even if only in the minds of the founders ( Thurston, 1983)—against which the founders attempt to execute.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 5, "text": "Analytical explanations focus on plans and preparation and emphasize the relentless pursuit of competitive advantages by Honda in the domains of technology, innovation capabilities, and flexible manufacturing.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 19, "text": "There was no overly rational, pre-planned approach driving the process ( March, 1994, 1999 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 2, "text": "Our meticulous models, rigorous frameworks and primordial principles are predicated on analysis, planning and control, as are our courses, textbooks and degree programmes.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cohen et al. (1972)", "title": "A Garbage Can Model of Organizational Choice", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2392088", "page": 17, "text": "The process occurs precisely when the preconditions of more normal rational models are not met.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 2, "text": "Because Parsons's (1909) theory makes occupational choice such a rational and reasonable process, there is no room for chance or unplanned events.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 11, "text": "All these point to a linear and predictive approach where support system managers make decisions regarding feasibility and scalability in a structured sequential process.", "close": false, "none": false, "chosen": "rea
