preneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 6, "text": "In this sense, differences between these groups may be the result of the entrepreneurial path taken, not just a cause of entrepreneurship (Hayward, Shepherd and Griffin, 2006; Sarasvathy, 2001).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 3, "text": "This stance enables them to develop strong beliefs in their own agency, thereby suggesting an unexpected resolution to the theoretical tension inherent in Baumol’s institutional story when juxtaposed with Gerschenkron’s agentic narrative.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 1, "text": "On the contrary, the impact of these unplanned events caused a major change in their career directions, revitalized their career interests, altered their self-concepts, increased self-confidence, and established important contacts with significant professionals.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-20", "group": "outcome", "status": "reference", "label": "Strategy reinforced or changed by misread luck", "description": "Chance outcomes are misread as evidence about strategy. Leaders become more confident in their strategy, while laggards change theirs.", "when": "The venture keeps or abandons a strategy because of results that may have come from chance.", "example": "", "notwhen": "The change concerns personal identity or self-belief; use 'Confidence and entrepreneurial identity'.", "evidence": [{"cite": "Denrell (2004)", "title": "Random Walks and Sustained Competitive Advantage", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.1030.0143", "page": 13, "text": "Under such circumstances industry leaders will probably grow more confident in the application of their strategy and their organization (Miller 1993), while laggards will be likely to consider a change in strategy and organization.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-21", "group": "outcome", "status": "reference", "label": "Pleasure and morale boost", "description": "Serendipitous finds bring delight, amazement or awe and raise morale. This can make even small finds feel significant.", "when": "The person expresses delight, wonder or energised spirits about a timely, unexpected good outcome.", "example": "", "notwhen": "The person feels uneasy about the luck; use 'Discomfort with undeserved success'.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 19, "text": "“Accidents” and “coincidences” might generate amazement, even awe, but not research into their genesis.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-22", "group": "outcome", "status": "reference", "label": "Discomfort with undeserved success", "description": "Unexpected good fortune can bring moral unease and self-doubt, and the risk that others will dismiss the success as mere luck.", "when": "The person expresses unease, self-doubt or fear of others' judgment after a lucky success.", "example": "", "notwhen": "The reaction is positive delight; use 'Pleasure and morale boost'.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Moral Implications of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "Too much luck, good or bad, is suspect; though effort and reward may not be congruent, the individual must be able to show that he has striven to overcome difficulties and has earned success.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-23", "group": "outcome", "status": "reference", "label": "Value requires conversion work", "description": "Serendipity creates only potential value. It has to be converted through effort, capability and extensive development before it pays off.", "when": "The account stresses the work, capability or long development needed to turn a lucky break into value.", "example": "", "notwhen": "Success depended on users or markets accepting the innovation; use 'Market acceptance required'.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 15, "text": "Accordingly, identifying through which mechanisms capability-based views affect the chances of realising serendipitous value provides an opportunity for detailed empirical research.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 12, "text": "Like improvisation, it appears serendipity is “not inherently good or bad” (Hmieleski and Corbett, 2008: 484); serendipity—with its associated unexpected discoveries—seems to create potential value which may be translated to realized value if it is flexibly acted upon.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Serendipity as Ideology and Politics of Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 14, "text": "In fact, after ten years’ work . . .” 15 Serendipity alone would put the company in a bad light, just as it was felt to detract from the merit of individual scientists, so success by virtue of serendipity is justified by subsequent effort.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-24", "group": "outcome", "status": "reference", "label": "Market acceptance required", "description": "A serendipitous or novel offering succeeds only if others adopt it. This often requires educating customers or reworking the concept.", "when": "The founder describes customers not understanding the offering, missionary work, or success depending on uptake by users.", "example": "", "notwhen": "The effort was internal development of the discovery; use 'Value requires conversion work'.", "evidence": [{"cite": "Bhave (1994)", "title": "A process model of entrepreneurial venture creation", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/0883-9026(94)90031-0", "page": 9, "text": "GB had to further develop his business concept, educate customers, and be educated by them before his product found customer acceptance.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 18, "text": "And while serendipitous outcomes can relate to intangible (e.g., social or cognitive) or tangible factors (e.g., physical production of a prototype), for a serendipitous innovation to succeed it often needs to be more broadly adopted (Hargadon and Douglas, 2001).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-26", "group": "outcome", "status": "reference", "label": "Stalled or exploited by others", "description": "A recognised serendipitous finding stalls for years for lack of resources or support. Or it is so unexpected that a different party, not the discoverer, capitalises on it.", "when": "A chance discovery is shelved or delayed, or is later revived or exploited by another person or firm.", "example": "", "notwhen": "The discovery was simply never noticed or pursued by anyone; use 'Missed or forgotten serendipity'.", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 10, "text": "There are several examples of serendipitous observations not being recognised by others.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 4, "text": "For some reason, perhaps the lack of resources and encouragement at St Marj s or the many other promising areas of research Aemming was pursuing, the development of penicillin stopped for ten years (Sheehan, 1982). .", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-27", "group": "outcome", "status": "reference", "label": "Cascade of further opportunities", "description": "One serendipitous outcome opens new possibilities that lead to further unexpected opportunities and widening applications over time.", "when": "The speaker describes one unexpected find or first move leading to later, often larger, unforeseen opportunities or applications.", "example": "", "notwhen": "The account is about the idea spreading through others' networks; use 'Unplanned spread and uptake'.", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 8, "text": "The long-term impacts of serendipitous discoveries also make analysis and classification difficult.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 19, "text": "Thus, the potential infiniteness of possibilities ‘collapses’ into a concrete materialization, which in itself opens up new (infinite) latent possibilities (potentiality).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 11, "text": "Rather, initial moves unearth subsequent opportunities that may prove huge, as e-commerce and broadband cable have for Enron.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 21, "text": "For example, a single serendipitous discovery may trigger a cascade of others, creating a virtuous cycle of unexpected opportunities observable over time (Busch, 2024).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-28", "group": "outcome", "status": "reference", "label": "Unplanned spread and uptake", "description": "A small initiative unexpectedly spreads through others' networks, bringing inquiries, adoption, awards or press that were never planned.", "when": "The person describes their idea or venture being picked up widely in ways they did not anticipate.", "example": "", "notwhen": "New opportunities follow from one's own discoveries; use 'Cascade of further opportunities'.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 223, "text": "I attribute much of the subsequent spread of the idea to my copy-left approach.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-29", "group": "outcome", "status": "reference", "label": "Distraction and loss of focus", "description": "Chasing serendipity can cause drift, opportunity overload, scattered ad hoc ideas, derailment from the task, or lost efficiency on the original plan.", "when": "The person describes unexpected opportunities distracting them, clouding direction, scattering effort, causing delays or trading off against efficient delivery.", "example": "", "notwhen": "The unexpected event caused direct harm, losses or errors; use 'Harmful or costly unexpected outcomes'.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 66, "text": "But organismic organizations are also exposing themselves to drift, chasing one opportunity after another or tackling threats reactively rather than systematically.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 10, "text": "These three findings imply that there is a trade-off between pursuing serendipity and achieving research efficiency in science, via who plays the managerial role and who the leading research role.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 19, "text": "Instead, we demonstrate that attention can also uncover unexpected opportunities through serendipity, even in the absence of deliberate search efforts.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Hargadon and Bechky (2006)", "title": "When Collections of Creatives Become Creative Collectives: A Field Study of Problem Solving at Work", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1060.0200", "page": 15, "text": "There just isn't any way that I know of to make all knowledge that has ever been done on something available to the person at the time in which they need it.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 41, "text": "After explaining how scientists cultivate serendipity, they add what might seem to be a non sequitur if we had not encountered the same suspicion of serendipity before: “Planning, reflection, and hypotheses give direction to the inquiry.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 13, "text": "Therefore, any comprehensive theory of entrepreneurship must include resourceful behavioral repertoires along with factors facilitating the discovery and exploitation of (planned and/or unplanned) opportunities as they arise.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 7, "text": "A system which allowed itself to be derailed from a task at hand might not achieve as much as one which maintains focus.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-30", "group": "outcome", "status": "reference", "label": "Harmful or costly unexpected outcomes", "description": "Most accidents are not valuable. Openness to chance or bold action on a perceived opportunity can produce costly errors, losses, misinformation or harmful consequences (zemblanity).", "when": "The person notes chance outcomes that were useless, harmful or costly, or a misread opportunity that led to losses.", "example": "", "notwhen": "The cost is lost focus or direction; use 'Distraction and loss of focus'.", "evidence": [{"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 7, "text": "This does not, of course, mean that all accidents produce valuable outcomes.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 238, "text": "Despite the potential for both genuine and fake serendipity to lead to negative consequences, such as consumerism or the spread of misinformation, serendipity can also be a tool for breaking out of echo chambers and correcting misinformation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 8, "text": "This, in turn, may help to identify cases in which serendipity leads to positive and negative outcomes (socalled zemblanity, the opposite of serendipity; Boyd, 1998).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 23, "text": "And such errors may generate still more errors.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 9, "text": "‘‘Happy accidents’’ are ‘‘happy’’ only post hoc, which means that the facilitation of serendipity will potentially result in the increase of errors – including those of the ‘‘unhappy’’ type.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-31", "group": "outcome", "status": "reference", "label": "Valuable by-product of other work", "description": "Work aimed at something else, including failed projects and apparent mistakes, incidentally yields a valuable side result, feature, application or spillover.", "when": "The person reports a benefit that arose incidentally from an initiative with another purpose, or from something once judged a failure.", "example": "", "notwhen": "The benefit was the initiative's explicit goal, or the gain came from buying an undervalued resource; use 'Windfall gain from undervalued resources'.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Stock Responses to Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "We were looking for something else, and the profit was simply a pleasant thing that we ran across accidentally.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 24, "text": "Another tension discussed in the innovation literature is one between exploration and exploitation (March 1991; Benner & Tushman 2003).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 14, "text": "To identify potential application fields for the carbon hydraulic cylinder, a searcher consulted the CEO from a hydroelectric power company.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 9, "text": "Such a mix was representative of the “mechanical skill” base that had emerged as a result of a “practical engineer” education typical of the Danish machine industry.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 4, "text": "Even effectuation theory, a perspective developed from the premise of a priori uncertainty, involves logical entrepreneurial design thinking around the rational goal of advancing under uncertainty and reducing the cost of failure.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-32", "group": "outcome", "status": "reference", "label": "Venture mirrors founder's background", "description": "Opportunities that arrive by chance or through networks tend to produce ventures close to the founder's prior industry and knowledge, which imprint the venture's market and model.", "when": "The venture is an offshoot of the founder's prior work, or its form or market reflects their background.", "example": "", "notwhen": "The chance event redirected the founder into a different career or line of work; use 'Redirection of venture or career'.", "evidence": [{"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 12, "text": "Network bricolage is more likely than the search for founding opportunities to result in a new business in a founder’s prior industry.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 13, "text": "In each case, the selection of the market, the way to serve the market, and the solutions to the customer problems were influenced by the entrepreneur' s prior knowledge.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-33", "group": "outcome", "status": "reference", "label": "Chance deals crowd out planning", "description": "Relying on deals that arrive unplanned reduces later effort to build planned capabilities such as a sales function.", "when": "The founder relied on incoming deals rather than building sales or planning functions.", "example": "", "notwhen": "Chance opportunities caused distraction rather than neglect of capability building; use 'Distraction and loss of focus'.", "evidence": [{"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 14, "text": "It would seem that the ability to get an early deal without prior planning reduced efforts to build design and execution competencies when obtaining future deals.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-34", "group": "outcome", "status": "reference", "label": "Redirection of venture or career", "description": "An unplanned development redirects the venture or the person's professional life. It may take them into new areas, lead to an additional venture, or turn out to be a misstep later abandoned.", "when": "The person describes a chance event changing the venture's direction or their career, starting an extra venture, or a discounted idea succeeding and prompting a change of course.", "example": "", "notwhen": "The unexpected input kept the project on its original course; use 'Project kept on its original path'.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 14, "text": "The model positions critical events as key components of serendipity processes that can trigger venture formation, illustrating how a single, unplanned, personal event, can generate unexpected, life-changing consequences (Zerbe et al., 2022).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 26, "text": "The coexistence of multiple forms of change during the acquisition integration process may provide some broader insights into how exploration and exploitation can coexist.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 22, "text": "One gets a sense of how quickly (and thoroughly) a project organization can change direction of its own accord, independent of its formal leadership.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 14, "text": "2001 Sarasvathy 255 not always pull in opposite directions.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-35", "group": "outcome", "status": "reference", "label": "Stalled work unblocked", "description": "A chance encounter or insight supplies the missing piece, so that long-stalled work moves forward quickly.", "when": "The person reports that after a chance meeting or insight, a difficult problem was solved and the rest followed quickly.", "example": "", "notwhen": "The chance input only explained a crisis so the team could continue as before; use 'Project kept on its original path'.", "evidence": [{"cite": "Eagle (2004)", "title": "Can Serendipity Be Planned", "venue": "", "url": "", "page": 2, "text": "I was elated because I had found someone who could help me with some difficult programming problems, but I couldn’t help feeling some regret.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 38, "text": "Once that piece of my puzzle fell into place, a draft of this essay emerged rapidly. 51 Here, then, we see Kuhn’s major book providing a fine specimen of “the serendipity pattern” at work in a serendipitous microenvironment, and in self-exemplifying fashion.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-36", "group": "outcome", "status": "reference", "label": "Project kept on its original path", "description": "An unexpected explanation resolves a crisis, so the project survives without changing direction.", "when": "An unexpected input lets the team return to its original assumptions and continue rather than end the project.", "example": "", "notwhen": "The input leads to new assumptions and a new direction; use 'Redirection of venture or career'.", "evidence": [{"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 14, "text": "This allowed actors to continue their existing innovation process rather than terminate the project.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-37", "group": "outcome", "status": "reference", "label": "Greater openness to future chance", "description": "Implemented serendipitous discoveries make people more alert and receptive to the unexpected. Failed ones teach self-censorship.", "when": "Past success or failure with unexpected ideas is described as shaping later openness to them.", "example": "", "notwhen": "The organisation builds formal routines to exploit the unexpected; use 'Serendipity becomes a dynamic capability'.", "evidence": [{"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 9, "text": "In the first case, people may become more alert and vigilant, whereas in the second they may self-censor their ideas.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-38", "group": "outcome", "status": "reference", "label": "Environment transformed", "description": "Ventures built from contingencies end up changing the institutions and conditions in which the original contingencies arose.", "when": "The venture is described as changing the institutions or conditions around it.", "example": "", "notwhen": "The venture creates a new market; use 'New market, industry or field created'.", "evidence": [{"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 16, "text": "We see the entrepreneurial journeys of these two ventures as a matter of their founders developing a resourceful stance toward contingency and learning to use their agency as a way to transform the environment.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "outcome-39", "group": "outcome", "status": "reference", "label": "Delayed payoff", "description": "Benefits from chance encounters may emerge only slowly, after years.", "when": "The person notes that the benefits of a chance meeting appeared long after it happened.", "example": "", "notwhen": "The finding was shelved for lack of support; use 'Stalled or exploited by others'.", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 2, "text": "In particular, even if an encounter eventually produces new knowledge, this process may occur slowly and only emerge after a number of years (Catalini, 2018; Fleming, 2001 ).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-04", "group": "condition", "status": "core", "label": "Putting themselves in chance's way", "description": "The founder actively made unexpected opportunities more likely: going to events, talking to many people, trying many things, sharing their work.", "when": "The founder describes deliberate habits that invite chance.", "example": "'I said yes to every coffee meeting that first year.'", "notwhen": "The founder only says they are open to luck, without describing actions.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 66, "text": "Therefore, organizations cannot systematize the serendipity process, but they might create contexts that will make serendipity more likely, in a search for planned luck (Busch and Barkema 2020).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 5, "text": "The key strategic processes should place the company where the flow of opportunities is swiftest and deepest.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Dictionaries and Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 2, "text": "We must, in a measure, assist to turn them up.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 27, "text": "While entrepreneurs cannot control or predict luck events, they might be able to foster specific conditions or recognize actions that lead to the achievement of specific goals.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 5, "text": "They also noted, “Scientists cultivate serendipity by being constantly alert for chance occurrences that may lead to new explanations and discoveries ” (Merton & Barber, 2004, p. 197).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 6, "text": "We believe that this will increase the likelihood of chance encounters occurring to expect serendipity to follow.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 3, "text": "Yaqub (2018) echoes these themes, recommending: (1) examining deviations from theory, (2) activating previously acquired knowledge and experiences from individuals, (3) tolerating errors and following up on such occurrences, and (4) leveraging network.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "condition-17", "group": "condition", "status": "core", "label": "Cheap to try", "description": "Trying the new idea cost little, so the founder could act on the unexpected without much risk.", "when": "The founder says they could test it quickly and cheaply, or had a safety net.", "example": "'It cost me $50 to see if anyone would buy it.'", "notwhen": "The point is lacking money to follow up (condition-35 or MIS-CND).", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 14, "text": "To answer the research question of why and how individuals exploit unexpected entrepreneurial opportunities to create unforeseen new ventures, the participants capitalised on unexpected entrepreneurial opportunities because they could do so within the boundaries of available means and affordable loss.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 7, "text": "Benefit motivates open ness to accident, but cost controls the degree to which it appears.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Denrell et al. (2015)", "title": "Perspective—Chance Explanations in the Management Sciences", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0946", "page": 15, "text": "Rather than betting big on a small number of options, managers should increase the number of small bets (Mauboussin 2012) to better understand causality and better prepare for future eventualities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 12, "text": "Moreover, the application of the affordable loss heuristic works to keep the potential cost of networking at an acceptable level while keeping the venture open to unexpected new possibilities on the upside ( Dew, 2009 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 11, "text": "Effectuation predetermines how much loss is affordable and focuses on experimenting with as many strategies as possible with the given limited means.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 15, "text": "Most of the new foundings we studied initially required few resources beyond founders’ own capabilities and resources readily available through their networks.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 12, "text": "It therefore follows that in industries where users have lower opportunity costs, user entrepreneurship is more likely.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "condition-22", "group": "condition", "status": "core", "label": "Loose plans", "description": "The founder held plans loosely, which left room to follow the unexpected; or held them rigidly, which nearly made them miss it.", "when": "The founder describes having no fixed plan, moving step by step, or being locked into a plan.", "example": "'We never had a business plan, so it was easy to switch.'", "notwhen": "The constraint was obligations to investors or contracts; if no core code fits, use MIS-CND.", "evidence": [{"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 15, "text": "One is that the entrepreneur should expect business plans to change; in fact, evolving business plans may be somethingto strive for.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 3, "text": "For example, this article emphasises that firms can encourage an increase in serendipity through the adoption of adaptive paradigms and emergent strategies[1] rather than the strict execution of predefined plans (Crick and Spence, 2005; Denrell et al., 2003; van Andel, 1994).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 36, "text": "Plans should be made but often only of a general kind.” 46 The art of profiting from the unexpected, then, that art, to return to Poe’s phrase, of “calculating upon the unforeseen,” is an art of general planning.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 16, "text": "Openness to such emergent strategy enables management to act before everything is fully understood-to respond to an evolving reality rather than having to focus on a stable fantasy.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 38, "text": "But none can likewise function with strategies that are always and purely deliberate; that would amount to an unwillingness to learn, a blindness to whatever is unexpected.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 4, "text": "Hence, individuals’ psychological ownership of ideas might challenge their willingness to revise them in response to external feedback.", "close": true, "none": false, "chosen": "reading; close match"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 4, "text": "It is dismissed because not wanted – it does not conform to the preconceived plan.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 14, "text": "Had they had a proper planning process in place .. . this non-starter would have been eliminated at the outset-plan rationally and be done with it.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 27, "text": "Managers should learn to expect surprise and see it as an opportunity rather than as an indication of poor control.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 16, "text": "This can cause a loss of serendipity: the aim and/or plan spoils the journey.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "condition-35", "group": "condition", "status": "core", "label": "Little money or resources", "description": "Having little money or few resources pushed the founder to rely on what turned up and improvise.", "when": "Being short of money or resources led the founder to improvise or take an unexpected opportunity.", "example": "'We couldn't afford ads, so we said yes to any partnership.'", "notwhen": "Lack of money stopped them following up; if no core code fits, use MIS-CND.", "evidence": [{"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 4, "text": "First, resource constraints provide an impetus for startups to find additional uses for their existing resources when improvising.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 6, "text": "Intriguingly, this also introduces an argument for why serendipity might be less constrained in contexts where resources may be lacking, and where there are no particular methods, system, or tools to “unlearn” (Busch 2022; also see German and Barrett 2005; German and Defeyter 2000).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 2, "text": "In addition, few studies account for challenges that disproportionately affect small and new firms—such as constrained resources and limited prior knowledge—that make systematic search impractical (Dew, 2009; Shah & Tripsas, 2007; Shane, 2000).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 15, "text": "Obtaining new ideas and information through serendipity at the initial stage of a firm’s life cycle is prevalent in firms with scare resources ( Carayannis, 2014 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 25, "text": "Third, firms facing penurious environments sometimes engage in bricolage, making do by applying combinations of the resources at hand to new problems and opportunities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "According to this perspective, SMEs might be more exposed to serendipity in internationalisation processes (Meyer and Skak, 2002 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 88, "text": "Intriguingly, this also introduces an argument for why serendipity might be less constrained in contexts where resources may be lacking, and where there are no particular methods, system, or tools to “unlearn” (Busch 2022; also see German and Barrett 2005; German and Defeyter 2000).", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "condition-01", "group": "condition", "status": "reference", "label": "Luck of place and timing", "description": "Being in a particular place at a particular moment, or small circumstantial differences, rather than superior ability, lead one person and not another to an opportunity. Sometimes several independent fortunate circumstances line up.", "when": "The person attributes the start or a turn of the venture to luck, timing, location or a coincidence of several fortunate circumstances rather than to their own attributes.", "example": "", "notwhen": "The person credits their own alertness, curiosity or knowledge for spotting it. Code those under the individual trait or experience codes.", "evidence": [{"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 3, "text": "He later emphasized that Aemming's discovery was mainly attributable to tenacity in seizing an opportunity others had let pass rather than due to just pure chance (Scott, 1947).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 6, "text": "For example, two individuals may be indistinguishable with respect to their attributes, but small variations in their local environment – e.g., differences in location – might lead one of them to form and exploit an opportunity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and Tsay (2023)", "title": "A normative theory of luck", "venue": "Frontiers in Psychology", "url": "https://doi.org/10.3389/fpsyg.2023.1157527", "page": 4, "text": "The implication is that successful career outcomes among these superintendents may not have been a reliable indicator of superior merit but may instead have reflected the superintendents being at the right place and right time.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-02", "group": "condition", "status": "reference", "label": "High uncertainty and unclear goals", "description": "Serendipity matters most where outcomes cannot be known in advance, goals are emergent or ambiguous, the needed ties or resources are unknown, and the person has little control over the conditions of success.", "when": "The person says they could not foresee where actions would lead, did not know what the venture would become or whom they needed, and so acted on whatever came along.", "example": "", "notwhen": "The account stresses rapid change in the market rather than not knowing; use the dynamic environment code.", "evidence": [{"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 6, "text": "In principle, no matter how hard an entrepreneur works, all the information needed to turn this decision making setting into a risky one cannot be collected.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 6, "text": "However, apart from notable exceptions (e.g., Giudici et al., 2018), the literature has been surprisingly silent on how to handle such uncertainty and, importantly, how to create conditions for serendipity to happen, for instance, in the context of incubators.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cohen et al. (1972)", "title": "A Garbage Can Model of Organizational Choice", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2392088", "page": 2, "text": "In the organization it is difficult to impute a set of preferences to the decision situation that satisfies the standard consistency requirements for a theory of choice.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 2, "text": "When entrepreneurs do not know what resources they need from their network and which ties can potentially provide these resources, extending the scope of their network becomes attractive.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 3, "text": "The network evolves outside the control of the firm, as resources in the network cannot be managed to the same extent as internal resources.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 4, "text": "Effectuation provides useful design principles for transforming extant environments into new futures in the face of ambiguous goals.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 4, "text": "Individuals faced complex problems of sustainability challenges, characterized by uncertainty and unclear goals (see Table 1 for a description).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": 4, "text": "These differences reflect uncertainty in the competitive environments facing firms.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 7, "text": "In the following sections, we therefore take this task more seriously and begin to consider the implications of incorporating the notion of uncertainty into investigations of how entrepreneurs may effectually form and maintain network ties. 4.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 3, "text": "As yet, few entrepreneurship scholars have examined the role of serendipity in the entrepreneurial opportunity process, and examined how to reconcile the paradox between deliberate search and chance encounters.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Moral Implications of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 7, "text": "The factors involved seem to lie along two dimensions: The first is the dimension of control over the conditions of success; the second is the dimension of responsibility.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 35, "text": "[10] In recent years, companies have used the development of a broader social purpose, for example related to the UN’s Sustainable Development Goals, to maintain a broader ‘north star’ while embracing emergent strategy , allowing for the emergence of serendipity .", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 12, "text": "New markets however, show high levels of uncertainty and ambiguity about user needs, which are themselves changing (Clark, 1985; Tushman and Anderson, 1986).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-03", "group": "condition", "status": "reference", "label": "Dynamic, fast-changing environment", "description": "Rapidly changing or high-velocity markets, and information that arrives in stages, make unexpected discoveries more frequent and more valuable to pursue. One author dissents: incessant change can also undermine what was discovered before it pays off.", "when": "The person links an unexpected opportunity to fast or unpredictable change in their market or industry, a boom with a flow of new opportunities, or constantly arriving new information, or says constant change wiped out what they had noticed.", "example": "", "notwhen": "The emphasis is on not knowing outcomes or goals rather than on pace of change; use high uncertainty.", "evidence": [{"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 9, "text": "In contrast, dynamic environments push firms to explore novel or unconventional opportunities as a response to uncertainty and change.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 21, "text": "In a world of incessant change, they argue, it is precisely those acts of entrepreneurial boldness which must frustrate any discovery efforts made by fellow entrepreneurs.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davis et al. (2009)", "title": "Optimal Structure, Market Dynamism, and the Strategy of Simple Rules", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2009.54.3.413", "page": 29, "text": "In these opportunity-rich environments, there are likely to be many high-payoff opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 6, "text": "The dynamic nature of this framework is clear: nodes will be accessing web services, so the data being used will be constantly changing; existing nodes will be updated and new nodes will be uploaded regularly; and new flowcharts will be created rapidly.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 8, "text": "These relationships are in alignment with what we would anticipate in that unexpected or surprise discoveries may be more likely to result in dynamic environments that are characterized by uncertainty.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-05", "group": "condition", "status": "reference", "label": "Expecting and welcoming serendipity", "description": "People who believe they are lucky, expect unexpected finds and have had positive past experiences of noticing become more open to serendipity and so luckier.", "when": "The person describes seeing themselves as lucky, treating unexpected finds as a normal part of their work, or says earlier noticing made them more attentive later.", "example": "", "notwhen": "The person describes concrete actions to create chances; use deliberately setting the stage.", "evidence": [{"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 3, "text": "Those who believe they are lucky and act on that belief frequently find that their luck increases, whereas those who consider themselves unlucky and assume that the worst is going to happen, often find that it does (Kanter, 2004).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 236, "text": "The common thread in these findings is that positive outcomes with serendipity can encourage people to be more open to it and, therefore, become ‘luckier’ than others.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 10, "text": "In their social milieu unexpected good luck is a relatively frequent occurrence, and in retrospect, at least, it is fairly easy to see why we should find concentrated among collectors people who are familiar with the word serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and Tsay (2023)", "title": "A normative theory of luck", "venue": "Frontiers in Psychology", "url": "https://doi.org/10.3389/fpsyg.2023.1157527", "page": 12, "text": "A middle-dip version of the normative theory of luck Many theories of luck exist.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 2, "text": "‘B’ is the organizational culture that can affect serendipity’s appearance likelihood, like openness to new ideas, allowance for “sloppiness,” a cross-discipline mix of people, etc.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-08", "group": "condition", "status": "reference", "label": "Improvisation", "description": "The ability of a person or venture to react quickly, intentionally and creatively in the moment raises the chance of acknowledging and acting on unexpected events.", "when": "The person or venture improvised a fast creative response to an unexpected situation.", "example": "", "notwhen": "The account is about loose rules or structure that permitted the response; use loose, flexible structure.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 9, "text": "In their study of US start-ups, Fultz and Hmieleski (2021) theorised and found empirical support for their hypothesis that organisational improvisation is positively related to serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 90, "text": "Grimes of one’s intellectual “blind spots” and thus ensures increased openness to different persons, arguments, or ideas (Driver 1989; Spiegel 2012).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-10", "group": "condition", "status": "reference", "label": "Emotional state", "description": "Positive, especially other-oriented, emotions broaden attention and receptivity to triggers; negative emotions reduce it.", "when": "The person links their mood or emotional state to noticing or missing an unexpected opportunity.", "example": "", "notwhen": "The account concerns a stable personality trait; use curiosity, openness and alertness.", "evidence": [{"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 7, "text": "When participants felt negative emotions arising from an unexpected encounter, they described being “ in the wrong mood ” (#2, Stage 2: Emotions/Energy → Agency).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 7, "text": "Conversely, negative emotions can diminish receptiveness to (potential) serendipity triggers, as they decrease receptivity to novel or unconventional information (Busch 2020a; also see Kahneman 2011).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 89, "text": "Conversely, negative emotions can diminish receptiveness to (potential) serendipity triggers, as they decrease receptivity to novel or unconventional information (Busch 2020a; also see Kahneman 2011).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-11", "group": "condition", "status": "reference", "label": "Sociable and reflective practices", "description": "Outgoing behaviour increases the number and diversity of encounters, while solitary practices such as reading, browsing or reflection help notice weak cues.", "when": "Frequent socialising or solitary reading, browsing, meditation or reflection preceded the unexpected input.", "example": "", "notwhen": "The focus is on the breadth or reach of the network rather than personal habits; use network breadth and weak ties.", "evidence": [{"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 6, "text": "Such attraction can thereby give rise to increased sharing of novel information, thus potentially surfacing unexpected solutions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 88, "text": "Such attraction can thereby give rise to increased sharing of novel information, thus potentially surfacing unexpected solutions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 1, "text": "In uncertain terrain where complexity is the norm, emotion-led reflection is a strategic toolkit for navigating the unexpected. 1.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-13", "group": "condition", "status": "reference", "label": "Active effort and search", "description": "Hard work, diligent and sustained activity, repeated exposure, habitual searching and entrepreneurial action such as networking and combining resources increase the number of chance encounters and finds.", "when": "The person links lucky opportunities to working hard, doing a lot, actively scanning, or regularly attending to a stream of information.", "example": "", "notwhen": "The person stresses persisting after failure; use persistence through setbacks.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 9, "text": "For example, entrepreneurial actions, which can be viewed as the processes of creation, attraction, and a combination of resources to capture emergent market opportunities, can increase the chances of serendipity ( Cha and Bae, 2010).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 6, "text": "But the important point to notice is that the value of the accident depends on the kind of man, on the kind of mind, by whom or by which it is first observed.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 11, "text": "This new pattern, entrepreneurial serendipity, was also observed in participants who were bored in their previous job and were looking for opportunities to work for themselves.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 22, "text": "Prior knowledge influences the kind of inferences a person makes during exposure to new information, and the nature of these inferential processes determines how new information is represented in our memory (Fincher-Kiefer, 1992).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-14", "group": "condition", "status": "reference", "label": "Motivation and incentives to act", "description": "A prospect of profit, a personal need or frustration, a desire for self-employment, or the firm's existing interests shape whether a person notices and acts on an unexpected opportunity. Noticing without motivation does not lead to action.", "when": "The person explains noticing or acting, or not acting, by gain, dissatisfaction, wanting their own business, or how the opportunity fit existing business interests.", "example": "", "notwhen": "The issue is whether the opportunity was judged attractive or whether they felt capable; use judging whether to act.", "evidence": [{"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 11, "text": "If the answer is yes, then a first-person opportunity is believed to exist, and entrepreneurial action takes place.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 15, "text": "While firms typically search locally, within the boundaries of their existing knowledge domain, some of them display a higher propensity to search beyond such boundaries (e.g., Rosenkopf and Nerkar 2001).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 15, "text": "The competitive process is an entrepreneurial one in that it depends crucially on the incentives provided by the possibility of pure entrepreneurial profit.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 11, "text": "CET founders wanting to go into business were offered a partnership.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-15", "group": "condition", "status": "reference", "label": "Judging whether to act", "description": "Whether an unexpected opportunity is pursued depends on a subjective, changing evaluation shaped by risk tolerance, timing, available information, and doubts that learning or encouragement can resolve.", "when": "The person describes weighing whether the unexpected idea was worth it, or overcoming doubt through learning or encouragement before acting.", "example": "", "notwhen": "The decision turned on low stakes; use low cost of trying.", "evidence": [{"cite": "Davidsson (2015)", "title": "Entrepreneurial opportunities and the entrepreneurship nexus: A re-conceptualization", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2015.01.002", "page": 12, "text": "Subjective, perceptual, and individual-level, the construct has its most relevant lineage from psychology and its application in prior research on opportunity perception and evaluation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 11, "text": "However, through learning efforts and/or the encourage ment of others, one may be able to overcome doubt and act.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 2, "text": "During this process, the evaluation might be affected by the risk tolerance, uncertainty surrounding the information and evaluation, timing, and finding additional information, which will help the individual confirm or dispute the initial unexpected information.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-16", "group": "condition", "status": "reference", "label": "Effectual orientation", "description": "An effectual, means-driven way of thinking that embraces contingency, and a belief that one's actions can shape the environment, prepare the mind and lower the threshold for acting on the unexpected.", "when": "The person describes using surprises rather than avoiding them, starting from available means, or believing they can shape their surroundings.", "example": "", "notwhen": "The account is specifically about capping losses; use low cost of trying.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 6, "text": "Further, effectual thinking, that is, making decisions based on available means and prior knowledge, enables individuals to recognise the potential, connect the dots and seize emerging opportunities (Long et al., 2017).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 13, "text": "These points beg questions about the process of generating and acting on serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 17, "text": "They can also perceive the environment as mostly exogenous to their agency and therefore adversarial in nature.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "condition-18", "group": "condition", "status": "reference", "label": "Inexperience and outsider position", "description": "Being new to a field, an outsider to its norms and networks, or unaware of expert objections keeps people open and lets novel ideas survive. Authors differ: others see experience as enabling serendipity.", "when": "The person says being new, naive, an outsider or ignorant of conventional wisdom helped them spot or keep pursuing an unexpected idea.", "example": "", "notwhen": "The person credits their experience or prior knowledge; use experience and prior knowledge.", "evidence": [{"cite": "Denrell et al. (2019)", "title": "In Search of Behavioral Opportunities From Misattributions of Luck", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2017.0239", "page": 14, "text": "While interdependency barriers can be attenuated by being an outsider, o
