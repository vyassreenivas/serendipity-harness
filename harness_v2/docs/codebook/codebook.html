ork environment (Amabile & Gryskiewicz, 1987), scientists tended to overlook or not mention the significance of chance occurrences.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 14, "text": "Unsettled, emergent, contingent living forward contrasts sharply with our backward - oriented theoretical propositions that depict that living as settled, causally connected, and coherent after the fact (Weick, 1999: 135).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": 17, "text": "However, this is much less prevalent in the literature, most likely as a result of the retrospective bias that might largely affect the results in this particular stage of the process.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 2, "text": "While the significant contribution of serendipity to innovation is well-established through historical instances (e.g., Fink et al., 2017), the stories of serendipitous discoveries behind numerous innovative products and services often remain obscured until after achieving commercial success (Roberts, 1989; Thorson, 2017).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 20, "text": "In sum, the innovation journeys clearly were not linear, although they may appear so when viewed retrospectively or when interpreted through popular product development frameworks such as the stage gate model (Cooper 2001).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 18, "text": "Therefore, studies based on their stories after the fact may be subject to retrospective bias.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "account-08", "group": "account", "status": "core", "label": "Credited to luck", "description": "The founder explicitly explains an event or success as luck, chance or being in the right place at the right time.", "when": "The founder uses luck language.", "example": "'Honestly, we just got lucky.'", "notwhen": "The founder divides credit between luck and their own effort (account-09).", "evidence": [{"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 3, "text": "At first they may claim that it was pure luck, just being in the right place at the right time.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 2, "text": "For example, serendipity is often attributed to ‘‘dumb luck’’ or uncontrollable exogenous shocks (Go¨rling & Rehn, 2008; Lee et al., 2023).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 13, "text": "Serendipitous invention: I was always told that the best ideas were the ones that were invented by accident; however, I never understood that until I accidentally invented the Tuggo!", "close": false, "none": false, "chosen": "reading"}, {"cite": "Daniels and Wang (2019)", "title": "What do you think? Success: is it luck or is it hard work?", "venue": "Applied Economics Letters", "url": "https://doi.org/10.1080/13504851.2019.1593930", "page": 2, "text": "Success: is it luck or is it hard work?", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 8, "text": "For example, B.M. was in the right place at the right time.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 11, "text": "In all eight cases, the respondents indicated that they simply recognized the opportunity, almost by accident, as if they were surprised by the discovery.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 2, "text": "Such depictions within the strategy and entrepreneurship literature of serendipity as uncontrollable may explain the clear divergence between the lack of academic exploration on the topic of serendipity and the frequency and consistency with which practitioners credit it for their success (Busch 2020a; Gyori et al. 2019).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 9, "text": "All the participants saw serendipity as a business fact and believed that they needed to have an element of luck, chance or fortune to be successful.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "account-09", "group": "account", "status": "core", "label": "Part luck, part effort", "description": "The founder divides credit between luck and their own skill or hard work.", "when": "The founder says success was partly luck and partly effort, or that they made their own luck.", "example": "'Luck opened the door, but we worked hard to walk through it.'", "notwhen": "The founder credits luck alone (account-08).", "evidence": [{"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 39, "text": "38 The origins and development of new ventures can be traced to many incidents: some designed, others coincidental.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 12, "text": "Accident may be no use without effort and sagacity, but effort and sagacity are of little value without being complemented by fortunate accidents which can be leveraged — and these may be randomly distributed.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 21, "text": "Rather than such stories being perceived as luck or chance that could be frowned upon as unearned, crowdfunders appear to view such creations as the result of a ‘‘prepared mind’’ and reward those who are mindful enough to identify and capitalize on such opportunities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 2, "text": "Harley Davidson’slatter-day renaissance was three parts fluke to one part foresight (Holt, 2004).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 16, "text": "For those entrepreneurs that did believe luck played a role in their success, there were three distinctly different and nonexclusive ways luck operated.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Moral Implications of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 6, "text": "The moral policy makers take it as their concern to work out general answers to the problem of good and bad fortune; they attempt to reinterpret apparently undeserved luck as actually deserved.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 15, "text": "Pure luck and chance, such as being in the right place at the right time, play a role in opportunity recognition, but entrepreneurs maintain that they create their own luck, and their hard work leads them to be in the right place when the time comes.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "account-18", "group": "account", "status": "core", "label": "Only clear in hindsight", "description": "The founder says the event seemed minor at the time and only later proved to be a turning point.", "when": "The founder describes something that seemed small or unimportant then but crucial now.", "example": "'I almost didn't go to that meetup.'", "notwhen": "A setback first seen as bad luck was reinterpreted; if nothing fits, MIS-ACC.", "evidence": [{"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 18, "text": "When you are going through it, you don’t realize it, you can only realize it when you look back.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 2, "text": "By definition, you cannot know when you meet someone today where that person will land tomorrow.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 18, "text": "Ultimately this proved to be a fortuitous choice.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "Importantly, critical events can only be identified retrospectively (Mertova and Webster, 2019).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 20, "text": "Sometimes you leave an interview feeling like it wasn’t great because it was difficult or slow, but later you realize it provided crucial information.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Kirtley and O'Mahony (2023)", "title": "What is a pivot? Explaining when and how entrepreneurial firms decide to make strategic change and pivot", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3131", "page": 26, "text": "Our informants used the term only to refer to a strategy transition in retrospect.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "account-02", "group": "account", "status": "reference", "label": "Failed chance leads go untold", "description": "Serendipity stories are rebuilt backwards from successes. Accidents and chance leads that went nowhere, and failed attempts along the way, drop out of the telling.", "when": "The account presents only the chance event that worked, or the person acknowledges that other accidents, failed attempts or unpursued leads are not usually mentioned.", "example": "", "notwhen": "Use 'Chance airbrushed into a planned story' when chance itself is removed. Here chance stays in the story, but only the successful instances are told.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 186, "text": "We see that, while all noticed accidents result in an updated epistemic state, serendipity arises when that disruption consciously leads to novelty or discovery through action.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 3, "text": "Therefore, whether they obtained the finding as intended or by chance may affect the likelihood of the eventual publication of the finding.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-03", "group": "account", "status": "reference", "label": "Chance inflated or dramatised", "description": "In retrospect, people make a story sound more serendipitous than it was, to convey excitement or significance or to make a good story. Such stories can become legends or myths. Authors note that retrospective accounts can either inflate or erase chance; this code covers inflation.", "when": "The person tells a dramatised, legendary or embellished chance story, especially for an audience, or the story seems built after the fact around a chance turning point.", "example": "", "notwhen": "Use 'Chance story hides prior groundwork' when the main point is that preparation or effort behind the event is left out, rather than that the chance element is exaggerated.", "evidence": [{"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 14, "text": "The serendipity of it can easily become underestimated and even denied or overestimated and even invented.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 1, "text": "Serendipity is a value-laden concept, and has been considered both to depreciate and enhance a scientist’s achievement, leading to accounts in which the role of serendipity in a discovery is either under or overrated.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 32, "text": "In fact, actual and rhetorical serendipity might differ: social actors might make stories more serendipity- sounding to make sense of their significance or to present them as more exciting than they are.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 15, "text": "Fleming's chance observation, in September 1928, rein forced a similar observation made by him in 1919, when suffering from a bad cold he had used his own mucus to grow a culture.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 9, "text": "This is to say, that the concept of serendipity may sometimes be a useful tool for helping us generate good entrepreneurial stories out of vaguely understood, highly complex situations.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-04", "group": "account", "status": "reference", "label": "Chance story hides prior groundwork", "description": "The account credits a single lucky moment or an effortless tip, while long prior work, search, background interests or problem framing that made the discovery likely stay hidden. The search and the result appear immediately linked.", "when": "The person tells of a lucky, effortless or obvious-in-hindsight discovery, while the account reveals earlier groundwork, an existing problem or need, a background interest, or effort and expertise behind it.", "example": "", "notwhen": "Use 'Chance inflated or dramatised' when the story exaggerates or invents chance without hiding identifiable prior work.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 202, "text": "Roberts relies in his account entirely on Compere’s, as he cites the following passage (p. 20): Jenner did not discover his vaccine as a result of long and arduous work in a laboratory.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 14, "text": "Rather, the seeds of discovery were brewing long before the chance observations credited with innovations.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 4, "text": "Rather, the seeds of discovery were brewing long before the chance observations were credited with innovations.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 15, "text": "The reasons for lucky encounters or observations, from our perspective, then have to do with the priors—a specified search image (related to a function or formulated problem) that scientific and economic actors carry in their heads prior to search.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity in the Humanities. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "Serendipity magically collapses the time frame of this process: In the narrative of serendipitous discovery, the search (or research) and the objet trouv ´ee appear immediately linked.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 9, "text": "The way we treat latent questions as either having had ‘ade fined problem in mind ’ or ‘searching with no particular problem in mind ’, depends on the investigator’s work on antecedent problems.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-05", "group": "account", "status": "reference", "label": "Lucky success credited to skill", "description": "After a success, the person explains it mainly by their own capability, strategy, foresight, alertness or distinctive history. The role of chance and early lucky breaks is played down or left out.", "when": "The narrator credits success wholly or mainly to skill, vision, competence or something special in the venture's history, while the events described point to luck. This includes holding up a run of success as proof of superiority.", "example": "", "notwhen": "Use 'Luck framed as earned or deserved' when luck is acknowledged but presented as merited. Use 'Claimed hunch or intuition' when success is credited specifically to gut feeling.", "evidence": [{"cite": "Denrell (2004)", "title": "Random Walks and Sustained Competitive Advantage", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.1030.0143", "page": 13, "text": "Underestimation of the role of chance also makes it difficult for individuals to draw valid lessons from history.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 14, "text": "All research is a voyage to the edge of the unknown, and who can say what discoveries will be made there, by scientists endowed with training and skill and imagination—and blessed by happy chance?", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell and March (2001)", "title": "Adaptation as Information Restriction: The Hot Stove Effect", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.12.5.523.10092", "page": 14, "text": "Because capabilities can be imagined to transfer to other alternatives, success on one alternative tends to inflate expectations of success on other alternatives.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2012)", "title": "Inferring superior capabilities from sustained superior performance: A Bayesian analysis", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.2001", "page": 2, "text": "Our work has implications for the origins of competitive advantages and for organization learning in strategy research.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2015)", "title": "Perspective—Chance Explanations in the Management Sciences", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0946", "page": 16, "text": "For example, when increasing returns or social influence can significantly reinforce initial lucky breaks, higher performance may not be a signal of higher skill.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2019)", "title": "In Search of Behavioral Opportunities From Misattributions of Luck", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2017.0239", "page": 1, "text": "The implication is that the way people mistake luck for skill is predictable and that managers can be rewarded (blamed) for good (bad) luck.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 17, "text": "As a result, people often overestimate the role of skill and underestimate the role of luck in their counterfactual imaginations, mistaking luck for skill.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and Tsay (2023)", "title": "A normative theory of luck", "venue": "Frontiers in Psychology", "url": "https://doi.org/10.3389/fpsyg.2023.1157527", "page": 1, "text": "KEYWORDS luck, chance models, attribution biases, behavioral strategy, the Carnegie school, Matthew effect, simulation Introduction Success attracts our attention.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 14, "text": "The caller who gets through but provides the wrong an swer cannot be described as exercising entrepreneurial alertness.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": 11, "text": "On the other hand, these firms might also have been lucky.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell (2003)", "title": "Vicarious Learning, Undersampling of Failure, and the Myths of Management", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.14.2.227.15164", "page": 13, "text": "One can add that the difficulty of evaluating the risk of a strategy will be aggravated by the tendency for individuals to minimize \"chance\" as an explanation for success.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-06", "group": "account", "status": "reference", "label": "Claimed hunch or intuition", "description": "Afterwards the person says they had a hunch, gut feeling or conviction that led them to the right choice. Authors note such claims cannot be verified and may disguise a chance hit.", "when": "The person says they 'knew all along', had a hunch before the unexpected event, or succeeded through intuition or single-minded conviction rather than analysis.", "example": "", "notwhen": "Use 'Mystical or fated explanation' when the instinct is presented as uncanny or inexplicable, like a sixth sense, rather than as personal intuition.", "evidence": [{"cite": "Denrell (2003)", "title": "Vicarious Learning, Undersampling of Failure, and the Myths of Management", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.14.2.227.15164", "page": 13, "text": "Thus, the top performers will seem to have acted on intuition.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 9, "text": "Such notions are impossible to verify, akin to the lottery winner who claims that she ‘knew all along ’ that she was going to win.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-07", "group": "account", "status": "reference", "label": "Skill for successes, bad luck for failures", "description": "The person credits successes to their own skill, instinct or providence and blames failures on bad luck, other people or outside factors.", "when": "Within the same account, good outcomes are credited to the self or to providence and bad outcomes to chance or to others.", "example": "", "notwhen": "Use 'Lucky success credited to skill' when only successes are discussed and there is no shifting of blame for failures.", "evidence": [{"cite": "Giustiniano et al. (2016)", "title": "Organizational zemblanity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2015.12.001", "page": 7, "text": "It was rather my instinct, my skills, the ability to know the sea and suddenly change direction ” [C.050712.4].", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 7, "text": "For example, when evaluating own performances, self-serving bias suggests that people tend to attribute their successes to skill or effort and consider failures to be bad luck (Miller & Ross, 1975).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-10", "group": "account", "status": "reference", "label": "Luck framed as earned or deserved", "description": "The person acknowledges good luck but defends it as earned, deserved or the reward of preparation and effort. They may balance it against past misfortune, or ask whether they deserved it.", "when": "The narrator insists a lucky outcome was earned, stresses the striving that the chance event multiplied, says chance comes only to the deserving, points to earlier bad luck as making good luck due, or justifies a lucky find to peers or stakeholders.", "example": "", "notwhen": "Use 'Lucky success credited to skill' when luck is not acknowledged at all.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 4, "text": "And is, therefore, even unexpected good or ill luck mysteriously deserved?", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 11, "text": "/C116 /C97/C98/C111/C117/C116 /C117/C115/C101/C102/C117/C108 /C119/C101/C101/C100 /C97/C110/C100 /C115/C107/C117/C110/C107 /C119/C111/C114/C107 /C116/C121/C112/C101 /C111/C102 /C105/C110/C116/C101/C114/C110/C97/C108 /C99/C111/C114/C112/C111/C114/C97/C116/C101 /C118/C101/C110/C116/C117/C114/C105/C110/C103 /C97/C99/C116/C105/C118/C105/C116/C105/C101/C115/C46 /C84/C111 /C112/C117/C116 /C116/C104/C101 /C112/C114/C111/C97/C99/C116/C105/C118/C101 /C112/C101/C114/C115/C112/C101/C99/C116/C105/C118/C101 /C105/C110/C116/C111 /C101/C120/C116/C114/C101/C109/C101/C44 /C108/C117/C99/C107 /C105/C115 /C99/C114/C101/C97/C116/C101/C100/C46 /C82/C101/C102/C101/C114/C101/C110/C99/C101/C115 /C65/C110/C100/C114/C101/C119/C115/C44 /C75/C46 /C40._/C49/C57/C55/C49/C41/C44/C84/C104/C101 /C67/C111/C110/C99/C101/C112/C116 /C111/C102 /C67/C111/C114/C112/C111/C114/C97/C116/C101 /C83/C116/C114/C97/C116/C101/C103/C121/C44 /C72/C111/C109/C101/C119/C111/C111/C100/C44 /C73/C114/C119/C105/C110/C44 /C73/C76/C46 /C66/C97/C114/C110/C101/C121/C44 /C74/C46/C66/C46 /C40._/C49/C57/C56/C54/C41/C44 /C96/C96/C83/C116/C114/C97/C116/C101/C103/C105/C99 /C102/C97/C99/C116/C111/C114 /C109/C97/C114/C107/C101/C116/C115/C58 /C101/C120", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-11", "group": "account", "status": "reference", "label": "Luck as happening to me versus achieved by me", "description": "The person frames a chance discovery either as a windfall that passively happened to them or as something they actively accomplished through alertness, effort or acting on contingency. They may also waver between the two.", "when": "The account shows whether a lucky find is told as an unearned gift or windfall, or as the product of the person's own alertness, imagination and action. This includes separating credit for planned results from credit for surprises.", "example": "", "notwhen": "Use 'Luck framed as earned or deserved' when the person is defending the legitimacy of the luck rather than describing their own role in bringing the find about.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Dictionaries and Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 15, "text": "Another specialized dictionary that includes serendipity has been put together by Eric Partridge, the well-known lexicographer with something of a penchant for the byroads of lexicography.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 1, "text": "Organizational researchers have paid little attention to this observation, ignoring processes such as luck, “happy accidents” ( Lindsay, 2013), chance, and serendipity as elements in organizing.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 11, "text": "How did the vision get embodied in particular project targets over time? • What is the role of contingency, as opposed to luck, in all of this?", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-12", "group": "account", "status": "reference", "label": "Modest credit to luck", "description": "The person attributes their own success to luck in a self-deprecating way. This may be genuine belief or a narrative device to appear humble to an audience.", "when": "The person says they were 'just lucky' about their own achievement, especially in a way that downplays their own role or talent, or seems aimed at investors or other listeners.", "example": "", "notwhen": "Use 'Outcome explained as luck' when luck is credited plainly, without a self-effacing tone.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 16, "text": "After all, an investigator is not taking undue credit to himself when he calls attention to the fact that results which he has obtained in his researches have depended on a fortuitous incident and not on his own intelligence and insight!", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 26, "text": "This finding suggests that entrepreneurs could be referencing luck based on a real belief in its effects or might be simply utilizing luck as a narrative device to project humility.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-13", "group": "account", "status": "reference", "label": "Chance seen as discrediting", "description": "Chance-based success or a winding, unplanned path is treated as a sign of undeserved reward, passivity, lack of strategy or incompetence. This can lead the person to worry that it lessens their credit, or to apologise for it.", "when": "The person or others treat accidental success as less worthy ('anybody could have done that'), worry that calling something luck reduces their credit, apologise for or justify a nonlinear path, or report being seen as lacking strategy for chasing opportunities.", "example": "", "notwhen": "Use 'Luck framed as earned or deserved' when the person actively defends the luck as merited, rather than describing the stigma itself.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 15, "text": "Luck or chance, according to these formulations, does not favor people at random; rather, it is prepared minds who are able to benefit from luck, and to preparedness may be linked such qualities as alertness, flexibility, courage, and assiduity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 19, "text": "As Copeland recently wrote, serendipity is discovery that happens “at the intersection of chance and wisdom” (Copeland 2019).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 5, "text": "But a simple-rules strategy and its underlying logic of pursuing opportunities are harder to see than traditional approaches.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 2, "text": "Let's Teach Our Clients That Unplanned Events Are a Normal and Expected Part of the Career Development Process There is no need for a client to feel guilt ridden over a nonlinear career path.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-14", "group": "account", "status": "reference", "label": "Natural knack for lucky finds", "description": "The person presents themselves as someone with an innate gift, or a career marked by repeated valuable unexpected finds, and takes pride in the aura of good fortune.", "when": "The person says they have a knack, gift or natural talent for lucky finds, or describes their career or method as a series of valuable unsought discoveries in a way that presents them as specially fortunate.", "example": "", "notwhen": "Use 'Mystical or fated explanation' when the finds are credited to outside forces or an inexplicable sixth sense rather than to a personal trait.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Stock Responses to Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "“Vebna,” a contributor to Notes and Queries in the 1880s, calls serendipity “a gift, or good fortune, or whatever else it may be called,” which aided him in the search for a certain quotation from Cicero.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-15", "group": "account", "status": "reference", "label": "Mystical or fated explanation", "description": "A fortunate coincidence is explained by fate, providence, destiny, a guiding force or an inexplicable sixth sense. This avoids deciding whether skill or plain chance was responsible.", "when": "The person invokes fate, destiny, mysterious forces, an uncanny instinct, a 'radar' or premonition to explain an opportunity or repeated lucky finds.", "example": "", "notwhen": "Use 'Outcome explained as luck' when plain chance is invoked without any suggestion of mysterious or guiding forces.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 19, "text": "Whether it is due primarily to chance, to sagacity, to a “sixth sense,” or to providence, was not, ultimately, of very great concern to them.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-16", "group": "account", "status": "reference", "label": "Eureka moment and excited recall", "description": "The discovery is told as a sudden flash, an 'aha' or a 'click', or as sudden clarity after waiting. It is recalled vividly, with surprise and elation.", "when": "The person recounts a sudden moment of realisation, an instant fit with someone after which things started to roll, or a find told with marked excitement, vivid detail or a shift to positive feeling.", "example": "", "notwhen": "Use 'Serendipity as gradual build-up' when the discovery is told as unfolding over time through many moments.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 124, "text": "However, serendipity seems to rather entail overlap between the phenomenological and theoretical aspects of discovery—cases of serendipity, as they are told, generally include a response of surprise, an ‘aha’, or even a ‘eureka’ in the moment.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 5, "text": "These moments sometimes lead to discoveries with human and commercial value, but they can still be perceived as mysterious, sudden acts of awareness, or instant revelations, ‘‘Eureka’’ or ‘‘Aha! moments’’.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 14, "text": "And suddenly, things started to roll.” 726 ENTREPRENEURSHIP THEORY and PRACTICE", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 8, "text": "I think it’s a matter of having creative people in the company and letting them work on things that they think will be important for the future.’ (Dippon)", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-17", "group": "account", "status": "reference", "label": "Serendipity as gradual build-up", "description": "Serendipity is told not as a single flash but as a series of accidents, a slow crescendo, or a long and partly controlled exploration over an extended period.", "when": "The person describes the discovery as building up gradually through many chance moments or a protracted, effortful exploration.", "example": "", "notwhen": "Use 'Eureka moment and excited recall' when a single sudden insight is described.", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 8, "text": "Serendipity may depend on the window of analysis.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 7, "text": "As Silver recounted, there was no one moment of serendipity in the Post-it notes case, but instead a series of moments,“a slow crescendo of things, which is typical of the discovery process.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 13, "text": "Rather, in our context, serendipity resembles something more closely related to a protracted, partially controlled process with high uncertainty. 5.1.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-19", "group": "account", "status": "reference", "label": "Setback reframed as fortunate", "description": "An event first seen as bad luck, a mistake or a failure is later retold as good luck, a learning opportunity, or a solution looking for a problem. Authors differ: some call this repackaging misfortune, others defend it as genuine reappraisal.", "when": "The person narrates a setback, mistake or failed result that in hindsight they describe as lucky, as something they learned from or that made them stronger, or as useful but with an unknown use.", "example": "", "notwhen": "Use 'Significance seen only in hindsight' when the earlier event was seen as trivial, not as bad.", "evidence": [{"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 29, "text": "This evaluative status can change over time, which means that a new venture that is able to capitalize on a luck event initially classified as “bad luck” might later reframe that event as good luck.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 7, "text": "C44 /C67/C111/C99/C97/C45/C67/C111/C108/C97 /C104/C97/C100 /C116/C111 /C112/C117/C116 /C116/C104/C101 /C111/C108/C100 /C102/C111/C114/C109/C117/C108/C97 /C98/C97/C99/C107 /C116/C111 /C116/C104/C101 /C109/C97/C114/C107/C101/C116 /C97/C115 /C116/C104/C101 /C67/C108/C97/C115/C115/C105/C99/C97/C108/C46 /C84/C104/C101/C121 /C119/C101/C114/C101 /C108/C117/C99/C107/C121 /C116/C104/C97/C116 /C116/C104/C101 /C99/C117/C115/C116/C111/C109/C101/C114/C115 /C104/C97/C100 /C97 /C115/C116/C105/C99/C107/C121 /C116/C97/C115/C116/C101/C59 /C111/C116/C104/C101/C114/C119/C105/C115/C101/C44 /C116/C104/C101 /C114/C101/C105/C110/C116/C114/C111/C100/C117/C99/C101/C100 /C67/C111/C99/C97/C45/C67/C111/C108/C97 /C67/C108/C97/C115/C115/C105/C99/C97/C108 /C119/C111/C117/C108/C100 /C116/C97/C107/C101 /C97 /C109/C97/C106/C111/C114 /C100/C105/C112/C44 /C106/C101/C111/C112/C97/C114/C100/C105/C122/C105/C110/C103 /C67/C111/C99/C97/C45/C67/C111/C108/C97/C39/C115 /C108/C101/C97/C100/C101/C114/C115/C104/C105/C112 /C105/C110 /C116/C104/C101 /C115/C111/C102/C116 /C100/C114/C105/C110/C107 /C105/C110/C100/C117/C115/C116/C114/C121/C46 /C82/C101/C116/C114/C111/C115/C112/C101/C99/C116/C105/C118/C101/C108/C121/C44 /C116/C104/C10", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Soto-Simeone et al. (2021)", "title": "The role of skill versus luck in new venture survival", "venue": "International Journal of Management Reviews", "url": "https://doi.org/10.1111/ijmr.12262", "page": 5, "text": "Another shortcoming of the gambling analogy is that it misrepresents the effects of (entrepreneurial) learning.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 6, "text": "When asked if he considered his experiment a failure, Silver replied that his discovery was a “solution looking for a problem ” (quoted in Lindahl, 1988, p. 14).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-20", "group": "account", "status": "reference", "label": "Making meaning of surprises", "description": "The person works out the meaning of events while acting or afterwards, retells the past in a new light to fit changed circumstances, and constructs surprises either as meaningful and happening for a reason or as random noise.", "when": "The account shows goals or meaning becoming clear only during or after action, the past being renarrated to justify a new direction, or a surprise being framed as either a meaningful lesson or a random deviation.", "example": "", "notwhen": "Use 'Setback reframed as fortunate' when what is specifically reinterpreted is bad luck turned into good luck.", "evidence": [{"cite": "Cohen et al. (1972)", "title": "A Garbage Can Model of Organizational Choice", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2392088", "page": 3, "text": "Such a view of organizational choice focuses attention on the way the meaning of a choice changes over time.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 17, "text": "Crucially, they constructed this deviation as meaningful, as something that happened for a reason, and that moreover has the potential to advance their development process (deviation enacted as a learning opportunity).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2014)", "title": "Entrepreneurial Storytelling, Future Expectations, and the Paradox of Legitimacy", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0915", "page": 12, "text": "Relational ties to social and material elements that form a story are replotted and reconfigured through ongoing storytelling to generate new meaning as to what has transpired and what might now be possible.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-21", "group": "account", "status": "reference", "label": "Would not have happened otherwise", "description": "The person reflects counterfactually that the venture or connection would not have happened without the chance event, for example without being co-located, or because they had never thought of the idea.", "when": "The account asks 'would it have happened if…', credits the connection to proximity or membership, or says they would otherwise be doing something else.", "example": "", "notwhen": "Use 'Venture just happened to me' when the emphasis is on never having intended to found a business rather than on the event being necessary.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 10, "text": "Sarah was aware of the failure rate among startups but felt Finland’s social safety net allowed her to take the risk without “gambling her life”.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 20, "text": "Would that have happened if my friend was not a member?", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-22", "group": "account", "status": "reference", "label": "Venture just happened to me", "description": "Founders narrate the founding as unintended, as something that happened to them or as the opportunity finding them. They express surprise at having become an entrepreneur at all.", "when": "The person says they never intended to start a business, never saw themselves as an entrepreneur, or that 'it found us' or 'it just happened'.", "example": "", "notwhen": "Use 'Luck as happening to me versus achieved by me' when the framing concerns a particular discovery rather than the founding and the person's identity as a founder.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 16, "text": "Reflecting on this development, Cobb remarked: With our optical lighting film we never found its niche, the niche found us.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 10, "text": "Despite this, she repeatedly stated during the interview that she never imagined joining a startup team herself and becoming an entrepreneur.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 6, "text": "In these cases, the founders’ descriptions of the founding process suggest strongly that design and execution were experienced as largely indistinguishable, embodying a substantive convergence of design and execution.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-23", "group": "account", "status": "reference", "label": "The right moment", "description": "Success is narrated in terms of timing: the right opportunity appearing when the time was right, or choosing the moment when circumstances aligned and 'the time was ripe'.", "when": "The person explains a decision, launch or opportunity by waiting for the right moment, ripeness or the alignment of circumstances.", "example": "", "notwhen": "Use 'Outcome explained as luck' when 'right place, right time' is used as a luck idiom rather than as an account of timing and waiting.", "evidence": [{"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 11, "text": "Archimedean and Columbian serendipity involve seeking specific opportunities, while Galilean serendipity involves finding an opportunity even though you are not looking for one.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 18, "text": "You know, there is a right moment for everything.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-24", "group": "account", "status": "reference", "label": "Cannot trace where it came from", "description": "Because of delays between trigger and insight, people cannot recall or properly attribute the original source of an idea. They may also acknowledge debts to chance conversations or readings that they cannot reconstruct.", "when": "The person cannot pinpoint or date where an idea or connection came from, gives vague origins, or says chance encounters shaped things in ways they cannot fully reconstruct.", "example": "", "notwhen": "Use 'Chance story hides prior groundwork' when a specific origin is given but earlier work is omitted.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 7, "text": "I cannot put a definite date on the serendipitous moment of my own first encounter with the word, since one doesn’t ordinarily record such an episode for future reference, especially when one fails to keep a journal or a diary.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 11, "text": "Indeed, this delay between the triggering event and the related bisociation can make it difficult for an actor to recall and properly attribute the original source of the creative observation (Stock-Homburg et al. 2021).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 93, "text": "Indeed, this delay between the triggering event and the related bisociation can make it difficult for an actor to recall and properly attribute the original source of the creative observation (Stock-Homburg et al. 2021).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-25", "group": "account", "status": "reference", "label": "Under my very nose", "description": "The person describes the discovery as surprise at their own earlier ignorance: what they found had been available all along.", "when": "The person says 'it was right in front of me' or expresses surprise at not having seen it before.", "example": "", "notwhen": "Use 'Missed earlier chances' when the person regrets a specific delayed encounter rather than an overlooked opportunity.", "evidence": [{"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 14, "text": "Each such discovery will be accompanied by a sense of surprise (at one's earlier unaccountable ignorance).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-26", "group": "account", "status": "reference", "label": "Missed earlier chances", "description": "Looking back, the person regrets that a key encounter did not happen sooner, although the chance had been there many times.", "when": "The narrator says they passed the key person or chance many times before acting and wishes it had happened earlier.", "example": "", "notwhen": "Use 'Under my very nose' when the focus is on surprise at an overlooked opportunity rather than regret about lost time.", "evidence": [{"cite": "Eagle (2004)", "title": "Can Serendipity Be Planned", "venue": "", "url": "", "page": 2, "text": "10 MIT SLOAN MANAGEMENT REVIEWFALL 2004 I I had probably greeted Tom in passing more than 50 times before we actually met.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-27", "group": "account", "status": "reference", "label": "Official versus personal versions", "description": "The same venture story exists in different versions. Formal, official or outside analysts' accounts streamline events and expurgate accidents, while insiders' informal retellings restore the miscalculations, surprises and luck.", "when": "The person contrasts their own insider account with an official, formal or analyst version, or recounts chance episodes absent from the official story, or notes that formal accounts omit the accidents.", "example": "", "notwhen": "Use 'Chance airbrushed into a planned story' when there is a single account that smooths chance out, with no contrast between versions.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 43, "text": "The observation about the public record of science being misleading with regard to the actual course of the inquiry had by then manifestly become haunting.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 4, "text": "When “competing versions of the truth” emerge, “what matters” may become more important than “what [really] happened” ( De Rond, 2012, p. 77).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg et al. (1996)", "title": "CMR Forum: The “Honda Effect” Revisited", "venue": "California Management Review", "url": "https://doi.org/10.2307/41165855", "page": 1, "text": "Then we reprint some correspondence from the Strategic Management Journal, first a comment of mine that uses the Honda story.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-28", "group": "account", "status": "reference", "label": "Chance stories as shared lore", "description": "People enjoy telling and retelling serendipity tales, and one tale prompts another. Within organisations, stories of stumbling onto discoveries become memory that inspires and legitimises new pursuits.", "when": "The account retells accidental-discovery stories as models for how innovation happens, as company lore, or as tales worth telling, or one chance story prompts another.", "example": "", "notwhen": "Use 'Serendipity used to justify exploration' when the stories are aimed at investors or sponsors to justify spending.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 22, "text": "The most apparent way innovation narratives help activate an organizational memory is through the use of retrospective narratives.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 22, "text": "For instance, companies such as 3M have a number of narratives of innovation that serve as generative memories and spawn additional innovations.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Stock Responses to Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 25, "text": "Encountering the word serendipity may serve as stimulus for describing such happy accidental discoveries.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-29", "group": "account", "status": "reference", "label": "Serendipity used to justify exploration", "description": "Firms and researchers invoke chance-discovery stories to investors, sponsors or the public as proof that unplanned exploration pays off. They present leaving room for accidents as deliberate strategy.", "when": "The person tells investors or stakeholders that accidental discoveries are a route to returns, or uses chance stories to justify exploratory spending.", "example": "", "notwhen": "Use 'Chance stories as shared lore' when stories circulate internally as inspiration without being used to persuade funders.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 23, "text": "Soon after Cannon’s article on “The Role of Chance in Discovery” appeared, the Industrial Bulletin of Arthur D.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-30", "group": "account", "status": "reference", "label": "Credit given to a lone hero", "description": "A collective, partly lucky process is retold as the merit or insight of one individual founder or discoverer.", "when": "Credit for a breakthrough or success goes to one person, while the narrative reveals multiple contributors, interactions or luck.", "example": "", "notwhen": "Use 'Lucky success credited to skill' when the issue is crediting capability over chance without collapsing a group's contribution into one person.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 204, "text": "In many instances, in which individuals are singled out to be attributed the status of the sole discoverer, this represents the forceful reduction of the historical complexities of the process of discovery (Schaffer 1986).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Hargadon and Bechky (2006)", "title": "When Collections of Creatives Become Creative Collectives: A Field Study of Problem Solving at Work", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1060.0200", "page": 16, "text": "In other cases, it provides a language that masks (to participants and observers alike) what is a collective process.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-31", "group": "account", "status": "reference", "label": "Same event, different framings", "description": "Whether an event is told as serendipity depends on the narrator's perspective, emphasis and values. It can be serendipitous for one party but goal-directed for another, or read as accident by some and as plan by others.", "when": "Different people describe the same event as accident versus plan, one party deliberately sought what the other experienced as unexpected, or a narrator's interpretation of chance plainly reflects their wider values.", "example": "", "notwhen": "Use 'Official versus personal versions' when the contrast is between a formal or outside account and an insider's account of the same venture.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 10, "text": "We find people in different social circumstances, and even within the same social circumstances, giving different answers to these questions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 229, "text": "The experience is likely not serendipity on his end, I can only guess that from his perspective it was a more straightforward turn of events.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-32", "group": "account", "status": "reference", "label": "Opportunity told as discovered or created", "description": "After the fact, an opportunity can be told as found because it was always there, or as made through the person's own framing and effort, or as both.", "when": "The founder narrates the opportunity as having been there all along, flowing logically from an existing industry, or as both found and made through their own framing.", "example": "", "notwhen": "Use 'Luck as happening to me versus achieved by me' when the framing concerns the person's role in a lucky event rather than the nature of the opportunity itself.", "evidence": [{"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 2, "text": "Also, it will always be possible after an opportunity is formed to describe the actions of a particular entrepreneur in both ‘discovery’ and ‘creation’ terms.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 15, "text": "Thus, the underlying resources that emerge from search can be thought about as both discovered and constructed or created (e.g., in combination with other assets).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "account-33", "group": "account", "status": "reference", "label": "Visionary versus scientist self-image", "description": "Founders narrate themselves either as visionaries who hold to the idea or as scientists who test it.", "when": "The founder describes their stance toward the idea as visionary conviction or as experimental testing.", "example": "", "notwhen": "", "evidence": [{"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 16, "text": "Thus, in light of the restricted idea work and their intact psychological ownership, these entrepreneurs rejected the scientific founder role and increased their identification with the visionary founder role.", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "account-34", "group": "account", "status": "reference", "label": "Idea described as sparked or born", "description": "Founders describe the origin of their idea as a spark or birth, a sudden moment rather than a search.", "when": "The founder narrates the idea as sparked, born or arriving at a moment.", "example": "", "notwhen": "", "evidence": [{"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 8, "text": "It had to be an idea I could call my own.", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "account-35", "group": "account", "status": "reference", "label": "Change described as organic", "description": "People describe the change as organic, as something that just grew, rather than as planned.", "when": "The founder says the venture or change 'just grew' or was 'organic'.", "example": "", "notwhen": "", "evidence": [{"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 17, "text": "Informants from Mission Church described the period following the initial small change with statements such as, \"Church members began the [breakfasts] five years ago and everything just grew and blossomed from there.\"", "close": false, "none": false, "chosen": "fixed code"}], "note": "New: from a paper read after the draft."}, {"id": "ANO-TYP", "group": "anomaly", "status": "core", "label": "Anomaly: type", "description": "", "when": "The episode is serendipity, but no type code describes it", "example": "", "notwhen": "A type fits roughly: use it and note the doubt", "evidence": [], "note": "Anomaly code, fixed in Stage 1. Use it when no core code in a group fits."}, {"id": "ANO-RIV", "group": "anomaly", "status": "core", "label": "Anomaly: rival", "description": "", "when": "The account fits another explanation that is not a rival code", "example": "", "notwhen": "The founder only denies chance: that is account", "evidence": [], "note": "Anomaly code, fixed in Stage 1. Use it when no core code in a group fits."}, {"id": "ANO-TRG", "group": "anomaly", "status": "core", "label": "Anomaly: trigger", "description": "", "when": "Something unexpected started it, but no trigger code names that kind of event", "example": "", "notwhen": "The trigger is unclear: leave trigger blank", "evidence": [], "note": "Anomaly code, fixed in Stage 1. Use it when no core code in a group fits."}, {"id": "ANO-BKG", "group": "anomaly", "status": "core", "label": "Anomaly: background", "description": "", "when": "The founder brought something relevant that no background code covers", "example": "", "notwhen": "It is a circumstance, not something the founder had: that is condition", "evidence": [], "note": "Anomaly code, fixed in Stage 1. Use it when no core code in a group fits."}, {"id": "ANO-MEC", "group": "anomaly", "status": "core", "label": "Anomaly: mechanism", "description": "", "when": "The founder did something with the event that no mechanism code covers", "example": "", "notwhen": "", "evidence": [], "note": "Anomaly code, fixed in Stage 1. Use it when no core code in a group fits."}, {"id": "ANO-ROL", "group": "anomaly", "status": "core", "label": "Anomaly: role", "description": "", "when": "It played a part in the venture other than
