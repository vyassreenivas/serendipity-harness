periment the potential for a new product in a wholly different industry.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Serendipity as Ideology and Politics of Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 13, "text": "One of the chemists began to search for an insecticide.” In writing down the chemical formula of his 406th experiment, he noted that its chemical structure looked perfect for an insecticide.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 6, "text": "However, their mine turned out to produce anorthosite, a relatively soft mineral not suitable for such purposes.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-06", "group": "trigger", "status": "reference", "label": "By-product of pursuing another goal", "description": "While working toward one aim, often under a wrong hypothesis or none at all, the person comes upon an unintended side effect or finding that becomes the main product or a new direction. One author notes this kind of chance arises from the design of the person's own activity rather than from purely outside randomness.", "when": "The person describes looking for or developing X and encountering an unrelated, valuable Y along the way, such as a side effect in a trial or a strange material in an experiment.", "example": "", "notwhen": "The finding came from the original aim failing (use failure turned to another use) or from an error (use mistake code). If the person was browsing openly with no goal, use undirected browsing.", "evidence": [{"cite": "Merton and xt": "For instance, 3M’s Spence Silver recounted how he stumbled upon a strange new material when he was conducting an experiment (Lindahl, 1988).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 27, "text": "By contrast, the unanticipated side effects of sildenafil citrate surfaced in part as a result of research design; after all, toxicity trials tend to use men between the ages of 18 and 30, as did Pfizer’s clinical trials.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 11, "text": "The general value of this serendipitous discovery was then recognized by and acted upon by the patient’s doctor (Carruthers and Carruthers 1992, Coondoo and Sengupta 2015).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-07", "group": "trigger", "status": "reference", "label": "Unplanned action sets off a chain", "description": "A short-sighted, unplanned or one-off action or decision, not meant as a step toward an opportunity, starts a chain of reactions that leads the person to stumble into a venture direction or strategy.", "when": "The account describes an experiment, whim, ad hoc decision or myopic move that unexpectedly snowballed into the venture's direction or became a template for later activity.", "example": "", "notwhen": "A specific unexpected result or side effect was noticed and exploited (use by-product), or the action was a planned step toward an identified opportunity.", "evidence": [{"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formati g their own films, but together, and with a certain consistency.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 3, "text": "In discovery theory, competitive imperfections are assumed to arise exogenously, from changes in technology, consumer preferences, or some other attributes of the context within which an industry or market exists (Kirzner, 1973: 10).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 16, "text": "Reflecting on this development, Cobb remarked: With our optical lighting film we never found its niche, the niche found us.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 9, "text": "Either people acknowledge a third-person opportunity arising from a technological change or they do not.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 6, "text": "Such 'subconscious' strategies would probably be more difficult to change th!an those based on more conscious visions.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": " illips Petroleum happened to have a rig in the area at the time (Haigh, 2004).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 8, "text": "People discover things because they were lucky to be there when what they can see as/C212something/C213(rather than nothing) happened.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 4, "text": "”In traditional strategy, advantage comes from exploiting resources or stable market positions.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-15", "group": "trigger", "status": "reference", "label": "Reconnecting with a lapsed contact", "description": "A chance meeting or a mutual friend revives a dormant tie, such as an old classmate or former workmate, and that revived contact passes on crucial information or an opportunity.", "when": "The person describes running into or being put back in touch with someone they had lost contact with, who then supplied something important.", "example": "", "notwhen": "The person met someone new (use chance meeting with a person), or the contact was close and frequently seen.", "evidence": [{"cite": "Granovetter (1973)", "title": "The Strength of Weak Ties", "venue": "", "url": "", "page": 14, "text": "Had long information paths been involved, large numbers might have found out about any given job, and no particular tie would have been crucial.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-16", "group": "trigger", "status": "reference", "label": "Key person arrives at the right time", "description": "A badly needed person, such as a backer, team member, partner or supplier, comes into the venture unexpectedly at a crucial moment and helps turn it into a viable business.", "when": "The founder describes luckily coming across someone who 'clicked', backed the idea or filled a critical role just when needed, after which things started to move.", "example": "", "notwhen": "The emphasis is on the accidental circumstances of the meeting rather than the person's timely role in the venture (use chance meeting with a person), or the person was recruited through planned processes.", "evidence": [{"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 14, "text": "And suddenly, things started to roll.” 726 ENTREPRENEURSHIP THEORY and PRACTICE", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 8, "text": "/C109/C101/C114/C121 /C87/C97/C114/C100 /C98/C97/C110/C107/C114/C117/C112/C116/C99/C121 /C105/C110 /C116/C104/C101 /C49/C57/C57/C48/C115 /C112/C114/C111/C118/C105/C100/C101/C100 /C108/C117/C99/C107/C121 /C111/C112/C112/C111/C114/C116/C117/C110/C105/C116/C121 /C102/C111/C114 /C83/C101/C97/C114/C115 /C116/C111 /C101/C97/C115/C105/C108/C121 /C108/C117/C114/C101 /C105/C116/C115 /C101/C120/C101/C99/C117/C116/C105/C118/C101/C115/C46 /C68/C114/C101/C97/C109 /C101/C120/C112/C101/C100/C105/C116/C101/C114 /C65 /C102/C105/C114/C109 /C99/C97/C110 /C111/C102/C116/C101/C110 /C103/C97/C105/C110 /C97/C100/C118/C97/C110/C116/C97/C103/C101 /C102/C114/C111/C109 /C108/C117/C99/C107 /C116/C104/C114/C111/C117/C103/C104 /C117/C110/C101/C120/C112/C101/C99/C116/C101/C100 /C112/C114/C101/C115/C101/C110/C99/C101 /C111/C102 /C98/C97/C100/C108/C121 /C110/C101/C101/C100/C101/C100 /C104/C101/C108/C112 /C105/C110 /C115/C117/C112/C112/C108/C121/C44 /C99/C111/C109/C112/C108/C101/C109/C101/C110/C116/C97/C114/C121 /C112/C114/C111/C100/C117/C99/C116/C115/C44 /C111/C114 /C112/C97/C114/C116/C110/C101/C114/C115 /C102/C111/C114 /C99/C111/C108/C108/C101/C99/C116/C105/C118/C101 /C97/C99/C116/C105/C111/C110/C46 /C70/C111/C11", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 18, "text": "And then they also sent me to business school, an extreme level of privilege.” People For the entrepreneurs in our sample, “people” refers to the critical social and relational capital resources available to entrepreneurs prior to and throughout the venture creation process.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-19", "group": "trigger", "status": "reference", "label": "Tip-off or introduction from a third party", "description": "Someone outside the venture, or a change in the person's network, unexpectedly informs them of an opportunity, recommends them, or links them to a customer or partner.", "when": "The account describes another actor telling the founder about an opportunity, making a recommendation, or connecting them with a new contact without the founder seeking it.", "example": "", "notwhen": "The future partner approached the founder directly with an offer (use unsolicited offer or request), or the founder simply bumped into someone (use chance meeting with a person).", "evidence": [{"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 7, "text": "On the other hand, 15 of the 20 firms engaged in business following up an opportunity arising by chance, for instance via a contact established at a trade fair, or being contacted directly by the future business partner.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "In both the early and late internationalisation phases, serendipity can play a critical role and sometimes acts as an enabler of internationalisation (Khoury et al., 2021) or of the venture creation process itself ( Kimjeon and Davidsson, 2021 ).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-20", "group": "trigger", "status": "reference", "label": "Chance exposure to an outside idea or technology", "description": "While doing something else, the person happens upon an invention, technology, text, presentation, media item or sight from an unrelated setting, and sees how it connects to their own capabilities or a need.", "when": "The person describes coming across a patent, demo, talk, footnote, TV programme or an incidental scene that sparked an idea or a 'eureka' moment.", "example": "", "notwhen": "The person was deliberately searching for that technology, or was browsing open-endedly as an activity in itself (use undirected browsing).", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 16, "text": "Cobb recounted: Illustrative quotes Practices/Comments ‘One of the things that you often find about innovation is that it will spin off into something that you didn’t necessarily expect at the time, and which 10 years later, will be a bigger business than the original idea….", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 36, "text": "I found it in Hans Reichenbach’s Experience and Prediction.”44 That chance encounter with Fleck was of no small moment.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 11, "text": "Rather, each of the entrepreneurs heard about the technology from someone directly involved in its development, and recognized the opportunity immediately upon hearing about it.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 2, "text": "Sadow, now 85, had his eureka moment in 1970 as he lugged two heavy suitcases through an airport while returning from a family vacation in Aruba.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 2, "text": "We can \"give permission\" for any sequence of educational and occupational experiences—no need for anyone to apologize!", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 2, "text": "By chance, Earnshaw attended a presentation by Dekker and Mirny about their joint work on mitotic chromosomes, during which he became convinced that his lab could provide bench methods to improve Dekker and Mirny's computational models.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-21", "group": "trigger", "status": "reference", "label": "Undirected browsing", "description": "Wandering beyond a focused task, such as reading around, walking a trade show 'to see what is new' or exploring byways, exposes the person to chance finds, sometimes revealing a want they did not know they had.", "when": "The account describes open-ended browsing or exploration that produced an unexpected finding, often 'exactly what I wanted and had not been looking for'.", "example": "", "notwhen": "The person was pursuing a specific goal and found something else (use by-product), or met the item by chance without any browsing (use chance exposure to an outside idea or technology).", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 6, "text": "It was exactly what I wanted and had not been looking for. 2 Antiquarians are exempt from explaining too precisely why they want a certain item; hence, many odd and pleasant things come their way unexpectedly.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 2, "text": "To illustrate what we mean, consider a firm employee walking through a trade show “just to see what is new.” The employee encounters a booth offering new payrollprocessing software (a solution) that claims to address certain needs better than earlier software.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-22", "group": "trigger", "status": "reference", "label": "Stumbling on business information", "description": "The person comes across valuable business information, such as on competitors or the market, by chance or through unsystematic means rather than through deliberate analysis that others could also do.", "when": "A founder or manager describes encountering key information unexpectedly while not looking for it, or surprising information that prompted rethinking.", "example": "", "notwhen": "The information was feedback from customers or users about the venture's own offering (use unexpected market signal), or it came from a specific person's remark (use offhand remark or suggestion).", "evidence": [{"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": 10, "text": "Thus, only if the information was obtained through nonsystematic means can it give a firm expectational advantages.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 11, "text": "894 Entrepreneurship Theory and Practice 46(4)Busch and Barkema 11 Table 2.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 234, "text": "During the early 1990s, while conducting exploratory interviews with small business managers for my dissertation research, I discovered that many of them had stumbled upon crucial information for their businesses unexpectedly.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-23", "group": "trigger", "status": "reference", "label": "Gap left by others' errors or oversight", "description": "Earlier mistakes, ignorance or negligence by other market actors leave shortages, mismatches, price discrepancies or unserved needs that the alert person notices and exploits.", "when": "The person describes noticing a gap, price difference or need that others had failed to serve, or benefiting from a rival's oversight or ignorance.", "example": "", "notwhen": "The person discovers an error in their own plans through market feedback (use unexpected market signal).", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 5, "text": "15 /C99/C111/C109/C112/C108/C101/C109/C101/C110/C116/C111/C114 /C111/C114 /C115/C117/C98/C115/C116/C105/C116/C117/C116/C111/C114 /C111/C102 /C116/C104/C101 /C102/C111/C99/C97/C108 /C102/C105/C114/C109/C39/C115 /C115/C117/C112/C112/C108/C105/C101/C114/C44 /C99/C111/C117/C108/C100 /C98/C114/C105/C110/C103 /C110/C101/C119 /C111/C112/C112/C111/C114/C116/C117/C110/C105/C116/C121 /C116/C111 /C116/C104/C101 /C102/C111/C99/C97/C108 /C102/C105/C114/C109 /C97/C110/C100 /C101/C110/C104/C97/C110/C99/C101 /C105/C116/C115 /C98/C97/C114/C103/C97/C105/C110/C105/C110/C103 /C112/C111/C115/C105/C116/C105/C111/C110/C46 /C80/C114/C105/C118/C97/C116/C101 /C111/C114 /C97/C115/C121/C109/C109/C101/C116/C114/C105/C99 /C105/C110/C102/C111/C114/C109/C97/C116/C105/C111/C110 /C73/C110/C102/C111/C114/C109/C97/C116/C105/C111/C110 /C99/C97/C110 /C109/C97/C107/C101 /C111/C114 /C98/C114/C101/C97/C107 /C97 /C102/C105/C114/C109/C46 /C65/C115/C121/C109/C109/C101/C116/C114/C121 /C105/C110 /C105/C110/C102/C111/C114/C109/C97/C116/C105/C111/C110 /C97/C109/C111/C110/C103 /C114/C105/C118/C97/C108/C105/C110/C103 /C112/C97/C114/C116/C105/C101/C115 /C99/C111/C117/C108/C100 /C114/C101/C110/C100/C101/C114 /C97 /C99/C101/C114/C116", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 12, "text": "The daring, alert entrepreneur discovers these earlier errors, buys where prices are \"too low\" and sells where prices are \"too high.\" In this way low prices are nudged higher, high prices are nudged lower; price discrepancies are narrowed in the equilibrative direction.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-25", "group": "trigger", "status": "reference", "label": "Existing solution meets a problem", "description": "The person already has a product, skill or remembered idea, and later encounters a problem or everyday annoyance it can address; the answer comes before the question.", "when": "The person recalls connecting a mundane need or problem with a known but unused technology, skill or idea they already held.", "example": "", "notwhen": "An owned resource turned out to have value in a new context or through an unforeseen synergy without a specific problem prompting it (use resource proves valuable for an unforeseen use), or the person first identified a need and then searched for a solution.", "evidence": [{"cite": "Cohen et al. (1972)", "title": "A Garbage Can Model of Organizational Choice", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2392088", "page": 4, "text": "A computer is not just a solution to a problem in payroll management, discovered when needed.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 7, "text": "Indeed, through ongoing experimentation, Art Fry, another 3M employee, could imagine a new function for this strange glue (a Type II serendipitous event). 5 Fry was tired of losing his place in the choir hymnal at church.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-26", "group": "trigger", "status": "reference", "label": "Resource proves valuable for an unforeseen use", "description": "An asset, skill, product or acquisition obtained for one purpose turns out to be valuable for something else, for example when exposed to new users, settings or conditions, or through a synergy nobody anticipated.", "when": "The account describes something acquired or made for one reason that later proved useful for a different venture or strategy, or a product used in a new context producing an unexpected effect.", "example": "", "notwhen": "The person expected that later use when acquiring it, or a specific problem was matched to a stored solution (use existing solution meets a problem).", "evidence": [{"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": 6, "text": "If, as seems more likely, the resource was acquired for one purpose, and only recently did its value in implementing another strategy become known, then its current value was unanticipated when the resource was acquired.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 19, "text": "Therefore, the thalidomide case shows that the exposure of a drug developed for a specific purpose to novel and different contexts may lead to the unexpected discovery of radical breakthroughs based on new mechanisms of action and phenomena.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-27", "group": "trigger", "status": "reference", "label": "Idea out of the blue", "description": "An idea arrives suddenly and unbidden as a personal insight, sometimes in an incidental setting, through play, a joke, a dream or after a period of forgetting.", "when": "The person describes a sudden inspiration, whim or realisation, or an idea that came during play or in a dream, as the origin of the venture or product.", "example": "", "notwhen": "The person can point to a specific outside observation, remark or event that sparked the idea (use the code for that trigger).", "evidence": [{"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 14, "text": "This model is sometimes referred to as his 'forgetting hypothesis'.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 2, "text": "The idea for America’s foremost dysfunctional family came out of the blue to Matt Groening, as he sat in the outer office of acclaimed TV producer James L.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 9, "text": "Related to this, 14% of the projects mentioned that their idea came from anomalies from their research that needed revisiting.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-01", "group": "background", "status": "core", "label": "Relevant expertise", "description": "The founder's knowledge, training or experience in a field let them see the value of the unexpected event when others might not.", "when": "The founder credits their professional or industry knowledge for recognising the opportunity.", "example": "'After ten years in logistics, I knew straight away what that meant.'", "notwhen": "What mattered was a specific problem they were already working on (background-02).", "evidence": [{"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 2, "text": "Thus, prior related knowledge confers an ability to recognize the value of new information, assimilate it, and apply it to commercial ends.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "The Origins of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 17, "text": "This all indicates dependence of the gift of serendipity upon the total (even forgotten) knowledge and training of the individual.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 236, "text": "This saying emphasizes the importance of having the skills of observation and the ability to apply knowledge gained through education and experience to interpret what is observed in order to make serendipitous discoveries in scientific research.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 13, "text": "Her prepared mind was shaped by her work experience, as well as her prior interest in startups and student entrepreneurship.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 17, "text": "Serendipitous luck may come unexpectedly, but it does so only in a mind 'prepared' by previous interest, thought and/or experience, as in the examples of pseudoserendipity, e.g ..", "close": false, "none": false, "chosen": "reading"}, {"cite": "Alvarez and Barney (2007)", "title": "Discovery and creation: alternative theories of entrepreneurial action", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.4", "page": 13, "text": "In particular, discovery theory suggests that an individual’s prior knowledge and experience with an industry or market can enable that individual to combine information in new ways to discover opportunities that could not have been discovered by individuals without this prior knowledge or experience.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 25, "text": "In other words, ‘chance favors the prepared mind’ but preparedness doesn’t mean a normative theory of what is expected.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 7, "text": "Sagacious people are those that have the right individual characteristics, plus the knowledge necessary, to explore and seek explanation of the anomalous things that they witness.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 2, "text": "It assumes that the best way to prepare for the unexpected consists in improving the organization’s competences.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 11, "text": "This all indicates dependence of the gift of serendipity upon the total (even forgotten) knowledge and training of the individual (quoted in Merton and Barber 2004, 173).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 2, "text": "Third, sagacity enters the story because Fleming had been experimenting with the antibacterial properties of common substances for many years, and therefore had enough prior knowledge about molds to find that particular petri dish anomalous, and immediately begin to discern its potential implications.", "close": false, "none": false, "chosen": "reading"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 10, "text": "For example, with out a certain degree of domain-specific knowl edge, one may not even recognize the possibility for action (by oneself or others).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 3, "text": "In short, scholars argue that serendipity is not just pure luck and words such as sagacity, knowledge, deduction and experience are often associated with it, showing how one can explore a serendipitous situation.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "In a detailed analysis of Pasteur’s scientific experiments, [100] described how Pasteur was able to make deductions following some unexpected observations because of his unusual education and training.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 18, "text": "The eight potential entrepreneurs engaged in no search for the new technology, and recognized only opportunities closely related to their prior work.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 4, "text": "That is, those whose training, reading, research, experience et cetera enables them to appreciate the significance of serendipitous occurrences.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 21, "text": "Alexander Fleming, the discoverer of penicillin, for example, was able to identify mould as an opportunity given his previous expertise in the domain.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 6, "text": "Echoing innovation research in entrepreneurship, studies have noted that prior knowledge (Shane, 2000), prior experience (Shah & Tripsas, 2007), and deliberate, systematic search (Dew, 2009) can enhance the chances of unexpected discoveries.", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 8, "text": "Because of his experience of working with artists, labels and promotion companies, he was able to exploit the opportunity which Paolo presented and to turn him into an international brand.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Bhave (1994)", "title": "A process model of entrepreneurial venture creation", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/0883-9026(94)90031-0", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "background-02", "group": "background", "status": "core", "label": "A problem already in mind", "description": "Before the event, the founder was already carrying a specific problem, need or strong interest, and the chance input mattered because it connected to it.", "when": "The founder says they were already wrestling with a particular problem when the input arrived.", "example": "'I'd been trying to fix my own sleep for years.'", "notwhen": "The founder credits general expertise without a specific problem (background-01).", "evidence": [{"cite": "Felin et al. (2021)", "title": "Resource origins and search", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3350", "page": 15, "text": "That is, search images and problem formulations enable the identification of novelty and value when it is encountered.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 143, "text": "In that sense, serendipity events exploit not a general type of ignorance, but one that we ache to overcome, that we had not the right tools to uncover before.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 16, "text": "His very general schematic anticipation is based on a specific problem-oriented and/or experience-based intuition.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 8, "text": "the user initially innovated to meet his or her own need, developing a prototype product for personal use.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "background-11", "group": "background", "status": "core", "label": "Idea grew from their work", "description": "The founder's job, daily tasks or hands-on experience gave them the closeness from which the idea came.", "when": "The idea is traced to the founder's current or past work, projects or role.", "example": "'As a nurse, I saw the same problem every shift.'", "notwhen": "The founder credits expertise in general without tying it to a role or activity (background-01).", "evidence": [{"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 13, "text": "We found that in their daily work, scientists and engineers working in BSRIs often develop novel ideas about alternative uses of technologies that could be potentially commercialized.", "close": false, "none": false, "chosen": "reading"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 10, "text": "Similarly, in our §1 example of the individual happening to notice a safe and sturdy bike baby carrier in the store window, recall that that person is described as a parent who has the task of transporting a child to preschool.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Shah and Tripsas (2007)", "title": "The accidental entrepreneur: the emergent and collective process of user entrepreneurship", "venue": "Strategic Entrepreneurship Journal", "url": "https://doi.org/10.1002/sej.15", "page": 11, "text": "Armed with unique, inimitable knowledge, users are therefore in a strong position to identify opportunities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "background-17", "group": "background", "status": "core", "label": "Their network brought it", "description": "The unexpected opportunity, idea or information reached the founder through people they knew: friends, family, colleagues, communities.", "when": "An opportunity or referral came through the founder's contacts.", "example": "'An old colleague passed my name to a buyer.'", "notwhen": "The founder met someone new by chance (trigger-14), not through existing contacts.", "evidence": [{"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 6, "text": "Business networks have an essential role in their internationalization processes as they provide complementary resources especially information, reinforce learning processes and create coincidences that may lead to identification of new business opportunities.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 23, "text": "This highlights the importance of the respective social embedding, i.e., the nature, depth, and extent of an individual’s social ties (Busch and Barkema, 2022b; McKeever et al., 2014, p. 222).", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 14, "text": "According to Burt ( 2004, 349–50), people who stand near the holes in a social structure are at higher risk of having good ideas ...", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 17, "text": "Similarly, social structures that promote collaboration and networking can spur unexpected interactions and the discovery of unforeseen opportunities (Cunha et al., 2010).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 14, "text": "Cluster and central concepts in the causal maps of each firm show that personal networks, especially in the early stages of establishing a business, are significant sources of serendipity.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "Experience and social networks can likewise increase the likelihood of encountering serendipity (Dew, 2009; e Cunha et al., 2010).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 9, "text": "Instead, the value of networks is often surfaced by way of serendipitous encounters and only recognised post-hoc.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 91, "text": "Instead, the value of networks is often surfaced by way of serendipitous encounters and only recognised post-hoc.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 6, "text": "One evening, while having a beer with some friends from Microtonic, a firm specializing in micromechanics, Olsen mentioned the problem and ‘‘one of his friends knew of such a microprocessor, which was subsequently used in the Multifocus product line.’’ Serendipity travels in good social networks.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 3, "text": "Multiple influences: All discoveries took place in a social context, and in some examples the “unexpected source” was another person.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 6, "text": "The strength of weak ties may govern exposure to novelty ( Granovetter, 1973 ) and opportunities to broker information and resources from certain points within a network may offer a locus for serendipity to emerge ( Burt, 2004 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 31, "text": "Other studies emphasize that such serendipity should be attributed less to the actors and more to the network structure the actors are embedded in.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "A further processual perspective has been advanced by Balconi and co-authors, (2004) in their suggestion of “network emergent” mechanisms that are founded on the established influence of a researcher’s position within a collaborative network.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "background-03", "group": "background", "status": "reference", "label": "Knowing both the problem and the solution", "description": "The person combines close familiarity with a user's or organisation's unsolved problem with the technical knowledge to solve it. This combination lets them recognise a new technology or idea as the answer.", "when": "The founder experienced the need personally, or knew it closely from work with users or the organisation, and also had the skills or technical knowledge to build the solution.", "example": "", "notwhen": "Only a held problem is described, with no account of solution expertise; use Problem already in mind.", "evidence": [{"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 17, "text": "Unlike the other entrepreneurs, Stephen Campbell's (3D Orthopedics) recognition of a solution to a customer problem came from a combination of research, experience as a user, and prior education.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 11, "text": "It offers a knowledge base and modelbased technology to enable a problem solver to systematically “try out” success-associated possibilities that might otherwise not have been envisioned.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 9, "text": "The R&D people must be free to think up new approaches, and they must also be closely coupled to the problems and challenges where innovation is needed.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-04", "group": "background", "status": "reference", "label": "Market knowledge shapes exploitation", "description": "Prior knowledge of how particular markets work, and of how to turn a technology into a product or service, shapes which market the entrepreneur sees and how they choose to serve it.", "when": "The person explains their choice of market or business model by markets they had worked in or by what they did or did not know how to do (manufacture, retail, regulation, service).", "example": "", "notwhen": "Knowledge is credited with noticing the opportunity at all rather than with shaping which market or model was chosen; use Prior expertise enables recognition.", "evidence": [{"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 6, "text": "An entrepreneur's ability to recognize an opportunity in a new technology might be enhanced by prior knowledge about how the new technology could be used to create a product or service.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-05", "group": "background", "status": "reference", "label": "Idiosyncratic background explains who sees it", "description": "Each person's particular life experience and way of seeing forms a corridor that lets them see certain opportunities and not others. This explains why one person, rather than others exposed to the same event, saw promise in it.", "when": "The account contrasts the person with others who met the same event or idea, and explains the difference by the person's particular background, perception or knowledge. It also applies when the person says they could not have seen others' opportunities.", "example": "", "notwhen": "The account credits expertise for recognition without comparing the person to others; use Prior expertise enables recognition.", "evidence": [{"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 6, "text": "Each person's idiosyncratic prior knowledge creates a \"knowledge corridor\" that allows him/her to recognize certain opportunities, but not others (Venkataraman 1997).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davidsson (2015)", "title": "Entrepreneurial opportunities and the entrepreneurship nexus: A re-conceptualization", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2015.01.002", "page": 12, "text": "It is essential to conceptualize this evaluation separately in order to eliminate innate favorability from the other constructs; let different stakeholders' evaluations vary for the same stimulus, and to allow contents and evaluation of the stimulus to vary independently of each other over time.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "Through his analysis of Merton’s files, [84] also advances four mechanisms for explaining how serendipity unfolds.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-06", "group": "background", "status": "reference", "label": "Outsider or low-knowledge advantage", "description": "Limited knowledge of a field, or being a newcomer or outsider, can itself lead to serendipitous discovery. Outsiders pursue areas experts avoid, are less bound by entrenched assumptions, or stumble on opportunities rather than plan. This contrasts with authors who see expertise as the enabler.", "when": "A newcomer, outsider or inexperienced founder pursues an area others dismissed, or relies on stumbling onto opportunities, or spots a new use because they lacked the established assumptions, and this turns out valuable.", "example": "", "notwhen": "Expertise is credited with enabling recognition; use Prior expertise enables recognition.", "evidence": [{"cite": "March (1991)", "title": "Exploration and Exploitation in Organizational Learning", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2.1.71", "page": 10, "text": "They are less likely to contribute new knowledge on the margin.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell (2003)", "title": "Vicarious Learning, Undersampling of Failure, and the Myths of Management", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.14.2.227.15164", "page": 11, "text": "However, they may also lead the firms to do research in areas that few informed firms are investigating because these areas are correctly evaluated as having very low potential, and thus low expected returns.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 22, "text": "Engaging external searchers who are less constrained by internal cognitive frames introduces novel perspectives, helping firms identify solutions beyond their established knowledge structures.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Plowman et al. (2007)", "title": "Radical Change Accidentally: The Emergence and Amplification of Small Change", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2007.25525647", "page": 24, "text": "For Mission Church, this meant that the tension the organization was experiencing as a result of decline, new leaders, an unclear identity, and ongoing conflict made it all the more likely that a small change could emerge and be amplified into something much larger.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "Interestingly, a low degree of knowledge can also stimulate serendipity.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-07", "group": "background", "status": "reference", "label": "Breadth of varied experience", "description": "A broad background across several fields, roles, hobbies or life experiences increases the chance that something unexpected connects with something already known and can be recombined.", "when": "The person traces an insight to knowledge from an unrelated earlier role, hobby, upbringing or varied self-built knowledge. It also applies when information from an unexpected domain connected with their broad background.", "example": "", "notwhen": "An established capability or technology is deliberately carried into a new market; use Redeploying capabilities to a new domain. Also not when depth in a single specialty is credited; use Prior expertise enables recognition.", "evidence": [{"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 17, "text": "The broad knowledge and interests of IDEO's engineers result in access to design solutions beyond the solutions that IDEO is exposed to in its clients' industries.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Hargadon and Bechky (2006)", "title": "When Collections of Creatives Become Creative Collectives: A Field Study of Problem Solving at Work", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1060.0200", "page": 9, "text": "The activities prompted sets of momentary interactions that connected those facing problematic situations and those with potentially relevant?though rarely obvious ex ante?knowledge and experience.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 4, "text": "A successful antiquarian, then, must build up on his own a huge stock of knowledge, a stock whose adequacy or deficiency he has no way of checking.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Grimes (2018)", "title": "The Pivot: How Founders Respond to Feedback through Idea and Identity Work", "venue": "Academy of Management Journal", "url": "https://doi.org/10.5465/amj.2015.0823", "page": 19, "text": "Alternatively, individuals with specialized or limited creative work experience tended to perceive outsiders as challenging their creative authority or domain expertise and thus their self-concepts.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cohen and Levinthal (1990)", "title": "Absorptive Capacity: A New Perspective on Learning and Innovation", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393553", "page": 5, "text": "In a setting in which there is uncertainty about the knowledge domains from which potentially useful information may emerge, a diverse background provides a more robust basis for learning because it increases the prospect that incoming information will relate to what is already known.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 8, "text": "And it’s also keeping your eyes open to the world to see where and how you can take what you’ve learned in all of the different areas that you’ve been in and apply it to a specific thing, an idea.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-08", "group": "background", "status": "reference", "label": "Redeploying capabilities to a new domain", "description": "Skills, technologies or know-how developed for one industry or purpose, sometimes outdated there, are carried over and applied in a different domain or new direction.", "when": "The venture applies capabilities from a prior, different field or purpose to a new market or direction. It also applies when the founder approached the new venture through the frame of earlier craft experience.", "example": "", "notwhen": "Earlier projects or ideas were kept dormant and later revived; use Retained earlier work as options.", "evidence": [{"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 5, "text": "This is especially true when firms create a new technological field and the only available knowledge they can readily rely on is their own.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 9, "text": "Such a mix was representative of the “mechanical skill” base that had emerged as a result of a “practical engineer” education typical of the Danish machine industry.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 4, "text": "Nonetheless, Corning ’s efforts to translate its extant glass technologies into this new frontier helped bring the world of fiber optics to life.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 30, "text": "In effect, the trickle can serve as a bellwether, suggesting a new direction based on skills already established in the organization.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-09", "group": "background", "status": "reference", "label": "Collecting without a set purpose", "description": "The person accumulates interesting ideas, objects, materials, skills or contacts with no specific use in mind, keeping them loosely organised or revisited. Later these turn out useful for an unforeseen problem.", "when": "The person describes gathering or browsing things that caught their interest, keeping odds and ends that 'may come in handy', or storing ideas without a clear use, and later drawing on them unexpectedly.", "example": "", "notwhen": "An organisation retains its own earlier projects, patents or platforms as options; use Retained earlier work as options. Also not when items were acquired for a current, defined project.", "evidence": [{"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 12, "text": "(1) Collection: We attempt to accumulate interesting ideas without any sense of how we might use them later; we save them with no specific purpose in mind; we orga nize them loosely, since the search through them often gives us better ideas.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 16, "text": "This resulted in collections of tools, materials, and other odds and ends that were very diverse when compared with the equipment and inventory of firms doing little bricolage.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 22, "text": "This designer was especially fond of toys and spent a lot of time telling us about how his toys contained useful ideas in the form of distinctive hinges, materials, molding features, or assembly requirements.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 13, "text": "Companies such as the design group IDEO have developed related approaches such as rapid prototyping, where the problem-solver responds to initial challenges by immediately developing", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-10", "group": "background", "status": "reference", "label": "Retained earlier work as options", "description": "Earlier projects, failed experiments, divested ventures, patents, platforms or scaled-down strategies are kept alive or remembered. Years later they supply the knowledge or tools to exploit an unexpected opportunity.", "when": "The account credits past, abandoned, failed or side projects, or a stored stock of patents, technologies or old strategies, with what later made a lucky break usable.", "example": "", "notwhen": "Things were collected informally without purpose by an individual; use Collecting without a set purpose. Also not when current resources are recombined; use Resources already at hand.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 18, "text": "We also had the patents and intellectual property.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 25, "text": "Another approach has explored how platforms of social and technical arrangements can be created to serve as generative memories (Garud et al., 2011).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 9, "text": "In addition, categorization of patented discoveries, combined with bibliometric analyses, allows people to search through patents to identify those that could be useful.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and McHugh (1985)", "title": "Strategy Formation in an Adhocracy", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393104", "page": 32, "text": "This accumulation of strategies would appear to have its positive side, as noted earlier, enabling an organization to maintain multiple capabilities and so to have several options whenever reorientation of attention becomes necessary.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 5, "text": "Eventually, Corning divested, but a few years later the knowledge they had gathered as a result of this investment happened to be useful to fiber optics.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-12", "group": "background", "status": "reference", "label": "Resources already at hand", "description": "Knowledge of, and familiarity with, the resources, assets, skills and capabilities a person or firm already holds enables new and unexpected combinations, or lets them act on an opportunity.", "when": "The person recognises that something they or their team already have (assets, materials, internal capabilities, employees' hidden skills or contacts) can be combined or used for an unexpected opportunity. It also applies when they act because they already had what was needed.", "example": "", "notwhen": "The emphasis is on having the capability to profit from a lucky event rather than on combining held resources; use Capability to exploit chance.", "evidence": [{"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 34, "text": "When supervisors’ requests and permissions generated bricolage by employees, the employees called on resources that were at hand to the employees, but about which the employers had no specific knowledge.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 13, "text": "She was not actively searching but recognised an entrepreneurial opportunity during an unplanned discussion with a startup team.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Adegbesan (2009)", "title": "On the Origins of Competitive Advantage: Strategic Factor Markets and Heterogeneous Resource Complementarity", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2009.40632465", "page": 12, "text": "On the other hand, my study suggests that heterogeneous firm endowments may permit profitable factor market trading.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 11, "text": "In particular, scholars have converged on the idea that serendipity plays an important role in developing capabilities, acquiring assets, and constructing networks.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 4, "text": "I’ll dry ‘em and make powder and flakes in Idaho.”’ Thus, through a contingent meeting with Sokol, Simplot found an opportunity to recombine his existing resources (storage and sorting facilities and access to a large supply of onions) with new ones (onion-drying processes).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 11, "text": "Managers at Enron also try to build on mistakes by salvaging what did work and recombining it with other resources to create new opportunities.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 4, "text": "It is often uncertain and can generate unexpected outcomes since “the value of the resources is typically discovered as they are being combined” (Wiklund and Shepherd, 2009: 196).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 8, "text": "Further, sequential focus can deepen a firm’s familiarity with its resources and operating environment, enabling it to detect subtle cues that less focused firms may overlook (Ardichvili et al., 2003; Jett & George, 2003).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-13", "group": "background", "status": "reference", "label": "Capability to exploit chance", "description": "Practical skill, organisational capability, infrastructure and endowments determine whether a chance event can be turned into value. More capable actors gain more from luck.", "when": "The account shows that skills, know-how, resources, infrastructure or organising effort were needed, and were present, to turn an accidental find into something valuable.", "example": "", "notwhen": "The account is about recognising the event's significance; use Prior expertise enables recognition. Also not when status or position amplified a lucky break; use Reputation and favourable position.", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": null, "text": "", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 2, "text": "Hence, in each case, serendipity was not the result of an isolated moment of accident but of curiosity coupled with organizational capability to make something good of the unknown.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2012)", "title": "Inferring superior capabilities from sustained superior performance: A Bayesian analysis", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.2001", "page": 13, "text": "Consider a second, development rule in which prof its can be reinvested to improve capability.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 6, "text": "Coryton’s article contained a whole catalogue of accidental inventions or chance insights, enough thoroughly to familiarize the reader with the role that accident has played in the history of science.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-14", "group": "background", "status": "reference", "label": "Cheap experimentation", "description": "Skills, evolved techniques, cheap materials and tools make failures inexpensive. This lets people stay open to accidents and follow chance.", "when": "The person says they could afford to experiment or follow a chance lead because their skills, tools or materials made failure cheap.", "example": "", "notwhen": "Skills are credited with turning an accident into value, not with lowering the cost of trying; use Capability to exploit chance.", "evidence": [{"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 14, "text": "Makers we studied used evolved techniques, expertise, and both low- and high-tech technologies to lower the cost of non valuable accidents.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "background-15", "group": "background", "status": "reference", "label": "Starting from existing means", "description": "Entrepreneurs begin from who they are, what they know and whom they know, rather than from a preset goal. These means then combine with contingencies.", "when": "A venture direction emerges from the founder's identity, knowledge and existing contacts together, fo
