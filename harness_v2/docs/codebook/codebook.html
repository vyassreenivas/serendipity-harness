<style>
/* Layout: a field manual. Left pane is the coder's index (group question, then one line per code);
   right pane is the full entry for the selected code, with the papers behind it. */
:root {
  --paper: #f5f7f6;
  --sheet: #ffffff;
  --ink: #1b2326;
  --muted: #5b686b;
  --rule: #d8dfdd;
  --accent: #1f5c6b;
  --accent-soft: #e2eef0;
  --amber: #8a5a00;
  --amber-soft: #fbefd6;
  --plum: #6a3d7a;
  --plum-soft: #f1e6f5;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121819; --sheet: #182022; --ink: #e4ebea; --muted: #9aa8a9; --rule: #2c3739;
    --accent: #7cc0cf; --accent-soft: #1d3338; --amber: #f0c06a; --amber-soft: #3a2e17;
    --plum: #d6aee6; --plum-soft: #34263b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121819; --sheet: #182022; --ink: #e4ebea; --muted: #9aa8a9; --rule: #2c3739;
  --accent: #7cc0cf; --accent-soft: #1d3338; --amber: #f0c06a; --amber-soft: #3a2e17;
  --plum: #d6aee6; --plum-soft: #34263b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  display: flex; flex-direction: column;
}
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { border-bottom: 1px solid var(--rule); background: var(--sheet); }
header.top .wrap { padding-block: var(--s4); display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: center; }
.brand { min-width: 0; flex: 1 1 280px; }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.1; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.search { position: relative; }
.search input {
  font: inherit; font-size: 14px; width: 240px; max-width: 100%; padding: 7px 10px 7px 30px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); fill: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 7px 11px; border: 0; background: var(--sheet); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
button:focus-visible, input:focus-visible, a:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); }
.index { border-right: 1px solid var(--rule); overflow-y: auto; min-width: 0; padding-bottom: 96px; }
.detail { overflow-y: auto; min-width: 0; padding-bottom: 96px; }

.group { border-bottom: 1px solid var(--rule); }
.group > h2 {
  position: sticky; top: 0; z-index: 1; margin: 0; background: var(--paper);
  padding: var(--s3) max(16px, env(safe-area-inset-right, 0px)) var(--s2) max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: auto 1fr; gap: 0 var(--s2); align-items: baseline;
}
.group .num { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.group .gname { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.group .ask { grid-column: 2; font-family: var(--display); font-size: 16px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
.row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px var(--s2); align-items: start;
  padding: var(--s2) max(16px, env(safe-area-inset-right, 0px)) var(--s2) max(16px, env(safe-area-inset-left, 0px));
  cursor: pointer; border-left: 3px solid transparent;
}
.row:hover { background: var(--sheet); }
.row.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.row input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.row .lbl { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.row .when { grid-column: 2 / 4; color: var(--muted); font-size: 13px; line-height: 1.4; }
.row .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.row.ref .lbl { font-weight: 500; }
.chip { display: inline-block; font-family: var(--body); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; vertical-align: 1px; margin-left: 4px; }
.chip.ref { background: var(--rule); color: var(--muted); }
.chip.new { background: var(--plum-soft); color: var(--plum); }
.chip.close { background: var(--amber-soft); color: var(--amber); }
.chip.core { background: var(--accent-soft); color: var(--accent); }
.empty { padding: var(--s5) var(--s4); color: var(--muted); }

.entry { max-width: 760px; padding-block: var(--s6); }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.eyebrow b { color: var(--accent); font-family: var(--mono); font-weight: 500; letter-spacing: 0; text-transform: none; margin-right: 6px; }
.entry h2 { font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.1; margin: var(--s2) 0 var(--s2); text-wrap: balance; }
.idline { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.copy { font: inherit; font-size: 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.fields { display: grid; gap: var(--s4); margin: var(--s5) 0; }
.field { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.field dt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.field dd { margin: 0; font-size: 16px; max-width: 62ch; }
.field.ex dd { font-family: var(--display); font-style: italic; font-size: 17px; }
.field.desc dd { color: var(--muted); font-size: 15px; }
.ref-link { font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.note { margin: 0 0 var(--s4); padding: var(--s2) var(--s3); background: var(--plum-soft); color: var(--plum); border-radius: 4px; font-size: 13.5px; }
.ev h3 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: var(--s6) 0 var(--s1); }
.ev .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 var(--s4); max-width: 62ch; }
.ev ol { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s4); }
.ev li { display: grid; gap: var(--s1); padding-left: var(--s4); border-left: 2px solid var(--rule); }
.ev blockquote { margin: 0; font-family: var(--display); font-size: 16.5px; line-height: 1.45; max-width: 64ch; }
.ev .src { font-size: 13px; color: var(--muted); }
.ev .src a { color: var(--accent); font-weight: 600; text-decoration: none; }
.ev .src a:hover { text-decoration: underline; }
.ev .nosent { color: var(--muted); font-style: italic; }
.placeholder { padding-block: var(--s6); color: var(--muted); max-width: 60ch; }

.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--ink); color: var(--paper);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tray .wrap { padding-block: var(--s3); display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; }
.tray .t-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.tray .ids { font-family: var(--mono); font-size: 13px; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.tray button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 5px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.tray button.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.back { display: none; }

@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .index { border-right: 0; }
  .detail { position: fixed; inset: 0; z-index: 4; background: var(--paper); padding-top: env(safe-area-inset-top, 0px); }
  .detail[data-open="false"] { display: none; }
  .back { display: inline-block; margin-top: var(--s4); font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .entry { padding-block: var(--s3) var(--s6); }
  .entry h2 { font-size: 28px; }
  .field { grid-template-columns: minmax(0, 1fr); gap: var(--s1); }
  .search input { width: 100%; }
  .search { flex: 1 1 200px; }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: background-color .12s; } }
</style>

<script>
const DATA = {"built": "2026-10-23", "source": "codebook_review.xlsx", "groups": [{"n": 1, "name": "definition", "asks": "Does this episode count as serendipity?", "sq": "SQ1: What counts as serendipity?"}, {"n": 2, "name": "type", "asks": "What kind of serendipity is it?", "sq": "SQ1: What counts as serendipity?"}, {"n": 3, "name": "rival", "asks": "What else could explain the same story?", "sq": "SQ1: What counts as serendipity?"}, {"n": 4, "name": "trigger", "asks": "What unexpected event started it?", "sq": "SQ2: Where does it happen, and what sets it off?"}, {"n": 5, "name": "background", "asks": "What did the founder already have?", "sq": "SQ3: What do founders bring and do?"}, {"n": 6, "name": "mechanism", "asks": "What did the founder do to turn it into something?", "sq": "SQ3: What do founders bring and do?"}, {"n": 7, "name": "role", "asks": "What part did it play in the venture?", "sq": "SQ4: What does it change in the venture?"}, {"n": 8, "name": "outcome", "asks": "What came of it?", "sq": "SQ4: What does it change in the venture?"}, {"n": 9, "name": "condition", "asks": "What made it easier or harder?", "sq": "SQ5: When is it more or less likely?"}, {"n": 10, "name": "account", "asks": "How does the founder tell it afterwards?", "sq": "SQ6: How do founders tell it?"}, {"n": 11, "name": "anomaly", "asks": "What in this episode does no other code capture?", "sq": "All sub-questions"}], "codes": [{"id": "definition-04", "group": "definition", "status": "core", "label": "Already searching", "description": "When the unexpected event happened, the founder was already looking for something: an idea, a solution, customers or a way forward. Needed for the narrow verdict (Dew 2009).", "when": "The account shows a search or effort under way at the time.", "example": "'I'd been trying ideas for months when...'", "notwhen": "The founder was not looking for anything at the time; leave this code off.", "evidence": [{"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 2, "text": "Serendipity lies between these two concepts: individuals are involved in some kind of search effort when they accidentally discover something that they were not looking for.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 2, "text": "In the management literature, serendipity has been defined as a “search leading to unintended discovery” (Dew, 2009, p. 735) and has been conceptualised as a combination of searching, contingency, and prior knowledge (Dew, 2009).", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 2, "text": "Dew (2009, p. 739) suggests that serendipity “involves the interaction of three elements (i) a resource (sagacity), (ii) an event (contingency), (iii) an activity (the individual is already on a journey).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 13, "text": "Because serendipity is characterized by “some combination of search (directed effort), contingency (favorable accidents) and prior knowledge (sagacity) ” (Dew, 2009 : 736), attracting stakeholders' pre-commitments and enlarging the means available to the venture serves to enhance the pool of knowledge required to detect and act on key contingencies.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 5, "text": "First, serendipity results from intentional effort toward achieving a specific goal.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 5, "text": "Defined in the management literature as a “ search leading to unintended discovery ” ( Dew, 2009 , p. 735), serendipity is more than mere chance, arising from the interplay of searching, contingency, and prior knowledge ( Dew, 2009 ).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "definition-07", "group": "definition", "status": "core", "label": "Agency: acted on it", "description": "The founder did something with the unexpected event: followed it up, tried it, or built on it. Without this, it is luck, not serendipity.", "when": "The founder describes their own response to the event and links the result to it.", "example": "'I wrote back that night and offered to build it.'", "notwhen": "The benefit simply arrived with no action by the founder; code rival-01 (pure luck) instead.", "evidence": [{"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 6, "text": "First, whereas luck is purely random, serendipity involves agency—serendipitous discoveries often emerge, at least in part, from purposeful effort.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 3, "text": "Following prior research, agency is included in our definition of serendipity to clarify that it is an outcome that results partly from purposeful human action and also to distinguish it from unexpected discoveries made via pure luck, which are A.E.F.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2015)", "title": "The dialectics of serendipity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2014.11.001", "page": 8, "text": "Serendipity can thus be defined as unexpected observations framed as opportunities, made actionable by a frame of reference that is kept dynamic via the cultivation of doubt, i.e. using the sentiment of un-knowing as a stimulus to expand existing knowledge into new territories.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Stock Responses to Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 35, "text": "All we can do is, like serendipity, put ourselves into a favorable position to profit by unexpected occurrences.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 15, "text": "I capture these human- driven actions and interventions that help generate serendipity as agency.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 2, "text": "Building on a recent systematic review on serendipity in the management context (Busch 2022), we define serendipity as a surprising and valuable discovery originating from agentic responses to unplanned events.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "A defining feature of serendipity is agency: the notion that outcomes result partly from purposeful human action (Fultz and Hmieleski, 2021).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 1, "text": "Yet a more careful examination shows that serendipity should be viewed as the result of purposeful actions [25], [82], [83].", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 84, "text": "Building on a recent systematic review on serendipity in the management context (Busch 2022), we define serendipity as a surprising and valuable discovery originating from agentic responses to unplanned events.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "definition-09", "group": "definition", "status": "core", "label": "Surprise", "description": "Something happened that the founder did not expect, plan or intend.", "when": "The founder says an event, contact, result or reaction was unexpected or not part of the plan.", "example": "'I never expected anyone to ask for that.'", "notwhen": "The founder got what they planned and expected, on schedule.", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 16, "text": "Thus, serendipity is based on something unexpected, unplanned, or unusual (i.e., it comes by surprise ; Busch, 2020; Shani and Gunawardana, 2011).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Austin (2012)", "title": "Accidental Innovation: Supporting Valuable Unpredictability in the Creative Process", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1110.0681", "page": 14, "text": "Processes that lead to the most original innovations produce outcomes outside a maker'scone of expectation, out comes that cannot result from available predictive logic.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 6, "text": "Serendipity does not emerge from the systematic application of what is already thought; rather, it emerges from surprise ( Cunha et al., 2010).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 185, "text": "Evidence from qualitative work suggests surprise as an important marker of serendipity.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 6, "text": "Second, in contrast to targeted innovation, serendipity is characterized by surprise— it is never entirely intended or controlled, whether that refers to how the discovery occurs or what is uncovered.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "definition-13", "group": "definition", "status": "core", "label": "Value", "description": "The unexpected event led to something the founder sees as worth having: an idea, customer, product, partner or turning point.", "when": "The founder presents what followed as useful or important for them or the venture.", "example": "'That one email became our biggest customer.'", "notwhen": "Nothing of value came of it; code outcome-25 instead.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "It has been defined as finding something valuable by chance (e Cunha et al., 2010) or encountering resources, such as information, people or objects, in unplanned ways (Bj€orneborn, 2017).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Moral Implications of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 3, "text": "Serendipity can be about finding something of value while seeking something entirely different or it can be about finding a sought-after object in a place or a manner where it was not at all expected.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 3, "text": "Value: The result must be happy, useful (evaluated externally).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 19, "text": "While achieving the expected value from an acquisition was important, the buyers in this study were often surprised to find unexpected, yet significant, sources of value in their acquired companies.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 1, "text": "As events in the network are generally beyond the control of smaller firms, their strategies are subject to high degrees of serendipity, i.e. fortunate and unexpected discoveries made by chance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 7, "text": "More precisely, accidental discoveries need the right capabilities to exploit and extract value from these discoveries to entail serendipity and lead to value creation (Austin et al., 2012).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 16, "text": "‘Value’ tends to be in the eye of the beholder, and it can become apparent in the moment the connection is made, or at a later stage (e.g., once a learning outcome manifests) (Makri and Blandford, 2012b; McCay- Peet and Toms, 2015).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 7, "text": "By comparing serendipitous findings to intentional findings with both successful and unsuccessful findings, this paper aims to estimate the difference in the potential values of findings that are found intentionally and accidentally from the perspectives of scientists.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 1, "text": "Where research does happen to yield something of value, the results are often quite different from what was expected.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Giustiniano et al. (2016)", "title": "Organizational zemblanity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2015.12.001", "page": 2, "text": "In management, when serendipity has been used, it is in reference to the accidental discovery of something that, post hoc , generates value ( Brown, 2005; Cunha et al., 2010; Liyanage, 2006 ).", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "definition-01", "group": "definition", "status": "reference", "label": "Finding something not sought", "description": "Serendipity means finding something one was not looking for, often while pursuing a different aim. Finding what one set out to find does not count. Authors leave open whether the find only needs to be unsought at that moment or must also have been unknown and unsuspected.", "when": "The person describes coming upon an idea, contact, resource or opportunity different from what they were seeking at the time.", "example": "", "notwhen": "The person found exactly what they were searching for. Also distinguish from 'Discovery solves a different problem': use that code when the account stresses that the find answered a different problem or question than the one pursued.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 15, "text": "They didn’t find what they were looking for, but they kept finding other things just as valuable.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 14, "text": "The 'unsought' is related to the finder or anybody, and do es not exclude that the finder sought something else when he found the 'unsought' finding (in fact this is mostly the case).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 67, "text": "Thus, effort and agency sometimes leads to discoveries that were not programmed, meaning that someone discovers something that they were not trying to find—even if they were trying to discover something else.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 1, "text": "The serendipity gained and lost in the case of the floppy-eared rabbits is a prime example of the third characteristic .", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 11, "text": "Serendipity, as it is used today, is often considered a very valuable mode of scientific discovery.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-02", "group": "definition", "status": "reference", "label": "Discovery solves a different problem", "description": "While seeking a solution to one problem, the person notices something that solves a different problem, or answers a question nobody had yet asked. The accident lies in how the discovery relates to the original question.", "when": "The person was pursuing one goal or question and the result addressed a different need or answered a question they had not set out to ask.", "example": "", "notwhen": "Use 'Finding something not sought' when the account only says the find was unsought, without linking it to a different problem or question.", "evidence": [{"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 3, "text": "Even though this definition directs our attention to the extent to which the discovery answers a question not yet posed, the present paper adopts this definition and explores the relation between management and serendipity in science.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 5, "text": "Serendipity starts accidentally, when someone is looking for a solution to a given problem – problem A; in the process, the person notices something that will lead to the solution of a different problem (problem B) that may be of even greater value.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-03", "group": "definition", "status": "reference", "label": "Need and solution found together", "description": "A need and its solution are discovered at the same moment as a pair. The problem is recognised only afterwards, if at all, by comparing the new arrangement with the old one.", "when": "The person says they were not aware of a problem or need until they came across the solution, for example 'I didn't think we had a problem, but now I see we do'.", "example": "", "notwhen": "Use 'Discovery solves a different problem' when the person already had a defined problem and the find solved another one.", "evidence": [{"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 2, "text": "In such a case, problem identification and formulation, if done at all, come only after the discovery of the need–solution pair.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-05", "group": "definition", "status": "reference", "label": "Discovery without search", "description": "Opportunities come to people who were not searching for them. Discovery is recognising the value of information received by other means, because an opportunity cannot be searched for until it is known.", "when": "The founder stresses that they were not looking for a business idea or opportunity when they came across it and recognised it.", "example": "", "notwhen": "Use 'Search leading to unintended discovery' when the person was actively searching for something else and found the opportunity along the way.", "evidence": [{"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 18, "text": "Discovery of opportunity “involved recognition, rather than a search for information” ( Shane, 2000, p. 457).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 5, "text": "Austrian economists have challenged this approach, arguing that people do not search for entrepreneurial opportunities because \"opportunity, by definition, is unknown until discovered\"; and one cannot search for something that one does not know exists (Kaish and Gilad 1991, p. 38).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-06", "group": "definition", "status": "reference", "label": "Accident plus sagacity", "description": "Serendipity joins a chance occurrence with the person's sagacity: the perceptiveness, prior knowledge, prepared mind or judgement to recognise what the chance event offers. Neither luck alone nor skill alone counts. Most authors require both to work together, but one source phrases it as 'chance or sagacity'.", "when": "The account pairs a chance event with the person's own noticing, interpretation, openness or expertise, and presents this recognition as what made the event valuable.", "example": "", "notwhen": "Use 'Acting on the unexpected' when the emphasis is on what the person did after the event rather than on their recognising or interpreting it. Do not apply to pure luck with no recognition.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "Serendipity as a Political Metaphor to discover, by chance or sagacity, wonderful things they had not sought.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 127, "text": "Sagacity is required in addition to accidents for serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 5, "text": "We define serendipity as entrepreneurs “making discoveries, by accidents and sagacity, of things they were not in quest of” (Merton & Barber, 2004, p. 2).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 2, "text": "In his letter to his diplomatist friend Walpole mentioned a special type of luck that these princes bestow: he termed itserendipity, after the ancient tale, which resulted from the combination of an accident with sagacity or perspicacity in understanding.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 2, "text": "Serendipity in finding and exploring new things is, however, believed to be a result of “accident and sagacity”, rather than accident or luck alone ( Friedel, 2001 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 1, "text": "Sagacity, defined as penetrating intelligence, keen per­ ception and sound judgment, is a key element of serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 4, "text": "(Camman [1967]) The word 'serendipity' was coined and defined on 28 January 1754 by Horace Walpole, the 'genial dilettant', in one of his eighteen hundred letters to Horace Mann.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Giustiniano et al. (2016)", "title": "Organizational zemblanity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2015.12.001", "page": 8, "text": "The event of colliding with the reef demonstrated such deficiencies, as did the dramatic phases of the sinking.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 2, "text": "Dew (2009) however argues that serendipity is not luck but rather relies on prior knowledge.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 6, "text": "Serendipity is not “mere chance” – the axes of sagacity and useful results are equally important.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 5, "text": "To make this argument, we begin with the work of organizational scholars who have explored serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ross (2024)", "title": "Serendipity: The Role of Chance and Accidents in Creativity", "venue": "Creativity Research Journal", "url": "https://doi.org/10.1080/10400419.2024.2313898", "page": 1, "text": "Chance without skill is not enough on its own to support creativity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 2, "text": "Sagacity refers to having perception and sound judgment, or in other words, a prepared mind.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-08", "group": "definition", "status": "reference", "label": "Serendipity as a capability", "description": "Serendipity is a capability or faculty for recognising and extracting value from unexpected occurrences, not merely the occurrence itself. Merton argues it is both a personal faculty and an event, and coders can note which framing is used.", "when": "The account presents serendipity as an ability or trait of the person or firm, for example a knack for spotting and absorbing outside knowledge or for turning chance to advantage.", "example": "", "notwhen": "Use 'Acting on the unexpected' when the account describes a specific action in a specific episode rather than a general ability.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 10, "text": "Interestingly, a low degree of knowledge can also stimulate serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 17, "text": "Serendipity is authoritatively and exclusively defined as the “faculty or ability or gift or habit or aptitude or talent” for making unexpected and felicitous discoveries.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 11, "text": "Chance is an event, a happening, serendipity a capability.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 1, "text": "The serendipity gained and lost in the case of the floppy-eared rabbits is a prime example of the third characteristic .", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Carayannis et al. (2011)", "title": "Knowledge Arbitrage, Serendipity, and Acquisition Formality: Their Effects on Sustainable Entrepreneurial Activity in Regions", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2011.2109725", "page": 3, "text": "He proposes that entrepreneurs employ either of two types of knowledge transformation—strategic knowledge serendipity and strategic knowledge arbitrage—in order to incorporate novel knowledge into their ventures.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "Serendipity is better understood as a capability than as a coincidence (De Rond, 2014).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-10", "group": "definition", "status": "reference", "label": "Anomaly against expectations", "description": "The serendipitous datum is anomalous: it contrasts with prior experience or expectations and becomes strategic by setting a new direction. Without such contrast an event is mere chance.", "when": "The person notes that what they encountered was odd or contradicted what they knew or predicted, and that they then built on it.", "example": "", "notwhen": "Use 'Surprise' when the event was only unexpected in occurrence and still fit the person's existing understanding.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Introduction The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 10, "text": "All three of the crucial attributes (unanticipated, anomalous, and strategic) required to fulfill the serendipity pattern in research have also been met for the word’s absorption into the lexicon.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 4, "text": "Without some contrast to theory an event cannot be serendipitous, it is mere chance. 8 Louis Pasteur considered chance to be a subordinate of theoretical advance:“Without theory, practice is but routine born of habit.” (Radot, cited in Merton and Barber, 2004, p. 162).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 5, "text": "They also noted, “Scientists cultivate serendipity by being constantly alert for chance occurrences that may lead to new explanations and discoveries ” (Merton & Barber, 2004, p. 197).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 1, "text": "The serendipity gained and lost in the case of the floppy-eared rabbits is a prime example of the third characteristic .", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-11", "group": "definition", "status": "reference", "label": "Realising what was overlooked", "description": "Genuine discovery comes with the surprise of realising one had overlooked something readily available ('it was under my nose'). It reduces ignorance the person did not know they had.", "when": "The person describes a sudden realisation that an opportunity or fact had been in front of them all along.", "example": "", "notwhen": "Use 'Surprise' when the unexpectedness concerns a new event rather than something already present that had gone unnoticed.", "evidence": [{"cite": "Kirzner (1997)", "title": "Entrepreneurial Discovery and the Competitive Market Process An Austrian Approach", "venue": "", "url": "", "page": 17, "text": "The earmark of a genuine discovery is that it reveals the existence of something concerning which one had not been merely ignorant, but in fact utterly ignorant (in the sense that one was not even aware of one's ignorance).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 5, "text": "But it is in the nature of an overlooked profit opportunity that it has been utterly overlooked, i.e., that one is not aware at all that one has missed the grasping of any profit. . ..", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-12", "group": "definition", "status": "reference", "label": "Chance trigger", "description": "The trigger is a chance event that happened without design, with no obvious cause or link to a present need. It is one of many possible triggers of action and is not a necessary precondition.", "when": "The person describes an unplanned, coincidental or accidental event whose cause they cannot identify or that arose independently of their plans, and which set things in motion.", "example": "", "notwhen": "Use 'Surprise' when the account is about the person's sense of unexpectedness rather than the accidental origin of the event.", "evidence": [{"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 1, "text": "/C115 /C104/C97/C112/C112/C101/C110/C105/C110/C103/C115/C44 /C111/C102/C116/C101/C110 /C117/C110/C102/C97/C116/C104/C111/C109/C97/C98/C108/C101 /C101/C118/C101/C110 /C116/C111 /C105/C116/C115 /C98/C101/C110/C101/C102/C105/C99/C105/C97/C114/C105/C101/C115/C44 /C97/C110/C100 /C117/C110/C112/C114/C101/C100/C105/C99/C116/C97/C98/C108/C101 /C97 /C112/C114/C105/C111/C114/C105/C46 /C69/C108/C117/C115/C105/C118/C101 /C97/C115 /C97 /C116/C104/C101/C111/C114/C101/C116/C105/C99/C97/C108 /C99/C111/C110/C99/C101/C112/C116 /C121/C101/C116 /C99/C101/C114/C116/C97/C105/C110 /C105/C110 /C105/C116/C115 /C101/C97/C114/C116/C104/C108/C121 /C112/C114/C101/C115/C101/C110/C99/C101/C44 /C108/C117/C99/C107/C44 /C97/C100/C109/C105/C116 /C105/C116 /C111/C114 /C110/C111/C116/C44 /C97/C115 /C97 /C110/C111/C110/C45/C116/C114/C105/C118/C105/C97/C108 /C100/C101/C116/C101/C114/C109/C105/C110/C97/C110/C116 /C111/C102 /C112/C101/C114/C102/C111/C114/C109/C97/C110/C99/C101/C44 /C98/C101/C103/C115 /C111/C117/C114 /C102/C117/C114/C116/C104/C101/C114 /C117/C110/C100/C101/C114/C115/C116/C97/C110/C100/C105/C110/C103 /C97/C110/C100 /C115/C104/C111/C117/C108/C100 /C112/C101/C114/C104/C97/C112/C115 /C110/C101/C105/C116/C104/C", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 3, "text": "In the same way, a deterministic world is one in which chance plays no part; it is a world that is, in principle, predictable (Rescher, 1995: 44).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 3, "text": "By “contingency” we mean a sufficient, yet unnecessary, trigger to entrepreneurial action.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 3, "text": "Chance: The serendipity trigger is unlikely, unexpected, unsought, accidental, random, surprising, coincidental, arises independently of, and before, the result.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-14", "group": "definition", "status": "reference", "label": "Value judged by the finder, often in hindsight", "description": "Whether something was unexpected and valuable is judged from the individual's viewpoint. Value is potential and must be realised, and events are often labelled serendipitous only in hindsight. An event can be deliberate for one party yet unplanned for another.", "when": "The person values a find that others overlooked, says its usefulness had to be realised through further action, labels events serendipitous only after they turned out well, or notes that someone else acted deliberately while the event was unplanned for them.", "example": "", "notwhen": "Use 'Beneficial outcome' when the account simply states that the outcome was valuable, without the personal or retrospective framing.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 216, "text": "The same action or event may be seen as serendipitous by one but not by another.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 19, "text": "Furthermore, Busch notes that the potential value of serendipity must be actively materialized to become realized value.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 1, "text": "X's point of view, the event was unexpected and certainly unplanned.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "A serendipitous process includes an unexpected event that is unanticipated, anomalous and possesses the potential for long-term value (Lawley and Tompkins, 2011).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 5, "text": "Scarcity is, of course, a factor in the value of any collector’s item, but most collectors do not value the uncommonness, the peculiarity, the strangeness of their items above all else.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-15", "group": "definition", "status": "reference", "label": "Surprise, agency and value together", "description": "Following Busch, three conditions must all be present: surprise (the discovery is unexpected), agency (purposeful action or a prepared mind) and value (a worthwhile outcome). Pure luck has surprise and value but lacks agency.", "when": "A single account shows all three: an unexpected event, the person acting on it, and a perceived benefit.", "example": "", "notwhen": "Use the separate codes 'Surprise', 'Acting on the unexpected' or 'Beneficial outcome' when only one or two of these elements appear.", "evidence": [{"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 3, "text": "In contrast to pure luck, Busch (2024) argues that in addition to the necessary conditions of surprise and value forming luck, respectively, agency is a third necessary condition for serendipity to happen.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 10, "text": "Value, together with agency and surprise, is one of the necessary conditions of serendipity (Busch, 2024).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reinsberger et al. (2026)", "title": "Deliberate exploratory search in technology innovation: Discovering and developing need-solution pairs", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2025.105348", "page": 5, "text": "Busch (2024) refines this understanding by identifying three necessary conditions — agency, surprise, and value — that differentiate serendipity from luck or targeted innovation.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e00573", "page": 1, "text": "Recent work frames serendipity as the interplay of unexpectedness, agency, and value ( Busch, 2024 ; Busch and Grimes, 2023 ).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-16", "group": "definition", "status": "reference", "label": "Serendipity as a process", "description": "Serendipity is a process and its outcome, not a single event. It runs from a trigger, through a connection to something relevant, to acting on that connection, and often unfolds through effort, alertness and testing over time and across people. This contrasts with authors who treat breakthroughs as fleeting moments.", "when": "The account traces a sequence from an unexpected moment, through linking it to a goal or need, to follow-up action, or describes the discovery as building gradually.", "example": "", "notwhen": "Use 'Unpredictable opportune moment' when the account presents the breakthrough as a sudden, fleeting moment rather than an unfolding sequence.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 75, "text": "It is for this reason that we need to know more about the process, the sequence of actions in time and place that conduct serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 16, "text": "Yaqub (2018), in turn, conceptualized serendipity as unexpected discovery , i.e., an outcome.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 17, "text": "Our review thus established that serendipity is not a singular event, but a process (and related outcome) that requires sagacity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Smith and Hilbolling (2025)", "title": "Demystifying serendipity: How mundane practices enable the identification and pursuit of extraordinary discoveries", "venue": "Strategic Organization", "url": "https://doi.org/10.1177/14761270251386431", "page": 28, "text": "Understanding serendipity as a gradually unfolding process, rather than a eureka moment spontaneously occurring out of the blue, emphasizes the importance of acknowledging serendipity as a practice embedded within an “always already-changing texture of organizations” (Tsoukas and Chia, 2002: 579).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 22, "text": "Often, potential serendipity goes unnoticed if it occurs in environments that do not embrace it, which is particularly salient in the start- up context, in which ideas often evolve serendipitously (Dew, 2009).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "From the enactment perspective, serendipity is best conceptualised as a process rather than a single event.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 4, "text": "Only once the process is complete, i.e., the unexpected event is noticed, associated, and organization action has serendipity taken place.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-17", "group": "definition", "status": "reference", "label": "Connecting separate elements", "description": "Serendipity involves combining two or more observations, events or pieces of information into a meaningful new pairing that is then put to use. This includes recognising that something that first seemed out of place is useful.", "when": "The person describes linking an unexpected observation or piece of information with something else they knew, so that the pieces 'add up' into a new idea or opportunity.", "example": "", "notwhen": "Use 'Serendipity as a process' when the account traces the whole sequence through to action, rather than centring on the act of combining elements.", "evidence": [{"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 2, "text": "Etymologically speaking, serendipity describes the process of identifying meaningful pairings of two or more observations, events or fragments of information that can be put to practical or strategic use.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 61, "text": "As the princes wander along and move through an unfamiliar environment they glean pieces of information that unexpectedly “add up” and that—with hindsight—become useful later in the story.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 26, "text": "A first distinction is that between “true” and “pseudo” serendipity, where one seeks A but finds B, and where B is ultimately the more highly valued.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 14, "text": "I speak of a 'finding' when two or more elements (observations, hypotheses, ideas, facts, relations or insights) are combined originally, for the finder or anybody, to something new an d true (science), new and useful (technology), or new and fascinating (arts).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-18", "group": "definition", "status": "reference", "label": "Existing thing finds an unintended use", "description": "Something that already exists, such as a product, skill, knowledge, technology or earlier decision, turns out by chance to serve a purpose nobody intended, often with little adjustment and without foresight.", "when": "The account describes capabilities, assets or decisions developed for one purpose that later proved useful for a new venture, market or problem nobody had anticipated.", "example": "", "notwhen": "Use 'Finding something not sought' when the find is new information or an opportunity encountered, rather than a new use for something the person already had.", "evidence": [{"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 3, "text": "In biology, preadaptation refers to cases when the feature of an organism proves by chance to be useful, or preadapted, for performing a function other than the one for which it developed or was originally selected (Bock 1959, Gould and Vrba 1982).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 3, "text": "Similarly, Viagra was found useful against the problem of erectile dysfunction although it was developed as an anti - hypertensive drug.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 17, "text": "However, a right-wing government stopped it, and it was not till a new government in 1995 formally articulated carbon dioxide as a major problem that this goal was politically stabilized.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 2, "text": "Underpinning this phenomenon is the concept of serendipity which refers to the unanticipated discovery of something beneficial. 2.1.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-19", "group": "definition", "status": "reference", "label": "Unpredictable opportune moment", "description": "Serendipitous moments cannot be predicted, scheduled or willed. They are opportune times when 'the time is right', or fleeting coincidences, though they may rest on prior engagement with the field.", "when": "The person describes a breakthrough or lucky break that came at an unscheduled, favourable moment or from a passing coincidence they could not have planned.", "example": "", "notwhen": "Use 'Serendipity as a process' when the account stresses gradual unfolding through effort over time.", "evidence": [{"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 2, "text": "These eureka moments can neither be predicted nor willed a priori, but require prior engagement (Usher 1954; Irvine & Martin 1984) – a paradox aptly captured by Pasteur when he observed that ‘chance favors only the prepared mind’.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Hargadon and Bechky (2006)", "title": "When Collections of Creatives Become Creative Collectives: A Field Study of Problem Solving at Work", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1060.0200", "page": 2, "text": "Rather than focusing on the group and organizational variables that make up the ongoing context for creativity, this perspective recognizes the fleeting coincidence of behaviors that triggers moments when creative insights emerge.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-20", "group": "definition", "status": "reference", "label": "Unplanned encounter with new people", "description": "A chance encounter exposes the person to people they would not otherwise have met and to unfamiliar information. The connection happens spontaneously, not through a deliberate attempt to bring people together.", "when": "The person describes meeting someone by chance, or a connection arising spontaneously, often after direct efforts had failed, and this interaction shaped the venture idea.", "example": "", "notwhen": "Use 'Chance trigger' when the unplanned event does not involve meeting people. Do not apply when the meeting was a deliberately targeted contact.", "evidence": [{"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 26, "text": "Nevertheless, moderators might not have the required knowledge to evaluate search needs, leaving limited available options to bring them together.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 227, "text": "The process was not initiated through a conscious effort to reconcile and bring them together.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 2, "text": "In particular, even if an encounter eventually produces new knowledge, this process may occur slowly and only emerge after a number of years (Catalini, 2018; Fleming, 2001 ).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "definition-21", "group": "definition", "status": "reference", "label": "Unexpected in time or place", "description": "The unexpectedness may lie in when a find occurs or in where it is found ('where one least expects it'), rather than in what is found.", "when": "The account stresses that a find came at an unexpected moment or in an unexpected setting.", "example": "", "notwhen": "Use 'Finding something not sought' when what was found differed from what was sought, rather than only its timing or location.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Dictionaries and Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 12, "text": "Previous dictionary definitions had not related the factor of unexpectedness either to time or to place, and if there are any suggestions in Walpole in this regard, they would seem to imply that he had unexpectedness with respect to time rather than place in mind.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "type-01", "group": "type", "status": "core", "label": "Mertonian: sought, found unexpectedly", "description": "The founder was looking for something specific and found it, but through chance: an unexpected source, path or moment. The goal stayed the same.", "when": "A known problem or need was solved by something that turned up unexpectedly.", "example": "'We needed a supplier, and the guy next to me on the plane ran one.'", "notwhen": "The find answered a different problem or changed the goal; use type-02.", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 3, "text": "Thus, I distinguish Mertonian serendipity where the discovery may lead to the solution of a given problem via an unexpected route, as distinct from the more traditional type of serendipity where the discovery leads to the solution of an entirely different problem.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 18, "text": "What was unexpected was the “how” or “when” of the discovery, not the “what,” the object of discovery itself.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 5, "text": "Put simply, Archimedean serendipity applies to a situation where one islooking for something, and they accidentallyfind it.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 3, "text": "A search for a solution to a known problem is under way, but the solution comes from an entirely unexpected place.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 11, "text": "When it came to the discovery of PCR and DNA, those involved found what it was they were looking for but by way of chance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2021)", "title": "The art of discovering and exploiting unexpected opportunities: The roles of organizational improvisation and serendipity in new venture performance", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2021.106121", "page": 14, "text": "When we solve a particular problem, the solution is often unexpected.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 26, "text": "When it came to the Nobel prize winning discoveries of PCR and DNA, Mullis and Francis and Crick, respectively, found what they were looking for but by way of chance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Oo et al. (2025)", "title": "The Aha Moment! The Effects of Serendipity and Innovation on Crowdfunding Performance", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587241254069", "page": 5, "text": "Second, a serendipitous invention can either be an unexpected solution to a given problem at hand (Mertonian serendipity) or to a problem that was not intended to be solved (Walpolian serendipity).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 85, "text": "A search for a solution to a known problem is under way, but the solution comes from an entirely unexpected place.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Pease et al. (2013)", "title": "A Discussion on Serendipity in Creative Systems", "venue": "", "url": "", "page": 3, "text": "The discovery may be an example of a sought finding (classified by Roberts as pseudoserendipity (Roberts 1989, p. x)), in which case the solution arises from an unknown, unlikely, coincidental or unexpected source.", "close": false, "none": false, "chosen": "reading"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 11, "text": "Sometimes, as researchers have found, a serendipitous event triggers a new solution approach to a formulated problem already being worked upon, and the records of many successful discovery processes often show important serendipitous events (Campbell 1960, Fioratou and Cowley 2009).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "type-02", "group": "type", "status": "core", "label": "Walpolian: sought one, found another", "description": "While working on one goal, the founder found something valuable for a different purpose, and turned toward it.", "when": "A project or search ended up producing a different product, market or direction.", "example": "'We were building a tool for agencies and schools started buying it.'", "notwhen": "The original goal was met unexpectedly (type-01), or there was no search (type-03).", "evidence": [{"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 2, "text": "This forms the basis of our first type – Walpolian serendipity – discovery of things which the discoverers were not in search of – for which I can offer some of the most well-known discoveries as examples.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Dictionaries and Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 16, "t
