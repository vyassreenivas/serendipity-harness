ding"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 3, "text": "The assumption of reasoned intentionality has the effect of imposing an ex ante teleology on entrepreneurial behavior, wherein entrepreneurs are presumed to control their time, resources, and environments (Lippmann & Aldrich, 2016) and purposefully progress through the phases of idea generation, resource mobilization, and functional establishment (Aldrich & Ruef, 2006).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 16, "text": "When Paul Guehler, a 3M vice president, was charged with breathing fresh life into the struggling division during the early 1990s, he and the division’s managers carefully assessed the market potential of the division’s various technologies, ideas and applications.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "Mintzberg et al. (1996)", "title": "CMR Forum: The “Honda Effect” Revisited", "venue": "California Management Review", "url": "https://doi.org/10.2307/41165855", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "rival-10", "group": "rival", "status": "core", "label": "Working with what's at hand", "description": "The venture is explained as the founder combining resources, skills or contacts they already had, with no unexpected trigger (effectuation, bricolage).", "when": "The founder describes building from their own means, making do and recombining, and reports no surprise.", "example": "'I had a van and some carpentry skills, so I started there.'", "notwhen": "An unexpected event and its recognition are also present; then it supports serendipity.", "evidence": [{"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 5, "text": "In contrast, effectuation begins with existing means and resources and subsequently searches for problems that can be addressed using those means (Busch and Grimes, 2023).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 5, "text": "In terms of materiality bricolage makes do with the materials at hand; creativity seeks to represent them in new ways; improvisation rings the changes on familiar themes, while serendipity registers the shock of the new.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 4, "text": "They can also be contrasted against “garbage-can” models of decisionmaking or effectual models of innovation in which the actor starts with existing solutions, resources, or other means and subsequently searches for problems that might be addressed by way of those means (Cohen et al. 1972; Sarasvathy 2008).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 4, "text": "It views entrepreneurs as following a logic of control that helps them overcome the problem of predicting the future by instead considering one’s available resources and evaluating the possible outcomes that can be generated on an ad hoc basis (Sarasvathy, 2001, 2003).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Carayannis et al. (2011)", "title": "Knowledge Arbitrage, Serendipity, and Acquisition Formality: Their Effects on Sustainable Entrepreneurial Activity in Regions", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2011.2109725", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "rival-02", "group": "rival", "status": "reference", "label": "Venture performance as random luck", "description": "Differences in venture survival, growth or profitability are explained as the luck of the draw, random shocks, timing or external conditions rather than founders' skills or actions. Authors differ: some argue luck should be the default explanation, while others criticise this view or hold that chance events are spread evenly and cannot by themselves explain performance.", "when": "The account attributes the venture's overall results, survival, failure or growth mainly to chance, random shocks, timing or uncontrollable conditions, or to the market being so ambiguous that results were a game of luck.", "example": "", "notwhen": "Confused with 'Pure luck without agency', which concerns a single fortunate event. Also confused with 'Compounding early advantage or privilege': use that code when an initial lucky break or privilege is said to have snowballed over time.", "evidence": [{"cite": "Denrell et al. (2015)", "title": "Perspective—Chance Explanations in the Management Sciences", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2014.0946", "page": 4, "text": "Finally, chance explanations do not have to assume that social reality is \"essentially\" random.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 15, "text": "Realistically, probably both luck and foresight play a role; the challenge is to clarify when each of these two forces is more likely to be at work.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Davis et al. (2009)", "title": "Optimal Structure, Market Dynamism, and the Strategy of Simple Rules", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2009.54.3.413", "page": 18, "text": "Yet both the range of optimal structures and the peak performance at the optimal structure differ in the low- versus the highambiguity environments.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 11, "text": "Significantly, they find that as much as half of variations in performance cannot be explained by firm or industry attributes (McGahan & Porter, 2002).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 2, "text": "Serendipity apparently happens in a random manner, implying that it is not manageable.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Soto-Simeone et al. (2021)", "title": "The role of skill versus luck in new venture survival", "venue": "International Journal of Management Reviews", "url": "https://doi.org/10.1111/ijmr.12262", "page": null, "text": "", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 19, "text": "But what entrepreneurs do with such events can make a real difference in performance.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-03", "group": "rival", "status": "reference", "label": "Compounding early advantage or privilege", "description": "Success is traced to advantaged starting conditions, such as inherited wealth, social connections, early luck or early success, that were amplified over time through path dependence or rich-get-richer dynamics, rather than to serendipity.", "when": "The account shows that a privileged start, an early lucky break or initial success opened doors (for example investor contacts or extra resources) that then drove later success or survival, or that lock-in followed an initial chance event without anyone actively seizing it.", "example": "", "notwhen": "Confused with 'Superior resources or complementary assets', which credits resources or capabilities treated as the firm's genuine strengths rather than as advantages that luck or privilege handed out and then compounded.", "evidence": [{"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 30, "text": "For example, exceptional performers might have started out with specific privileges (or ‘blind’ luck) that are amplified over time (see, Barnsley et al., 1985; Liu and de Rond, 2016).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 102, "text": "Related questions could focus on the link between serendipity and inequality.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2019)", "title": "In Search of Behavioral Opportunities From Misattributions of Luck", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2017.0239", "page": 14, "text": "By reducing exposure to the norms, incumbents, and noisy information, a strategist is more likely to judge an opportunity based on its merit rather than social norms.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 16, "text": "Exceptional performances may have little to do with initial levels of skill, but merely reflect contexts where rich-get-richer dynamics are stronger.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, lertness', which concerns a general readiness to notice rather than specific foresight.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 17, "text": "Thus he happened to conceive of all radiology in that instant, showing more acute insight than could ever be set down to accident.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Barney (1986)", "title": "Strategic Factor Markets: Expectations, Luck, and Business Strategy", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.32.10.1231", "page": 10, "text": "Any informational advantages obtained in this manner must reflect a firm's good fortune and luck, not their skill in evaluating the return potential of strategies.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 21, "text": "Their disagreement reflects similar fundamental and recurring tensions in the organizational literature, such as that between foresight and luck (Cattani 2006, Garud et al. 1997).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brownell et al. (2024)", "title": "Choice or chance: How successful entrepreneurs talk about luck", "venue": "Journal of Small Business Management", "url": "https://doi.org/10.1080/00472778.2023.2169703", "page": 3, "text": "Critically, it is impossible to demonstrate via measurement the “entity realism” of luck (Borsboom et al., 2003 ).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 15, "text": "The other arguement is that competitive advantage can be the result of \"any kind of managerial foresight or strategic insight\" (Henderson 2000, p. 289).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Adegbesan (2009)", "title": "On the Origins of Competitive Advantage: Strategic Factor Markets and Heterogeneous Resource Complementarity", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2009.40632465", "page": 3, "text": "According to Barney, \"The cost of acquiring strategic resources will approximately equal the economic value of those re sources,\" unless \"buyers are consistently better informed about their future value\" (1986: 1231, 1232) or are just plain lucky.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell et al. (2012)", "title": "Inferring superior capabilities from sustained superior performance: A Bayesian analysis", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.2001", "page": 14, "text": "More generally, our Bayesian analysis suggests a way to control for the confounding impact of chance.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 24, "text": "Such foresight, in turn, resulted in the mobilization of specific elements of 3M’s past in productive ways.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Ma (2002)", "title": "Competitive advantage: what’s luck got to do with it?", "venue": "Management Decision", "url": "https://doi.org/10.1108/00251740210433927", "page": 6, "text": "/C109/C101/C101/C116/C115 /C111/C112/C112/C111/C114/C11 chance', which credits knowing or anticipating something rather than possessing assets. Also confused with 'Compounding early advantage or privilege', which treats the advantage as luck or privilege amplified over time.", "evidence": [{"cite": "Adegbesan (2009)", "title": "On the Origins of Competitive Advantage: Strategic Factor Markets and Heterogeneous Resource Complementarity", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2009.40632465", "page": 11, "text": "There fore, for a firm acquiring in the face of competition, the gains to trade it can be guaranteed ex ante are those resulting from its superior complementarity relative to the acquiring firm that displays least complementarity to the target resource.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Denrell (2004)", "title": "Random Walks and Sustained Competitive Advantage", "venue": "Management Science", "url": "https://doi.org/10.1287/mnsc.1030.0143", "page": 4, "text": "In this process, stocks of resources at a given time are a function of past levels of resources and the size of flows of resources.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Cattani (2005)", "title": "Preadaptation, Firm Heterogeneity, and Technological Performance: A Study on the Evolution of Fiber Optics, 1970–1995", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.1050.0145", "page": 16, "text": "A firm, for instance, is more likely to enter a new market or industry if it also \"possesses a broad base of assets required for successful commercialization of the new goods...\" (Mitchell 1989, p. 208).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Eisenhardt and Sull (2001)", "title": "Strategy as Simple Rules", "venue": "", "url": "", "page": 4, "text": "Nor is it possible to attribute Yahoo!’ssuccess to unique or valuable resources – its founders had little more than a computer and a great idea when they started the company.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Soto-Simeone et al. (2021)", "title": "The role of skill versus luck in new venture survival", "venue": "International Journal of Management Reviews", "url": "https://doi.org/10.1111/ijmr.12262", "page": 4, "text": "Moreover, entrepreneurs’ experience in a similar industry generates transferable capabilities and knowledge about the task environment, improving the chances of survival (Lyles et al.,2004;v a n Praag,2003).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Graebner (2004)", "title": "Momentum and serendipity: how acquired leaders create value in the integration of technology firms", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.419", "page": 23, "text": "A potential hypothesis would be that acquired companies with more resources, such as a more developed organization or more experienced management, would be more likely to yield unexpected windfalls.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-08", "group": "rival", "status": "reference", "label": "Chance find for an existing goal", "description": "Something found by chance, or in an unexpected place, served a goal the person already held, so on a narrow view it is pseudo-serendipity or not serendipity at all. Authors differ: some reserve serendipity for cases where the objective changed, while Busch and Grimes reject this narrow view.", "when": "The person was already on the lookout for a solution of that kind, and the unexpected find advanced that same goal without changing their objective.", "example": "", "notwhen": "Confused with 'Deliberate systematic search', where the answer came as expected from the search itself. Do not use when the find changed what the person was trying to do.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 85, "text": "In this view, pseudoserendipity is about a situation in which you are looking for something already, and then come across something coincidentally that helps you reach the initial goal.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-09", "group": "rival", "status": "reference", "label": "Deliberate incremental extension or iteration", "description": "A new use or venture idea is explained as the planned extension of an existing technology to adjacent targets, improvement within the same domain, or planned cycles of prototyping and reformulating the problem.", "when": "The account describes systematically trying a product on closely related problems or markets, making a technology more efficient or robust within its original field, or reaching the idea through planned iterative prototype testing with users.", "example": "", "notwhen": "Confused with 'Deliberate systematic search', which looks for an opportunity from scratch rather than stepwise extension or iteration of something existing. Do not use when the technology was moved to an unexpected new field through a chance encounter.", "evidence": [{"cite": "Andriani et al. (2017)", "title": "Measuring Exaptation and Its Impact on Innovation, Search, and Problem Solving", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2017.1116", "page": 18, "text": "The radiation can be explained by the fact that uses designed for a target are likely to work for adjacent targets (that rely on the same or similar pathways).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "von Hippel and von Krogh (2016)", "title": "CROSSROADS—Identifying Viable “Need–Solution Pairs”: Problem Solving Without Problem Formulation", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2015.1023", "page": 13, "text": "In rapid prototyping, problem solvers respond to initial user need specifications by quickly developing and delivering to users (usually within weeks) an inexpensive, easy-to-modify, working model that provides much of the functionality contained in the initial request.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 7, "text": "Similarly, some projects signalled new application areas by envisioning what opportunities can be created if the technology becomes a magnitude more efficient or powerful.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-11", "group": "rival", "status": "reference", "label": "Routines rather than chance", "description": "Apparently fortunate connections or foundings are explained by established routines, such as a serial founder's familiar founding approach or organisational practices that systematically produce new combinations.", "when": "The account attributes the connection or founding to repeated, systematic practices, for example brainstorms, knowledge catalogues, deliberate involvement of experts, or a repeat founder applying a familiar approach.", "example": "", "notwhen": "Confused with 'Means-driven processes', which concern ad hoc combination of resources at hand rather than standing routines. Do not use when the person stresses genuine unexpectedness in the encounter.", "evidence": [{"cite": "Hargadon (1997)", "title": "Technology Brokering and Innovation in a Product Development Firm", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2307/2393655", "page": 27, "text": "It acts as a technology broker by introducing these solutions to industries where they are not known, and, in the process, creates new products that are original combinations of existing knowledge from disparate industries.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Baker et al. (2003)", "title": "Improvising firms: bricolage, account giving and improvisational competencies in the founding process", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00099-9", "page": 7, "text": "However, in both the cases, the founding business models for the new firms differed substantially from the old.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-12", "group": "rival", "status": "reference", "label": "Opportunity discovered by alertness", "description": "The opportunity is treated as pre-existing and found through the entrepreneur's alertness, observation, general opportunity-spotting ability or traits. It is then pursued. Some authors criticise this view in favour of opportunities enacted or created collectively.", "when": "The person attributes the discovery to being on the lookout, generally good at spotting opportunities, or alert to an existing market gap, which was then pursued with gathered resources.", "example": "", "notwhen": "Confused with 'Spontaneous recognition without search', which involves information arriving by chance and being recognised through specific prior knowledge rather than general alertness. Also confused with 'Foresight or insight rather than chance', which concerns specific anticipation.", "evidence": [{"cite": "Baker and Nelson (2005)", "title": "Creating Something from Nothing: Resource Construction through Entrepreneurial Bricolage", "venue": "Administrative Science Quarterly", "url": "https://doi.org/10.2189/asqu.2005.50.3.329", "page": 30, "text": "Rather, the processes of discovering opportunities and enacting resources were often one and the same, with both the resource environment and the opportunity environment idiosyncratic to the specific firm and constructed through processes of bricolage.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2008)", "title": "Effectuation Elements of Entrepreneurial Expertise", "venue": "", "url": "https://doi.org/10.4337/9781848440197", "page": 7, "text": "But the ideas in this book suggest that opportunities themselves originate through the effectual process.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 11, "text": "The empirical observation that each of them was inferior at opportunity discovery for seven out of the eight opportunities suggests that superiority at the discovery process alone is not sufficient to explain the discovery of opportunity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud and Karnøe (2003)", "title": "Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "venue": "Research Policy", "url": "https://doi.org/10.1016/s0048-7333(02)00100-2", "page": 4, "text": "From this perspective, it is not just the discovery of new opportunities by alert individuals ( Kirzner, 1997) or speculation on the future (Knight, 1971).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 16, "text": "I do agree with Pattle, as cited by Comroe [1967d]: ( .. .) some writers refer to a discovery based on observation of something which was not what was actually being investigated, as a 'chance' or 'accidental' discovery.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": 7, "text": "These structures drive not only where attention is focused (Ocasio, 1997) but also how the firm approaches problems and opportunities more broadly (Souitaris & Maestro, 2010).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-13", "group": "rival", "status": "reference", "label": "Spontaneous recognition without search", "description": "Information arrives by chance, for example through social contacts, and a person with relevant prior knowledge recognises an opportunity without having been engaged in any quest or search. Dew treats this as distinct from serendipity, which arises during an active pursuit.", "when": "Someone with relevant knowledge happens to receive information and sees an opportunity, while not pursuing any search or other goal at the time.", "example": "", "notwhen": "Confused with 'Opportunity discovered by alertness', which credits general alertness rather than chance information meeting specific prior knowledge. Do not use when the person was actively pursuing another goal when the chance event occurred.", "evidence": [{"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 8, "text": "It differs from prediscovery in that it incorporates a role for prior knowledge in the opportunity discovery process.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-14", "group": "rival", "status": "reference", "label": "Pre-discovery", "description": "During search, a person stumbles on something that seems significant but lacks the knowledge to evaluate it. Its value is realised only later, once complementary knowledge exists.", "when": "The account describes coming across something during work that seemed important but could not be understood or commercialised until much later.", "example": "", "notwhen": "Confused with 'Spontaneous recognition without search': there the person's prior knowledge allowed immediate recognition and there was no search. Do not use if existing knowledge let them see the implications at once.", "evidence": [{"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 8, "text": "This is the space where contingency and search overlap, but without prior knowledge (sagacity).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-15", "group": "rival", "status": "reference", "label": "Innate genius or heroic personality", "description": "Discoveries or success are explained solely by the founder's innate gift, genius, knack or heroic, never-say-die character. Authors criticise this as tautological and as sidestepping specific reasoning practices.", "when": "The account credits the outcome only to the founder's natural talent, exceptional character or being the right kind of person.", "example": "", "notwhen": "Confused with 'Effort and persistence over luck', which credits sustained work rather than inborn traits. Do not use when the account describes specific recognition practices or the circumstances that produced the event.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 127, "text": "Recent proposals for how to increase serendipity in a variety of contexts illustrate this belief that increasing the number of chance connections made is the key, so that they may more likely befall the ‘right person’ to recognize their value.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Merton and Barber (2004)", "title": "Afterword Autobiographic Reflections on The Travels and Adventures of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "The Travels and Adventures of Serendipity", "url": "https://doi.org/10.1515/9781400841523", "page": 29, "text": "It is said to be a faculty, capacity, gift, or talent for making felicitous discoveries by chance.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 16, "text": "Or it could be the charismatic and heroic personalities of the entrepreneur that did it, the never-say-die spirit that eventually triumphs in spite of circumstances to the contrary.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-16", "group": "rival", "status": "reference", "label": "Effort and persistence over luck", "description": "Outcomes are explained by hard work, tenacity, will power, persistence, skill or relationships, explicitly rather than by luck or serendipity.", "when": "The person or a narrator attributes the result mainly to persistent effort, determination or seizing an opportunity others let pass, treating luck as minor.", "example": "", "notwhen": "Confused with 'Innate genius or heroic personality', which credits fixed traits rather than effort. Do not use if an unexpected find played a central role in the result.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Social History of Serendipity. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 4, "text": "Lewis’ persistence, however, has been greater than his luck.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Daniels and Wang (2019)", "title": "What do you think? Success: is it luck or is it hard work?", "venue": "Applied Economics Letters", "url": "https://doi.org/10.1080/13504851.2019.1593930", "page": 3, "text": "As a result, these individuals are more likely to associate success with hard work than with pure luck.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 3, "text": "He later emphasized that Aemming's discovery was mainly attributable to tenacity in seizing an opportunity others had let pass rather than due to just pure chance (Scott, 1947).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-17", "group": "rival", "status": "reference", "label": "Impulsive personal drivers", "description": "Venturing steps are explained by impulse, disinhibition or personal disposition, which are internal dynamics that drive unreasoned action, rather than by an unexpected external event.", "when": "The account attributes an unplanned venturing step to the person's impulsivity, disinhibition or temperament.", "example": "", "notwhen": "Confused with 'Pure luck without agency': use that code when the unplanned element is an external chance event or encounter rather than the person's own impulses.", "evidence": [{"cite": "Van Lent et al. (2022)", "title": "Historiography and the excavation of nascent business venturing", "venue": "Small Business Economics", "url": "https://doi.org/10.1007/s11187-022-00691-w", "page": 11, "text": "Internal factors include personal dynamics that incite nonrational action.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-18", "group": "rival", "status": "reference", "label": "Inevitability or obviousness", "description": "A seemingly serendipitous discovery is explained as obvious, in the air, or bound to happen given existing knowledge, timing or system behaviour. Chance only affected who made the discovery or when.", "when": "The account suggests the opportunity was widely known or obvious, that someone would have found it anyway, that the time was simply ripe, or that the supposedly accidental event followed predictably from earlier interactions.", "example": "", "notwhen": "Confused with 'Environmentally imposed direction', which concerns outside forces dictating the venture's course rather than the discovery being bound to happen. Do not use when the event was genuinely unforeseeable given existing knowledge.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 24, "text": "The discovery was the logical and perhaps necessary conclusion to a long series of investigations and the only [our italics] accidental circumstance connected with it was that Roentgen happened to note the fluorescence on a screen at the particular time that the phenomenon was evident.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 14, "text": "Choice, Chance, and Inevitability in Strategy 547 from the arguments preceding them.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 15, "text": "Christopher Columbus, for instance, never had the sagacity to recognize the significance of his discovery.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 10, "text": "Thus viewed, the ‘accidental’ event may be explained by prior interactions, and might perhaps be a recurring result of them, though any particular instance remains unpredictable.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "McMullen and Shepherd (2006)", "title": "Entrepreneurial Action And The Role Of Uncertainty In The Theory Of The Entrepreneur", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2006.19379628", "page": 12, "text": "In other cases, there is nothing to discover about them, be cause they are quite obvious.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 16, "text": "Maybe it was a matter of inevitability, a simple matter of the timing being right.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-19", "group": "rival", "status": "reference", "label": "Environmentally imposed direction", "description": "The venture's emergence or direction is explained by market forces, institutions, reward structures, situational factors or general changes in circumstances that determine or force action, rather than by chance or choice.", "when": "The account says market imperatives, government, clients, institutional incentives, industry structure, selection forces or broad conditions such as access to finance or a poor economy dictated or triggered the venture's course, leaving little choice.", "example": "", "notwhen": "Confused with 'Acting on others' prompting or pressure', which concerns specific outside parties pointing out or pushing particular unexpected information. Also confused with 'Inevitability or obviousness'.", "evidence": [{"cite": "Harmeling and Sarasvathy (2013)", "title": "When Contingency is a Resource: Educating Entrepreneurs in the Balkans, the Bronx, and Beyond", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/j.1540-6520.2011.00489.x", "page": 8, "text": "Maybe property rights will do the trick, for example, or maybe financial incentives would suffice.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Mintzberg and Waters (1985)", "title": "Of strategies, deliberate and emergent", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.4250060306", "page": 13, "text": "Again the organization has internalized the imperative so that strategic choice becomes a moot point.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Reijonen and Heroum (2026)", "title": "Critical events and the interplay between serendipity and effectuation in an unforeseen venture creation", "venue": "International Journal of Entrepreneurial Behavior & Research", "url": "https://doi.org/10.1108/ijebr-12-2023-1242", "page": 3, "text": "Some triggering events have a broad scope, while others are more specific, or can be subdivided into detailed components (Schindehutte et al., 2000).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Sarasvathy (2001)", "title": "Causation and Effectuation: Toward a Theoretical Shift from Economic Inevitability to Entrepreneurial Contingency", "venue": "The Academy of Management Review", "url": "https://doi.org/10.2307/259121", "page": 21, "text": "262 Academy of Management Review April gent endowments and endeavors but as the in - evitable outcome of mindless \"forces,\" stochastic processes, or environmental selection.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "de Rond and Thietart (2007)", "title": "Choice, chance, and inevitability in strategy", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.602", "page": 6, "text": "Porter's (1980) suggestion that profitability is contingent on five generic forces is still part and parcel of strategy, yet character ized by an environmental determinism (Aktouf, Chenoufi, and Holford, 2005).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and de Rond (2016)", "title": "Good Night, and Good Luck: Perspectives on Luck in Management Scholarship", "venue": "Academy of Management Annals", "url": "https://doi.org/10.1080/19416520.2016.1120971", "page": 31, "text": "This line of research thus undermines the role of actors and emphasizes the role of situational factors such as networks in serendipitous discoveries.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-20", "group": "rival", "status": "reference", "label": "Acting on others' prompting or pressure", "description": "The organisation acts on information mainly because others pointed it out and many followed, or because outside parties such as policymakers evaluated it and pressured the organisation to act.", "when": "The account shows the opportunity was suggested by others and pursued by many actors at once, or that the person acted on unexpected information because government or other outsiders pushed them to.", "example": "", "notwhen": "Confused with 'Environmentally imposed direction', which concerns broad structural forces rather than specific parties prompting action on particular information. Do not use when the person noticed and evaluated the information independently.", "evidence": [{"cite": "Nguyen et al. (2024)", "title": "Serendipity as a Strategic Advantage", "venue": "", "url": "", "page": 3, "text": "Second, the decision-maker notices unexpected information but mostly because others have pointed it out and suggested a way to leverage it.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-21", "group": "rival", "status": "reference", "label": "Deliberate targeted networking", "description": "Valuable ties are explained as planned: the entrepreneur knew in advance which contacts or resources were needed and pursued them, or used referrals and intermediaries such as investors, rather than meeting people by chance.", "when": "The entrepreneur describes identifying a needed contact in advance and pursuing them, cold outreach, asking for referrals, negotiating with several partners in parallel, an investor introducing a cofounder, or leveraging existing acquaintances for a predefined goal.", "example": "", "notwhen": "Confused with 'Prior ties and network structure', which attributes outcomes to existing ties or similarity without deliberate goal-directed outreach. Do not use when the value of the connection was unknown beforehand.", "evidence": [{"cite": "Clough et al. (2019)", "title": "Turning Lead into Gold: How Do Entrepreneurs Mobilize Resources to Exploit Opportunities?", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/annals.2016.0132", "page": 8, "text": "In a similar vein, Hallen and Eisenhardt (2012) document strategies which entrepreneurs use to successfully cultivate new ties to potential investors, such as negotiating in parallel with multiple potential partners.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 5, "text": "By contrast, in settings of uncertainty, goals are emergent, and predicting which ties will be needed and what value they will create for the nascent entrepreneur may be impossible.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Engel et al. (2017)", "title": "Toward a dynamic process model of entrepreneurial networking under uncertainty", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2016.10.001", "page": 5, "text": "For instance, current conceptions of networking tend to be instrumental in nature, as actions are organized around a relatively stable goal such as receiving investment (Hallen and Eisenhardt, 2012) or seeking other venture resources (Zott and Huy, 2007).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 14, "text": "While this shares similarities with the effectual view ( Engel et al., 2017 ), networking with strangers is distinct from the effectual view as the serendipity engine does not involve a search among existing ties.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-22", "group": "rival", "status": "reference", "label": "Prior ties and network structure", "description": "Outcomes or partnerships are explained by pre-existing relationships, network position, a preference for similar others, or the commitment of close contacts, rather than by unexpected encounters.", "when": "The account attributes the opportunity or collaboration to existing ties, network position, a close friend or family member's help, or seeking out similar others.", "example": "", "notwhen": "Confused with 'Deliberate targeted networking', which involves planned outreach for a known goal. Do not use when a new, unexpected meeting is central.", "evidence": [{"cite": "Lane et al. (2020)", "title": "Engineering serendipity: When does knowledge sharing lead to knowledge production?", "venue": "Strategic Management Journal", "url": "https://doi.org/10.1002/smj.3256", "page": 8, "text": "First, principles of homophily suggest that people are attracted to others who hold similar values because their interactions are more rewarding and less uncertain (McPherson & Smith-Lovin, 1987), as a result of the benefits of security and mutual attraction (Dahlander & McFarland, 2013).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 2, "text": "This assumes entrepreneurs (or incubators) know which kind of ties they will need, which network outcomes are possible, and which objectives might emerge for them based on ongoing social interactions (Engel et al., 2017).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Granovetter (1973)", "title": "The Strength of Weak Ties", "venue": "", "url": "", "page": 13, "text": "I will use this as a measure of tie strength.15 A natural a priori idea is that those with whom one has strong ties are more motivated to help with job information.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-23", "group": "rival", "status": "reference", "label": "Success credited to skill that chance could explain", "description": "Outcomes are attributed to skill, strategy or customer orientation when chance events, survivor-only evidence or alternative causes could equally explain them.", "when": "The account draws lessons about success from successful cases alone, infers that success proves good strategy or meeting customer needs, or credits skill while ignoring evident chance events or causes such as competitor weakness or shortages.", "example": "", "notwhen": "Confused with 'Reconstructed or embellished accident narrative', where the chance story itself is what has been constructed after the fact. Do not use when the person describes actively noticing and acting on an unexpected event.", "evidence": [{"cite": "Denrell (2003)", "title": "Vicarious Learning, Undersampling of Failure, and the Myths of Management", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.14.2.227.15164", "page": 11, "text": "Thus, if we only observe successful entrepreneurs, it is likely that we overestimate the benefits of a persistent and singleminded focus.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Liu and Tsay (2023)", "title": "A normative theory of luck", "venue": "Frontiers in Psychology", "url": "https://doi.org/10.3389/fpsyg.2023.1157527", "page": 4, "text": "March developed a series of “chance models” to challenge this assumption by showing how randomness and situational factors play more important roles in outcomes (March and March, 1977 , 1978).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 13, "text": "Thus, even if success is the result of luck, it is possible to construct an “explanation” (Fischhoff 1975, 1982).", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 5, "text": "If it isn’t, then customer orientation can’t be inferred from evidence of commercial success.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-24", "group": "rival", "status": "reference", "label": "Reconstructed or embellished accident narrative", "description": "The story of an unplanned or lucky discovery may have been rationalised after the fact, exaggerated or second-hand, or luck may be invoked as a catch-all for otherwise unexplained outcomes.", "when": "There are signs that the accident narrative was reconstructed later, embellished relative to evidence of effort, or that luck or serendipity is cited loosely to explain what is otherwise unexplained.", "example": "", "notwhen": "Confused with 'Success credited to skill that chance could explain', which concerns skill stories that hide chance rather than chance stories that may hide effort.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "The Diverse Significance of Serendipity in Science. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 25, "text": "Serendipity in Science 181 berg’s view might be put as follows: If accident is not all, neither is it nothing.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 2, "text": "Furthermore, serendipity is often suggested by management scholars as a possible reason for “unexplained ” outcomes.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Shane (2000)", "title": "Prior Knowledge and the Discovery of Entrepreneurial Opportunities", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.11.4.448.14602", "page": 19, "text": "They might have rationalized a process that had either favorable or unfavorable outcomes for them.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-25", "group": "rival", "status": "reference", "label": "Need-pull or technology-push development", "description": "The venture or invention is explained as a planned response to an existing market need, or as pushing a technology or scientific discovery toward a use identified in advance, including through institutional incentives.", "when": "The account presents the idea as answering a known demand, as commercialising a technology toward a predefined use, or as steered by subsidies or technology-transfer programmes.", "example": "", "notwhen": "Confused with 'Deliberate systematic search': here the driver is a known need or technology capability rather than a search process. Do not use when the use emerged unanticipated.", "evidence": [{"cite": "Garud et al. (2018)", "title": "Serendipity Arrangements for Exapting Science-Based Innovations", "venue": "Academy of Management Perspectives", "url": "https://doi.org/10.5465/amp.2016.0138", "page": 3, "text": "By contrast, science-push, demand-pull, and institutional-steering offer adaptive pathways to science-based innovations often driven by a desire to realize functionalities identified ex ante.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Garud et al. (2013)", "title": "Perspectives on Innovation Processes", "venue": "Academy of Management Annals", "url": "https://doi.org/10.5465/19416520.2013.791066", "page": 5, "text": "In contrast, the reverse of this statement, i.e. invention is the mother of necessity , could well capture the notion of technology push.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-26", "group": "rival", "status": "reference", "label": "Founder created the enabling change", "description": "The external condition that enabled the venture was brought about by the founder, for example through their own invention or lobbying, rather than happening to them.", "when": "The account shows that the enabling technology, regulation or market change was produced by the founder's own actions.", "example": "", "notwhen": "Confused with 'Environmentally imposed direction', where the change arose independently of the actor and shaped the venture from outside.", "evidence": [{"cite": "Davidsson (2015)", "title": "Entrepreneurial opportunities and the entrepreneurship nexus: A re-conceptualization", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2015.01.002", "page": 11, "text": "Thus, New Venture Ideas (NVI) are imaginary combinations of product/service offerings; potential markets or users, and means of bringing these offerings into existence.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-27", "group": "rival", "status": "reference", "label": "Imitative entry without trigger", "description": "Some ventures, notably me-too entries in mature industries, start without any identifiable external event or unexpected trigger.", "when": "The venture copies an existing business model in a stable industry, and the account names no distinct event behind its start.", "example": "", "notwhen": "Confused with 'Environmentally imposed direction', where a specific external change or condition prompted the start.", "evidence": [{"cite": "Davidsson (2015)", "title": "Entrepreneurial opportunities and the entrepreneurship nexus: A re-conceptualization", "venue": "Journal of Business Venturing", "url": "https://doi.org/10.1016/j.jbusvent.2015.01.002", "page": 16, "text": "In many cases— notably imitative start-ups and corporate“me-too” entry in mature industries— no clearly identifiable External Enabler has a major role in triggering initiation or determining success.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-28", "group": "rival", "status": "reference", "label": "Exploiting others' predictable misjudgments", "description": "Entrepreneurial profit or entry against incumbents is explained by deliberately exploiting others' systematic biases, as a non-random alternative to luck or serendipity.", "when": "The account explains success by recognising and exploiting what incumbents or others predictably misjudge or overlook.", "example": "", "notwhen": "Confused with 'Venture performance as random luck': use that code when the same success is attributed to chance.", "evidence": [{"cite": "Denrell et al. (2019)", "title": "In Search of Behavioral Opportunities From Misattributions of Luck", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2017.0239", "page": 18, "text": "Our theory suggests an alternative, behavioral source of superior profit that complements existing strategy frameworks: superior profit can result not only from economic barriers that deter rivals ’ entry but also from behavioral barriers that deter learning and being contrarian.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-29", "group": "rival", "status": "reference", "label": "Engineered or algorithmic serendipity", "description": "Encounters that feel serendipitous were in fact produced by recommender systems, targeted ads or other people's arrangements. Critics hold that this is an illusion of serendipity rather than genuine chance.", "when": "The apparently chance encounter or find came through algorithmic recommendations, data-driven targeting or deliberate arrangement by someone else for their own ends.", "example": "", "notwhen": "Confused with 'Deliberate targeted networking', where the person themselves planned the encounter. Do not use when the encounter arose without targeting.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 171, "text": "Conversely, pseudo-personalised serendipity can trigger more serendipitous encounters (greater in quality, rather than number).", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-30", "group": "rival", "status": "reference", "label": "Mere receipt of new information", "description": "Simply encountering new information, for example from a newsfeed or newsletter, is not serendipity if it brings no surprise, answers no felt question and prompts no follow-up.", "when": "The person merely learned a new fact, and it did not address a problem they had or prompt them to act.", "example": "", "notwhen": "Confused with 'Spontaneous recognition without search', where the chance information was recognised as an opportunity. Do not use when the information prompted surprise, investigation and use.", "evidence": [{"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 147, "text": "That sentence is rather the conclusion of an explanatory reasoning that occurred because a strange and unexplored fact wasbothering Fleming with surprise and “aching” ignorance.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-31", "group": "rival", "status": "reference", "label": "Wishful 'something will turn up' optimism", "description": "Serendipity is invoked as shallow optimism, a belief that something will turn up that is used to avoid facing evident problems, rather than as an actual unsought discovery.", "when": "The account invokes luck or 'things will work out' while ignoring real problems, with no actual discovery described.", "example": "", "notwhen": "Confused with 'Pure luck without agency', which describes a fortunate event that actually happened rather than hoped-for luck.", "evidence": [{"cite": "Merton and Barber (2004)", "title": "A Note on Serendipity as a Political Metaphor. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 4, "text": "Serendipity becomes the tag for a kind of shallow, falsely optimistic opportunism in political affairs—a Micawberish optimism that denies the patent realities and seeks to convert people into believing in the fantasies being supplied in place of the realities.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "rival-32", "group": "rival", "status": "reference", "label": "Zemblanity and suppressed serendipity", "description": "Zemblanity is the logical reverse of serendipity: actors unintentionally construct their own misfortune through ill-conceived choices, habits or settings. Bahramdipity is the suppression of serendipitous good outcomes, for example by hierarchical power.", "when": "The account frames an adverse surprise as bad luck but shows it arose from the actors' own choices, overconfidence, lax controls or habits, or describes a leader suppressing a promising unexpected opportunity.", "example": "", "notwhen": "Confused with 'Pure luck without agency', where the misfortune or fortune simply befell the person. Do not use for accidents caused purely by system complexity.", "evidence": [{"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 13, "text": "For example, entrepreneurs can construct their own misfortunes or suppress any good outcomes caused by serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Giustiniano et al. (2016)", "title": "Organizational zemblanity", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2015.12.001", "page": 2, "text": "Hence zemblanity is conceived as the polar opposite of serendipity.", "close": false, "none": false, "chosen": "fixed code"}, {"cite": "Busch and Grimes (2023)", "title": "Serendipity in Entrepreneurship, Strategy, and Innovation—A Review and Conceptualisation", "venue": "Serendipity Science", "url": "https://doi.org/10.1007/978-3-031-33529-7_5", "page": 20, "text": "Research could also look into the role of “negative serendipity” (“zemblanity”; Boyd 1998; Giustiniano et al. 2016), the faculty of making unlucky discoveries by design.", "close": false, "none": false, "chosen": "fixed code"}], "note": ""}, {"id": "trigger-01", "group": "trigger", "status": "core", "label": "Something odd was noticed", "description": "The founder noticed something strange or contrary to expectation, and it led to an idea or a new direction.", "when": "The founder saw an odd result, behaviour or detail and looked into it instead of ignoring it.", "example": "'Customers kept using it for something we never designed it for.'", "notwhen": "The surprise came from the market as a whole (trigger-24) or a mistake (trigger-04).", "evidence": [{"cite": "Cunha et al. (2010)", "title": "On serendipity and organizing", "venue": "European Management Journal", "url": "https://doi.org/10.1016/j.emj.2010.07.001", "page": 2, "text": "Merton and Barber (2004, p. 293) see serendipity working when one stumbles on an ‘‘unanticipated, anomalous and strategic datum that becomes an occasion for developing a new theory or for extending an existing theory’’.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Merton and Barber (2004)", "title": "Accidental Discovery in Science Victorian Opinion. In The Travels and Adventures of Serendipity: A Study in Sociological Semantics and the Sociology of Science", "venue": "Princeton University Press", "url": "https://doi.org/10.1515/9781400841523", "page": 8, "text": "The concept of “the serendipity pattern in scientific inquiry,” it was proposed, consists in the observation of “an unanticipated, anomalous and strategic datum that becomes the occasion for developing a new theory or for extending an existing theory.” 11 Thus, the unexpected occurs twice over in the serendipity pattern.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 11, "text": "He noticed that one of the trees was much taller than the others.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 4, "text": "Merton supplies examples of serendipity in social research, or ‘the fairly common experience of observing an unanticipated, anomalous and strategic datum which becomes the occasion for developing a new theory or for extending an existing theory’ (Merton1948, 506).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Otto et al. (2024)", "title": "Finding Creativity in Predictability: Seizing Kairos in Chronos Through Temporal Work in Complex Innovation Processes", "venue": "Organization Science", "url": "https://doi.org/10.1287/orsc.2020.14743", "page": 15, "text": "Luca was puzzled by the observation because it contradicted many of the basic assumptions they had when setting up their experiments and presented the irregular data to the higher R&D management.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "That the observation is unexpected or anomalous, and sometimes surprising is either because it seems inconsistent with prevailing theory or with established facts.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 71, "text": "In their essay on serendipity Merton and Barber ( 2004) characterize the use of serendipity in science as the identification of data that is both unanticipated, anomalous, and strategic (i.e. allowing for new theorization).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Garud et al. (2011)", "title": "Complexity Arrangements for Sustained Innovation: Lessons from 3M Corporation", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840611410810", "page": 16, "text": "In 1986, Rich Dryer, a scientist at the Optics Technology Center, noticed that a piece of paper looked brighter when the plastic film was placed on it.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Murayama et al. (2015)", "title": "Management of science, serendipity, and research performance: Evidence from a survey of scientists in Japan and the U.S.", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2015.01.018", "page": 4, "text": "When scientists are committed to actual research, they often encounter unexpected observations and findings.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Rosenman (1988)", "title": "Serendipity and Scientific Discovery", "venue": "", "url": "", "page": 3, "text": "For example, Scott noticed the inhibition ofa staphy­ lococcal colony by a mold; he viewed it as a nuisance.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Wareham et al. (2022)", "title": "Systematizing serendipity for big science infrastructures: The ATTRACT project", "venue": "Technovation", "url": "https://doi.org/10.1016/j.technovation.2021.102374", "page": 9, "text": "Related to this, 14% of the projects mentioned that their idea came from anomalies from their research that needed revisiting.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 6, "text": "Serendipity does not emerge from the systematic application of what is already thought; rather, it emerges from surprise ( Cunha et al., 2010).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Fultz and Hmieleski (2025)", "title": "Cultivating and Harnessing Unexpected Opportunities: How Monochronic Orientation Fosters Innovation by Facilitating Serendipity in New Firms", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/10422587251347043", "page": null, "text": "", "close": false, "none": true, "chosen": "reading"}], "note": ""}, {"id": "trigger-04", "group": "trigger", "status": "core", "label": "A mistake or accident", "description": "An error, slip, malfunction or accident produced something unexpected that turned out to be useful.", "when": "The founder traces the idea or path to a mistake or mishap.", "example": "'We ordered the wrong size by accident and it sold better.'", "notwhen": "A planned attempt simply failed and was reused elsewhere; if nothing fits, MIS-TRG.", "evidence": [{"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 6, "text": "However, on a trip to find work, she got off at the wrong stop and ended up at GR Management, which was owned by the former manager of the band Texas.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Balzano (2022)", "title": "Serendipity in management studies: a literature review and future research directions", "venue": "Management Decision", "url": "https://doi.org/10.1108/md-02-2022-0245", "page": 7, "text": "In more detail, the author noted that serendipity is often induced by errors, meaning that it could be critically enhanced by controlled “sloppiness”.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 65, "text": "For example, during the clinical trial of Covid-19 vaccines, participants in an experiment conducted by AstraZeneca mistakenly received half a dose, which allowed researchers to ‘stumble’ onto a more promising dosing regime.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Yaqub (2018)", "title": "Serendipity: Towards a taxonomy and a theory", "venue": "Research Policy", "url": "https://doi.org/10.1016/j.respol.2017.10.007", "page": 6, "text": "Contamination, methodological blunder and equipment malfunction also feature frequently in accounts of serendipity, as well as assumed equipment failure.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Andel (1994)", "title": "Anatomy of the Unsought Finding. Serendipity: Orgin, History, Domains, Traditions, Appearances, Patterns and Programmability", "venue": "The British Journal for the Philosophy of Science", "url": "https://doi.org/10.1093/bjps/45.2.631", "page": 11, "text": "(4) Successful error: The 'bad and discarded' glue, the 'temporarily permanent' adhesive on removable self-stick 3M post-it notes, was unintentionally invented at 3M.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Trott et al. (2024)", "title": "How Cognitive Bias Prevents Serendipity in New Product Development (and What to Do About It)", "venue": "IEEE Transactions on Engineering Management", "url": "https://doi.org/10.1109/tem.2024.3407515", "page": 2, "text": "Thus, “error-borne” serendipity may arise when research is loosely directed to the extent that errors will creep in to experiments that prove to be a source of serendipity.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Vogel (2017)", "title": "From Venture Idea to Venture Opportunity", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1111/etap.12234", "page": 10, "text": "A good example is Alfred Nobel, the inventor of dynamite, who initially looked for a way to safely store nitroglycerine and one day accidentally discovered the absorbability of porous earth or kieselguhr.", "close": false, "none": false, "chosen": "reading"}], "note": ""}, {"id": "trigger-14", "group": "trigger", "status": "core", "label": "A chance meeting", "description": "An unplanned meeting with a person led to a partner, co-founder, customer, investor or opportunity.", "when": "The founder describes meeting someone by chance: at an event, through a seat on a plane, a shared office.", "example": "'I met my co-founder at a wedding.'", "notwhen": "What mattered was a passing remark (trigger-17), or the meeting was arranged.", "evidence": [{"cite": "Dew (2009)", "title": "Serendipity in Entrepreneurship", "venue": "Organization Studies", "url": "https://doi.org/10.1177/0170840609104815", "page": 4, "text": "Simplot’s chance meeting with Sokol (Silver 1985); Peter Hodgson’s chance attendance of a party where kids happened to be playing with Silly Putty as a toy (VanAndei 1994).", "close": false, "none": false, "chosen": "reading"}, {"cite": "Copeland et al. (2023)", "title": "Serendipity Science An Emerging Field and its Methods", "venue": "", "url": "https://doi.org/10.1007/978-3-031-33529-7", "page": 229, "text": "The couple introduced me, and we briefly had the opportunity to say hello.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Brown (2005)", "title": "Science, serendipity and the contemporary marketing condition", "venue": "European Journal of Marketing", "url": "https://doi.org/10.1108/03090560510623235", "page": 1, "text": "One night, at a bridge party thrown by a new neighbour, SDH discussed his difficulties with another doctoral student from the philosophy department.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch and Barkema (2020)", "title": "Planned Luck: How Incubators Can Facilitate Serendipity for Nascent Entrepreneurs Through Fostering Network Embeddedness", "venue": "Entrepreneurship Theory and Practice", "url": "https://doi.org/10.1177/1042258720915798", "page": 19, "text": "Members were prompted to form new bonds, and unplanned, serendipitous encounters became common and appreciated.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Busch (2024)", "title": "Towards a Theory of Serendipity: A Systematic Review and Conceptualization", "venue": "Journal of Management Studies", "url": "https://doi.org/10.1111/joms.12890", "page": 34, "text": "I consider as ‘obvious’ associations those incidences in which there is a straightforward link that the observer makes; for example, when person A meets a stranger B in the train, who tells them about a job opportunity that they subsequently exploit.", "close": false, "none": false, "chosen": "reading"}, {"cite": "de Rond (2014)", "title": "The structure of serendipity", "venue": "Culture and Organization", "url": "https://doi.org/10.1080/14759551.2014.967451", "page": 8, "text": "Perhaps the most significant contributor to DNA’s elucidation came from the sharing of an office with Jerry Donohue, a crystallographer.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Klyver et al. (2025)", "title": "With help from strangers: entrepreneurs’ networking for serendipity", "venue": "Journal of Business Research", "url": "https://doi.org/10.1016/j.jbusres.2025.115586", "page": 7, "text": "Legitimay/Identity 5 I got to know her through a fashion show and I did not know her before, and then she was like, “No, I work in this agency and blah, blah, blah, yeah.", "close": false, "none": false, "chosen": "reading"}, {"cite": "McFarlane and Carter (2016)", "title": "Serendipity and Its Role in the Discovery of Entrepreneurial Opportunities", "venue": "", "url": "", "page": 6, "text": "However, on a trip to find work, she got off at the wrong stop and ended up at GR Management, which was owned by the former manager of the band Texas.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Mirvahedi and Morrish (2017)", "title": "The role of serendipity in opportunity exploration", "venue": "Journal of Research in Marketing and Entrepreneurship", "url": "https://doi.org/10.1108/jrme-10-2017-0045", "page": 11, "text": "TTM ’s first large research contract was signed while teaching an MBA student whose automobile company needed a marketing research project.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Eagle (2004)", "title": "Can Serendipity Be Planned", "venue": "", "url": "", "page": 2, "text": "10 MIT SLOAN MANAGEMENT REVIEWFALL 2004 I I had probably greeted Tom in passing more than 50 times before we actually met.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Krumboltz (1998)", "title": "Serendipity is not serendipitous.", "venue": "Journal of Counseling Psychology", "url": "https://doi.org/10.1037/0022-0167.45.4.390", "page": 1, "text": "Was it chance that they ran into each other?", "close": false, "none": false, "chosen": "reading"}, {"cite": "Meyer and Skak (2002)", "title": "Networks, Serendipity and SME Entry into Eastern Europe", "venue": "European Management Journal", "url": "https://doi.org/10.1016/s0263-2373(02)00028-2", "page": 7, "text": "Crucial for the development of the business is how the partners build their relationship after the first encounter ‘by chance’.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Nair et al. (2020)", "title": "Toward the Emergence of Entrepreneurial Opportunities: Organizing Early-Phase New Venture Creation Support Systems", "venue": "Academy of Management Review", "url": "https://doi.org/10.5465/amr.2019.0040", "page": 38, "text": "The example of the StartUp HERE Toronto Café shows that informal chats and unplanned interactions in different settings can open doors, spark ideas, and establish critical new relationships that shape the emergence and development of entrepreneurs’ ventures.", "close": false, "none": false, "chosen": "reading"}, {"cite": "Terveen (2025)", "title": "Navigating complex problem spaces: How emotion and energy shape entrepreneurial agency in serendipitous encounters", "venue": "Journal of Business Venturing Insights", "url": "https://doi.org/10.1016/j.jbvi.2025.e0057
