<meta charset="utf-8">
<title>Serendipity Codebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field manual. Left pane is the coder's index (group question, then one line per code);
   right pane is the full entry for the selected code, with the papers behind it. */
:root {
  --paper: #f5f7f6;
  --sheet: #ffffff;
  --ink: #1b2326;
  --muted: #5b686b;
  --rule: #d8dfdd;
  --accent: #1f5c6b;
  --accent-soft: #e2eef0;
  --amber: #8a5a00;
  --amber-soft: #fbefd6;
  --plum: #6a3d7a;
  --plum-soft: #f1e6f5;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121819; --sheet: #182022; --ink: #e4ebea; --muted: #9aa8a9; --rule: #2c3739;
    --accent: #7cc0cf; --accent-soft: #1d3338; --amber: #f0c06a; --amber-soft: #3a2e17;
    --plum: #d6aee6; --plum-soft: #34263b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121819; --sheet: #182022; --ink: #e4ebea; --muted: #9aa8a9; --rule: #2c3739;
  --accent: #7cc0cf; --accent-soft: #1d3338; --amber: #f0c06a; --amber-soft: #3a2e17;
  --plum: #d6aee6; --plum-soft: #34263b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  display: flex; flex-direction: column;
}
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { border-bottom: 1px solid var(--rule); background: var(--sheet); }
header.top .wrap { padding-block: var(--s4); display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: center; }
.brand { min-width: 0; flex: 1 1 280px; }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.1; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.search { position: relative; }
.search input {
  font: inherit; font-size: 14px; width: 240px; max-width: 100%; padding: 7px 10px 7px 30px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); fill: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 7px 11px; border: 0; background: var(--sheet); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
button:focus-visible, input:focus-visible, a:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); }
.index { border-right: 1px solid var(--rule); overflow-y: auto; min-width: 0; padding-bottom: 96px; }
.detail { overflow-y: auto; min-width: 0; padding-bottom: 96px; }

.group { border-bottom: 1px solid var(--rule); }
.group > h2 {
  position: sticky; top: 0; z-index: 1; margin: 0; background: var(--paper);
  padding: var(--s3) max(16px, env(safe-area-inset-right, 0px)) var(--s2) max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: auto 1fr; gap: 0 var(--s2); align-items: baseline;
}
.group .num { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.group .gname { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.group .ask { grid-column: 2; font-family: var(--display); font-size: 16px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
.row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px var(--s2); align-items: start;
  padding: var(--s2) max(16px, env(safe-area-inset-right, 0px)) var(--s2) max(16px, env(safe-area-inset-left, 0px));
  cursor: pointer; border-left: 3px solid transparent;
}
.row:hover { background: var(--sheet); }
.row.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.row input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.row .lbl { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.row .when { grid-column: 2 / 4; color: var(--muted); font-size: 13px; line-height: 1.4; }
.row .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.row.ref .lbl { font-weight: 500; }
.chip { display: inline-block; font-family: var(--body); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; vertical-align: 1px; margin-left: 4px; }
.chip.ref { background: var(--rule); color: var(--muted); }
.chip.new { background: var(--plum-soft); color: var(--plum); }
.chip.close { background: var(--amber-soft); color: var(--amber); }
.chip.core { background: var(--accent-soft); color: var(--accent); }
.empty { padding: var(--s5) var(--s4); color: var(--muted); }

.entry { max-width: 760px; padding-block: var(--s6); }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.eyebrow b { color: var(--accent); font-family: var(--mono); font-weight: 500; letter-spacing: 0; text-transform: none; margin-right: 6px; }
.entry h2 { font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1.1; margin: var(--s2) 0 var(--s2); text-wrap: balance; }
.idline { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.copy { font: inherit; font-size: 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.fields { display: grid; gap: var(--s4); margin: var(--s5) 0; }
.field { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.field dt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.field dd { margin: 0; font-size: 16px; max-width: 62ch; }
.field.ex dd { font-family: var(--display); font-style: italic; font-size: 17px; }
.field.desc dd { color: var(--muted); font-size: 15px; }
.ref-link { font: inherit; font-family: var(--mono); font-size: .86em; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.note { margin: 0 0 var(--s4); padding: var(--s2) var(--s3); background: var(--plum-soft); color: var(--plum); border-radius: 4px; font-size: 13.5px; }
.ev h3 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: var(--s6) 0 var(--s1); }
.ev .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 var(--s4); max-width: 62ch; }
.ev ol { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s4); }
.ev li { display: grid; gap: var(--s1); padding-left: var(--s4); border-left: 2px solid var(--rule); }
.ev blockquote { margin: 0; font-family: var(--display); font-size: 16.5px; line-height: 1.45; max-width: 64ch; }
.ev .src { font-size: 13px; color: var(--muted); }
.ev .src a { color: var(--accent); font-weight: 600; text-decoration: none; }
.ev .src a:hover { text-decoration: underline; }
.ev .nosent { color: var(--muted); font-style: italic; }
.placeholder { padding-block: var(--s6); color: var(--muted); max-width: 60ch; }

.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--ink); color: var(--paper);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tray .wrap { padding-block: var(--s3); display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: center; }
.tray .t-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.tray .ids { font-family: var(--mono); font-size: 13px; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.tray button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 5px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.tray button.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.back { display: none; }

@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .index { border-right: 0; }
  .detail { position: fixed; inset: 0; z-index: 4; background: var(--paper); padding-top: env(safe-area-inset-top, 0px); }
  .detail[data-open="false"] { display: none; }
  .back { display: inline-block; margin-top: var(--s4); font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .entry { padding-block: var(--s3) var(--s6); }
  .entry h2 { font-size: 28px; }
  .field { grid-template-columns: minmax(0, 1fr); gap: var(--s1); }
  .search input { width: 100%; }
  .search { flex: 1 1 200px; }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: background-color .12s; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Serendipity Codebook</h1>
      <p id="sub">Pilot draft for review</p>
    </div>
    <div class="controls">
      <label class="search" for="q">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 015.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>
        <input id="q" type="search" placeholder="Search codes  ( / )" autocomplete="off" aria-label="Search codes">
      </label>
      <div class="seg" role="group" aria-label="Which codes to show">
        <button id="show-core" type="button" aria-pressed="true">Core codes</button>
        <button id="show-all" type="button" aria-pressed="false">All codes</button>
      </div>
    </div>
  </div>
</header>

<main>
  <nav class="index" id="index" aria-label="Codes by group"></nav>
  <section class="detail" id="detail" data-open="false" aria-live="polite"></section>
</main>

<div class="tray" id="tray">
  <div class="wrap">
    <span class="t-label">This episode</span>
    <span class="ids" id="tray-ids">Tick the codes that apply while you read an episode; their IDs collect here.</span>
    <button type="button" class="primary" id="tray-copy">Copy IDs</button>
    <button type="button" id="tray-clear">Clear</button>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const byId = Object.fromEntries(DATA.codes.map(c => [c.id, c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let showAll = store.get("cb-all", false);
let picked = new Set(store.get("cb-picked", []));
let current = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const REF = /\b(?:definition|type|rival|trigger|background|mechanism|role|outcome|condition|account)-\d{2}\b|\bANO-[A-Z]{3}\b/g;
const linkRefs = s => esc(s).replace(REF, m => byId[m] ? `<button type="button" class="ref-link" data-go="${m}">${m}</button>` : m);

const core = DATA.codes.filter(c => c.status === "core");
const anomaly = DATA.codes.filter(c => c.group === "anomaly").length;
const papers = new Set(DATA.codes.filter(c => c.status === "core").flatMap(c => c.evidence.map(e => e.cite)));
$("sub").textContent = `Pilot draft · ${core.length - anomaly} core codes and ${anomaly} anomaly codes in 11 groups · backed by ${papers.size} papers · built ${DATA.built}`;

function visible() {
  const q = $("q").value.trim().toLowerCase();
  return DATA.codes.filter(c => (showAll || c.status === "core") &&
    (!q || [c.id, c.label, c.when, c.example, c.notwhen, c.description].join(" ").toLowerCase().includes(q)));
}

function renderIndex() {
  const list = visible();
  const html = DATA.groups.map(g => {
    const rows = list.filter(c => c.group === g.name);
    if (!rows.length) return "";
    return `<section class="group"><h2><span class="num">${String(g.n).padStart(2, "0")}</span><span class="gname">${esc(g.name)}</span><span class="ask">${esc(g.asks)}</span></h2>` +
      rows.map(c => `<div class="row${c.status === "core" ? "" : " ref"}${c.id === current ? " sel" : ""}" data-id="${c.id}" tabindex="0" role="button" aria-label="${esc(c.label)}">
        <input type="checkbox" id="pick-${c.id}" ${picked.has(c.id) ? "checked" : ""} aria-label="Applies to this episode: ${esc(c.label)}">
        <span class="lbl">${esc(c.label)}${c.status !== "core" ? '<span class="chip ref">ref</span>' : ""}${c.note.startsWith("New") ? '<span class="chip new">new</span>' : ""}</span>
        <span class="meta">${c.id}</span>
        <span class="when">${esc(c.when)}</span></div>`).join("") + `</section>`;
  }).join("");
  $("index").innerHTML = html || `<p class="empty">No code matches “${esc($("q").value)}”.</p>`;
}

function renderDetail(id) {
  const c = byId[id];
  if (!c) {
    $("detail").innerHTML = `<div class="wrap"><div class="placeholder"><p>Pick a code on the left to see its full entry and the papers behind it.</p>
      <p>Code one episode at a time. Ask each group's question in turn, tick the codes that apply, and use an anomaly code when nothing in a group fits.</p></div></div>`;
    return;
  }
  const g = DATA.groups.find(x => x.name === c.group);
  const field = (cls, label, val) => val ? `<div class="field ${cls}"><dt>${label}</dt><dd>${linkRefs(val)}</dd></div>` : "";
  const ev = c.evidence;
  const evHtml = ev.length ? `<div class="ev"><h3>From the literature</h3>
      <p class="sub">${ev.filter(e => !e.none).length} ${ev.filter(e => !e.none).length === 1 ? "paper states" : "papers state"} this code${ev.some(e => e.none) ? `; ${ev.filter(e => e.none).length} more were linked to it but no sentence states it` : ""}. Each sentence is copied from the paper; the link opens the paper.</p>
      <ol>${ev.map(e => `<li>${e.text ? `<blockquote>“${esc(e.text)}”</blockquote>` : (e.none ? '<span class="nosent">No sentence in the passages cited for this code states it directly (checked by reading).</span>' : '<span class="nosent">No single sentence states it; see the passages in the paper.</span>')}
        <span class="src">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.cite)}</a>` : `<b>${esc(e.cite)}</b>`}${e.page ? `, PDF page ${e.page}` : ""} · ${esc(e.venue || e.title)}${e.close ? '<span class="chip close">close match</span>' : ""}</span></li>`).join("")}</ol></div>` : "";
  $("detail").innerHTML = `<div class="wrap"><button type="button" class="back" id="back">← All codes</button><article class="entry">
    <div class="eyebrow"><b>${String(g.n).padStart(2, "0")}</b>${esc(g.name)} · ${esc(g.asks)}</div>
    <h2>${esc(c.label)}</h2>
    <div class="idline"><span>${c.id}</span><span class="chip ${c.status === "core" ? "core" : "ref"}">${c.status === "core" ? "core" : "reference"}</span>
      <button type="button" class="copy" data-copy="${c.id}">Copy ID</button></div>
    <dl class="fields">
      ${field("", "Code it when", c.when)}
      ${field("ex", "Example", c.example ? "“" + c.example + "”" : "")}
      ${field("", "Not when", c.notwhen)}
      ${field("desc", "Fuller description", c.description)}
    </dl>
    ${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}
    ${evHtml}</article></div>`;
  $("detail").scrollTop = 0;
}

function select(id, push = true) {
  current = id;
  document.querySelectorAll(".row.sel").forEach(r => r.classList.remove("sel"));
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if (row) { row.classList.add("sel"); row.scrollIntoView({ block: "nearest" }); }
  renderDetail(id);
  $("detail").dataset.open = id ? "true" : "false";
  if (push && id) { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
}

function renderTray() {
  const ids = DATA.codes.filter(c => picked.has(c.id)).map(c => c.id);
  $("tray-ids").textContent = ids.length ? ids.join("; ") : "Tick the codes that apply while you read an episode; their IDs collect here.";
  store.set("cb-picked", ids);
}

async function copyText(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($("tray-ids"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected, press Copy";
  }
  setTimeout(() => (btn.textContent = old), 1600);
}

$("index").addEventListener("click", e => {
  const box = e.target.closest("input[type=checkbox]");
  if (box) { const id = box.id.slice(5); box.checked ? picked.add(id) : picked.delete(id); renderTray(); return; }
  const row = e.target.closest(".row"); if (row) select(row.dataset.id);
});
$("index").addEventListener("keydown", e => {
  const row = e.target.closest(".row"); if (!row) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(row.dataset.id); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const rows = [...document.querySelectorAll(".row")]; const i = rows.indexOf(row);
    const next = rows[i + (e.key === "ArrowDown" ? 1 : -1)]; if (next) { next.focus(); select(next.dataset.id); }
  }
});
$("detail").addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) { if (byId[go.dataset.go].status !== "core" && !showAll) setShowAll(true); select(go.dataset.go); return; }
  const cp = e.target.closest("[data-copy]"); if (cp) { copyText(cp.dataset.copy, cp); return; }
  if (e.target.id === "back") { $("detail").dataset.open = "false"; }
});
$("q").addEventListener("input", renderIndex);
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });
function setShowAll(v) {
  showAll = v; store.set("cb-all", v);
  $("show-all").setAttribute("aria-pressed", v); $("show-core").setAttribute("aria-pressed", !v); renderIndex();
}
$("show-core").addEventListener("click", () => setShowAll(false));
$("show-all").addEventListener("click", () => setShowAll(true));
$("tray-copy").addEventListener("click", e => copyText($("tray-ids").textContent, e.currentTarget));
$("tray-clear").addEventListener("click", () => { picked.clear(); renderTray(); renderIndex(); });

setShowAll(showAll);
renderTray();
const start = (location.hash || "").slice(1);
const first = byId[start] ? start : (window.matchMedia("(max-width: 760px)").matches ? null : "definition-09");
if (first && byId[first].status !== "core" && !showAll) setShowAll(true);
if (first) select(first, false); else renderDetail(null);
</script>
