<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding page</title>
<style>
/* Layout: codebook on the left (what to look for), interview on the right (where it is),
   with the story being coded pinned above the interview. */
:root {
  --paper: #f5f7f6; --sheet: #ffffff; --ink: #1b2326; --muted: #5b686b; --rule: #d8dfdd;
  --accent: #1f5c6b; --accent-soft: #e2eef0; --plum: #6a3d7a; --plum-soft: #f1e6f5; --amber-soft: #fbefd6;
  --e1: #2f7d6d; --e2: #b5651d; --e3: #6a3d7a; --e4: #2d5fa8; --e5: #a83f4f;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display: "Newsreader", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121819; --sheet: #182022; --ink: #e4ebea; --muted: #9aa8a9; --rule: #2c3739;
    --accent: #7cc0cf; --accent-soft: #1d3338; --plum: #d6aee6; --plum-soft: #34263b; --amber-soft: #3a2e17; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); display: flex; flex-direction: column; }
header { background: var(--sheet); border-bottom: 1px solid var(--rule); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
header h1 { font: 600 20px/1.2 var(--display); margin: 0; }
header .sub { color: var(--muted); font-size: 12.5px; }
header .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type=text], textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; min-height: 38px; }
button { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 5px; padding: 5px 11px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 430px) minmax(0, 1fr); }
.codebook { overflow-y: auto; border-right: 1px solid var(--rule); padding-bottom: 40px; }
.group h2 { position: sticky; top: 0; z-index: 1; background: var(--paper); margin: 0; padding: 10px 16px 6px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; }
.group h2 .ask { text-transform: none; letter-spacing: 0; font: 500 15px/1.3 var(--display); }
.group h2 .count { margin-left: auto; font: 500 11px var(--mono); color: var(--accent); }
.group h2 { cursor: pointer; }
.group h2 .caret { font: 12px var(--mono); color: var(--muted); width: 10px; }
mark.ev { background: var(--amber-soft); color: inherit; border-bottom: 2px solid #c58a1a; padding: 0 1px; border-radius: 2px; transition: opacity .15s, background-color .15s; }
mark.ev.on { background: #f6d27a; border-bottom-color: #8a5a00; }
.dimmed mark.ev:not(.on) { background: transparent; border-bottom-color: var(--rule); }
.mk { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px; border-radius: 9px;
  font: 600 10.5px var(--body); color: var(--sheet); background: var(--accent); vertical-align: 3px; cursor: pointer; }
.mk.mis { background: var(--plum); }
.dimmed .mk:not(.on) { opacity: .3; }
.mk.on { outline: 2px solid #8a5a00; }
.reading #coder-box { display: none; }
body:not(.reading) #names-box { display: none; }
.switch { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.howto { margin: 0; font-size: 13px; color: var(--muted); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.crow { all: unset; display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; cursor: pointer; padding: 3px 6px; margin: 0 -6px; border-radius: 5px; font-size: 14.5px; font-weight: 600; }
.crow:hover { background: var(--sheet); }
.crow:focus-visible { outline: 2px solid var(--accent); }
.crow.sel { background: #fbe7b0; }
.crow .n { display: inline-flex; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; font: 600 10.5px/18px var(--body); color: var(--sheet); background: var(--accent); }
.crow.mis .n { background: var(--plum); }
.crow.mis .cl { color: var(--plum); }
.detail { margin: 2px 0 6px 28px; display: grid; gap: 4px; font-size: 13.5px; }
.detail .lab { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.info { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.info b { color: var(--ink); font-weight: 600; }
.tagc { display: inline-block; font: 600 11px/1.5 var(--body); color: var(--sheet); background: var(--accent); border-radius: 3px; padding: 0 6px; margin: 0 2px; vertical-align: 2px; white-space: nowrap; }
.tagc.mis { background: var(--plum); }
.summary .q { font-size: 13.5px; font-weight: 400; color: var(--ink); margin-top: 2px; }
.summary .q a { font: 500 11px var(--mono); color: var(--accent); cursor: pointer; margin-left: 4px; }
.code { display: grid; grid-template-columns: 20px 1fr; gap: 0 8px; padding: 6px 16px; border-left: 3px solid transparent; }
.code.on { background: var(--accent-soft); border-left-color: var(--accent); }
.code.anomaly .lbl { color: var(--plum); font-style: italic; }
.code input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.code .lbl { font-weight: 600; font-size: 14px; cursor: pointer; }
.code .lbl small { font: 400 10.5px var(--mono); color: var(--muted); margin-left: 6px; }
.code .when { grid-column: 2; color: var(--muted); font-size: 13px; }
.code .more { grid-column: 2; font-size: 13px; margin-top: 4px; display: grid; gap: 3px; }
.code .more b { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.disabled .code input { opacity: .35; }
.right { display: flex; flex-direction: column; min-height: 0; }
.episodes { background: var(--sheet); border-bottom: 1px solid var(--rule); padding: 10px 16px; display: grid; gap: 8px; max-height: 46vh; overflow-y: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 13px var(--mono); padding: 3px 10px; border-radius: 14px; border: 2px solid var(--c); color: var(--c); background: var(--sheet); cursor: pointer; }
.chip.active { background: var(--c); color: var(--sheet); }
.panel { display: grid; gap: 6px; }
.panel .row { display: grid; grid-template-columns: 150px 1fr; gap: 8px; align-items: start; font-size: 13.5px; }
.panel .row > span:first-child { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 5px; }
.applied { display: flex; flex-wrap: wrap; gap: 4px; }
.applied span { font-size: 12px; background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; }
.applied span.mis { background: var(--plum-soft); color: var(--plum); }
.hint { color: var(--muted); font-size: 13px; }
.interview { overflow-y: auto; padding: 12px 16px 60px; }
.seg { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 8px 10px; margin-bottom: 6px; border-radius: 6px; border-left: 4px solid transparent; background: var(--sheet); cursor: pointer; }
.seg:hover { outline: 1px solid var(--rule); }
.seg .num { font: 500 12px var(--mono); color: var(--muted); padding-top: 2px; }
.seg .txt { white-space: pre-wrap; max-width: 70ch; font-size: 16px; line-height: 1.65; }
.reading .episodes { display: none; }
.reading .seg { cursor: default; }
.reading .interview { padding: 20px 28px 80px; }
.summary { padding: 16px 20px 60px; display: grid; gap: 22px; }
.summary .ep { display: grid; gap: 12px; }
.summary .ep h2 { margin: 0; font: 600 20px/1.2 var(--display); display: flex; gap: 10px; align-items: baseline; }
.summary .ep h2 .segs { font: 500 12px var(--mono); color: var(--muted); }
.summary .ep h2 .segs a { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.summary .unexp { margin: 0; padding: 10px 12px; background: var(--sheet); border-left: 3px solid var(--c); border-radius: 4px; font-size: 15px; }
.summary .unexp b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.summary dl { margin: 0; display: grid; grid-template-columns: 104px 1fr; gap: 8px 12px; }
.summary dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.summary dd { margin: 0; display: grid; gap: 4px; }
.summary .c { font-size: 14.5px; font-weight: 600; }
.summary .c small { font: 400 10.5px var(--mono); color: var(--muted); margin-left: 4px; }
.summary .c.mis { color: var(--plum); }
.summary .why { font-size: 13.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
.summary .empty { font-size: 13px; color: var(--muted); }
.summary .notes { font-size: 14px; line-height: 1.55; }
.summary .notes b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg.question .txt { font-weight: 600; }
.seg.header .txt { font: 12.5px var(--mono); color: var(--muted); }
.seg .tags { grid-column: 2; display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px; }
.seg .tags span { font: 600 11.5px var(--body); color: var(--sheet); border-radius: 3px; padding: 1px 7px; }
.seg.inactive { cursor: default; }
.defs { display: grid; gap: 3px; font-size: 13px; }
.def { color: var(--muted); }
.def b { font-weight: 600; }
.def.met { color: var(--ink); }
.def.met b { color: var(--accent); }
.def .part { white-space: nowrap; margin-left: 6px; }
.def .part.no { opacity: .55; }
.summary .defs { background: var(--sheet); border-radius: 4px; padding: 8px 12px; }
.noep { display: flex; gap: 6px; align-items: center; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Coding page</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="tools">
    <span id="coder-box"><label for="coder" class="hint">Coder</label>
    <input type="text" id="coder" placeholder="your name" size="10"></span>
    <label class="hint switch" id="names-box"><input type="checkbox" id="names"> Show code names in the text</label>
    <button type="button" id="mode" class="primary">Edit coding</button>
    <button type="button" id="export-csv">Export CSV</button>
    <button type="button" id="export-json">Export JSON</button>
  </div>
</header>
<main>
  <nav class="codebook" id="codebook" aria-label="Codebook"></nav>
  <section class="right">
    <div class="episodes" id="episodes"></div>
    <div class="interview" id="interview"></div>
  </section>
</main>
<script>
const D = {"case_id": "demo-tile-studio-000000", "case_no": "000", "title": "Tile Studio (made-up demo)", "built": "2026-10-28", "codebook": "codebook version 1.0", "groups": [{"n": 1, "name": "parts", "title": "Parts of serendipity", "asks": "Which parts are present?", "pick_note": "Search state: What was the founder doing when it happened? Pick one.", "codes": [{"id": "type-03", "label": "Not looking at all", "when": "The founder was not looking for a business or a solution when it happened.", "example": "'I made it for myself, then people kept asking for one.'", "notwhen": "The founder already wanted a business (type-04) or pursued a specific goal (type-01, type-02).", "description": "The founder was not looking for a business or an idea. A need and a way to meet it turned up together in everyday life, and they saw an opportunity.", "pick": "Search state"}, {"id": "type-04", "label": "Open to any business", "when": "The founder wanted to start something but had no specific idea in mind.", "example": "'I knew I wanted to work for myself; then a friend mentioned...'", "notwhen": "No wish to found (type-03), or already pursuing a specific idea (type-01, type-02).", "description": "The founder wanted to start or grow a business but had no specific idea, and a suitable opportunity came along by chance (Mirvahedi and Morrish's 'entrepreneurial serendipity').", "pick": "Search state"}, {"id": "definition-04", "label": "Searching for something specific", "when": "The founder was working on a specific problem, product or goal at the time.", "example": "'I'd been trying ideas for months when...'", "notwhen": "The founder was not looking for anything at the time; leave this code off.", "description": "When the unexpected event happened, the founder was already looking for something: an idea, a solution, customers or a way forward. Needed for the narrow verdict (Dew 2009).", "pick": "Search state"}, {"id": "definition-09", "label": "Surprise", "when": "The founder says an event, contact, result or reaction was unexpected or not part of the plan.", "example": "'I never expected anyone to ask for that.'", "notwhen": "The founder got what they planned and expected, on schedule.", "description": "Something happened that the founder did not expect, plan or intend."}, {"id": "definition-07", "label": "Agency: acted on it", "when": "The founder describes their own response to the event and links the result to it.", "example": "'I wrote back that night and offered to build it.'", "notwhen": "The benefit simply arrived with no action by the founder; code rival-01 (pure luck) instead.", "description": "The founder did something with the unexpected event: followed it up, tried it, or built on it. Without this, it is luck, not serendipity."}, {"id": "definition-13", "label": "Value", "when": "The founder presents what followed as useful or important for them or the venture.", "example": "'That one email became our biggest customer.'", "notwhen": "Nothing of value came of it; code outcome-25 instead.", "description": "The unexpected event led to something the founder sees as worth having: an idea, customer, product, partner or turning point."}]}, {"n": 2, "name": "trigger", "title": "Trigger", "asks": "What unexpected event started it?", "pick_note": "", "codes": [{"id": "trigger-01", "label": "Something odd was noticed", "when": "The founder saw an odd result, behaviour or detail and looked into it instead of ignoring it.", "example": "'Customers kept using it for something we never designed it for.'", "notwhen": "The surprise came from the market as a whole (trigger-24) or a mistake (trigger-04).", "description": "The founder noticed something strange or contrary to expectation, and it led to an idea or a new direction."}, {"id": "trigger-04", "label": "A mistake or accident", "when": "The founder traces the idea or path to a mistake or mishap.", "example": "'We ordered the wrong size by accident and it sold better.'", "notwhen": "A planned attempt simply failed and was reused elsewhere; if nothing fits, ANO-TRG.", "description": "An error, slip, malfunction or accident produced something unexpected that turned out to be useful."}, {"id": "trigger-14", "label": "A chance meeting", "when": "The founder describes meeting someone by chance: at an event, through a seat on a plane, a shared office.", "example": "'I met my co-founder at a wedding.'", "notwhen": "What mattered was a passing remark (trigger-17), or the meeting was arranged.", "description": "An unplanned meeting with a person led to a partner, co-founder, customer, investor or opportunity."}, {"id": "trigger-17", "label": "A passing remark", "when": "The founder says an offhand remark sparked the idea or changed direction.", "example": "'My sister said, \"you should sell these\".'", "notwhen": "The person made a concrete offer or request (trigger-18), or the relationship mattered (trigger-14).", "description": "A casual comment, question or piece of feedback from someone else revealed a possibility the founder had not seen."}, {"id": "trigger-18", "label": "An unasked-for offer or request", "when": "The founder received an unexpected message, contract, partnership proposal or product request and acted on it.", "example": "'A hotel emailed asking if we could make 500.'", "notwhen": "Someone only mentioned a need in passing (trigger-17), or many customers showed a pattern (trigger-24).", "description": "Someone approached the founder, unsought, with an offer, order, invitation or unusual request, and this started or changed the venture."}, {"id": "trigger-24", "label": "An unexpected market signal", "when": "The founder describes a demand spike, a surprising best-seller, or users doing something unforeseen, which pointed to a new path.", "example": "'One product we added as an extra outsold everything else.'", "notwhen": "One customer asked directly (trigger-18), or the surprise was technical; if nothing fits, ANO-TRG.", "description": "Customers or users responded in a way the founder did not expect: surprising demand, unexpected uses, or feedback showing the plan was wrong."}, {"id": "ANO-TRG", "label": "None of these fits", "when": "Something unexpected started it, but no trigger code names that kind of event", "example": "", "notwhen": "The trigger is unclear: leave trigger blank", "description": "", "anomaly": true}]}, {"n": 3, "name": "background", "title": "Background", "asks": "What did the founder already have?", "pick_note": "", "codes": [{"id": "background-01", "label": "Relevant expertise", "when": "The founder credits their professional or industry knowledge for recognising the opportunity.", "example": "'After ten years in logistics, I knew straight away what that meant.'", "notwhen": "What mattered was a specific problem they were already working on (background-02).", "description": "The founder's knowledge, training or experience in a field let them see the value of the unexpected event when others might not."}, {"id": "background-02", "label": "A problem already in mind", "when": "The founder says they were already wrestling with a particular problem when the input arrived.", "example": "'I'd been trying to fix my own sleep for years.'", "notwhen": "The founder credits general expertise without a specific problem (background-01).", "description": "Before the event, the founder was already carrying a specific problem, need or strong interest, and the chance input mattered because it connected to it."}, {"id": "background-11", "label": "Idea grew from their work", "when": "The idea is traced to the founder's current or past work, projects or role.", "example": "'As a nurse, I saw the same problem every shift.'", "notwhen": "The founder credits expertise in general without tying it to a role or activity (background-01).", "description": "The founder's job, daily tasks or hands-on experience gave them the closeness from which the idea came."}, {"id": "background-17", "label": "Their network brought it", "when": "An opportunity or referral came through the founder's contacts.", "example": "'An old colleague passed my name to a buyer.'", "notwhen": "The founder met someone new by chance (trigger-14), not through existing contacts.", "description": "The unexpected opportunity, idea or information reached the founder through people they knew: friends, family, colleagues, communities."}, {"id": "ANO-BKG", "label": "None of these fits", "when": "The founder brought something relevant that no background code covers", "example": "", "notwhen": "It is a circumstance, not something the founder had: that is condition", "description": "", "anomaly": true}]}, {"n": 4, "name": "mechanism", "title": "Mechanism", "asks": "What did the founder do to turn it into something?", "pick_note": "", "codes": [{"id": "mechanism-02", "label": "Noticing it", "when": "The founder describes the moment they registered a cue and kept it in mind.", "example": "'Everyone laughed it off, but I couldn't stop thinking about it.'", "notwhen": "The founder goes on to link it to a need or use (mechanism-06).", "description": "The founder paid attention to something unexpected that others overlooked or would have dismissed."}, {"id": "mechanism-06", "label": "Connecting the dots", "when": "The founder describes realising how the new information fit something they knew or needed.", "example": "'I put the two together and thought, this could be a product.'", "notwhen": "The founder only noticed the cue without linking it (mechanism-02).", "description": "The founder linked the unexpected input to a need, problem, skill or piece of knowledge, and saw a new idea in the combination (Busch's 'association')."}, {"id": "mechanism-22", "label": "Acting on it", "when": "The founder describes what they did next and how quickly.", "example": "'I built a landing page that weekend.'", "notwhen": "Acting meant dropping or changing the original plan (mechanism-23).", "description": "The founder took concrete steps to pursue the unexpected event: followed up, invested time or money, built or launched something."}, {"id": "mechanism-23", "label": "Changing the plan", "when": "The founder describes abandoning or changing their idea or strategy because of the event.", "example": "'We scrapped the app and focused on the API.'", "notwhen": "The founder acted on it without changing any plan (mechanism-22).", "description": "The founder dropped or reshaped the original plan, product or goal to follow the unexpected input."}, {"id": "mechanism-27", "label": "Following what took off", "when": "The founder describes small tests, early customer feedback or usage data, and backing the surprise winner.", "example": "'We ran a few ads, one took off, so we went all in on that.'", "notwhen": "The experiments were on materials or the product, not customers; if nothing fits, ANO-MEC.", "description": "The founder tried things in the market, watched how customers responded, and built on what unexpectedly worked."}, {"id": "ANO-MEC", "label": "None of these fits", "when": "The founder did something with the event that no mechanism code covers", "example": "", "notwhen": "", "description": "", "anomaly": true}]}, {"n": 5, "name": "role", "title": "Role", "asks": "What part did it play in the venture?", "pick_note": "", "codes": [{"id": "role-01", "label": "Started the venture", "when": "The founder traces the origin of the business to the event.", "example": "'That conversation is why the company exists.'", "notwhen": "The founder never meant to found (role-02), or an existing venture changed course (role-08).", "description": "The unexpected event gave rise to the business idea, the first project or first customer, or made founding possible."}, {"id": "role-02", "label": "Accidental founder", "when": "The founder stresses they were not trying to be an entrepreneur.", "example": "'I never meant to start a company; it just grew.'", "notwhen": "The founder already wanted to start something and found the idea by chance (role-01).", "description": "The founder had no plan to start a business, or this business, and the unexpected event made them a founder."}, {"id": "role-08", "label": "Changed the venture's direction", "when": "The founder describes a clear turning point away from the original plan.", "example": "'After that, we stopped selling to consumers and went B2B.'", "notwhen": "Small tweaks with the same purpose, or growth along the same path (role-16).", "description": "The unexpected event made the venture turn from its original plan: a new product, market, customer or business model (a pivot)."}, {"id": "role-16", "label": "Moved the venture forward", "when": "The founder credits a chance event with a jump in growth or progress.", "example": "'Getting on that podcast doubled our sales.'", "notwhen": "The event changed what the venture does (role-08).", "description": "After founding, the unexpected event brought growth: a big order, a key partner, press, a new market, without changing direction."}, {"id": "ANO-ROL", "label": "None of these fits", "when": "It played a part in the venture other than starting, redirecting or advancing it", "example": "", "notwhen": "", "description": "", "anomaly": true}]}, {"n": 6, "name": "outcome", "title": "Outcome", "asks": "What came of it?", "pick_note": "", "codes": [{"id": "outcome-01", "label": "A new product or service", "when": "The founder traces something they now sell or do back to the event.", "example": "'That's how our best-selling kit was born.'", "notwhen": "What came out was a new market or customers, not a new offering (outcome-03).", "description": "A specific product, service, feature or process came out of the unexpected event."}, {"id": "outcome-03", "label": "A new market or opportunity", "when": "The founder says the event opened their eyes to customers or channels they had not targeted.", "example": "'We realised dentists were our real market.'", "notwhen": "The result was a new product or se const COLORS = ["var(--e1)", "var(--e2)", "var(--e3)", "var(--e4)", "var(--e5)"];
const GROUP_COLS = D.groups.filter(g => g.name !== "something else").map(g => g.name);
const codeInfo = {};
D.groups.forEach(g => g.codes.forEach(c => (codeInfo[c.id] = { ...c, group: g.name, groupTitle: g.title })));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let coder = store.get("coding-coder", "");
let S = blank();
let open = new Set();
let openGroups = new Set();
let sel = null, showNames = false;
const tagText = id => { const c = codeInfo[id]; return c.anomaly ? `Anomaly · ${c.groupTitle}` : `${c.groupTitle}: ${c.label}`; };

function blank() { return { episodes: [], active: null, none: false }; }
function key() { const v = D.prefill && coder === D.prefill.coder ? ":" + D.prefill.version : ""; return `coding:${D.case_id}:${coder || "anon"}${v}`; }
function load() { S = store.get(key(), blank()); }
function save() { store.set(key(), S); }
function ep() { return S.episodes.find(e => e.id === S.active) || null; }
function color(e) { return COLORS[(S.episodes.indexOf(e)) % COLORS.length]; }

function renderCodebook() {
  const e = ep();
  $("codebook").className = "codebook" + (e ? "" : " disabled");
  $("codebook").innerHTML = D.groups.map(g => {
    const n = e ? g.codes.filter(c => e.codes.includes(c.id)).length : 0;
    const isOpen = openGroups.has(g.name);
    const shown = isOpen ? g.codes : g.codes.filter(c => e && e.codes.includes(c.id));
    return `<section class="group"><h2 data-group="${esc(g.name)}"><span class="caret">${isOpen ? "▾" : "▸"}</span><span>${g.n}</span><span>${esc(g.title)}</span><span class="ask">${esc(g.asks)}</span><span class="count">${n ? n + " ticked" : ""}</span></h2>` +
      (isOpen && g.pick_note ? `<p class="hint" style="margin:4px 16px">${esc(g.pick_note)} Then tick each part present.</p>` : "") +
      shown.map(c => {
        const on = e && e.codes.includes(c.id);
        return `<div class="code${on ? " on" : ""}${c.anomaly ? " anomaly" : ""}">
          <input type="checkbox" id="cb-${c.id}" data-code="${c.id}" ${on ? "checked" : ""} ${e ? "" : "disabled"} aria-label="${esc(c.label)}">
          <span class="lbl" data-toggle="${c.id}">${esc(c.label)}<small>${c.id}</small></span>
          <span class="when">${esc(c.when)}</span>
          ${open.has(c.id) ? `<div class="more">${c.example ? `<div><b>Example</b> “${esc(c.example)}”</div>` : ""}${c.notwhen ? `<div><b>Not when</b> ${esc(c.notwhen)}</div>` : ""}${c.description ? `<div><b>Description</b> ${esc(c.description)}</div>` : ""}</div>` : ""}
        </div>`;
      }).join("") + `</section>`;
  }).join("");
}

function renderEpisodes() {
  const e = ep();
  const chips = S.episodes.map((x, i) => `<button type="button" class="chip${x.id === S.active ? " active" : ""}" style="--c:${COLORS[i % COLORS.length]}" data-ep="${x.id}">${esc(x.name || "Story " + (i + 1))}</button>`).join("");
  let panel = `<p class="hint">${S.none ? "Marked: nothing to code in this interview." : "Code the whole interview, story by story. Start a story for each thread of the founder's journey and give it a short name, such as \u201cthe café order\u201d. Click the segments where it is told and tick its codes. Use a story named \u201cwhole journey\u201d for remarks about everything. To tie a code to the words it rests on, select the words, then tick the code."}</p>`;
  if (e) {
    const segs = [...e.segments].sort((a, b) => a - b);
    const applied = e.codes.map(id => `<span class="${codeInfo[id]?.anomaly ? "mis" : ""}" title="${esc(codeInfo[id]?.group)}">${esc(codeInfo[id]?.label)} · ${id}</span>`).join("");
    const anomalies = e.codes.filter(id => codeInfo[id]?.anomaly);
    panel = `<div class="panel">
      <div class="row"><span>Segments</span><div>${segs.length ? segs.map(n => "s" + String(n).padStart(2, "0")).join(", ") : '<span class="hint">click segments in the interview</span>'}</div></div>
      <div class="row"><span>Story name</span><input id="story-name" value="${esc(e.name || "")}" placeholder="e.g. the café order"></div>
      <div class="row"><span>What happens in it</span><textarea id="unexpected" rows="2">${esc(e.unexpected)}</textarea></div>
      <div class="row"><span>Codes</span><div class="applied">${applied || '<span class="hint" style="background:none">tick codes on the left</span>'}</div></div>
      <div class="row"><span>Level 2 (worked out)</span>${defsHtml(e)}</div>
      ${anomalies.map(id => `<div class="row"><span>${id}: why no code fits</span><textarea data-misnote="${id}" rows="2">${esc(e.anomaly_notes[id] || "")}</textarea></div>`).join("")}
      <div class="row"><span>Notes</span><textarea id="notes" rows="2">${esc(e.notes)}</textarea></div>
      <div><button type="button" id="del-ep">Delete this story</button></div>
    </div>`;
  }
  $("episodes").innerHTML = `<div class="chips">${chips}<button type="button" id="new-ep" class="primary">+ New story</button>
    <label class="noep"><input type="checkbox" id="none" ${S.none ? "checked" : ""}> Nothing to code in this interview</label></div>${panel}`;

// Level 2 is never ticked: each rule is worked out from the level-1 codes ticked.
const RULES = D.rules || [];
const KIND = { definition: "Definitions", rival: "Rival explanations", type: "Type" };
const meets = (e, r) => r.all.every(c => e.codes.includes(c.id)) && (!r.any.length || r.any.some(c => e.codes.includes(c.id)))
  && !r.none.some(c => e.codes.includes(c.id));
const whole = e => (e.name || "").trim().toLowerCase() === "whole journey";
function defsHtml(e) {
  if (!RULES.length) return "";
  if (whole(e)) return `<span class="hint">Level 2 is not worked out for the whole journey.</span>`;
  const part = (ok, text, title) => `<span class="part${ok ? "" : " no"}" title="${esc(title)}">${ok ? "✓" : "○"} ${esc(text)}</span>`;
  return `<div class="defs">${Object.entries(KIND).map(([k, title]) => {
    const rs = RULES.filter(r => r.kind === k); if (!rs.length) return "";
    return `<div class="def"><b>${title}</b></div>` + rs.map(r => `<div class="def${meets(e, r) ? " met" : ""}"><b>${meets(e, r) ? "✓" : "·"}</b> ${esc(r.name)}` +
      r.all.map(c => part(e.codes.includes(c.id), c.label, c.id)).join("") +
      (r.any.length ? part(r.any.some(c => e.codes.includes(c.id)), r.any.map(c => c.label).join(" or "), "one of these") : "") +
      r.none.map(c => part(!e.codes.includes(c.id), "no " + c.label, c.id)).join("") + `</div>`).join("");
  }).join("")}</div>`;
}

function numbers() {
  const num = {}; let k = 0;
  S.episodes.forEach(e => D.groups.forEach(g => e.codes.filter(id => codeInfo[id]?.group === g.name)
    .forEach(id => { if (!(id in num)) num[id] = ++k; })));
  return num;
}

function markup(s) {
  const spans = [];
  S.episodes.forEach(e => Object.entries(e.evidence || {}).forEach(([id, list]) => list.forEach(x => {
    if (x.seg !== s.n) return;
    const at = s.text.indexOf(x.text);
    if (at >= 0) spans.push({ a: at, b: at + x.text.length, id });
  })));
  if (!spans.length) return esc(s.text);
  const num = numbers();
  const cuts = [...new Set([0, s.text.length, ...spans.flatMap(x => [x.a, x.b])])].sort((x, y) => x - y);
  let out = "";
  for (let k = 0; k < cuts.length - 1; k++) {
    const a = cuts[k], b = cuts[k + 1], piece = esc(s.text.slice(a, b));
    const cover = spans.filter(x => x.a <= a && x.b >= b);
    out += cover.length ? `<mark class="ev${cover.some(x => x.id === sel) ? " on" : ""}">${piece}</mark>` : piece;
    const ending = [...new Set(spans.filter(x => x.b === b).map(x => x.id))].sort((x, y) => num[x] - num[y]);
    out += ending.map(id => showNames
      ? `<span class="tagc${codeInfo[id]?.anomaly ? " mis" : ""}">${esc(tagText(id))}</span>`
      : `<span class="mk${codeInfo[id]?.anomaly ? " mis" : ""}${id === sel ? " on" : ""}" data-code="${id}" title="${esc(tagText(id))}">${num[id]}</span>`).join("");
  }
  return out;
}

function renderInterview() {
  const e = ep();

    }
    const in_ = S.episodes.filter(x => x.segments.includes(s.n));

    return `<div class="seg ${s.role}${e || mode === "read" ? "" : " inactive"}" data-seg="${s.n}" style="border-left-color:${border};${mine && mode !== "read" ? "background:var(--accent-soft)" : ""}">

    </div>`;
  }).join("");
}

    return `<section class="ep" style="--c:${COLORS[i % COLORS.length]}">
      <h2>${esc(e.name || "Story " + (i + 1))} <span class="segs">${segs.map(n => `<a data-jump="${n}">s${String(n).padStart(2, "0")}</a>`).join(" ")}</span></h2>
      ${e.unexpected ? `<p class="unexp"><b>What happens</b>${esc(e.unexpected)}</p>` : ""}
      ${defsHtml(e)}
      <dl>${filled.join("")}</dl>
      ${empty.length ? `<p class="empty">No code in: ${empty.join(", ")}</p>` : ""}
      ${e.notes ? `<div class="notes"><b>Notes</b>${esc(e.notes)}</div>` : ""}
    </section>`;
  }).join("");
}

let mode = D.prefill ? "read" : "code";
function subline() {
  if (mode !== "read") return `${D.case_id} · ${D.segments.length} segments · codebook: ${D.codebook}`;
  const all = S.episodes.flatMap(e => e.codes), mis = all.filter(id => codeInfo[id]?.anomaly).length;
  const n = S.episodes.length;
  return `Coded by ${coder || "—"} · ${n} stor${n === 1 ? "y" : "ies"} · ${all.length - mis} codes · ${mis} anomaly${mis === 1 ? "" : "s"} · ${D.codebook}`;
}
function render() {
  document.body.classList.toggle("reading", mode === "read");
  $("sub").textContent = subline();
  $("mode").textContent = mode === "read" ? "Edit coding" : "Done: show the coding";
  if (mode === "read") renderSummary(); else { renderCodebook(); renderEpisodes(); }
  renderInterview();
}
$("names").addEventListener("change", ev => { showNames = ev.target.checked; renderInterview(); });
$("codebook").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-code]"); if (!b || mode !== "read") return;
  sel = sel === b.dataset.code ? null : b.dataset.code; render();
  if (sel) document.querySelector("#interview mark.on")?.scrollIntoView({ behavior: "smooth", block: "center" });
});
$("interview").addEventListener("click", ev => {
  const m = ev.target.closest(".mk"); if (!m) return;
  sel = m.dataset.code; render();
  document.querySelector(".crow.sel")?.scrollIntoView({ behavior: "smooth", block: "center" });
});
$("mode").addEventListener("click", () => { mode = mode === "read" ? "code" : "read"; if (mode === "code" && !S.active && S.episodes.length) S.active = S.episodes[0].id; render(); });

$("codebook").addEventListener("change", ev => {
  const id = ev.target.dataset.code, e = ep(); if (!id || !e) return;
  e.evidence = e.evidence || {};
  if (ev.target.checked) {
    const pick = codeInfo[id]?.pick;
    if (pick) e.codes.filter(c => c !== id && codeInfo[c]?.pick === pick).forEach(c => { e.codes = e.codes.filter(x => x !== c); delete e.evidence[c]; });
    if (!e.codes.includes(id)) e.codes.push(id);
    const sel = window.getSelection(), node = sel && sel.anchorNode && sel.anchorNode.parentElement?.closest("[data-seg]");
    const text = sel ? sel.toString().trim() : "";
    if (node && text) {
      const n = +node.dataset.seg, segText = D.segments.find(x => x.n === n).text;
      if (segText.includes(text)) {
        (e.evidence[id] = e.evidence[id] || []).push({ seg: n, text });
        if (!e.segments.includes(n)) e.segments.push(n);
      }
      sel.removeAllRanges();
    }
  } else { e.codes = e.codes.filter(c => c !== id); delete e.evidence[id]; }
  save(); renderCodebook(); renderEpisodes(); renderInterview();
});
$("codebook").addEventListener("click", ev => {
  const h = ev.target.closest("[data-group]");
  if (h && mode === "code") { const g = h.dataset.group; openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g); renderCodebook(); return; }
  const t = ev.target.closest("[data-toggle]"); if (!t) return;
  const id = t.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); renderCodebook();
});
$("episodes").addEventListener("click", ev => {
  if (ev.target.id === "new-ep") {
    const id = "e" + Date.now();
    S.episodes.push({ id, name: "", segments: [], codes: [], unexpected: "", notes: "", anomaly_notes: {}, evidence: {} });
    S.active = id; S.none = false; save(); render(); return;
  }
  if (ev.target.id === "del-ep") {
    S.episodes = S.episodes.filter(x => x.id !== S.active); S.active = S.episodes.at(-1)?.id || null; save(); render(); return;
  }
  const chip = ev.target.closest("[data-ep]"); if (chip) { S.active = chip.dataset.ep; save(); render(); }
});
$("episodes").addEventListener("change", ev => {
  if (ev.target.id === "none") { S.none = ev.target.checked; save(); renderEpisodes(); }
});
$("episodes").addEventListener("input", ev => {
  const e = ep(); if (!e) return;
  if (ev.target.id === "unexpected") e.unexpected = ev.target.value;
  else if (ev.target.id === "story-name") { e.name = ev.target.value; document.querySelector(`[data-ep="${e.id}"]`).textContent = e.name || "Story"; }
  else if (ev.target.id === "notes") e.notes = ev.target.value;
  else if (ev.target.dataset.misnote) e.anomaly_notes[ev.target.dataset.misnote] = ev.target.value;
  save();
});
$("codebook").addEventListener("click", ev => {
  const j = ev.target.closest("[data-jump]"); if (!j) return;
  document.querySelector(`[data-seg="${j.dataset.jump}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
});
$("interview").addEventListener("click", ev => {
  if (mode === "read") return;
  const seg = ev.target.closest("[data-seg]"), e = ep(); if (!seg || !e) return;
  const n = +seg.dataset.seg;
  e.segments = e.segments.includes(n) ? e.segments.filter(x => x !== n) : [...e.segments, n];
  save(); renderEpisodes(); renderInterview();
});
$("coder").addEventListener("change", ev => { coder = ev.target.value.trim(); store.set("coding-coder", coder); load(); render(); });

const defCol = d => d.id.toLowerCase().replace("-", "_");  // DEF-BUSCH -> def_busch
function rows() {
  const base = { case_no: D.case_no, case_id: D.case_id, coder, codebook: D.codebook };
  if (!S.episodes.length) return [{ ...base, story: S.none ? 0 : "", segments: "" }];
  return S.episodes.map((e, i) => {
    const r = { ...base, story: whole(e) ? "W" : i + 1, story_name: e.name || "", segments: [...e.segments].sort((a, b) => a - b).join(", "), summary: e.unexpected };
    GROUP_COLS.forEach(g => (r[g] = e.codes.filter(id => codeInfo[id]?.group === g && !codeInfo[id]?.anomaly).join("; ")));
    const mis = e.codes.filter(id => codeInfo[id]?.anomaly);
    r.anomaly_codes = mis.join("; "); r.anomaly_notes = mis.map(id => `${id}: ${e.anomaly_notes[id] || ""}`).join(" | "); r.notes = e.notes;
    RULES.forEach(d => (r[defCol(d)] = whole(e) ? "" : meets(e, d) ? "yes" : "no"));
    r.evidence = Object.entries(e.evidence || {}).flatMap(([id, list]) => list.map(x => `${id} @s${String(x.seg).padStart(2, "0")}: "${x.text}"`)).join(" | ");
    return r;
  });
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
const fname = ext => `coding_${D.case_no || ""}_${D.case_id}_${coder || "anon"}.${ext}`;
$("export-csv").addEventListener("click", () => {
  const cols = ["case_no", "case_id", "coder", "codebook", "story", "story_name", "segments", "summary", ...GROUP_COLS, "anomaly_codes", "anomaly_notes", ...RULES.map(defCol), "notes", "evidence"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  download(fname("csv"), [cols.join(","), ...rows().map(r => cols.map(c => q(r[c])).join(","))].join("\n") + "\n", "text/csv");
});
$("export-json").addEventListener("click", () => {
  download(fname("json"), JSON.stringify({ case_id: D.case_id, case_no: D.case_no, coder, codebook: D.codebook,
    exported: new Date().toISOString(), nothing_to_code: S.none, stories: rows() }, null, 1), "application/json");
});

document.title = `Coding ${D.case_no} ${D.title}`;
$("title").textContent = `${D.case_no ? "Case " + D.case_no + ": " : ""}${D.title}`;
if (D.prefill) coder = D.prefill.coder;  // a page made with --load opens on that coding
$("coder").value = coder;
load();
if (D.prefill && coder === D.prefill.coder && !S.episodes.length && !S.none) S = JSON.parse(JSON.stringify(D.prefill.state));
render();
</script>
</body>
</html>
